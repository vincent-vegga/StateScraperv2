name: Rellenar duración del contrato
# Relee los ZIP del histórico y rellena SOLO duracion_meses, duracion_origen
# y prorrogas_texto de lo que ya está en la base (función rellenar_duracion).
# No crea filas ni toca otras columnas. Arranca con el push de la rama
# mientras no esté en main; después, a mano desde Actions.
on:
  push:
    branches: [duracion-contrato]
    paths: ['.github/workflows/rellenar-duracion.yml']  # relanzar = tocar este fichero
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rellenar:
    name: ${{ matrix.conjunto }} · ${{ matrix.ym }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {conjunto: '643', ym: '2024-01'}
          - {conjunto: '643', ym: '2024-02'}
          - {conjunto: '643', ym: '2024-03'}
          - {conjunto: '643', ym: '2024-04'}
          - {conjunto: '643', ym: '2024-05'}
          - {conjunto: '643', ym: '2024-06'}
