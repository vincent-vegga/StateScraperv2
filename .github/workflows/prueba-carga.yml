# ============================================================
# PRUEBA DE CARGA CON USUARIOS SINTÉTICOS
# ============================================================
# Solo a mano (botón "Run workflow"). Crea usuarios de prueba, les da
# de alta empresas con NIF reales, navega con ellos a la vez y lo borra
# todo al terminar. El informe sale en el resumen de la ejecución.
#
# CUESTA DINERO: el alta de cada empresa pasa por el modelo de lenguaje
# (lectura del historial + cribado inicial), igual que un cliente real.
#
# Si se corta a mitad, lo que quede se borra en el siguiente arranque,
# o a mano con la opción "solo_limpiar".
# ============================================================

name: Prueba de carga

on:
  workflow_dispatch:
    inputs:
      usuarios:
        description: 'Usuarios de prueba'
        default: '3'
      empresas:
        description: 'Empresas por usuario (1-3)'
        default: '3'
      etapas:
        description: 'Dispositivos simultáneos por etapa, separados por comas'
        default: '5,15,30'
      duracion:
        description: 'Segundos por etapa'
        default: '90'
      solo_limpiar:
        description: 'Solo borrar restos de una prueba anterior'
        type: boolean
        default: false

permissions:
  contents: read

# Dos pruebas a la vez se borrarían los usuarios la una a la otra.
concurrency:
  group: prueba-carga
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install "httpx>=0.27,<1"

      - name: Prueba
        if: ${{ !inputs.solo_limpiar }}
        run: >
          python prueba_carga.py
          --usuarios "${{ inputs.usuarios }}"
          --empresas "${{ inputs.empresas }}"
          --etapas "${{ inputs.etapas }}"
          --duracion "${{ inputs.duracion }}"

      # Red de seguridad: si el paso anterior murió de golpe (tiempo
      # agotado, runner cancelado), su `finally` no llegó a ejecutarse.
      - name: Limpiar restos
        if: ${{ always() }}
        run: python prueba_carga.py --solo-limpiar

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.solo_limpiar }}
        with:
          name: informe-carga
          path: informe_carga.md
          if-no-files-found: ignore
