name: Ver duración del contrato
on:
  workflow_dispatch:
    inputs:
      anio:
        description: 'Año'
        default: '2026'
      mes:
        description: 'Mes'
        default: '5'
      conjunto:
        description: 'Sindicación'
        default: '643'
      buscar:
        description: 'Texto a buscar en el expediente (p. ej. su identificador)'
        default: '16532957'
permissions:
  contents: read
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/ver_duracion.py --anio "${{ inputs.anio }}" --mes "${{ inputs.mes }}" --conjunto "${{ inputs.conjunto }}" --buscar "${{ inputs.buscar }}"
