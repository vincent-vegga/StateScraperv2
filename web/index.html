                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">Sus últimos contratos</h4>
          <div class="ultimos-contratos">
            ${ultimos.map(u => `<div>
              <p class="que">${tituloConEnlace(u.titulo, u.enlace)}</p>
              <span class="quien">${esc(u.organo ?? '')}${
                u.importe ? ` · ${euros(Number(u.importe))}` : ''}${
                duracionTxt(u.duracion_meses)
                  ? ` · ${duracionTxt(u.duracion_meses)}` : ''}${
                importeAnualTxt(u.importe, u.duracion_meses)
                  ? ` · ${importeAnualTxt(u.importe, u.duracion_meses)}` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
        ` : `
          ${utes.length ? `
            ${titulo('UTEs en las que participa')}
            <p class="guia" style="margin:0 0 6px;font-size:.86rem">Uniones temporales
              con otras empresas. No cuentan en sus cifras: el importe es el de
              toda la UTE, y cuánto le toca a cada socio no se publica.${
              nUtes > utes.length ? ` Aquí, las ${utes.length} más recientes de ${nUtes}.` : ''}</p>
            <div class="ultimos-contratos">
              ${utes.map(u => `<div>
                <p class="que">${enlaceEmpresa(u.cif, u.nombre)}</p>
                <span class="quien">${plural(u.contratos, 'contrato', 'contratos')}${
                  Number(u.importe_ute) ? ` · ${euros(Number(u.importe_ute))} la UTE entera` : ''}${
                  u.socios?.length ? ` · con ${yLista(u.socios.map(s =>
                    enlaceEmpresa(s.cif, s.nombre)))}` : ''}</span>
              </div>`).join('')}
            </div>` : ''}

        ${marcos.length ? `
          ${titulo('Acuerdos marco en los que está homologada')}
          <p class="guia" style="margin:0 0 6px;font-size:.86rem">Cualquier organismo
            adherido le puede encargar sin nueva licitación. No cuentan en las
            cifras de arriba: el dinero llega por los contratos que salen de ellos.</p>
          <div class="ultimos-contratos">
            ${marcos.map(m => `<div>
              <p class="que">${tituloConEnlace(m.titulo, m.enlace)}</p>
              <span class="quien">${esc(m.organo ?? '')}${
                m.lotes > 1 ? ` · ${plural(m.lotes, 'lote', 'lotes')}` : ''}${
                m.fecha ? ` · desde ${esc(new Date(m.fecha).toLocaleDateString('es-ES',
                  {timeZone:ZONA, month:'long', year:'numeric'}))}` : ''}${
                m.valor_marco ? ` · marco de ${euros(Number(m.valor_marco))} en total` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
        `}
      </div>`;

    zona.querySelectorAll('[data-ver-cif]').forEach(a => {
      a.onclick = ev => {
        ev.preventDefault();
        verEmpresa(a.dataset.verCif, false, e.nombre ?? e.cif);
      };
    });
    // El organismo abre su ficha en la pestaña Organismos.
    zona.querySelectorAll('[data-a-organismo]').forEach(a => {
      a.onclick = ev => {
        ev.preventDefault();
        pantallaOrganismos(perfil, session, false, a.dataset.aOrganismo);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
    });
    zona.querySelectorAll('[data-vista]').forEach(b => {
      b.onclick = () => {
        if (b.getAttribute('aria-pressed') === 'true') return;
        vistaFicha = { cif: e.cif, cual: b.dataset.vista };
        // Sin entrada nueva en el historial: cambiar de vista no es cambiar
        // de página, y "atrás" debe seguir llevando a la ficha anterior.
        history.replaceState({ ...history.state, vistaFicha: b.dataset.vista }, '');
        pintarFicha(e);
      };
    });

    activarBarras(zona);
    alPulsar('volver-listas', () => history.back());

    // El interruptor se atiende por delegación, más abajo: volver a
    // engancharlo en cada dibujado lo duplicaba.
    ultimaEmpresa = e;

    alPulsar('seguir', async () => {
      const b = document.getElementById('seguir');
      // Como en las listas: quieto mientras responde, y un fallo se dice
      // como fallo (sin mirar `error`, salía "Quitada de tu lista").
      if (b.disabled) return;
      b.disabled = true;
      let respuesta;
      try {
        respuesta = await sb.rpc('seguir', {
          cif_empresa: b.dataset.cif, nombre_empresa: b.dataset.nombre });
      } catch (error) { respuesta = { error }; }
      b.disabled = false;
      if (respuesta.error) {
        recado('No se ha podido guardar. Inténtalo de nuevo.');
        return;
      }
      const data = respuesta.data;
      e.sigo = !!data;
      b.setAttribute('aria-pressed', String(!!data));
      b.textContent = data ? 'Siguiendo' : 'Seguir';
      recado(data
        ? 'Añadida a tu lista de seguimiento'
        : 'Quitada de tu lista de seguimiento');
      olvidar('mi_seguimiento', 'competencia', 'movimientos_mercado',
              'seguimiento_periodo', 'competencia_periodo',
              'movimientos_periodo', 'resumen_periodo');
    });
  }

  // Un NIF abre la ficha directamente; cualquier otra cosa se busca por
  // nombre con la misma búsqueda del alta (tabla `empresas`, por
  // trigramas), y se elige de la lista.
  const pareceNif = t => /^([A-Z]\d{7}[A-Z0-9]|\d{8}[A-Z]|[XYZ]\d{7}[A-Z]|U\d{8})$/
    .test(t.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
  const mensajeBusqueda = html => {
    repintarVista = null;
    zona.classList.remove('cambiando');
    zona.innerHTML = `<button class="volver-listas" id="volver-busqueda">
      ← Volver a las listas</button>${html}`;
    alPulsar('volver-busqueda', () => { campo.value = ''; verListas(); });
  };
  async function buscarPorNombre(texto) {
    const turno = ++vueltaEmp;
    esperando('Buscando...');
    let r;
    try { r = await llamar('buscar_empresa', { empresa: texto }); }
    catch {
      if (turno !== vueltaEmp) return;
      return mensajeBusqueda(`<div class="aviso mal">No hemos podido buscar.
        Inténtalo de nuevo.</div>`);
    }
    if (turno !== vueltaEmp) return;
    const empresas = r.empresas ?? [];
    if (empresas.length === 1) return verEmpresa(empresas[0].cif);
    if (!empresas.length) return mensajeBusqueda(`<div class="aviso">Ninguna
      empresa con contratos públicos se llama así. Prueba con una parte del
      nombre o con su NIF.</div>`);
    mensajeBusqueda(`
      <p class="guia" style="margin:10px 0 4px">${plural(empresas.length,
        'empresa coincide', 'empresas coinciden')} con «${esc(texto)}»:</p>
      <div class="coincidencias">${empresas.map(e => `
        <button data-elige-cif="${esc(e.cif)}">
          <strong>${esc(e.nombre ?? e.cif)}</strong>
          <span class="nif">${esc(e.cif)}${e.contratos != null
            ? ` · ${plural(numero(e.contratos), 'contrato', 'contratos')}` : ''}</span>
        </button>`).join('')}</div>`);
    zona.querySelectorAll('[data-elige-cif]').forEach(b =>
      b.onclick = () => verEmpresa(b.dataset.eligeCif));
  }

  alPulsar('buscar-cif', () => {
    const texto = campo.value.trim();
    if (pareceNif(texto)) verEmpresa(texto);
    else if (texto.length >= 3) buscarPorNombre(texto);
    else campo.focus();
  });
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('buscar-cif').click();
  });

  if (cif) { campo.value = cif; verEmpresa(cif, true); }
  else verListas();
}

// ============================================================
// 7 · Panel de la cuenta
// ============================================================

// Menú de cuenta. Vive en la cabecera de las dos pantallas —contratos y
// panel— para que llegar a cualquier sección sea un solo clic. Antes
// había que entrar al panel y buscar otro botón dentro, y algo que se
// usa a diario no puede estar a dos pasos.
// Mi cuenta guarda lo que configura el servicio. Los sectores y los
// organismos se han ido a Mercado: son inteligencia sobre la propia
// empresa, el mismo dato que se ve de un competidor, y tenerlos aquí los
// separaba de donde pertenecen.
const SECCIONES = {
  cuenta: 'Mi cuenta',
  filtro: 'Mi filtro',
  avisos: 'Mis avisos',
};

// Los diálogos retienen el foco mientras están abiertos, y Escape los
// cierra. Sin esto, el tabulador se iba a la lista de detrás, que ni se ve.
function atraparFoco(velo, alEscapar = null) {
  velo.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && alEscapar) { ev.preventDefault(); alEscapar(); return; }
    if (ev.key !== 'Tab') return;
    const enfocables = [...velo.querySelectorAll(
      'button:not([disabled]), textarea, input, a[href], [tabindex="0"]')];
    if (!enfocables.length) return;
    const primero = enfocables[0], ultimo = enfocables.at(-1);
    if (ev.shiftKey && document.activeElement === primero) {
      ev.preventDefault(); ultimo.focus();
    } else if (!ev.shiftKey && document.activeElement === ultimo) {
      ev.preventDefault(); primero.focus();
    }
  });
}

// Confirmación efímera. Se usa donde la acción no deja rastro visible
// por sí sola, como la campana: un icono que cambia de forma no explica
// qué ha pasado.
//
// `accion` ({ texto, hacer }) añade un botón, como el "Deshacer" de un
// descarte; entonces dura lo que se le diga, que es lo que hay para pulsarlo.
let recadoTemporizador;
function recado(texto, accion = null, duracion = 3200) {
  let caja = document.getElementById('recado');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'recado';
    caja.className = 'recado';
    caja.setAttribute('role', 'status');
    document.body.appendChild(caja);
  }
  caja.textContent = texto;
  if (accion) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'accion-recado';
    b.textContent = accion.texto;
    b.onclick = () => {
      clearTimeout(recadoTemporizador);
      caja.classList.remove('visible');
      accion.hacer();
    };
    caja.append(' ', b);
  }
  // Sin la clase, un recado sin botón no recibe clics: no tapa lo de debajo.
  caja.classList.toggle('con-accion', !!accion);
  requestAnimationFrame(() => caja.classList.add('visible'));
  clearTimeout(recadoTemporizador);
  recadoTemporizador = setTimeout(() => caja.classList.remove('visible'), duracion);
}

// La campana enciende y apaga el correo diario. Va suelta y no dentro
// del menú porque su estado tiene que verse de un vistazo: si alguien
// apagó los avisos hace un mes, debe notarlo sin abrir nada.
// La campana enciende y apaga el aviso; la flechita pegada a ella abre el
// atajo al configurador (qué sectores y qué zona llegan en el correo), que
// si no queda enterrado en Mi cuenta.
function campanaAvisos() {
  return `
    <div class="menu-envoltorio campana-grupo">
      <button class="campana" id="campana" aria-pressed="true"
              aria-label="Avisos por correo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          <line class="tachado" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="campana-flecha" id="abrir-avisos" aria-haspopup="true"
              aria-expanded="false" aria-label="Opciones del aviso por correo">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu menu-avisos" id="menu-avisos" role="menu" hidden>
        <button role="menuitem" data-ir-avisos>Configurar mis avisos</button>
      </div>
    </div>`;
}

function activarCampana(yaSabido = null) {
  const boton = document.getElementById('campana');
  if (!boton) return;

  // Sin texto al pasar por encima: el mensaje de confirmación ya lo
  // explica, y el del navegador tarda en salir, no existe en el móvil y
  // deja el mismo texto dos veces en pantalla.
  const pintar = encendido =>
    boton.setAttribute('aria-pressed', String(encendido));

  // El panel ya ha consultado mi_panel, así que se le pasa el dato en
  // vez de repetir la llamada.
  if (yaSabido !== null) pintar(yaSabido !== false);
  else sb.rpc('mi_panel').then(({ data }) => pintar(data?.avisos !== false));

  boton.onclick = async () => {
    const quiero = boton.getAttribute('aria-pressed') !== 'true';
    // Se pinta al instante: el cliente no debe esperar al servidor para
    // ver que su decisión se ha registrado.
    pintar(quiero);
    recado(quiero
      ? 'Recibirás el aviso diario por correo'
      : 'Ya no recibirás el aviso diario');
    // Supabase no lanza: devuelve `{ error }`. Con solo un `catch`, un
    // fallo dejaba la campana pintada como si se hubiera guardado.
    let respuesta;
    try { respuesta = await sb.rpc('cambiar_avisos', { quiero }); }
    catch (error) { respuesta = { error }; }
    if (respuesta.error) {
      pintar(!quiero);
      recado('No se ha podido guardar. Inténtalo de nuevo.');
      return;
    }
    pintar(respuesta.data !== false);
  };
}

function menuCuenta(actual = null) {
  return `
    <div class="menu-envoltorio">
      <button class="boton-cuenta" id="abrir-menu" aria-haspopup="true"
              aria-expanded="false">Mi cuenta<span class="flechita">▾</span></button>
      <div class="menu" id="menu" role="menu" hidden>
        ${Object.keys(SECCIONES).map(k => `<button role="menuitem" data-ir="${k}"
          aria-current="${k === actual}">${SECCIONES[k]}</button>`).join('')}
        ${PERFILES.length < TOPE_EMPRESAS && PERFILES.every(p => p.paso_alta === 'listo')
          ? `<div class="separa"></div>
        <button role="menuitem" data-anadir-empresa>Añadir otra empresa</button>` : ''}
        <div class="separa"></div>
        <button role="menuitem" class="tema" id="tema"
                aria-pressed="false">Modo oscuro<span class="palanca"></span></button>
        <div class="separa"></div>
        <button role="menuitem" class="peligroso" id="salir-menu">Salir</button>
      </div>
    </div>`;
}

function activarMenu(perfil, session) {
  // Cada pantalla de la aplicación pasa por aquí una vez al pintarse: es
  // el momento de soltar los oyentes de la anterior.
  estrenarPantalla();

  const menu = document.getElementById('menu');
  const abrir = document.getElementById('abrir-menu');
  if (!menu || !abrir) return;

  const cerrar = () => {
    menu.hidden = true;
    abrir.setAttribute('aria-expanded', 'false');
  };
  abrir.onclick = ev => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.menu-envoltorio')) cerrar();
  }, dePantalla());
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') cerrar();
  }, dePantalla());

  menu.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    cerrar();
    pantallaPanel(perfil, session, false, b.dataset.ir);
  });
  alPulsar('salir-menu', () => sb.auth.signOut());

  const boton = document.getElementById('tema');
  if (boton) {
    boton.setAttribute('aria-pressed', String(temaActual() === 'oscuro'));
    boton.onclick = ev => {
      ev.stopPropagation();
      const nuevo = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
      ponerTema(nuevo);
      boton.setAttribute('aria-pressed', String(nuevo === 'oscuro'));
    };
  }
}


async function pantallaPanel(perfil, session, volviendo = false, seccion = 'cuenta') {
  if (!volviendo) irA('panel', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  const { data: p, error } = await sb.rpc('mi_panel');
  if (error || !p) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tu cuenta.</div></div>`;
    return;
  }

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const buscamos = p.que_buscamos ?? [];

  // Barras apiladas: la línea entera es el total, y cada segmento la
  // parte que representa. Una barra que se llena al 100 % por ser la
  // mayor no dice nada; ésta responde a "cuánto de mi negocio es esto".
  //
  // Los segmentos por debajo del 2 % se agrupan: por separado serían
  // hilos de dos píxeles imposibles de señalar, y su cifra sigue
  // apareciendo en la leyenda.

  const secciones = {
    cuenta: `
      <div class="bloque">
        <h3>Tu empresa</h3>
        <dl>
          <dt>Nombre</dt><dd>${p.cif ? esc(p.empresa ?? '—') : `
            <!-- Sin NIF el nombre no sale de ningún contrato: lo pone el
                 cliente. Si no, arriba se veía su correo en su lugar. -->
            <span id="nombre-empresa">${esc(p.empresa || 'Sin nombre')}</span>
            <button class="enlace" id="cambiar-nombre"
              style="padding:0 0 0 8px">${p.empresa ? 'Cambiar' : 'Ponerle nombre'}</button>`}</dd>
          <dt>NIF</dt><dd>${esc(p.cif ?? '—')}</dd>
          <dt>Actividad</dt><dd>${esc(p.actividad ?? '—')}</dd>
          <dt>Correo</dt><dd>${esc(p.email ?? '—')}</dd>
          <dt>Cliente desde</dt><dd>${fecha(p.alta)}</dd>
          <dt>Aviso diario por correo</dt><dd>${
            p.avisos === false
              ? 'desactivado — actívalo con la campana de arriba'
              : 'activado'}</dd>
        </dl>
      </div>
      <div class="bloque">
        <h3>Tu historial</h3>
        <dl>
          <dt>Contratos ganados</dt><dd>${p.contratos_ganados ?? 0}${
            p.lotes_ganados > p.contratos_ganados
              ? ` <span style="color:var(--tenue)">(${p.lotes_ganados} lotes)</span>` : ''}</dd>
          <dt>Importe adjudicado</dt><dd>${
            p.importe_ganado ? euros(Number(p.importe_ganado)) : '—'}</dd>
          <dt>Contratos abiertos que te mostramos</dt><dd>${p.oportunidades ?? 0}</dd>
        </dl>
      </div>
      <!-- Borrar la cuenta: al final de todo y como un enlace discreto, a
           propósito. No es algo que se haga sin buscarlo, y dos pasos
           (aviso y escribir BORRAR) evitan hacerlo sin querer. -->
      <div class="borrar-cuenta">
        <button class="enlace" id="borrar-cuenta" aria-expanded="false">Borrar mi cuenta</button>
        <div id="zona-borrar" hidden></div>
      </div>`,

    filtro: `
      ${buscamos.length ? `
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        <ul class="filtro-lista">
          ${buscamos.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>` : `
      <!-- Sin historial no hay lista de lo que buscamos: se enseña lo que
           el cliente contó y los sectores que salieron de ahí. Antes esta
           pantalla no decía nada de su filtro. -->
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        ${p.actividad ? `<p class="guia" style="margin:0 0 12px">Lo que nos
          contaste: «${esc(p.actividad)}»</p>` : ''}
        <ul class="filtro-lista" id="sectores-filtro"></ul>
      </div>`}
      <div class="bloque">
        <h3>Cómo va aprendiendo</h3>
        <dl>
          <dt>Correcciones que has hecho</dt><dd>${p.correcciones?.total ?? 0}${
            p.correcciones?.sin_aplicar
              ? ` · ${p.correcciones.sin_aplicar} sin aplicar todavía` : ''}</dd>
          <dt>Última actualización</dt><dd>${fecha(p.criterio_fecha)}</dd>
        </dl>
        <p class="guia" style="margin:18px 0 0;font-size:.88rem">
        Marca en tu lista los contratos que te interesan y los que no, y
        ajustamos el filtro automáticamente.</p>
        <div id="recuperar"></div>
      </div>
      <div class="bloque peligro">
        <h3>Empezar de cero</h3>
        <p class="guia" style="margin:0 0 18px">Si tu negocio ha cambiado de
        rumbo —una línea nueva, o has dejado de hacer algo— es mejor rehacer
        el filtro que ir corrigiéndolo. Tarda un minuto y no se pierde nada:
        tu historial de contratos sigue ahí.</p>
        <button class="secundario" id="reiniciar">Rehacer mi filtro</button>
        <div id="resultado"></div>
      </div>
      ${PERFILES.length > 1 ? `
      <div class="bloque peligro">
        <h3>Quitar esta empresa</h3>
        <p class="guia" style="margin:0 0 18px">Deja de vigilar
        ${esc(nombreEmpresa(perfil))} y libera su hueco. Se borran su filtro,
        sus correcciones y las empresas que sigues desde ella. Tus otras
        empresas no cambian.</p>
        <button class="secundario" id="quitar-empresa">Quitar esta empresa</button>
        <div id="resultado-quitar"></div>
      </div>` : ''}`,

  };

  secciones.avisos = `<div id="avisos-panel">
    <p class="guia">Cargando tus avisos...</p></div>`;

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>${esc(SECCIONES[seccion] ?? 'Mi cuenta')}</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('panel')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta(seccion)}
      </div>
    </div>
    <div class="panel">${secciones[seccion] ?? secciones.cuenta}</div>`;

  // La misma barra que en las demás pantallas, sin ninguna marcada. Antes
  // solo había un botón "Mis contratos" y para ir a Movimientos, Empresas
  // u Organismos había que pasar por la lista o tirar del botón atrás del
  // navegador, que además recorría una a una las secciones del panel.
  activarNav(perfil, session, 'panel');
  activarMenu(perfil, session);
  activarCampana(p.avisos);
  if (seccion === 'avisos') montarAvisos(perfil, p.avisos !== false);

  // Los sectores de quien no tiene historial, en "Mi filtro".
  const listaSectores = document.getElementById('sectores-filtro');
  if (listaSectores) cargarSectores(perfil).then(sectores => {
    if (!listaSectores.isConnected) return;
    if (sectores.length) listaSectores.innerHTML = sectores
      .map(s => `<li>${esc(s.nombre)}</li>`).join('');
    else listaSectores.remove();
  });

  // ---------- Nombre de la empresa (solo sin NIF) ----------
  // Sin alPulsar: el botón solo existe en "Mi cuenta" y sin NIF, y en las
  // demás secciones dejaba un aviso de que faltaba.
  const botonNombre = document.getElementById('cambiar-nombre');
  if (botonNombre) botonNombre.onclick = () => {
    const hueco = document.getElementById('nombre-empresa').parentElement;
    hueco.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" id="campo-nombre" maxlength="120"
          value="${esc(perfil.empresa ?? '')}" aria-label="Nombre de tu empresa"
          placeholder="Nombre de tu empresa" style="flex:1 1 200px">
        <button class="principal" id="guardar-nombre">Guardar</button>
        <button class="enlace" id="cancelar-nombre">Cancelar</button>
      </div>`;
    const campo = document.getElementById('campo-nombre');
    campo.focus();
    campo.onkeydown = ev => {
      if (ev.key === 'Enter') document.getElementById('guardar-nombre').click();
      if (ev.key === 'Escape') pantallaPanel(perfil, session, true, seccion);
    };
    alPulsar('cancelar-nombre', () => pantallaPanel(perfil, session, true, seccion));
    alPulsar('guardar-nombre', async () => {
      const nombre = campo.value.trim();
      if (!nombre) { campo.focus(); return; }
      const boton = document.getElementById('guardar-nombre');
      boton.disabled = true;
      const { error } = await sb.from('perfiles').update({ empresa: nombre })
        .eq('id', perfil.id);
      if (error) {
        boton.disabled = false;
        recado('No se ha podido guardar. Inténtalo de nuevo.');
        return;
      }
      // El mismo objeto que guarda PERFILES: así la cabecera y el selector
      // de empresas lo enseñan ya en todas las pantallas.
      perfil.empresa = nombre;
      recado('Nombre guardado');
      pantallaPanel(perfil, session, true, seccion);
    });
  };

  // ---------- Borrar la cuenta ----------
  //
  // Primero un aviso que dice qué se pierde; el botón no se activa hasta
  // escribir BORRAR. El servidor lo vuelve a comprobar (accion
  // `borrar_cuenta` en la función de alta).
  const botonBorrar = document.getElementById('borrar-cuenta');
  if (botonBorrar) botonBorrar.onclick = () => {
    const zona = document.getElementById('zona-borrar');
    const abierta = !zona.hidden;
    zona.hidden = abierta;
    botonBorrar.setAttribute('aria-expanded', String(!abierta));
    if (abierta) { zona.innerHTML = ''; return; }
    zona.innerHTML = `
      <div class="aviso mal">
        <strong>Esto no se puede deshacer.</strong> Se borra tu cuenta
        (${esc(p.email ?? 'este correo')}) con ${PERFILES.length > 1
          ? `sus ${PERFILES.length} empresas` : 'tu empresa'}: el filtro, las
        correcciones que has hecho, las empresas que sigues y tus avisos.
        Dejarás de recibir el correo diario y, para volver, haría falta un
        código de acceso nuevo.
        <label for="confirmar-borrar" style="display:block;margin:14px 0 6px">
          Escribe <strong>BORRAR</strong> para confirmarlo:</label>
        <input type="text" id="confirmar-borrar" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="secundario" id="no-borrar">Cancelar</button>
          <button class="principal peligroso" id="si-borrar" disabled>Borrar mi cuenta para siempre</button>
        </div>
        <div id="resultado-borrar"></div>
      </div>`;
    const campo = document.getElementById('confirmar-borrar');
    const si = document.getElementById('si-borrar');
    campo.focus();
    campo.oninput = () => { si.disabled = campo.value.trim().toUpperCase() !== 'BORRAR'; };
    document.getElementById('no-borrar').onclick = () => botonBorrar.click();
    si.onclick = async () => {
      si.disabled = true;
      si.textContent = 'Borrando...';
      try {
        await llamar('borrar_cuenta', { confirmacion: 'BORRAR' });
      } catch {
        si.disabled = false;
        si.textContent = 'Borrar mi cuenta para siempre';
        document.getElementById('resultado-borrar').innerHTML = `<p style="margin:12px 0 0">
          No se ha podido borrar. Inténtalo de nuevo o escríbenos.</p>`;
        return;
      }
      // Lo que este navegador recordaba de la cuenta: filtros, empresa
      // activa, explicación oculta. Ya no tiene a quién pertenecer.
      try {
        Object.keys(localStorage).filter(k => /^(filtros-contratos:|empresa-activa$|sin-explicacion$)/.test(k))
          .forEach(k => localStorage.removeItem(k));
        sessionStorage.clear();
      } catch { /* modo privado */ }
      // Solo en local: en el servidor la sesión ya no existe.
      await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      recado('Tu cuenta se ha borrado');
    };
  };

  // Si ocultó la explicación de la lista, aquí puede recuperarla.
  const hueco = document.getElementById('recuperar');
  let oculta = false;
  try { oculta = localStorage.getItem('sin-explicacion') === '1'; } catch { /* nada */ }
  if (hueco && oculta) {
    hueco.innerHTML = `<button class="enlace" id="volver-explica"
      style="padding-left:0;margin-top:10px">Volver a mostrar la explicación
      en mi lista</button>`;
    alPulsar('volver-explica', () => {
      try { localStorage.removeItem('sin-explicacion'); } catch { /* nada */ }
      hueco.innerHTML = `<p class="guia" style="margin:10px 0 0;font-size:.88rem">
        Hecho. Volverá a aparecer en tu lista.</p>`;
    });
  }

  // ---------- Quitar esta empresa ----------
  alPulsar('quitar-empresa', () => {
    const zona = document.getElementById('resultado-quitar');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? No se puede deshacer: para volver a
      vigilarla habría que darla de alta otra vez.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no-quitar">Cancelar</button>
        <button class="principal" id="si-quitar">Sí, quitarla</button>
      </div></div>`;
    alPulsar('no-quitar', () => zona.innerHTML = '');
    alPulsar('si-quitar', async () => {
      zona.innerHTML = `<div class="aviso">Quitando...</div>`;
      const { data, error } = await sb.rpc('quitar_empresa', { perfil: perfil.id });
      if (error || !data?.ok) {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
        return;
      }
      fijarEmpresa(PERFILES.find(p => p.id !== perfil.id)?.id ?? null);
      arrancar();
    });
  });

  // ---------- Rehacer el filtro ----------
  alPulsar('reiniciar', () => {
    const zona = document.getElementById('resultado');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? Se borrará tu filtro actual y volverás a
      empezar ${p.cif ? 'desde tu NIF' : 'el alta: tu NIF, si ya tienes contratos, o a qué te dedicas'}.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no">Cancelar</button>
        <button class="principal" id="si">Sí, rehacerlo</button>
      </div></div>`;
    alPulsar('no', () => zona.innerHTML = '');
    alPulsar('si', async () => {
      zona.innerHTML = `<div class="aviso">Preparando...</div>`;
      try {
        await llamar('reiniciar');
        arrancar();
      } catch {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
      }
    });
  });
}

// ---------- Mis avisos: qué llega en el correo diario ----------
//
// Por sector y por zona. Lo que se elige aquí filtra el correo, no la
// lista: en la web siempre se ve todo, y el correo es lo que merece
// interrumpir.
//
// Las reglas son las mismas que usa la base al preparar el correo
// (novedades_de_perfil) y la lista al filtrar: el recuento de abajo dice
// la verdad sobre lo que llegará.
async function montarAvisos(perfil, encendido) {
  const [cfg, zonas, sectores, contratos] = await Promise.all([
    sb.rpc('mis_avisos'), pedir('zonas_espana'),
    cargarSectores(perfil), pedirContratos(perfil.id)]);
  const zona = document.getElementById('avisos-panel');
  // Se ha ido a otra pantalla o a otra empresa mientras cargaba.
  if (!zona || perfil.id !== perfilActivoId) return;
  if (cfg.error || zonas.error || !cfg.data) {
    zona.innerHTML = `<div class="aviso mal">No hemos podido cargar tus avisos.</div>`;
    return;
  }

  const provs = new Set(cfg.data.provincias ?? []);
  const elegidos = new Set(cfg.data.sectores ?? []);
  const todosSectores = !elegidos.size;
  const lista = contratos.data ?? [];

  const porComunidad = {}, comunidadDe = {};
  (zonas.data ?? []).forEach(z => {
    (porComunidad[z.comunidad] ??= []).push(z.provincia);
    comunidadDe[z.provincia] = z.comunidad;
  });
  // "Comunidad de Madrid" con Madrid dentro: se enseña solo la provincia.
  const plano = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const uniprovincial = c => porComunidad[c].length === 1
    && plano(c).includes(plano(porComunidad[c][0]));
  // Por el nombre que SE VE: ordenando por el de la comunidad, "Madrid"
  // caía entre Ceuta y Comunidad Valenciana, y "Murcia" al final.
  const rotuloZona = c => uniprovincial(c) ? porComunidad[c][0] : c;
  const comunidades = Object.keys(porComunidad)
    .sort((a, b) => rotuloZona(a).localeCompare(rotuloZona(b), 'es'));

  zona.innerHTML = `
    ${encendido ? '' : `<div class="aviso aviso-apagado">El aviso diario está
      desactivado. Al guardar se activa, o puedes activarlo con la campana de
      arriba.</div>`}
    ${sectores.length > 1 ? `
    <div class="bloque">
      <h3>Sectores</h3>
      <p class="guia" style="margin:0 0 14px">De qué quieres que te avisemos.</p>
      <div class="casillas">
        ${sectores.map(x => `<label class="casilla-linea">
          <input type="checkbox" autocomplete="off" data-sector="${esc(x.id)}"
                 ${todosSectores || elegidos.has(x.id) ? 'checked' : ''}>
          <span>${esc(x.nombre)}</span></label>`).join('')}
      </div>
    </div>` : ''}
    <div class="bloque">
      <h3>Zona</h3>
      <p class="guia" style="margin:0 0 14px">Los contratos de ámbito
      autonómico, sin provincia concreta, te llegan si eliges alguna
      provincia de esa comunidad.</p>
      <label class="casilla-linea toda">
        <input type="checkbox" autocomplete="off" id="toda-espana" ${provs.size ? '' : 'checked'}>
        <span>Toda España</span></label>
      <div class="zonas">
        ${comunidades.map(c => uniprovincial(c) ? `
          <div class="comunidad">
            <label class="casilla-linea"><input type="checkbox" autocomplete="off"
              data-prov="${esc(porComunidad[c][0])}"><span>${esc(porComunidad[c][0])}</span></label>
          </div>` : `
          <div class="comunidad">
            <div class="fila-comunidad">
              <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-com="${esc(c)}">
                <span>${esc(c)}</span></label>
              <button type="button" class="enlace ver-provs" data-ver="${esc(c)}"
                aria-expanded="false">${porComunidad[c].length} provincias</button>
            </div>
            <div class="provs" data-de="${esc(c)}" hidden>
              ${porComunidad[c].sort((a, b) => a.localeCompare(b, 'es')).map(pv => `
                <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-prov="${esc(pv)}">
                  <span>${esc(pv)}</span></label>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="bloque resumen-avisos">
      <p id="avisos-cuenta"></p>
      <!-- Con la campana apagada, guardar sin encenderla dejaba a alguien
           configurando un correo que nunca le iba a llegar. -->
      <button class="principal" id="guardar-avisos">${encendido
        ? 'Guardar mis avisos' : 'Guardar y activar el aviso diario'}</button>
      <div id="avisos-resultado"></div>
    </div>`;

  const casillasSector = [...zona.querySelectorAll('[data-sector]')];
  const casillasProv = [...zona.querySelectorAll('[data-prov]')];
  const sectoresElegidos = () => sectores.filter(x =>
    casillasSector.find(c => c.dataset.sector === x.id)?.checked);

  // Lo que se ve marcado sale siempre de `provs`: una sola fuente. Las
  // casillas llevan autocomplete="off" para que el navegador no les
  // devuelva, al volver atrás, un estado anterior distinto del guardado.
  function pintarZona() {
    document.getElementById('toda-espana').checked = provs.size === 0;
    casillasProv.forEach(c => c.checked = provs.has(c.dataset.prov));
    zona.querySelectorAll('[data-com]').forEach(c => {
      const suyas = porComunidad[c.dataset.com];
      const n = suyas.filter(pv => provs.has(pv)).length;
      c.checked = n === suyas.length;
      c.indeterminate = n > 0 && n < suyas.length;
      // Con algunas elegidas, se enseñan: si no, no se ve cuáles.
      if (c.indeterminate) desplegar(c.dataset.com, true);
    });
    contar();
  }

  function desplegar(c, abierto) {
    const caja = zona.querySelector(`.provs[data-de="${CSS.escape(c)}"]`);
    const boton = zona.querySelector(`[data-ver="${CSS.escape(c)}"]`);
    if (!caja) return;
    caja.hidden = !abierto;
    boton.setAttribute('aria-expanded', String(abierto));
  }

  function contar() {
    const secs = sectoresElegidos();
    const entra = o =>
      (!casillasSector.length || secs.length === sectores.length
        || secs.some(x => enSector(o, x))) &&
      (provs.size === 0 || provs.has(o.provincia) ||
        (!o.provincia && (!o.comunidad ||
          [...provs].some(pv => comunidadDe[pv] === o.comunidad))));
    const n = lista.filter(entra).length;
    document.getElementById('avisos-cuenta').innerHTML =
      `De los <strong>${plural(lista.length, 'contrato abierto', 'contratos abiertos')}</strong>
       que tienes ahora, <strong>${n}</strong> ${n === 1 ? 'entraría' : 'entrarían'}
       en tus avisos. Cada día te llegan solo los nuevos.`;
  }

  document.getElementById('toda-espana').onchange = ev => {
    if (ev.target.checked) provs.clear();
    else ev.target.checked = true;   // se desmarca eligiendo una provincia
    pintarZona();
  };
  casillasProv.forEach(c => c.onchange = () => {
    c.checked ? provs.add(c.dataset.prov) : provs.delete(c.dataset.prov);
    pintarZona();
  });
  zona.querySelectorAll('[data-com]').forEach(c => c.onchange = () => {
    const suyas = porComunidad[c.dataset.com];
    const todas = suyas.every(pv => provs.has(pv));
    suyas.forEach(pv => todas ? provs.delete(pv) : provs.add(pv));
    pintarZona();
  });
  zona.querySelectorAll('[data-ver]').forEach(b => b.onclick = () =>
    desplegar(b.dataset.ver, b.getAttribute('aria-expanded') !== 'true'));
  casillasSector.forEach(c => c.onchange = contar);

  alPulsar('guardar-avisos', async () => {
    const resultado = document.getElementById('avisos-resultado');
    const secs = sectoresElegidos();
    if (casillasSector.length && !secs.length) {
      resultado.innerHTML = `<div class="aviso mal">Elige al menos un sector.</div>`;
      return;
    }
    const boton = document.getElementById('guardar-avisos');
    boton.disabled = true;
    // Todos marcados se guarda como "ninguno elegido" (= todos): así, si
    // mañana aparece un sector nuevo, también entra.
    const { data, error } = await sb.rpc('guardar_avisos', {
      provincias: [...provs],
      sectores: secs.length === sectores.length ? [] : secs.map(x => x.id),
    });
    boton.disabled = false;
    if (error || !data?.ok) {
      resultado.innerHTML = `<div class="aviso mal">No se ha podido guardar. Inténtalo de nuevo.</div>`;
      return;
    }
    resultado.innerHTML = '';
    if (encendido) { recado('Avisos guardados'); return; }

    let activar;
    try { activar = await sb.rpc('cambiar_avisos', { quiero: true }); }
    catch (fallo) { activar = { error: fallo }; }
    if (activar.error) {
      recado('Avisos guardados, pero no hemos podido activarlos. Usa la campana de arriba.');
      return;
    }
    encendido = true;
    document.getElementById('campana')?.setAttribute('aria-pressed', 'true');
    zona.querySelector('.aviso-apagado')?.remove();
    boton.textContent = 'Guardar mis avisos';
    recado('Avisos guardados. Te llegarán cada mañana por correo');
  });

  pintarZona();
}

    if (document.getElementById('quiero-aviso')?.checked) {
