// Paleta fría, sin rojos ni naranjas.
//
// En la interfaz el color ya significa algo: --no y --urge son rojizos,
// y --acento marca lo que reclama atención. Pintar con esos tonos una
// categoría neutra hace que el gráfico parezca una alarma: media barra
// naranja se lee como "algo va mal" aunque solo diga "equipamiento
// médico".
//
// La regla habitual en sistemas de diseño: los colores con significado
// se reservan, y las categorías usan una escala cualitativa aparte.
// Aquí, azules y verdeazulados que descienden en tono, lo bastante
// distintos entre sí para no confundirse.
const PALETA = ['#2d5f8a','#3f8f8c','#5c7fb8','#6aa88b','#7a6ea8',
                '#4a8fa8','#8a9a5b','#5e7a94'];
const COLOR_OTROS = '#aab6c2';

function apilada(filas, campoNombre, campoValor, unidad, rotulo = true,
                 campoClave = null, conLeyenda = true) {
  const total = filas.reduce((s, f) => s + (Number(f[campoValor]) || 0), 0);
  if (!total) return '';

  const conValor = filas
    .map((f, i) => ({
      nombre: String(f[campoNombre] ?? '—'),
      valor: Number(f[campoValor]) || 0,
      color: PALETA[i % PALETA.length],
      // Para que quien dibuje el gráfico pueda saber a qué fila
      // corresponde cada porción y reaccionar al señalarla.
      clave: campoClave ? String(f[campoClave] ?? '') : '',
    }))
    .filter(x => x.valor > 0)
    .sort((a, b) => b.valor - a.valor);

  const grandes = conValor.filter(x => x.valor / total >= 0.02);
  const chicos = conValor.filter(x => x.valor / total < 0.02);
  const trozos = [...grandes];
  if (chicos.length) {
    trozos.push({
      nombre: chicos.length === 1 ? chicos[0].nombre
            : `Otros ${chicos.length} ${unidad === 'euros' ? '' : ''}`.trim(),
      valor: chicos.reduce((s, x) => s + x.valor, 0),
      color: COLOR_OTROS,
      agrupa: chicos,
    });
  }

  const comoTexto = v => unidad === 'euros' ? euros(v)
    : `${v} ${v === 1 ? 'contrato' : 'contratos'}`;
  const pct = v => {
    const p = v / total * 100;
    return p >= 10 ? `${Math.round(p)} %` : `${p.toFixed(1).replace('.', ',')} %`;
  };

  const id = 'r' + Math.random().toString(36).slice(2, 8);

  // Barras o quesito, según lo que tenga elegido el cliente. Los dos
  // dibujan lo mismo: cada porción lleva su etiqueta y su valor, así que
  // el detalle al pasar por encima funciona igual con cualquiera.
  let grafico;
  if (formaActual() === 'quesito') {
    // Se dibuja con el trazo de un círculo y no con arcos: cada porción es
    // un segmento del contorno, lo que evita calcular trayectorias y hace
    // que cada una sea un elemento propio al que se puede apuntar.
    const R = 60, C = 2 * Math.PI * R;
    let recorrido = 0;
    grafico = `<svg class="quesito" viewBox="0 0 160 160" role="img">
      ${trozos.map((t, i) => {
        const parte = t.valor / total;
        const trazo = `<circle class="trozo" data-i="${i}" data-clave="${esc(t.clave ?? '')}"
          cx="80" cy="80" r="${R}"
          stroke="${t.color}"
          stroke-dasharray="${(parte * C).toFixed(2)} ${C.toFixed(2)}"
          stroke-dashoffset="${(-recorrido * C).toFixed(2)}"
          transform="rotate(-90 80 80)"
          data-valor="${esc(comoTexto(t.valor))}"
          aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></circle>`;
        recorrido += parte;
        return trazo;
      }).join('')}
    </svg>`;
  } else {
    grafico = `<div class="apilada">
      ${trozos.map((t, i) => `<button class="trozo" data-i="${i}" data-clave="${esc(t.clave ?? '')}"
        style="width:${t.valor / total * 100}%;background:${t.color}"
        data-valor="${esc(comoTexto(t.valor))}"
        aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></button>`).join('')}
    </div>`;
  }

  return `
    <div class="reparto" data-reparto="${id}">
      ${rotulo === false ? ''
        : `<h4>${unidad === 'euros' ? 'Por importe' : 'Por número de contratos'}</h4>`}
      ${grafico}
      <div class="detalle-trozo callado" data-hueco>
        Pasa por encima o toca para ver el detalle
      </div>
      ${conLeyenda === false ? '' : `<div class="leyenda">
        ${trozos.map((t, i) => `<button data-i="${i}">
          <span class="punto" style="background:${t.color}"></span>
          <span class="cual">${esc(t.nombre)}</span>
          <span class="pct">${pct(t.valor)}</span>
        </button>`).join('')}
      </div>`}
    </div>`;
}

// Devuelve las dos barras de una misma dimensión.
function reparto(filas, campoNombre) {
  if (!filas.length) return `<p class="sin-datos">Todavía no hay datos.</p>`;
  return apilada(filas, campoNombre, 'contratos', 'contratos')
       + apilada(filas, campoNombre, 'importe', 'euros');
}

// Detalle de cada segmento de las barras apiladas. Al pasar por encima o
// tocar, la línea de debajo dice qué es y cuánto vale. En el móvil no hay
// cursor, así que el toque es la única forma de leer un segmento estrecho.
function activarBarras(donde) {
  donde.querySelectorAll('[data-reparto]').forEach(caja => {
    const hueco = caja.querySelector('[data-hueco]');
    const trozos = [...caja.querySelectorAll('.trozo')];
    if (!hueco || !trozos.length) return;
    const reposo = hueco.innerHTML;

    const mostrar = i => {
      const t = trozos[i];
      if (!t) return;
      const etiqueta = t.getAttribute('aria-label');
      const corte = etiqueta.lastIndexOf(': ');
      hueco.className = 'detalle-trozo';
      hueco.innerHTML = `
        <span class="punto" style="background:${t.style.background || t.getAttribute('stroke')}"></span>
        <span class="cual">${esc(etiqueta.slice(0, corte))}</span>
        <span class="cuanto">${esc(etiqueta.slice(corte + 2))} · ${
          esc(t.dataset.valor ?? '')}</span>`;
      trozos.forEach((x, j) => x.classList.toggle('activo', j === +i));
    };
    const soltar = () => {
      hueco.className = 'detalle-trozo callado';
      hueco.innerHTML = reposo;
      trozos.forEach(x => x.classList.remove('activo'));
    };

    trozos.forEach(t => {
      t.onmouseenter = () => mostrar(t.dataset.i);
      t.onfocus = () => mostrar(t.dataset.i);
      // En táctil el clic es lo único que hay: se queda fijo hasta que se
      // toque otro.
      t.onclick = () => mostrar(t.dataset.i);
    });
    caja.querySelector('.apilada, .quesito')?.addEventListener('mouseleave', soltar);

    caja.querySelectorAll('.leyenda button').forEach(b => {
      b.onmouseenter = () => mostrar(b.dataset.i);
      b.onclick = () => mostrar(b.dataset.i);
    });
    caja.querySelector('.leyenda').onmouseleave = soltar;
  });
}

// Navegación principal. Va en la cabecera y no en el menú de cuenta
// porque Contratos y Mercado son áreas pares: qué me interesa presentar,
// y qué pasa en mi sector.
function navPrincipal(donde) {
  return `
    <div class="principales">
      <button data-nav="contratos" aria-current="${donde === 'contratos'}">Contratos</button>
      <button data-nav="movimientos" aria-current="${donde === 'movimientos'}">Movimientos</button>
      <button data-nav="mercado" aria-current="${donde === 'mercado'}">Empresas</button>
      <button data-nav="organismos" aria-current="${donde === 'organismos'}">Organismos</button>
      <button data-nav="viabilidad" aria-current="${donde === 'viabilidad'}">Viabilidad</button>
    </div>`;
}

function activarNav(perfil, session, donde) {
  document.querySelectorAll('[data-nav]').forEach(b => {
    // Al acercar el cursor ya se va pidiendo: para cuando pulsa, los
    // datos están de camino.
    const adelantar = () => precargar(b.dataset.nav);
    b.onmouseenter = adelantar;
    b.onfocus = adelantar;
    b.ontouchstart = adelantar;
  });

  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    if (b.dataset.nav === donde) return;
    if (b.dataset.nav === 'mercado') pantallaMercado(perfil, session);
    else if (b.dataset.nav === 'movimientos') pantallaMovimientos(perfil, session);
    else if (b.dataset.nav === 'organismos') pantallaOrganismos(perfil, session);
    else if (b.dataset.nav === 'viabilidad') pantallaViabilidad(perfil, session);
    else pantallaOportunidades(perfil, session);
  });
}

// ---------- Lo que ya se ha pedido ----------
//
// Cada cambio de pestaña volvía a pedirlo todo a la base, así que había
// un segundo de espera cada vez. Aquí se guarda lo último que devolvió
// cada consulta: al volver, la pantalla sale al instante con eso y se
// refresca por detrás.
//
// Vive solo en memoria y se pierde al recargar, que es lo que se quiere:
// nunca se enseñan datos de una sesión anterior.
const CACHE = new Map();
const VIGENCIA = 90_000;   // Metro y medio de margen: pasado eso, se pide de nuevo.

async function pedir(nombre, args = {}, opciones = {}) {
  const clave = nombre + ':' + JSON.stringify(args);
  const guardado = CACHE.get(clave);
  const fresco = guardado && (Date.now() - guardado.cuando) < VIGENCIA;

  // Con algo guardado se devuelve YA y se refresca en segundo plano.
  if (guardado && opciones.alVuelo !== false) {
    if (!fresco) refrescar(clave, nombre, args, opciones.alCambiar);
    return { data: guardado.data, error: null, deCache: true };
  }

  const r = await sb.rpc(nombre, args);
  if (!r.error) CACHE.set(clave, { data: r.data, cuando: Date.now() });
  return r;
}

async function refrescar(clave, nombre, args, alCambiar) {
  try {
    const r = await sb.rpc(nombre, args);
    if (r.error) return;
    const antes = JSON.stringify(CACHE.get(clave)?.data);
    CACHE.set(clave, { data: r.data, cuando: Date.now() });
    // Solo se avisa si de verdad cambió algo: repintar una lista
    // idéntica mueve lo que el cliente está mirando sin motivo.
    if (alCambiar && JSON.stringify(r.data) !== antes) alCambiar(r.data);
  } catch { /* el refresco nunca estorba */ }
}

// Lo que se toca deja de valer: tras corregir un contrato o seguir una
// empresa, lo guardado ya no describe la realidad.
function olvidar(...nombres) {
  for (const k of [...CACHE.keys()]) {
    if (nombres.some(n => k.startsWith(n + ':'))) CACHE.delete(k);
  }
}

// Sus contratos abiertos. No es una función sino una consulta de tabla,
// así que necesita su propio guardado — y es la pantalla a la que más se
// vuelve, así que es donde más se nota.
async function pedirContratos(perfilId, alCambiar) {
  const clave = 'contratos:' + perfilId;
  const guardado = CACHE.get(clave);

  if (guardado) {
    if (Date.now() - guardado.cuando >= VIGENCIA) {
      sb.from('mis_oportunidades').select('*').eq('perfil_id', perfilId)
        .then(({ data, error }) => {
          if (error) return;
          const antes = JSON.stringify(CACHE.get(clave)?.data);
          CACHE.set(clave, { data, cuando: Date.now() });
          if (alCambiar && JSON.stringify(data) !== antes) alCambiar(data);
        });
    }
    return { data: guardado.data, error: null };
  }

  const r = await sb.from('mis_oportunidades').select('*').eq('perfil_id', perfilId);
  if (!r.error) CACHE.set(clave, { data: r.data, cuando: Date.now() });
  return r;
}

// Al pasar el cursor por una pestaña se va pidiendo lo que necesita.
// Para cuando se pulsa, los datos ya están de camino.
function precargar(donde) {
  if (donde === 'contratos') {
    // El perfil no está aquí, pero la clave se resuelve sola en cuanto
    // la pantalla lo pida: lo que importa es no esperar dos veces.
    return;
  }
  if (donde === 'movimientos') {
    pedir('movimientos_mercado', { dias: 30 });
    pedir('pulso_mercado', { dias: 30 });
  } else if (donde === 'mercado') {
    pedir('buscar_organismo', { texto: '', salto: 0, cuantos: 400 });
  } else if (donde === 'viabilidad') {
    pedir('analizables', { texto: '', organo_filtro: '' });
  }
}

// ---------- Viabilidad ----------
//
// Responde a una pregunta distinta del cribado: no «¿esto encaja con lo
// que hago?» sino «¿merece la pena que me presente?».
//
// Devuelve un veredicto en palabras y sus motivos, no una puntuación de
// 0 a 100: un número compuesto oculta de dónde sale, y si falla una vez
// el cliente deja de fiarse de todo lo demás.
async function pantallaViabilidad(perfil, session, volviendo = false,
                                  contrato = null) {
  if (!volviendo) irA('viabilidad', contrato ? { contrato } : {});
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Viabilidad</strong>
        <div class="quien">${esc(perfil.empresa || '')}</div>
        ${navPrincipal('viabilidad')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <div id="zona"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'viabilidad');

  const zona = document.getElementById('zona');

  // ---------- Elegir contrato ----------
  async function elegir(texto = '', organo = '') {
    zona.innerHTML = `
      <h1 style="margin-top:26px">¿A cuál te presentas?</h1>
      <p class="guia" style="max-width:66ch">Antes de preparar una oferta,
      mira quién ha ganado las convocatorias anteriores, cuánto se baja del
      presupuesto en ese organismo y qué parte de la puntuación depende de
      una fórmula.</p>

      <div class="buscador-cif" style="max-width:640px">
        <input type="search" id="q-contrato" autocomplete="off"
               placeholder="Buscar entre tus contratos abiertos"
               value="${esc(texto)}" aria-label="Buscar contrato">
      </div>
      <div id="lista-elegir"><p class="guia">Cargando...</p></div>`;

    const campo = document.getElementById('q-contrato');
    let espera;
    campo.oninput = () => {
      clearTimeout(espera);
      espera = setTimeout(() => cargarLista(campo.value.trim(), organo), 250);
    };
    campo.focus();
    cargarLista(texto, organo);
  }

  async function cargarLista(texto, organo) {
    const { data, error } = await pedir('analizables',
      { texto: texto || '', organo_filtro: organo || '' });
    const caja = document.getElementById('lista-elegir');
    if (!caja) return;

    if (error) {
      caja.innerHTML = `<div class="aviso mal">No hemos podido cargar tus
        contratos.<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
        ${esc(error.message || '')}</div></div>`;
      return;
    }

    const filas = data ?? [];
    if (!filas.length) {
      caja.innerHTML = `<p class="vacio">${texto
        ? 'Ningún contrato abierto coincide con esa búsqueda.'
        : 'Ahora mismo no tienes contratos abiertos que analizar.'}</p>`;
      return;
    }

    caja.innerHTML = `<div class="elige">${filas.map(f => {
      const dias = diasHasta(f.fecha_limite);
      return `<button data-contrato="${esc(f.id_licitacion)}">
        <span>
          <p class="que">${esc(f.titulo ?? '')}</p>
          <span class="donde">${esc([f.organo, f.provincia]
            .filter(Boolean).join(' · '))}</span>
        </span>
        <span class="plazo">${f.presupuesto
          ? euros(Number(f.presupuesto)) : ''}${dias != null
          ? `<br>${dias < 0 ? 'vencido' : dias === 0 ? 'vence hoy'
             : dias === 1 ? 'queda 1 día' : `quedan ${dias} días`}` : ''}</span>
      </button>`;
    }).join('')}</div>`;

    caja.querySelectorAll('[data-contrato]').forEach(b =>
      b.onclick = () => analizar(b.dataset.contrato));
  }

  // ---------- Analizar ----------
  async function analizar(id, restaurando = false) {
    if (!restaurando) irA('viabilidad', { contrato: id });
    zona.innerHTML = `<p class="guia" style="margin-top:26px">Analizando...</p>`;

    const { data: d, error } = await sb.rpc('viabilidad', { ficha: id });
    if (error || !d || d.error) {
      zona.innerHTML = `<div class="aviso mal" style="margin-top:26px">
        No hemos podido analizar este contrato.
        ${error ? `<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
          ${esc(error.message)}</div>` : ''}</div>`;
      return;
    }
    pintar(d);
  }

  function pintar(d) {
    const c = d.contrato ?? {};
    const inc = d.incumbencia ?? {};
    const org = d.organismo ?? {};
    const lider = inc.lider ?? {};
    const motivos = Array.isArray(d.motivos) ? d.motivos : [];

    // Si el proveedor de siempre es él, el mensaje se invierte: no es un
    // aviso, es una ventaja que conviene defender.
    const clase = d.soy_el_lider ? 'mio' : d.veredicto === 'cerrado' ? 'cerrado'
                : d.veredicto === 'difícil' ? 'dificil' : 'abierto';
    const etiqueta = d.soy_el_lider ? 'Este contrato es tuyo'
                   : d.veredicto === 'cerrado' ? 'Parece cerrado'
                   : d.veredicto === 'difícil' ? 'Lo tienes difícil'
                   : 'Tienes opciones';

    // Cuánto respalda el veredicto. Sin esto, «Tienes opciones» suena
    // igual de firme con tres contratos detrás que con doscientos.
    const muestra = Math.max(inc.ediciones ?? 0, org.licitadores_muestra ?? 0,
                             org.baja_muestra ?? 0);

    zona.innerHTML = `
      <button class="volver-listas" id="otro" style="margin-top:22px">
        ← Analizar otro contrato</button>

      <h1 style="margin:6px 0 8px;font-size:clamp(1.3rem,3vw,1.7rem)">
        ${esc(c.titulo ?? '')}</h1>
      <p class="guia" style="margin:0 0 20px">${esc([c.organo, c.provincia]
        .filter(Boolean).join(' · '))}${c.presupuesto
        ? ` · ${euros(Number(c.presupuesto))}` : ''}</p>

      <div class="dictamen ${clase}">
        <div class="titular">
          <h2>${etiqueta}</h2>
          ${muestra ? `<span class="cuantos">según ${muestra}
            ${muestra === 1 ? 'contrato anterior' : 'contratos anteriores'}
            de este organismo</span>` : ''}
        </div>
        <div class="motivos">
          ${motivos.length
            ? motivos.map(m => `<p>${esc(m[0].toUpperCase() + m.slice(1))}.</p>`).join('')
            : `<p class="solo">No hemos encontrado señales en contra: ningún
               proveedor que repita, ningún criterio subjetivo y poca
               competencia en este organismo.</p>`}
        </div>
      </div>

      ${(!c.peso_objetivo && !inc.ediciones) ? `
        <p class="guia" style="margin:14px 0 0;font-size:.88rem">
        De este contrato no hay datos suficientes para valorarlo: ni el
        reparto de la puntuación ni adjudicaciones anteriores del
        organismo. El veredicto solo refleja que no hemos encontrado
        señales en contra, no que no las haya.</p>` : ''}

      <div class="factores">
        ${factorIncumbencia(inc, lider, d.soy_el_lider)}
        ${factorCriterios(c)}
        ${factorBaja(org)}
        ${factorCompetencia(org)}
      </div>

      ${(inc.reparto?.length) ? `
        <div class="seccion-mercado" style="margin-top:18px">
          <h3>Quién ha ganado aquí${inc.por_convocatoria
            ? ' este mismo contrato' : ' contratos parecidos'}</h3>
          <p class="guia" style="margin:0 0 14px;font-size:.89rem">
            ${inc.por_convocatoria
              ? `${inc.ediciones} convocatorias en los últimos cuatro años.`
              : `No hemos encontrado convocatorias anteriores de este contrato
                 concreto, así que miramos las de su misma familia en este
                 organismo: ${inc.ediciones} en cuatro años.`}</p>
          <div class="historial-contrato">
            ${inc.reparto.map((r, i) => `
              <div class="${r.cif === lider.cif ? 'lider' : ''} ${
                r.cif === perfil.cif ? 'mia' : ''}">
                <span class="quien">${esc(r.nombre ?? '—')}</span>
                <span class="cuando">${r.veces}
                  ${r.veces === 1 ? 'vez' : 'veces'}</span>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${c.enlace ? `<div style="margin-top:22px">
        <a class="secundario" href="${esc(c.enlace)}" target="_blank"
           rel="noopener" style="display:inline-block;text-decoration:none">
          Ver el expediente</a></div>` : ''}`;

    alPulsar('otro', () => elegir());
  }

  // ---------- Los cuatro factores ----------
  function factorIncumbencia(inc, lider, esMio) {
    if (!inc.ediciones) {
      return `<div class="factor"><h4>Quién suele ganar</h4>
        <p class="vacio-factor">No hay adjudicaciones anteriores de este
        organismo en tu sector.</p></div>`;
    }
    const cuota = lider.cuota ?? 0;
    const clase = esMio ? 'bueno' : cuota >= 60 ? 'malo' : cuota <= 30 ? 'bueno' : '';
    return `<div class="factor ${clase}">
      <h4>Quién suele ganar</h4>
      <div class="cifra">${cuota} %</div>
      <span class="pie">${esc(lider.nombre ?? '—')}<br>
        ${lider.veces} de ${inc.ediciones} adjudicaciones ·
        ${inc.empresas} ${inc.empresas === 1 ? 'empresa' : 'empresas'}
        distintas</span>
    </div>`;
  }

  function factorCriterios(c) {
    if (c.peso_objetivo == null) {
      return `<div class="factor"><h4>Cómo se puntúa</h4>
        <p class="vacio-factor">Este expediente no publica el reparto de
        la puntuación.</p></div>`;
    }
    const juicio = c.peso_subjetivo ?? 0;
    const lista = Array.isArray(c.criterios) ? c.criterios : [];
    return `<div class="factor ${juicio >= 40 ? 'malo' : juicio === 0 ? 'bueno' : ''}"
                 style="grid-column:span 2">
      <h4>Cómo se puntúa</h4>
      <div class="pesos">
        ${c.peso_objetivo ? `<span class="formula"
          style="width:${c.peso_objetivo}%">${c.peso_objetivo} % fórmula</span>` : ''}
        ${juicio ? `<span class="juicio"
          style="width:${juicio}%">${juicio} % juicio</span>` : ''}
      </div>
      <span class="pie">${juicio >= 40
        ? 'Una parte grande depende de la valoración de un técnico, y eso favorece a quien ya trabaja con el organismo.'
        : juicio === 0
          ? 'Todo se calcula con fórmula: gana la mejor oferta, sin valoraciones.'
          : 'La mayor parte se calcula con fórmula.'}</span>
      ${lista.length ? `<ul class="lista-criterios">
        ${lista.map(k => `<li>
          <span class="${k.juicio ? 'esjuicio' : ''}">${esc(k.nombre || '—')}</span>
          <span class="peso">${k.peso}${k.juicio ? ' · juicio' : ''}</span>
        </li>`).join('')}</ul>` : ''}
    </div>`;
  }

  function factorBaja(org) {
    if (org.baja_media == null) {
      return `<div class="factor"><h4>A qué precio se cierra</h4>
        <p class="vacio-factor">Sin datos suficientes de este organismo.</p></div>`;
    }
    return `<div class="factor ${org.baja_media <= 75 ? 'malo' : ''}">
      <h4>A qué precio se cierra</h4>
      <div class="cifra">${org.baja_media} %</div>
      <span class="pie">del presupuesto, de media<br>
        medido en ${org.baja_muestra}
        ${org.baja_muestra === 1 ? 'contrato' : 'contratos'}</span>
    </div>`;
  }

  function factorCompetencia(org) {
    // Con menos de cinco contratos, una media no describe nada: dos de
    // tres es una casualidad, no una costumbre del organismo.
    if (org.licitadores_muestra != null && org.licitadores_muestra < 5) {
      return `<div class="factor"><h4>Cuánta competencia</h4>
        <p class="vacio-factor">Solo hay ${org.licitadores_muestra}
        ${org.licitadores_muestra === 1 ? 'contrato' : 'contratos'} con datos
        de licitadores en este organismo: muy poco para decir nada.</p></div>`;
    }
    if (org.licitadores_medio == null) {
      return `<div class="factor"><h4>Cuánta competencia</h4>
        <p class="vacio-factor">Sin datos de licitadores en este
        organismo.</p></div>`;
    }
    const n = String(org.licitadores_medio).replace('.', ',');
    return `<div class="factor ${org.licitadores_medio >= 8 ? 'malo'
                                : org.licitadores_medio <= 3 ? 'bueno' : ''}">
      <h4>Cuánta competencia</h4>
      <div class="cifra">${n}</div>
      <span class="pie">empresas de media<br>
        medido en ${org.licitadores_muestra}
        ${org.licitadores_muestra === 1 ? 'contrato' : 'contratos'}${
        org.sin_competencia
          ? `, de los que ${org.sin_competencia} ${
             org.sin_competencia === 1 ? 'tuvo' : 'tuvieron'} un solo
             licitador` : ''}</span>
    </div>`;
  }

  if (contrato) analizar(contrato, true);
  else elegir();
}

  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Organismos</strong>
        <div class="quien">${esc(perfil.empresa || '')}</div>
        ${navPrincipal('organismos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién compra en tu sector</h1>
    <p class="guia" style="max-width:66ch">Busca un organismo y mira a

    <div class="buscar-organo">
      <input type="search" id="q-organo" autocomplete="off"
             placeholder="Ayuntamiento, diputación, consejería..."
             aria-label="Buscar organismo">
      <div class="sugerencias" id="sugerencias" hidden></div>
    </div>

    <div id="zona"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'organismos');

  const campo = document.getElementById('q-organo');
  const caja = document.getElementById('sugerencias');
  const zona = document.getElementById('zona');

  // ---------- Buscador ----------
  //
  // La lista se pide UNA vez al entrar y se filtra en el navegador.
  // Consultando en cada tecla, cada búsqueda tardaba segundos: agrupar
  // por organismo sobre decenas de miles de filas no es instantáneo, y
  // hacerlo cinco veces mientras se escribe una palabra menos.
  let TODOS = [];
  campo.disabled = true;
  campo.placeholder = 'Cargando organismos...';

  // Por tandas: la API recorta el número de filas por respuesta, así que
  // pedir la lista de una vez devolvía menos de la mitad sin avisar de
  // nada.
  (async () => {
    const TANDA = 400;
    for (let salto = 0; salto < 5000; salto += TANDA) {
      const { data, error } = await sb.rpc('buscar_organismo',
        { texto: '', salto, cuantos: TANDA });
      if (error) break;
      const trozo = data ?? [];
      TODOS = TODOS.concat(trozo);
      // Se habilita en cuanto llega la primera tanda: los organismos con
      // más contratos son los primeros, así que ya se puede buscar
      // mientras acaban de llegar los demás.
      if (salto === 0) campo.disabled = false;
      if (trozo.length < TANDA) break;
    }
    campo.disabled = false;
    campo.placeholder = TODOS.length
      ? `Busca entre ${TODOS.length} organismos de tu sector`
      : 'Ayuntamiento, diputación, consejería...';
  })();

  const sinAcentos = s => String(s ?? '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  function buscar() {
    const q = sinAcentos(campo.value.trim());
    const filas = (q ? TODOS.filter(o => sinAcentos(o.organo).includes(q)) : TODOS)
      .slice(0, 40);

    const total = q
      ? TODOS.filter(o => sinAcentos(o.organo).includes(q)).length
      : TODOS.length;

    caja.innerHTML = (filas.length
      ? filas.map(o => `<button data-organo="${esc(o.organo)}">
          ${esc(o.organo)}
          <span class="cuantos">${esc(o.provincia ?? '')}${o.provincia ? ' · ' : ''}${
            o.contratos} ${o.contratos === 1 ? 'contrato' : 'contratos'}${
            o.importe ? ` · ${euros(Number(o.importe))}` : ''}</span>
        </button>`).join('')
      : `<p class="sinresultado">Ningún organismo con ese nombre ha
         adjudicado contratos de tu sector.</p>`)
      + (total > filas.length
        ? `<p class="sinresultado">Y ${total - filas.length} más. Escribe
           unas letras del nombre para acotar.</p>` : '');
    caja.hidden = false;
  }

  campo.oninput = buscar;
  campo.onfocus = buscar;
  caja.addEventListener('click', ev => {
    const b = ev.target.closest('[data-organo]');
    if (!b) return;
    caja.hidden = true;
    campo.value = b.dataset.organo;
    abrir(b.dataset.organo);
  });
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.buscar-organo')) caja.hidden = true;
  });

  // ---------- Ficha ----------
  let desde = null, hasta = null, disponibles = [];
  let ultimoOrgano = null, ultimaFicha = null;
  let ultimasEmpresas = [], ultimosContratos = [];
  let señalarAhora = null, limpiarAhora = null;

  // Enganchados una sola vez sobre el contenedor, que no se sustituye.
  zona.addEventListener('mouseover', ev => {
    const el = ev.target.closest('.trozo, .lista-empresas [data-cif]');
    if (el && señalarAhora) señalarAhora(el);
  });
  zona.addEventListener('mouseleave', () => { if (limpiarAhora) limpiarAhora(); });
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaFicha) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintar(ultimoOrgano, ultimaFicha);
  });

  async function abrir(cual, conservarAnios = false) {
    zona.innerHTML = `<p class="guia" style="margin-top:24px">Cargando...</p>`;
    if (!conservarAnios) {
      const { data: anios } = await sb.rpc('anios_de_organismo',
        { organo_buscado: cual });
      disponibles = (anios ?? []).map(a => a.anio).sort((a, b) => a - b);
      desde = disponibles[0] ?? null;
      hasta = disponibles[disponibles.length - 1] ?? null;
    }

    const { data, error } = await sb.rpc('ficha_organismo',
      { organo_buscado: cual, desde, hasta });
    // Distinguir "no hay datos" de "no se han podido leer": decir lo
    // primero cuando pasa lo segundo es afirmar algo falso.
    if (error) {
      zona.innerHTML = `<div class="aviso mal">No hemos podido cargar este
        organismo.<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
        ${esc(error.message || '')}</div></div>`;
      return;
    }
    if (!data || !data.contratos) {
      zona.innerHTML = `<div class="aviso">No hay adjudicaciones de tu sector
        para ese organismo en el periodo elegido.</div>`;
      return;
    }
    pintar(cual, data);
  }

  function selectorAnios() {
    // Un solo año no da nada que elegir.
    if (disponibles.length < 2) return '';
    const min = disponibles[0], max = disponibles[disponibles.length - 1];
    // TODOS los años del rango, no solo los que tienen datos: con años
    // sueltos repartidos a partes iguales, las etiquetas no caían donde
    // se clavaba el asa.
    const todos = [];
    for (let a = min; a <= max; a++) todos.push(a);
    // 15 px es el diámetro del asa: recorre de 7,5 px a (ancho − 7,5).
    const pos = a => max === min ? 0 : (a - min) / (max - min);
    const sitio = a => `calc(7.5px + (100% - 15px) * ${pos(a).toFixed(4)})`;

    return `
      <div class="anios">
        <span class="rotulo">Periodo</span>
        <div class="pista-anios">
          <div class="riel-anios"></div>
          <div class="tramo-elegido" style="left:${sitio(desde)};
               width:calc(${sitio(hasta)} - ${sitio(desde)})"></div>
          <input type="range" id="a-desde" min="${min}" max="${max}" step="1"
                 value="${desde}" aria-label="Desde el año">
          <input type="range" id="a-hasta" min="${min}" max="${max}" step="1"
                 value="${hasta}" aria-label="Hasta el año">
          <div class="marcas">${todos.map(a =>
            `<span style="left:${sitio(a)}">${String(a).slice(2)}</span>`).join('')}</div>
        </div>
        <span class="elegido">${desde === hasta ? desde : `${desde}–${hasta}`}</span>
      </div>`;
  }

  // Con pocos contratos una media no dice nada: tres adjudicaciones no
  // describen cómo compra un ayuntamiento. Por debajo de este número la
  // cifra no se enseña.
  const MINIMO_PARA_MEDIA = 5;

  function bloqueAdjudicacion(d) {
    const trozos = [];

    // Cada cifra va con la de su sector al lado. Un porcentaje suelto no
    // distingue un organismo de otro; lo que informa es la diferencia.
    const comparar = (valor, referencia, sufijo) => {
      if (!referencia) return '';
      const dif = Math.round((valor - referencia) * 10) / 10;
      if (Math.abs(dif) < 0.5) return `igual que tu sector`;
      return `${Math.abs(dif).toString().replace('.', ',')} ${sufijo} ${
        dif > 0 ? 'más' : 'menos'} que tu sector`;
    };

    if (d.baja_media && d.con_baja >= MINIMO_PARA_MEDIA) {
      const roza = comparar(d.baja_media, d.baja_sector, 'puntos');
      trozos.push(`<div>
        <dt>Se adjudica al</dt>
        <dd>${d.baja_media} %
          <span class="matiz">del presupuesto${roza ? ` · ${roza}` : ''}
          <br>medido en ${d.con_baja} ${
            d.con_baja === 1 ? 'contrato' : 'contratos'}</span>
        </dd></div>`);
    }

    if (d.licitadores_medio && d.con_licitadores >= MINIMO_PARA_MEDIA) {
      // Que la mitad de los contratos vayan con un solo licitador sí es
      // propio de ese organismo, y responde a si merece la pena
      // presentarse.
      const solos = d.sin_competencia > d.con_licitadores / 2;
      const roza = comparar(d.licitadores_medio, d.licitadores_sector, '');
      trozos.push(`<div class="${solos ? 'alerta' : ''}">
        <dt>Se presentan</dt>
        <dd>${String(d.licitadores_medio).replace('.', ',')}
          <span class="matiz">empresas de media${roza ? ` · ${roza}` : ''}
          ${d.sin_competencia ? `<br><strong>${d.sin_competencia}</strong> de
            ${d.con_licitadores} con un solo licitador` : ''}</span>
        </dd></div>`);
    }

    if (d.procedimientos?.length) {
      const p = d.procedimientos[0];
      trozos.push(`<div>
        <dt>Suele adjudicar por</dt>
        <dd style="font-size:1.02rem">${esc(p.cual)}
          <span class="matiz">${p.cuantos} de sus ${d.contratos}${
            d.procedimientos.length > 1
              ? ` · y ${d.procedimientos.length - 1} vía más` : ''}</span>
        </dd></div>`);
    }

    if (!trozos.length) {
      return `<p class="poca-muestra">Este organismo tiene pocos contratos
        publicados en tus sectores como para decir cómo adjudica.</p>`;
    }
    return `<dl class="como-adjudica">${trozos.join('')}</dl>`;
  }

  function pintar(cual, d) {
    const empresas = d.empresas ?? [];
    const contratos = d.contratos_lista ?? [];

    zona.innerHTML = `
      <div class="ficha-organo">
        <div class="arriba">
          <div>
            <h2>${esc(d.organo)}</h2>
            <p class="cifras">
              <span><strong>${d.contratos}</strong> ${
                d.contratos === 1 ? 'contrato' : 'contratos'}</span>
              <span><strong>${empresas.length}</strong> ${
                empresas.length === 1 ? 'empresa' : 'empresas'}</span>
              ${d.importe ? `<span><strong>${euros(Number(d.importe))}</strong>
                adjudicados</span>` : ''}
              ${d.provincia ? `<span>${esc(d.provincia)}</span>` : ''}
            </p>
          </div>
          <div style="flex:1 1 260px;max-width:420px">${selectorAnios()}</div>
        </div>

        ${bloqueAdjudicacion(d)}

        <div class="dos-paneles">
          <div class="panel-organo">
            <div style="display:flex;align-items:center;margin-bottom:10px">
              <h4 style="margin:0">A quién le compra</h4>
              <div class="forma" role="group" aria-label="Forma del gráfico">
                <button data-forma="barras"
                  aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
                <button data-forma="quesito"
                  aria-pressed="${formaActual() === 'quesito'}">Circular</button>
              </div>
            </div>
            ${apilada(empresas, 'nombre', 'contratos', 'contratos', false,
                      'cif', false)}
            <div class="lista-empresas" style="margin-top:18px">
              ${empresas.slice(0, 10).map(e => `
                <div class="${e.es_mia ? 'mia' : ''}" data-cif="${esc(e.cif ?? '')}">
                  <span class="quien">${esc(e.nombre ?? '—')}</span>
                  <span class="cuanto">${e.contratos}
                    <span>${e.importe ? euros(Number(e.importe)) : '—'}</span></span>
                </div>`).join('')}
            </div>
          </div>

          <div class="panel-organo">
            <h4 id="rotulo-contratos">Sus contratos</h4>
            <div class="contratos-organo" id="contratos-organo"></div>
          </div>
        </div>
      </div>`;

    ultimoOrgano = cual; ultimaFicha = d; ultimasEmpresas = empresas;
    ultimosContratos = contratos;

    // ---------- Los contratos siguen a lo que señalas ----------
    //
    // Al pasar por encima de una empresa —en el gráfico o en la lista—,
    // la columna de la derecha enseña SUS contratos. Sin eso el gráfico
    // solo dice cuánto se lleva cada una; con eso dice qué le ha
    // comprado.
    const cajaContratos = document.getElementById('contratos-organo');
    const rotulo = document.getElementById('rotulo-contratos');

    const pintarContratos = (cifs, quien) => {
      const filtrados = cifs
        ? contratos.filter(c => cifs.includes(c.cif))
        : contratos;
      rotulo.textContent = quien ? `Contratos de ${quien}` : 'Sus contratos';
      cajaContratos.innerHTML = filtrados.length
        ? filtrados.slice(0, 14).map(c => `
            <div class="${c.es_mia ? 'mia' : ''}">
              <p class="que">${esc(c.titulo ?? '')}</p>
              <span class="quien">${esc(c.empresa ?? '')}${
                c.importe ? ` · ${euros(Number(c.importe))}` : ''}</span>
              ${(c.licitadores || c.baja || c.oferta_baja) ? `
                <span class="detalle-contrato">
                  ${c.licitadores ? `<span><strong>${c.licitadores}</strong>
                    ${c.licitadores === 1 ? 'licitador' : 'licitadores'}</span>` : ''}
                  ${c.baja ? `<span>al <strong>${c.baja} %</strong></span>` : ''}
                  ${c.oferta_baja && c.oferta_alta
                    && Number(c.oferta_alta) > Number(c.oferta_baja)
                    ? `<span>de ${euros(Number(c.oferta_baja))} a ${
                       euros(Number(c.oferta_alta))}</span>` : ''}
                </span>` : ''}
            </div>`).join('')
        : `<p class="sin-datos">Sin contratos en el periodo elegido.</p>`;
    };
    pintarContratos(null, null);

    const señalar = el => {
      const clave = el.dataset.clave ?? el.dataset.cif ?? '';
      if (!clave) return pintarContratos(null, null);
      const cifs = clave.split(',').filter(Boolean);
      const suya = empresas.find(e => e.cif === cifs[0]);
      pintarContratos(cifs, cifs.length === 1 ? (suya?.nombre ?? null) : null);
    };

    // El detalle y el interruptor se atienden por delegación desde
    // `zona`, enganchados UNA vez al abrir la pantalla. Volver a
    // engancharlos en cada dibujado los duplicaba y bastaba con que uno
    // fallara para que el botón dejara de responder.
    señalarAhora = señalar;
    limpiarAhora = () => pintarContratos(null, null);

    activarBarras(zona);

    // El selector recarga la ficha con el periodo nuevo.
    const dDesde = document.getElementById('a-desde');
    const dHasta = document.getElementById('a-hasta');
    if (!dDesde) return;

    const min = disponibles[0], max = disponibles[disponibles.length - 1];
    const pos = a => max === min ? 0 : (a - min) / (max - min);
    const sitio = a => `calc(7.5px + (100% - 15px) * ${pos(a).toFixed(4)})`;

    const previsualizar = () => {
      let a = +dDesde.value, b = +dHasta.value;
      if (a > b) [a, b] = [b, a];
      const tramo = zona.querySelector('.tramo-elegido');
      if (tramo) {
        tramo.style.left = sitio(a);
        tramo.style.width = `calc(${sitio(b)} - ${sitio(a)})`;
      }
      const texto = zona.querySelector('.anios .elegido');
      if (texto) texto.textContent = a === b ? a : `${a}–${b}`;
    };
    const soltar = () => {
      // Las asas no se cruzan: la que se mueve empuja a la otra.
      let a = +dDesde.value, b = +dHasta.value;
      if (a > b) { if (document.activeElement === dDesde) b = a; else a = b; }
      desde = a; hasta = b;
      abrir(cual, true);
    };
    dDesde.oninput = previsualizar; dHasta.oninput = previsualizar;
    dDesde.onchange = soltar; dHasta.onchange = soltar;
  }

  if (organo) { campo.value = organo; abrir(organo); }
  else zona.innerHTML = `<p class="guia" style="margin-top:26px">
    Escribe el nombre de un organismo para ver su ficha.</p>`;
}

// ---------- Movimientos del mercado ----------
//
// Los contratos que se han adjudicado en su sector durante el último mes.
//
// Va en la web y no en el correo: el correo es para lo que caduca —una
// licitación que cierra el jueves exige acción hoy— y una adjudicación ya
// cerrada no. Meterla ahí le restaría urgencia a lo que sí la tiene.
// Clasifica lo adjudicado que aún no tenga veredicto. Enseña progreso
// porque la primera vez son unos segundos, y una pantalla parada sin
// explicación se lee como que algo va mal.
async function cribarMercado() {
  const { data: cola } = await sb.rpc('mercado_sin_cribar', { dias: 30 });
  const total = (cola ?? []).length;
  if (!total) return;

  const zona = document.getElementById('zona');
  zona.innerHTML = `
    <div class="paso ancha" style="min-height:40vh">
      <h1 style="font-size:1.5rem">Revisando tu mercado</h1>
      <p class="lema">Estamos comprobando cuáles de las
      ${total} adjudicaciones de este mes son de verdad de tu sector.
      Solo hace falta la primera vez.</p>
      <div class="avance" style="margin-top:24px">
        <div class="barra"><div class="relleno" id="relleno-mercado"></div></div>
        <div class="cuenta"><span id="paso-mercado">Empezando...</span><span></span></div>
      </div>
    </div>`;

  let quedan = total;
  for (let vuelta = 0; vuelta < 30; vuelta++) {
    let r;
    try {
      r = await llamar('cribar_mercado', { dias: 30 });
    } catch {
      break;   // Si falla, se enseña sin filtrar antes que no enseñar nada.
    }

    // Si una vuelta clasifica y NO guarda nada, seguir es dar vueltas:
    // la siguiente encontrará los mismos contratos y la pantalla se
    // quedaría girando para siempre.
    if (r?.cribados > 0 && !r?.guardados) break;

    const antes = quedan;
    quedan = r?.quedan ?? 0;
    const hechas = total - quedan;
    const barra = document.getElementById('relleno-mercado');
    if (barra) barra.style.width = `${total ? hechas / total * 100 : 100}%`;
    const texto = document.getElementById('paso-mercado');
    if (texto) texto.textContent = `${hechas} de ${total}`;
    if (r?.terminado || !quedan || quedan >= antes) break;
  }
}

async function pantallaMovimientos(perfil, session, volviendo = false) {
  if (!volviendo) irA('movimientos');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Movimientos</strong>
        <div class="quien">${esc(perfil.empresa || '')}</div>
        ${navPrincipal('movimientos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <div id="zona"><p class="guia" style="margin-top:30px">Cargando...</p></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'movimientos');

  // Se criba antes de enseñar, la primera vez.
  //
  // El sector se define cruzando códigos CPV y eso trae empresas que no
  // compiten: a un proveedor de equipamiento médico le salían empresas
  // de mantenimiento de escuelas y de semáforos. El clasificador que ya
  // filtra sus contratos abiertos sabe distinguirlas.
  //
  // Solo pasa una vez: el veredicto se guarda, y lo que entra a diario
  // lo criba el propio scraper.
  await cribarMercado();

  // La estructura primero, los datos después: reemplazar la pantalla
  // entera por «Cargando...» da sensación de salto en cada cambio de
  // pestaña. Así la cabecera y el titular no parpadean.
  document.getElementById('zona').innerHTML = `
    <div class="cabeza-movimientos">
      <div>
        <h1 style="margin:0 0 12px">Qué se ha adjudicado en tu sector</h1>
        <p class="guia" style="margin:0">Los contratos que se han cerrado en
        los últimos treinta días con los mismos códigos que los tuyos.</p>
      </div>
      <div class="pulso"><h4>El mes en tu sector</h4>
        <p class="guia" style="margin:0;font-size:.9rem">Cargando...</p></div>
    </div>`;

  const [mov, pul] = await Promise.all([
    pedir('movimientos_mercado', { dias: 30 }),
    pedir('pulso_mercado', { dias: 30 }),
  ]);
  // Un fallo NO se enseña como "no hay nada".
  //
  // Cuando la consulta se cae —un tiempo de espera agotado mientras el
  // catálogo escribe, por ejemplo— la pantalla decía "Todavía no hay
  // adjudicaciones en tus sectores". Y eso es mentira: las hay, pero no
  // se han podido leer. El cliente concluye que su sector está parado.
  if (mov.error || pul.error) {
    const fallo = mov.error || pul.error;
    document.getElementById('zona').innerHTML = `
      <div class="aviso mal" style="margin-top:26px">
        No hemos podido cargar los movimientos.
        <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
          ${esc(fallo.message || 'Error desconocido')}</div>
        <div style="margin-top:14px">
          <button class="secundario" id="reintentar">Reintentar</button>
        </div>
      </div>`;
    alPulsar('reintentar', () => pantallaMovimientos(perfil, session, true));
    return;
  }

  const lista = mov.data ?? [];
  const p = pul.data ?? {};

  // Los rankings salen de la misma lista que se enseña debajo, no de otra
  // consulta: así lo que se cuenta arriba y lo que se ve abajo coinciden
  // siempre, y cada barra puede desglosarse en sus contratos.
  function agrupar(clave, etiqueta) {
    const grupos = new Map();
    lista.forEach(m => {
      const k = m[clave];
      if (!k) return;
      if (!grupos.has(k)) grupos.set(k, {
        clave: k, nombre: m[etiqueta] ?? k, provincia: m.provincia,
        es_mia: !!m.es_mia, la_sigo: !!m.la_sigo, contratos: [],
      });
      grupos.get(k).contratos.push(m);
    });
    return [...grupos.values()]
      .map(g => ({ ...g,
        n: g.contratos.length,
        euros: g.contratos.reduce((s, c) => s + (Number(c.importe) || 0), 0) }))
      // Por importe y no por número de contratos.
      //
      // Ordenar por cantidad dejaba a la empresa que más factura en el
      // último puesto: cuatro contratos y 1,2 millones frente a siete y
      // 600.000 del primero. Para un proveedor pesa más quién se lleva el
      // dinero que quién firma más veces.
      .sort((a, b) => b.euros - a.euros || b.n - a.n)
      .slice(0, 6);
  }

  const porEmpresa = agrupar('cif', 'empresa');
  const porOrgano = agrupar('organo', 'organo');

  function bloqueRanking(filas, titulo, id) {
    if (!filas.length) return '';
    // Todas las barras ocupan lo mismo: el importe total ya está escrito
    // a la derecha, así que la barra no tiene que repetirlo. Lo que
    // muestra es OTRA cosa: cómo se reparte ese dinero entre sus
    // contratos, y si depende de uno grande o lo tiene repartido.
    return `
      <div class="ranking" data-ranking="${id}">
        <h4>${titulo}</h4>
        <ol>${filas.map((f, i) => {
          // Cada contrato, un tramo. Los muy pequeños se ven porque hay
          // un ancho mínimo.
          // Tres tramos y el resto agrupado. Con diez o quince, los
          // pequeños quedaban en hilos de dos píxeles imposibles de
          // señalar, y uno grande se comía la barra entera.
          const ordenados = [...f.contratos]
            .sort((a, b) => (Number(b.importe) || 0) - (Number(a.importe) || 0));
          const cabeza = ordenados.slice(0, 3);
          const cola = ordenados.slice(3);
          const tramos = [...cabeza];
          if (cola.length) {
            tramos.push({
              titulo: cola.length === 1
                ? 'Otro contrato'
                : `Otros ${cola.length} contratos`,
              organo: '', empresa: '',
              importe: cola.reduce((s, c) => s + (Number(c.importe) || 0), 0),
              agrupado: true,
            });
          }
          return `<li class="${f.es_mia ? 'mia' : f.la_sigo ? 'sigo' : ''}">
            <div class="fila-ranking">
              <span class="cual">${esc(f.nombre)}${
                f.provincia && id === 'organos'
                  ? `<span class="cuanto"> · ${esc(f.provincia)}</span>` : ''}</span>
              <span class="cuanto">${f.n} · ${euros(f.euros)}</span>
            </div>
            <div class="barra-tramos">
              ${tramos.map((c, j) => `<button class="tramo"
                style="width:${(Number(c.importe) || 0) / f.euros * 100}%;
                       background:${c.agrupado ? COLOR_OTROS : PALETA[(i + j) % PALETA.length]}"
                data-titulo="${esc(c.titulo ?? '')}"
                data-quien="${esc(c.agrupado ? ''
                  : (id === 'organos' ? (c.empresa ?? '') : (c.organo ?? '')))}"
                data-importe="${esc(euros(Number(c.importe)) ?? '')}"
                aria-label="${esc(c.titulo ?? '')}"></button>`).join('')}
            </div>
          </li>`;
        }).join('')}</ol>
        <div class="detalle-tramo" data-hueco-ranking>
          <span class="titulo-tramo" style="font-weight:400;color:var(--tenue)">
            Cada barra es el reparto de ese dinero entre sus contratos.
            Pasa por encima de un tramo para ver cuál es.</span>
        </div>
      </div>`;
  }

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    { timeZone: ZONA, day: 'numeric', month: 'short' }) : '';

  // Sin el porcentaje sobre el presupuesto.
  //
  // Medido sobre 263.412 contratos: la media salía en 4.896 % y 100.862
  // estaban por encima del presupuesto. Los dos campos no comparan lo
  // mismo —importes de acuerdos marco frente a presupuestos de contratos
  // basados, lotes sueltos frente al expediente entero— y publicarlo
  // sería peor que no dar el dato: alguien podría calcular una oferta con
  // él.
  //
  // Para recuperarlo hay que extraer el número de lotes y el tipo de
  // contrato al procesar el histórico.
  // Una línea por contrato, no por compra.
  //
  // Un acuerdo marco de stents publica CADA compra derivada como su
  // propio expediente: salían 41 líneas con el mismo título y distinta
  // empresa. Se agrupan por organismo y título, y el detalle se
  // despliega.
  const grupos = new Map();
  lista.forEach(m => {
    const k = m.grupo || m.id_licitacion;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(m);
  });

  const unaLinea = m => {
    return `<div class="movimiento ${m.es_mia ? 'mia' : m.la_sigo ? 'sigo' : ''}">
      <div>
        <p class="gano">${esc(m.empresa ?? '—')}${
          m.es_mia ? '<span class="marca-mia">tu empresa</span>'
          : m.la_sigo ? '<span class="marca-mia">la sigues</span>' : ''}</p>
        <p class="que">${esc(m.titulo ?? '')}</p>
        <span class="donde">${esc([m.organo, m.provincia].filter(Boolean).join(' · '))}</span>
      </div>
      <div class="cifra">
        <strong>${m.importe ? euros(Number(m.importe)) : '—'}</strong>
        <span class="baja">${esc(fecha(m.fecha))}</span>
      </div>
    </div>`;
  };

  const cuerpo = lista.length ? [...grupos.values()].map(g => {
    if (g.length === 1) return unaLinea(g[0]);

    // Del grupo se enseña la compra más reciente, y el resto debajo.
    const primera = g[0];
    const empresas = new Set(g.map(x => x.cif).filter(Boolean)).size;
    const total = g.reduce((s, x) => s + (Number(x.importe) || 0), 0);
    const mia = g.some(x => x.es_mia);
    const sigo = g.some(x => x.la_sigo);

    return `<details class="grupo-mov">
      <summary>
        <div>
          <p class="gano">${empresas} ${empresas === 1 ? 'empresa' : 'empresas'}
            ${mia ? '<span class="marca-mia">tu empresa entre ellas</span>'
            : sigo ? '<span class="marca-mia">una que sigues</span>' : ''}</p>
          <p class="que">${esc(primera.titulo ?? '')}</p>
          <span class="donde">${esc([primera.organo, primera.provincia]
            .filter(Boolean).join(' · '))}</span>
          <span class="cuantas-veces">${g.length} compras
            <span class="flechita">▾</span></span>
        </div>
        <div class="cifra">
          <strong>${total ? euros(total) : '—'}</strong>
          <span class="baja">${esc(fecha(primera.fecha))}</span>
        </div>
      </summary>
      <div class="dentro">${g.map(unaLinea).join('')}</div>
    </details>`;
  }).join('') : `<p class="vacio">Todavía no hay adjudicaciones registradas en
    tus sectores este mes.</p>`;

  document.getElementById('zona').innerHTML = `
    <div class="cabeza-movimientos">
      <div>
        <h1 style="margin:0 0 12px">Qué se ha adjudicado en tu sector</h1>
        <p class="guia" style="margin:0">Los contratos que se han cerrado en
        los últimos treinta días con los mismos códigos que los tuyos. Quién
        los ganó, de qué organismo y por cuánto.</p>
      </div>

      <div class="pulso">
        <h4>El mes en tu sector</h4>
        <dl>
          <dt>Adjudicaciones</dt><dd>${p.contratos ?? 0}</dd>
          <dt>Importe total</dt><dd>${
            p.importe ? euros(Number(p.importe)) : '—'}</dd>
          <dt>Empresas distintas</dt><dd>${p.empresas ?? 0}</dd>
          ${p.importe_medio ? `<dt>Importe medio</dt>
            <dd>${euros(Number(p.importe_medio))}</dd>` : ''}
        </dl>
        ${p.mias ? `<p class="destacado">De ellas, <strong>${p.mias}</strong>
          ${p.mias === 1 ? 'la has ganado tú' : 'las has ganado tú'}.</p>` : ''}
        <p class="destacado" style="font-size:.8rem">Cada lote de un contrato
        cuenta como una adjudicación, así que el importe medio es por
        adjudicación y no por expediente.</p>
      </div>
    </div>

    ${(porEmpresa.length || porOrgano.length) ? `
    <div class="dos-columnas">
      ${bloqueRanking(porEmpresa, 'Quién más ha facturado este mes', 'empresas')}
      ${bloqueRanking(porOrgano, 'Quién ha adjudicado más', 'organos')}
    </div>` : ''}

    <div style="margin-top:32px">${cuerpo}</div>`;

  // Cada tramo dice de qué contrato es. Sin esto la barra solo compara
  // tamaños; con esto se puede ir al detalle sin bajar a la lista.
  raiz.querySelectorAll('[data-ranking]').forEach(caja => {
    const hueco = caja.querySelector('[data-hueco-ranking]');
    const reposo = hueco.innerHTML;
    const tramos = [...caja.querySelectorAll('.tramo')];

    const mostrar = t => {
      const contexto = [t.dataset.quien, t.dataset.importe]
        .filter(Boolean).join(' · ');
      hueco.innerHTML =
        `<span class="titulo-tramo">${esc(t.dataset.titulo)}</span>` +
        (contexto ? `<span class="meta-tramo">${esc(contexto)}</span>` : '');
      tramos.forEach(x => x.classList.toggle('activo', x === t));
    };
    const soltar = () => {
      hueco.innerHTML = reposo;
      tramos.forEach(x => x.classList.remove('activo'));
    };

    // Se escucha en la tarjeta entera y no tramo a tramo: así el detalle
    // solo se borra al salir de la tarjeta, no cada vez que el cursor
    // cruza de un tramo al siguiente.
    caja.addEventListener('mouseover', ev => {
      const t = ev.target.closest('.tramo');
      if (t) mostrar(t);
    });
    caja.addEventListener('mouseleave', soltar);
    tramos.forEach(t => {
      t.onfocus = () => mostrar(t);
      t.onclick = () => mostrar(t);
    });
  });
}

async function pantallaMercado(perfil, session, volviendo = false, cif = null) {
  if (!volviendo) irA('mercado');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Mercado</strong>
        <div class="quien">${esc(perfil.empresa || '')}</div>
        ${navPrincipal('mercado')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién gana en tu sector</h1>
    <p class="guia">Los contratos públicos son datos abiertos: quién los
    gana, por cuánto y de qué organismo. Mira tu propio historial, busca
    una empresa por su CIF, o averigua quién se lleva los contratos de tus
    sectores.</p>

    <div class="buscador-cif">
      <input type="text" id="cif-buscar" placeholder="CIF de una empresa"
             autocomplete="off">
      <button class="principal" id="buscar-cif">Buscar</button>
      ${perfil.cif ? `<button class="secundario" id="ver-mia">Ver mi
        empresa</button>` : ''}
    </div>

    <div id="zona" style="margin-top:22px"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'mercado');

  const zona = document.getElementById('zona');
  const campo = document.getElementById('cif-buscar');

  // Ver la propia empresa es la misma acción que buscar otra, así que va
  // junto al buscador y no abajo con las listas.
  alPulsar('ver-mia', () => verEmpresa(perfil.cif));

  // Cambiar de forma repinta la ficha y guarda la elección para todos los
  // gráficos. Enganchado una sola vez sobre el contenedor, que no se
  // sustituye al redibujar.
  let ultimaEmpresa = null;
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaEmpresa) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintarFicha(ultimaEmpresa);
  });

  // ---------- Estado: listas ----------
  async function verListas() {
    zona.innerHTML = `<p class="guia">Cargando...</p>`;
    const [comp, seg] = await Promise.all([
      sb.rpc('competencia'),
      sb.rpc('mi_seguimiento'),
    ]);
    const competencia = comp.data ?? [];
    const seguidas = seg.data ?? [];

    // Tres filas a la vista y el resto detrás de un botón.
    const ASOMAN = 3;

    const fila = (f, i, sigo) => `<tr data-cif="${esc(f.cif)}"
        class="${i >= ASOMAN ? 'oculta' : ''}">
        <td class="quien">${esc(f.nombre ?? f.cif)}</td>
        <td class="num">${f.contratos}</td>
        <td class="num">${f.importe ? euros(Number(f.importe)) : '—'}</td>
        <td class="fin"><button class="seguir chico" aria-pressed="${sigo}"
          data-seguir="${esc(f.cif)}" data-nombre="${esc(f.nombre ?? f.cif)}"
          >${sigo ? 'Siguiendo' : 'Seguir'}</button></td>
      </tr>`;

    const tabla = (filas, id, todasSeguidas = false) => `
      <table class="tabla" id="${id}">
        <thead><tr><th>Empresa</th><th class="num">Contratos</th>
          <th class="num">Importe</th><th class="fin"></th></tr></thead>
        <tbody>${filas.map((f, i) =>
          fila(f, i, todasSeguidas || !!f.sigo)).join('')}</tbody>
      </table>
      ${filas.length > ASOMAN ? `<button class="mas" data-tabla="${id}"
        aria-expanded="false"
        data-mas="Ver las ${filas.length - ASOMAN} restantes"
        data-menos="Ver menos">Ver las ${filas.length - ASOMAN} restantes
        <span class="flechita">▾</span></button>` : ''}`;

    // La lista de seguimiento se enseña SIEMPRE, aunque esté vacía: si no
    // aparece, nadie descubre que existe.
    zona.innerHTML = `
      <div class="seccion-mercado">
        <h3>Tu lista de seguimiento
          <span class="cuantas">${seguidas.length || 'vacía'}</span></h3>
        ${seguidas.length ? tabla(seguidas, 't-seguimiento', true) : `
          <p class="vacio-seguimiento">Todavía no sigues a ninguna empresa.
          Busca una por su CIF o elígela de la lista de abajo, y pulsa
          <strong>Seguir</strong> en su ficha para tenerla aquí a mano.</p>`}
      </div>

      <div class="seccion-mercado">
        <h3>Quién gana más en tus sectores
          <span class="cuantas">${competencia.length}</span></h3>
        <p class="guia" style="margin:0 0 14px;font-size:.9rem">Empresas que
        han ganado contratos de los mismos códigos que tú. Pulsa una para ver
        su ficha.</p>
        ${competencia.length ? tabla(competencia, 't-competencia')
          : '<p class="sin-datos">Todavía no hay datos de tus sectores.</p>'}
      </div>`;

    zona.querySelectorAll('tr[data-cif]').forEach(f =>
      f.onclick = ev => {
        // El botón de seguir vive dentro de la fila para que aparezca a su
        // altura; hay que evitar que su clic abra además la ficha.
        if (ev.target.closest('[data-seguir]')) return;
        verEmpresa(f.dataset.cif);
      });

    zona.querySelectorAll('[data-seguir]').forEach(b => b.onclick = async () => {
      const antes = b.getAttribute('aria-pressed') === 'true';
      // Se pinta al instante y se corrige si el servidor dice otra cosa.
      b.setAttribute('aria-pressed', String(!antes));
      b.textContent = !antes ? 'Siguiendo' : 'Seguir';
      try {
        const { data } = await sb.rpc('seguir', {
          cif_empresa: b.dataset.seguir, nombre_empresa: b.dataset.nombre });
        b.setAttribute('aria-pressed', String(!!data));
        b.textContent = data ? 'Siguiendo' : 'Seguir';
        recado(data
          ? 'Añadida a tu lista de seguimiento'
          : 'Quitada de tu lista de seguimiento');

        // Al seguirla desde la competencia, su fila se va: ya está arriba
        // en la lista de seguimiento y saldría dos veces. Si deja de
        // seguirla, vuelve a aparecer al recargar.
        //
        // La lista de seguimiento NO se repinta: hacerlo movería lo que
        // el cliente está mirando. Se pone al día al volver a entrar.
        const enCompetencia = b.closest('#t-competencia');
        if (data && enCompetencia) {
          const suya = b.closest('tr');
          // Se descubre la siguiente oculta para que sigan viéndose tres.
          const escondida = enCompetencia.querySelector('tbody tr.oculta');
          if (escondida) escondida.classList.remove('oculta');
          suya.remove();
        }
      } catch {
        b.setAttribute('aria-pressed', String(antes));
        b.textContent = antes ? 'Siguiendo' : 'Seguir';
        recado('No se ha podido guardar. Inténtalo de nuevo.');
      }
    });

    // Alterna: se puede volver a cerrar. Antes el botón desaparecía al
    // pulsarlo y la lista se quedaba abierta para siempre.
    zona.querySelectorAll('[data-tabla]').forEach(b => {
      const filas = [...document.getElementById(b.dataset.tabla)
        .querySelectorAll('tbody tr')];
      b.onclick = () => {
        const abierto = b.getAttribute('aria-expanded') === 'true';
        filas.forEach((t, i) => t.classList.toggle('oculta', abierto && i >= ASOMAN));
        b.setAttribute('aria-expanded', String(!abierto));
        b.firstChild.textContent = abierto
          ? b.dataset.mas + ' ' : b.dataset.menos + ' ';
      };
    });
  }

  // ---------- Estado: ficha ----------
  //
  // Deja marca en el historial: sin ella, atrás salía de Mercado entero
  // en vez de devolver a las listas.
  async function verEmpresa(cif, restaurando = false) {
    if (!restaurando) irA('mercado', { cif });
    zona.innerHTML = `<p class="guia">Buscando...</p>`;
    const { data, error } = await sb.rpc('ficha_empresa', { cif_buscado: cif });
    if (error || !data || !data.contratos) {
      zona.innerHTML = `
        <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
        <div class="aviso">No hemos encontrado contratos adjudicados con ese
        CIF. Puede que no haya ganado ninguno todavía.</div>`;
      alPulsar('volver-listas', () => history.back());
      return;
    }
    pintarFicha(data);
  }

  function pintarFicha(e) {
    const sectores = e.sectores ?? [];
    const organos = e.organos ?? [];
    const ultimos = e.ultimos ?? [];

    zona.innerHTML = `
      <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
      <div class="tarjeta-empresa" style="margin-top:8px">
        <div class="arriba">
          <div>
            <h3>${esc(e.nombre ?? e.cif)}</h3>
            <p class="cifras">
              <span><strong>${e.contratos}</strong> contratos</span>
              ${e.importe ? `<span><strong>${euros(Number(e.importe))}</strong>
                adjudicados</span>` : ''}
              ${e.ultimo ? `<span>último en ${esc(new Date(e.ultimo)
                .toLocaleDateString('es-ES', {timeZone:ZONA, month:'long',
                year:'numeric'}))}</span>` : ''}
            </p>
          </div>
          ${e.cif === perfil.cif ? '' : `
            <button class="seguir" id="seguir" aria-pressed="${!!e.sigo}"
                    data-cif="${esc(e.cif)}" data-nombre="${esc(e.nombre ?? e.cif)}">
              ${e.sigo ? 'Siguiendo' : 'Seguir'}</button>`}
        </div>

        ${sectores.length ? `
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div class="forma" role="group" aria-label="Forma de los gráficos">
              <button data-forma="barras"
                aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
              <button data-forma="quesito"
                aria-pressed="${formaActual() === 'quesito'}">Circular</button>
            </div>
          </div>
          <div style="margin-bottom:26px">${reparto(sectores, 'sector')}</div>` : ''}

        ${organos.length ? `
          <h4 style="margin:0 0 12px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">A quién le vende</h4>
          <table class="tabla"><tbody>
            ${organos.map(o => `<tr style="cursor:default">
              <td class="quien">${esc(o.organo)}</td>
              <td class="num">${o.contratos}</td>
              <td class="num">${o.importe ? euros(Number(o.importe)) : '—'}</td>
            </tr>`).join('')}
          </tbody></table>` : ''}

        ${ultimos.length ? `
          <h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">Sus últimos contratos</h4>
          <div class="ultimos-contratos">
            ${ultimos.map(u => `<div>
              <p class="que">${esc(u.titulo)}</p>
              <span class="quien">${esc(u.organo ?? '')}${
                u.importe ? ` · ${euros(Number(u.importe))}` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
      </div>`;

    activarBarras(zona);
    alPulsar('volver-listas', () => history.back());

    // El interruptor se atiende por delegación, más abajo: volver a
    // engancharlo en cada dibujado lo duplicaba.
    ultimaEmpresa = e;

    alPulsar('seguir', async () => {
      const b = document.getElementById('seguir');
      const { data } = await sb.rpc('seguir', {
        cif_empresa: b.dataset.cif, nombre_empresa: b.dataset.nombre });
      b.setAttribute('aria-pressed', String(!!data));
      b.textContent = data ? 'Siguiendo' : 'Seguir';
      recado(data
        ? 'Añadida a tu lista de seguimiento'
        : 'Quitada de tu lista de seguimiento');
      olvidar('mi_seguimiento', 'competencia', 'movimientos_mercado');
    });
  }

  alPulsar('buscar-cif', () => {
    const cif = campo.value.trim();
    if (cif.length >= 8) verEmpresa(cif);
  });
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('buscar-cif').click();
  });

  if (cif) { campo.value = cif; verEmpresa(cif, true); }
  else verListas();
}

// 7 · Panel de la cuenta
// ============================================================

// Menú de cuenta. Vive en la cabecera de las dos pantallas —contratos y
// panel— para que llegar a cualquier sección sea un solo clic. Antes
// había que entrar al panel y buscar otro botón dentro, y algo que se
// usa a diario no puede estar a dos pasos.
// Mi cuenta guarda lo que configura el servicio. Los sectores y los
// organismos se han ido a Mercado: son inteligencia sobre la propia
// empresa, el mismo dato que se ve de un competidor, y tenerlos aquí los
// separaba de donde pertenecen.
const SECCIONES = {
  cuenta: 'Mi cuenta',
  filtro: 'Mi filtro',
};

// Confirmación efímera. Se usa donde la acción no deja rastro visible
// por sí sola, como la campana: un icono que cambia de forma no explica
// qué ha pasado.
let recadoTemporizador;
function recado(texto) {
  let caja = document.getElementById('recado');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'recado';
    caja.className = 'recado';
    caja.setAttribute('role', 'status');
    document.body.appendChild(caja);
  }
  caja.textContent = texto;
  requestAnimationFrame(() => caja.classList.add('visible'));
  clearTimeout(recadoTemporizador);
  recadoTemporizador = setTimeout(() => caja.classList.remove('visible'), 3200);
}

// La campana enciende y apaga el correo diario. Va suelta y no dentro
// del menú porque su estado tiene que verse de un vistazo: si alguien
// apagó los avisos hace un mes, debe notarlo sin abrir nada.
function campanaAvisos() {
  return `
    <button class="campana" id="campana" aria-pressed="true"
            aria-label="Avisos por correo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        <line class="tachado" x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </button>`;
}

function activarCampana(yaSabido = null) {
  const boton = document.getElementById('campana');
  if (!boton) return;

  // Sin texto al pasar por encima: el mensaje de confirmación ya lo
  // explica, y el del navegador tarda en salir, no existe en el móvil y
  // deja el mismo texto dos veces en pantalla.
  const pintar = encendido =>
    boton.setAttribute('aria-pressed', String(encendido));

  // El panel ya ha consultado mi_panel, así que se le pasa el dato en
  // vez de repetir la llamada.
  if (yaSabido !== null) pintar(yaSabido !== false);
  else sb.rpc('mi_panel').then(({ data }) => pintar(data?.avisos !== false));

  boton.onclick = async () => {
    const quiero = boton.getAttribute('aria-pressed') !== 'true';
    // Se pinta al instante: el cliente no debe esperar al servidor para
    // ver que su decisión se ha registrado.
    pintar(quiero);
    recado(quiero
      ? 'Recibirás el aviso diario por correo'
      : 'Ya no recibirás el aviso diario');
    try {
      const { data } = await sb.rpc('cambiar_avisos', { quiero });
      pintar(data !== false);
    } catch {
      pintar(!quiero);
      recado('No se ha podido guardar. Inténtalo de nuevo.');
    }
  };
}

function menuCuenta(actual = null) {
  return `
    <div class="menu-envoltorio">
      <button class="boton-cuenta" id="abrir-menu" aria-haspopup="true"
              aria-expanded="false">Mi cuenta<span class="flechita">▾</span></button>
      <div class="menu" id="menu" role="menu" hidden>
        ${Object.keys(SECCIONES).map(k => `<button role="menuitem" data-ir="${k}"
          aria-current="${k === actual}">${SECCIONES[k]}</button>`).join('')}
        <div class="separa"></div>
        <button role="menuitem" class="tema" id="tema"
                aria-pressed="false">Modo oscuro<span class="palanca"></span></button>
        <div class="separa"></div>
        <button role="menuitem" class="peligroso" id="salir-menu">Salir</button>
      </div>
    </div>`;
}

function activarMenu(perfil, session) {
  const menu = document.getElementById('menu');
  const abrir = document.getElementById('abrir-menu');
  if (!menu || !abrir) return;

  const cerrar = () => {
    menu.hidden = true;
    abrir.setAttribute('aria-expanded', 'false');
  };
  abrir.onclick = ev => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.menu-envoltorio')) cerrar();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') cerrar();
  });

  menu.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    cerrar();
    pantallaPanel(perfil, session, false, b.dataset.ir);
  });
  alPulsar('salir-menu', () => sb.auth.signOut());

  const boton = document.getElementById('tema');
  if (boton) {
    boton.setAttribute('aria-pressed', String(temaActual() === 'oscuro'));
    boton.onclick = ev => {
      ev.stopPropagation();
      const nuevo = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
      ponerTema(nuevo);
      boton.setAttribute('aria-pressed', String(nuevo === 'oscuro'));
    };
  }
}


async function pantallaPanel(perfil, session, volviendo = false, seccion = 'cuenta') {
  if (!volviendo) irA('panel', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  const { data: p, error } = await sb.rpc('mi_panel');
  if (error || !p) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tu cuenta.</div></div>`;
    return;
  }

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const buscamos = p.que_buscamos ?? [];

  // Barras apiladas: la línea entera es el total, y cada segmento la
  // parte que representa. Una barra que se llena al 100 % por ser la
  // mayor no dice nada; ésta responde a "cuánto de mi negocio es esto".
  //
  // Los segmentos por debajo del 2 % se agrupan: por separado serían
  // hilos de dos píxeles imposibles de señalar, y su cifra sigue
  // apareciendo en la leyenda.

  const secciones = {
    cuenta: `
      <div class="bloque">
        <h3>Tu empresa</h3>
        <dl>
          <dt>Nombre</dt><dd>${esc(p.empresa ?? '—')}</dd>
          <dt>CIF</dt><dd>${esc(p.cif ?? '—')}</dd>
          <dt>Actividad</dt><dd>${esc(p.actividad ?? '—')}</dd>
          <dt>Correo</dt><dd>${esc(p.email ?? '—')}</dd>
          <dt>Cliente desde</dt><dd>${fecha(p.alta)}</dd>
          <dt>Aviso diario por correo</dt><dd>${
            p.avisos === false
              ? 'desactivado — actívalo con la campana de arriba'
              : 'activado'}</dd>
        </dl>
      </div>
      <div class="bloque">
        <h3>Tu historial</h3>
        <dl>
          <dt>Contratos ganados</dt><dd>${p.contratos_ganados ?? 0}</dd>
          <dt>Importe adjudicado</dt><dd>${
            p.importe_ganado ? euros(Number(p.importe_ganado)) : '—'}</dd>
          <dt>Contratos abiertos que te mostramos</dt><dd>${p.oportunidades ?? 0}</dd>
        </dl>
      </div>`,

    filtro: `
      ${buscamos.length ? `
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        <ul class="filtro-lista">
          ${buscamos.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>` : ''}
      <div class="bloque">
        <h3>Cómo va aprendiendo</h3>
        <dl>
          <dt>Correcciones que has hecho</dt><dd>${p.correcciones?.total ?? 0}${
            p.correcciones?.sin_aplicar
              ? ` · ${p.correcciones.sin_aplicar} sin aplicar todavía` : ''}</dd>
          <dt>Última actualización</dt><dd>${fecha(p.criterio_fecha)}</dd>
        </dl>
        <p class="guia" style="margin:18px 0 0;font-size:.88rem">
        Marca en tu lista los contratos que no te interesan y ajustamos el
        filtro automáticamente.</p>
        <div id="recuperar"></div>
      </div>
      <div class="bloque peligro">
        <h3>Empezar de cero</h3>
        <p class="guia" style="margin:0 0 18px">Si tu negocio ha cambiado de
        rumbo —una línea nueva, o has dejado de hacer algo— es mejor rehacer
        el filtro que ir corrigiéndolo. Tarda un minuto y no se pierde nada:
        tu historial de contratos sigue ahí.</p>
        <button class="secundario" id="reiniciar">Rehacer mi filtro</button>
        <div id="resultado"></div>
      </div>`,

  };

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>${esc(SECCIONES[seccion] ?? 'Mi cuenta')}</strong>
        <div class="quien">${esc(p.empresa || p.email || '')}</div></div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta(seccion)}
        <button class="enlace" id="volver">Mis contratos</button>
      </div>
    </div>
    <div class="panel">${secciones[seccion] ?? secciones.cuenta}</div>`;

  // A la lista, no a la pantalla anterior. Cada sección del panel deja
  // su marca en el historial, así que retroceder devolvía a la sección
  // de antes en vez de salir: para volver a los contratos había que
  // pulsar varias veces.
  alPulsar('volver', () => pantallaOportunidades(perfil, session));
  activarMenu(perfil, session);
  activarCampana(p.avisos);

  // Si ocultó la explicación de la lista, aquí puede recuperarla.
  const hueco = document.getElementById('recuperar');
  let oculta = false;
  try { oculta = localStorage.getItem('sin-explicacion') === '1'; } catch { /* nada */ }
  if (hueco && oculta) {
    hueco.innerHTML = `<button class="enlace" id="volver-explica"
      style="padding-left:0;margin-top:10px">Volver a mostrar la explicación
      en mi lista</button>`;
    alPulsar('volver-explica', () => {
      try { localStorage.removeItem('sin-explicacion'); } catch { /* nada */ }
      hueco.innerHTML = `<p class="guia" style="margin:10px 0 0;font-size:.88rem">
        Hecho. Volverá a aparecer en tu lista.</p>`;
    });
  }

  // ---------- Rehacer el filtro ----------
  alPulsar('reiniciar', () => {
    const zona = document.getElementById('resultado');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? Se borrará tu filtro actual y volverás a
      empezar desde tu CIF.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no">Cancelar</button>
        <button class="principal" id="si">Sí, rehacerlo</button>
      </div></div>`;
    alPulsar('no', () => zona.innerHTML = '');
    alPulsar('si', async () => {
      zona.innerHTML = `<div class="aviso">Preparando...</div>`;
      try {
        await llamar('reiniciar');
        arrancar();
      } catch {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
      }
    });
  });
}

// de la lista no se distinguía de lo habitual: sin nada que la señalara

//
// Y se recuerda en el PERFIL, no en el navegador: quien entra desde el
// móvil la vería otra vez, y quien limpia los datos del navegador
// también. Es una propiedad de la persona, no del aparato.
function pantallaBienvenida(perfil, session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="bienvenida">
      <div class="entra">
        <p class="saluda">${esc(perfil.empresa || '')}</p>
        <h1>Bienvenido</h1>
      </div>
      <div class="entra">
        <p class="lema">Hemos montado tu filtro leyendo los contratos que
        has ganado. Pero <strong>solo tú sabes a qué te presentarías de

      </div>
      <div class="entra">
        <div class="dos-botones">
          <span class="muestra si">Sí me interesa</span>
          <span class="muestra no">No me interesa</span>
