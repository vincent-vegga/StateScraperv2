  // el panel: quien la cierre el primer día no debería quedarse sin saber
  // para qué sirven los botones.
  const explica = document.getElementById('explica');
  try {
    if (localStorage.getItem('sin-explicacion') === '1') explica?.remove();
  } catch { /* modo privado */ }
  alPulsar('cerrar-explica', () => {
    explica?.remove();
    try { localStorage.setItem('sin-explicacion', '1'); } catch { /* nada */ }
  });

  // Sin NIF, cuántas correcciones lleva. Sin meta: en la medición del
  // 04/10 la lista mejora a partir de unas 10 y sigue mejorando a las 20,
  // sin un punto en el que pare, y pedir una cifra así asusta.
  // Se cuentan en la base (no en el navegador: puede corregir desde el
  // móvil) y se suma en el momento al corregir, sin volver a preguntar.
  let correccionesHechas = null;
  const pintarLlevas = () => {
    const sitio = document.getElementById('llevas-afinar');
    if (!sitio || correccionesHechas == null) return;
    sitio.textContent = correccionesHechas === 0 ? 'Aún no has hecho ninguna.'
      : correccionesHechas === 1 ? 'Llevas una.'
      : `Llevas ${correccionesHechas}.`;
  };
  if (!perfil.cif && explica?.isConnected) {
    sb.from('correcciones').select('id', { count: 'exact', head: true })
      .eq('perfil_id', perfil.id)
      .then(({ count, error }) => {
        if (error || !vigente()) return;
        correccionesHechas = count ?? 0;
        pintarLlevas();
      }, () => { /* sin cuenta, el aviso se queda sin ella */ });
  }

  // `pasado`: cómo se dice un plazo ya cerrado. En la cartera no es
  // "vencido" (suena a descuido), es simplemente "cerrado".
  const bloqueFecha = (o, pasado = 'vencido') => {
    if (o.dias == null) return `<div class="fecha sinplazo"><span class="dia">Sin plazo</span></div>`;
    // El día que vale de verdad: un plazo a las 00:00 es el final del
    // anterior (ver `plazoEfectivo`).
    const p = partes(plazoEfectivo(o.fecha_limite));
    // Corto para que quepa en una línea: con "quedan 5 días" la celda
    // crecía a dos y rompía el ritmo de la lista. La fecha está justo
    // encima, así que "hoy" o "en 5 días" se entiende igual.
    //
    // De otro año, el año en vez de la cuenta: "6 feb · en 1221 días" no
    // decía de qué año era, y una cifra así no se lee de un vistazo.
    const c = o.dias < 0 ? pasado
            : o.dias === 0 ? 'hoy'
            : o.dias === 1 ? 'mañana'
            : +p.year !== anioEnCurso() ? `de ${p.year}`
            : `en ${o.dias} días`;
    // Tres días, no siete. Con siete se marcaba media lista, y un aviso
    // que sale en la mayoría de las filas deja de avisar: se convierte
    // en ruido y enseña a ignorarlo.
    return `<div class="fecha ${o.dias >= 0 && o.dias <= 3 ? 'apura' : ''}">
      <span class="dia">${p.day} ${MESES[+p.month-1]}</span>
      <span class="cuenta-dias">${c}</span></div>`;
  };

  const fechaLarga = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const plazoLargo = s => {
    if (!s) return 'sin plazo publicado';
    // "5 de octubre, a las 00:00" se leía como que quedaba todo el día 5.
    if (esMedianoche(s))
      return `${fechaLarga(plazoEfectivo(s))}, hasta medianoche (hora peninsular)`;
    const p = partes(s);
    return `${fechaLarga(s)}, a las ${p.hour}:${p.minute} (hora peninsular)`;
  };
  // Sin provincia se dice la comunidad, y que la provincia no se sabe:
  // si no, un contrato catalán que aparece al filtrar por Girona parece
  // un error del filtro.
  const lugar = o => o.provincia
    ?? (o.comunidad ? `${o.comunidad}, provincia sin precisar` : null);

  // Lo que no es un contrato normal, dicho en la fila: en algunos sectores
  // los sistemas dinámicos llenan la lista y, vistos igual que un
  // contrato, parecen oportunidades que no son. El basado en un acuerdo
  // marco es el que más importa: si no estás homologado, no puedes
  // presentarte. La etiqueta es corta; la explicación va en el detalle,
  // porque un texto al pasar por encima no existe en el móvil.
  // El veredicto de Viabilidad en la fila, solo cuando avisa de algo.
  // "Tienes opciones" sale en tres de cada cuatro contratos (medido el
  // 04/10/2026: 2.150 de 2.865) y una marca en casi todas las filas deja
  // de avisar; para quedarse con esos está el filtro.
  // Qué piden, en la fila: solo lo que cambia la decisión (Decisión 54).
  // "Piden facturar" dice la cifra y no un veredicto: lo que la empresa
  // factura a privados no lo vemos.
  const marcaRequisitos = r =>
    r?.marca === 'clasificacion'
      ? '<span class="viab req">Exigen clasificación</span>'
      : r?.marca === 'facturacion' && r.pide
        ? `<span class="viab req" title="Más de lo que ganas en contratos públicos. Mira la ficha.">Piden facturar ${
            eurosRedondos(r.pide) ?? euros(r.pide)} al año</span>`
        : '';

  const VIABILIDAD_FILA = {
    mio: 'Es tuyo: ganaste la anterior',
    // "de ganar": junto a "Qué piden para presentarte" (Decisión 54), un
    // "Difícil" a secas se leía como "no llegas", y es otra pregunta.
    dificil: 'Difícil de ganar',
    cerrado: 'Parece cerrado',
  };

  const SISTEMAS = {
    'Sistema dinámico de adquisición': {
      marca: 'SISTEMA DINÁMICO',
      explica: 'Es una inscripción en un catálogo de proveedores que sigue abierto. Entrar no es ganar un contrato: los encargos llegan después, entre los inscritos.',
    },
    'Acuerdo marco': {
      marca: 'ACUERDO MARCO',
      explica: 'Se homologa a una o varias empresas. El dinero llega después, con los contratos basados en el acuerdo.',
    },
    'Contrato basado en acuerdo marco': {
      marca: 'SOLO HOMOLOGADOS',
      explica: 'Es un encargo dentro de un acuerdo marco: solo pueden presentarse las empresas ya homologadas en él.',
    },
  };

  // Solo el titular. Los cuatro recuadros de antes —abiertos, encaje
  // claro, importe, vencimientos— duplicaban lo que ya dicen el titular
  // y los filtros de debajo. La misma función en dos sitios confunde
  // más de lo que ayuda, y quien usa esto es un profesional que sabe
  // lo que busca.
  //
  // `total` es lo que hay en la pestaña sin filtros. Con filtros puestos se
  // dice "N de M": "Hay 3 contratos abiertos para ti" con 182 detrás de un
  // filtro recordado de hace días se leía como que solo había 3.
  function pintarTitular(lista, total) {
    const n = lista.length;
    const titular = document.getElementById('titular');
    const filtrado = hayFiltros() && total > n;
    if (n > 0) {
      titular.textContent = filtrado
        ? `${numero(n)} de ${plural(numero(total), 'contrato abierto', 'contratos abiertos')} con estos filtros`
        : `Hay ${plural(numero(n), 'contrato abierto', 'contratos abiertos')} para ti`;
      return;
    }
    // Sin nada que enseñar, el motivo importa: no es lo mismo estar al
    // día en novedades que no tener ningún contrato abierto, ni que lo
    // escondan los filtros.
    titular.textContent = filtrado
      ? (pestana === 'hoy' ? 'Ninguna novedad con estos filtros'
                           : 'Ningún contrato con estos filtros')
      : pestana === 'hoy'
        ? 'No hay novedades para ti'
        : 'Ahora mismo no hay contratos abiertos para ti';
  }

  // Provincias elegidas. Vacío es "toda España", no "ninguna": es lo que
  // espera quien todavía no ha elegido nada.
  const elegidas = new Set();
  let pestana = pestanaInicial;

  // ---------- Los filtros se recuerdan ----------
  //
  // Quien trabaja en Asturias no debería volver a marcar Asturias cada
  // vez que entra. Encaje, sector y provincias se guardan en este
  // navegador y por empresa: con dos NIF en la cuenta, cada una tiene los
  // suyos. La búsqueda por texto solo dura la sesión: un "limpieza"
  // escrito ayer y todavía puesto hoy parece una lista rota.
  //
  // En el navegador y no en la base: es cómo prefiere mirar la lista,
  // no un dato de la empresa, y así no cuesta una llamada por clic.
  const CLAVE_FILTROS = 'filtros-contratos:' + perfil.id;
  const CLAVE_TEXTO = 'texto-contratos:' + perfil.id;
  let recordados = {};
  try { recordados = JSON.parse(localStorage.getItem(CLAVE_FILTROS)) ?? {}; }
  catch { /* modo privado o dato roto: se empieza sin filtros */ }
  (Array.isArray(recordados.provincias) ? recordados.provincias : [])
    .forEach(p => elegidas.add(String(p)));

  function guardarFiltros() {
    const campoSector = document.getElementById('f-sector');
    // Mientras los sectores no han llegado, el selector está vacío: no se
    // pisa el que había guardado.
    const sector = SECTORES.length
      ? (SECTORES[campoSector.value]?.id ?? null)
      : (recordados.sector ?? null);
    recordados = {
      veredicto: document.getElementById('f-veredicto').value || null,
      viabilidad: document.getElementById('f-viabilidad').value || null,
      tamano: document.getElementById('f-tamano').value || null,
      sector,
      provincias: [...elegidas],
    };
    try {
      localStorage.setItem(CLAVE_FILTROS, JSON.stringify(recordados));
      sessionStorage.setItem(CLAVE_TEXTO, document.getElementById('f-texto').value);
    } catch { /* modo privado: se filtra igual, solo que no se recuerda */ }
  }

  const hayFiltros = () =>
    !!(document.getElementById('f-veredicto').value
       || document.getElementById('f-viabilidad').value
       || document.getElementById('f-tamano').value
       || document.getElementById('f-sector').value
       || document.getElementById('f-texto').value.trim()
       || elegidas.size);

  function quitarFiltros() {
    document.getElementById('f-veredicto').value = '';
    document.getElementById('f-viabilidad').value = '';
    document.getElementById('f-tamano').value = '';
    document.getElementById('f-sector').value = '';
    document.getElementById('f-texto').value = '';
    elegidas.clear();
    pintarEtiquetas();
    repintar();
  }

  // La visita se marca por HABER ENTRADO, no solo por abrir la pestaña de
  // novedades.
  //
  // Antes solo se marcaba al salir de esa pestaña, así que quien no la
  // pulsara nunca dejaba el contador intacto: al recargar volvían a
  // aparecer las mismas de siempre, y "novedad" dejaba de significar nada.
  //
  // Una sola vez por sesión, y sin tocar el contador de esta: lo que está
  // mirando sigue marcado hasta que vuelva.
  let yaMarcada = false;
  const marcarLaVisita = () => {
    if (yaMarcada) return;
    yaMarcada = true;
    // El `.then` no es decorativo: la librería de Supabase no envía la
    // petición hasta que alguien espera el resultado. Llamarla y soltarla
    // no hacía nada, y el fallo era invisible porque tampoco daba error.
    sb.rpc('marcar_visita').then(
      ({ error }) => { if (error) console.warn('No se marcó la visita:', error); },
      error => console.warn('No se marcó la visita:', error),
    );
  };

  // Sectores de la empresa; vacío hasta que llegan, y el selector oculto
  // mientras tanto o si tiene menos de dos.
  let SECTORES = [];

  // Cada pintado rehace la lista entera. Lo que el cliente tenía a medio
  // escribir en unas notas y dónde estaba el foco se recogen antes y se
  // devuelven después: si no, un refresco de fondo le borraba la nota
  // que estaba escribiendo.
  function pintar() {
    if (!vigente() || !document.getElementById('lista')) return;
    const foco = recordarFoco();
    pintarSinFoco();
    restaurarFoco(foco);
    // Las fichas que siguen abiertas (ABIERTAS) salen con el hueco de "Qué
    // piden" vacío. Sin esto, un repintado que no viene de un clic (el
    // refresco de la cartera tras cambiar el estado, guardar las notas, la
    // lista que llega por detrás) lo dejaba en blanco hasta el siguiente.
    llenarRequisitosAbiertos();
  }

  function pintarSinFoco() {
    engancharLista();
    // En la cartera los filtros no aplican (es lo suyo, no lo abierto), y
    // la explicación habla de corregir el filtro.
    const enCartera = pestana === 'cartera';
    // Con `style` y no con `hidden`: la hoja le da `display:flex`, que
    // gana al atributo.
    document.querySelector('.filtros').style.display = enCartera ? 'none' : '';
    const explica_ = document.getElementById('explica');
    if (explica_) explica_.style.display = enCartera ? 'none' : '';
    if (enCartera) return pintarCartera();
    guardarFiltros();
    document.getElementById('quitar-filtros').hidden = !hayFiltros();
    const ver = document.getElementById('f-veredicto').value;
    const viab = document.getElementById('f-viabilidad').value;
    // "Tienes opciones" incluye lo que ya es tuyo; "sin los cerrados" deja
    // también lo que aún no tiene veredicto: no saberlo no es estar cerrado.
    const pasaViab = o => !viab
      || (viab === 'abierto' ? ['abierto', 'mio'].includes(o.viabilidad)
        : viab === 'no-cerrado' ? o.viabilidad !== 'cerrado'
        : o.viabilidad === viab);
    // Tamaño: «los que marcaste» son sus franjas del alta. Un contrato sin
    // importe publicado se queda siempre: no saberlo no es no ser suyo.
    const tam = document.getElementById('f-tamano').value;
    const franjasSuyas = perfil.franjas ?? [];
    const pasaTamano = o => {
      if (!tam) return true;
      const f = franjaDe(o.presupuesto);
      return f == null || (tam === 'suyos' ? franjasSuyas.includes(f) : f === tam);
    };
    // Sin tildes y palabra a palabra, como en Organismos: "jardineria"
    // encontraba 3 contratos y "jardinería", 12.
    const txt = document.getElementById('f-texto').value.trim();
    const campoSector = document.getElementById('f-sector');
    const sector = SECTORES[campoSector.value];
    const enPestana = DATOS.filter(o => pestana === 'todo' || o.es_novedad);
    const vistos = enPestana.filter(o =>
      enZona(o) &&
      (!ver || o.veredicto === ver) &&
      pasaViab(o) &&
      pasaTamano(o) &&
      (!sector || enSector(o, sector)) &&
      (!txt || coincide(`${o.titulo} ${o.organo}`, txt)));

    // Cuántos hay en cada sector con la pestaña actual: elegir uno que
    // resulta vacío es un clic perdido y parece un fallo.
    [...campoSector.options].forEach(op => {
      const s = SECTORES[op.value];
      if (!s) return;
      const n = DATOS.filter(o => (pestana === 'todo' || o.es_novedad)
                                  && enSector(o, s)).length;
      op.textContent = `${s.nombre} (${n})`;
    });

    pintarTitular(vistos, enPestana.length);
    // La fila es un `div` con papel de botón y no un <button>: dentro van
    // los dos botones de corrección, y un botón no puede llevar otros. Con
    // <span> por botones no se llegaba a ellos con el teclado y el lector
    // de pantalla los leía como texto suelto.
    document.getElementById('lista').innerHTML = vistos.length ? vistos.map((o,i) => `
      <div class="fila-envoltorio">
      <div class="fila" data-i="${i}" data-id="${esc(o.id_licitacion)}" role="button" tabindex="0"
           aria-expanded="${ABIERTAS.has(o.id_licitacion)}" aria-controls="d${i}">
        ${bloqueFecha(o)}
        <div><p class="t">${esc(o.titulo)}</p>
          <p class="meta">${esc([o.organo, lugar(o)].filter(Boolean).join(' · '))}${
            SISTEMAS[o.sistema] ? `<span class="marca-ute marca-sistema">${
              SISTEMAS[o.sistema].marca}</span>` : ''}</p>
          ${VIABILIDAD_VISIBLE && VIABILIDAD_FILA[o.viabilidad] ? `<span class="viab ${
            o.viabilidad}">${VIABILIDAD_FILA[o.viabilidad]}</span>` : ''}
          ${marcaRequisitos(o.requisitos)}
          ${o.dias_sin_verificar > 90
            ? `<span class="sin-verificar">Sin movimiento desde hace
               ${o.dias_sin_verificar} días · comprueba en el expediente</span>` : ''}
          ${CARTERA.has(o.id_licitacion)
            ? marcaCartera(CARTERA.get(o.id_licitacion).estado)
            : o.correccion
            // Es lo que marcó con "Sí me interesa". Antes decía "Confirmado
            // como tuyo", que se leía como "lo has ganado".
            ? `<span class="confirmado">Te interesa</span>`
            : `<span class="acciones">
                 <button type="button" class="accion si" data-si="${esc(o.id_licitacion)}">Sí me interesa</button>
                 <button type="button" class="accion no" data-no="${esc(o.id_licitacion)}">No me interesa</button>
               </span>`}

        </div>
        <div class="derecha"><div class="importe">${euros(o.presupuesto) ?? 'sin importe'}</div>
          <span class="marca ${o.veredicto}">${o.veredicto === 'si' ? 'para mí' : 'puede ser para mí'}</span></div>
      </div>
      <section class="detalle ${ABIERTAS.has(o.id_licitacion) ? 'abierto' : ''}" id="d${i}">
        <!-- El motivo del cribado NO se enseña.
             Es el razonamiento interno del clasificador —"mantenimiento de
             dispositivos CR, pero no se especifica que sean de diagnóstico
             por imagen"— y leerlo solo consigue que el cliente discuta con
             la máquina en vez de decirle si le interesa o no. Para eso
             están los dos botones. -->
        <dl>
          ${SISTEMAS[o.sistema] ? `<dt>Tipo</dt><dd>${esc(o.sistema)}
            <br><span style="color:var(--tenue)">${SISTEMAS[o.sistema].explica}</span></dd>` : ''}
          <dt>Órgano</dt><dd>${esc(o.organo ?? '—')}</dd>
          <dt>Provincia</dt><dd>${esc(o.provincia
            ?? (o.comunidad ? `sin precisar (${o.comunidad})` : 'no informada'))}</dd>
          <dt>Presupuesto</dt><dd>${euros(o.presupuesto) ?? 'sin importe publicado'}</dd>
          <dt>Duración</dt><dd>${duracionTxt(o.duracion_meses)
            ? `${duracionTxt(o.duracion_meses)}${
                importeAnualTxt(o.presupuesto_base, o.duracion_meses)
                  ? ` · base de licitación ${importeAnualTxt(o.presupuesto_base, o.duracion_meses)}` : ''}${
                o.prorrogas_texto
                  ? `<br><span style="color:var(--tenue)">Prórrogas: ${esc(o.prorrogas_texto)}</span>` : ''}`
            : '<span style="color:var(--tenue)">no publicada por el organismo</span>'}</dd>
          <dt>Plazo</dt><dd>${plazoLargo(o.fecha_limite)}</dd>
          <dt>Códigos CPV</dt><dd>${esc((o.cpvs || []).join(', ')) || '—'}</dd>
          <dt>Último movimiento</dt><dd>${
            o.dias_sin_verificar == null ? '—'
            : o.dias_sin_verificar === 0 ? 'hoy'
            : o.dias_sin_verificar === 1 ? 'ayer'
            : `hace ${o.dias_sin_verificar} días`}${
            o.dias_sin_verificar > 90
              ? ' — lleva mucho parado, conviene comprobarlo' : ''}</dd>
        </dl>
        <div class="requisitos" data-requisitos="${esc(o.id_licitacion)}"></div>
        <div class="pliego" data-pliego="${esc(o.id_licitacion)}" hidden></div>
        ${bloqueCartera(o.id_licitacion)}
        ${VIABILIDAD_VISIBLE ? `<button class="principal" data-analizar="${esc(o.id_licitacion)}"
                style="margin-right:10px">Analizar viabilidad</button>` : ''}
        ${o.enlace ? `<a class="ver" href="${esc(o.enlace)}" target="_blank" rel="noopener">Ver el expediente</a>` : ''}
      </section></div>`).join('')
      // En Novedades, "estás al día" solo si de verdad no hay ninguna: si
      // las esconden los filtros, se dice eso y se da la salida.
      : pestana === 'hoy' && !(hayFiltros() && enPestana.length)
        ? `<p class="vacio">Estás al día. Aquí aparecerá lo que entre
           a partir de ahora.</p>`
        : `<p class="vacio">${pestana === 'hoy'
            ? `${plural(numero(enPestana.length), 'novedad', 'novedades')}, pero
               ninguna encaja con estos filtros.`
            : 'Ningún contrato encaja con estos filtros.'}${
            hayFiltros() ? `<button type="button" class="quitar-filtros"
              data-quitar-filtros>Quitar filtros</button>` : ''}</p>`;
    // Con los filtros recordados, una lista vacía puede venir de algo
    // que se eligió hace días: la salida tiene que estar justo ahí.
    document.querySelector('[data-quitar-filtros]')
      ?.addEventListener('click', quitarFiltros);

    raiz.querySelectorAll('.fila').forEach(f => {
      const alternar = () => {
        const abierta = document.getElementById('d' + f.dataset.i)
          .classList.toggle('abierto');
        // Lo dice al lector de pantalla y, por CSS, deja el título entero.
        f.setAttribute('aria-expanded', String(abierta));
        if (abierta) ABIERTAS.add(f.dataset.id); else ABIERTAS.delete(f.dataset.id);
      };
      f.onclick = ev => {
        // Los botones de corrección viven dentro de la fila para que
        // aparezcan a su altura. Hay que evitar que su clic despliegue
        // también el detalle.
        const accion = ev.target.closest('.accion');
        if (accion) {
          ev.stopPropagation();
          // Con la cartera, "sí me interesa" la guarda ahí (y la base apunta
          // la corrección igual). Sin ella, como siempre.
          if (accion.dataset.si && CARTERA_DISPONIBLE) ponerEstado(accion.dataset.si, 'interesa');
          else if (accion.dataset.si) corregir(accion.dataset.si, true);
          else pedirMotivo(accion.dataset.no, accion);
          return;
        }
        alternar();
      };
      // Lo que un <button> traía de serie: Intro y espacio la despliegan.
      f.onkeydown = ev => {
        if (ev.target !== f || (ev.key !== 'Enter' && ev.key !== ' ')) return;
        ev.preventDefault();
        alternar();
      };
    });
  }

  // ---------- Mi cartera ----------
  //
  // Lo que el cliente lleva entre manos: lo que le interesa, lo que
  // prepara, lo presentado y su resultado (Decisión 53). Sin esto, quien
  // decide presentarse se lleva el contrato a un Excel y deja de entrar:
  // la lista solo enseña lo abierto, y lo presentado desaparece de ella
  // al cerrar el plazo.
  //
  // El resultado llega solo: la base cruza la adjudicación con su NIF
  // (`mi_cartera`). Se propone y el cliente lo confirma con un clic; no
  // se cambia el estado por él, porque un NIF mal publicado o una UTE
  // que no conocemos lo dejarían ganado o perdido sin serlo.

  // Detalles desplegados, por contrato. Un cambio de estado repinta la
  // lista, y sin esto la ficha en la que estaba trabajando se cerraba.
  const ABIERTAS = new Set();
  // Notas e importes escritos y aún sin guardar, por contrato. Se apuntan
  // al teclear (`engancharLista`), no comparando la página con los datos:
  // así, si los datos cambian por detrás (deshacer, un refresco), lo
  // viejo de la página no se toma por algo que escribió él.
  const BORRADORES = new Map();

  // Un selector que vuelva a encontrar el elemento enfocado en la lista
  // nueva, y dónde estaba el cursor si era un campo de texto.
  function recordarFoco() {
    const a = document.activeElement;
    if (!a || a === document.body || !document.getElementById('lista')?.contains(a)) return null;
    const caja = a.closest('.bloque-cartera[data-id]');
    const id = caja ? CSS.escape(caja.dataset.id) : null;
    let sel = null;
    if (a.dataset.cartera) sel = `[data-cartera="${CSS.escape(a.dataset.cartera)}"][data-estado="${a.dataset.estado}"]`;
    else if (caja && a.matches('[data-nota]')) sel = `.bloque-cartera[data-id="${id}"] [data-nota]`;
    else if (caja && a.matches('[data-oferta]')) sel = `.bloque-cartera[data-id="${id}"] [data-oferta]`;
    else if (a.dataset.guardarNota) sel = `[data-guardar-nota="${CSS.escape(a.dataset.guardarNota)}"]`;
    else if (a.matches('.fila[data-id]')) sel = `.fila[data-id="${CSS.escape(a.dataset.id)}"]`;
    if (!sel) return null;
    return { sel, inicio: a.selectionStart, fin: a.selectionEnd };
  }

  function restaurarFoco(foco) {
    if (!foco) return;
    const b = document.querySelector(foco.sel);
    if (!b) return;
    b.focus({ preventScroll: true });
    if (foco.inicio != null && b.setSelectionRange) {
      try { b.setSelectionRange(foco.inicio, foco.fin); } catch { /* no es de texto */ }
    }
  }
  let cerradasAbiertas = false;
  // Cada escritura invalida los refrescos que estuvieran en camino: si
  // llegara uno pedido antes, devolvería el estado de antes del clic.
  let escrituras = 0;

  function ponerCartera(filas) {
    CARTERA.clear();
    (Array.isArray(filas) ? filas : []).forEach(c => CARTERA.set(c.id_licitacion, c));
    CARTERA_DISPONIBLE = true;
    carteraCargada = true;
    const boton = document.getElementById('p-cartera');
    if (boton) boton.hidden = false;
    pintarContadores();
    pintar();
  }

  // Lo que se acaba de cambiar ya está aquí; por detrás se trae lo que
  // dice la base (resultado de la adjudicación, copia vigente...).
  function refrescarCartera() {
    const yo = ++escrituras;
    olvidar('mi_cartera');
    pedir('mi_cartera').then(r => {
      if (!r.error && vigente() && yo === escrituras) ponerCartera(r.data);
    }, () => { /* el refresco nunca estorba */ });
  }

  // Abierto para presentarse: publicado y con plazo por delante.
  const sigueAbierto = c => (c.estado_licitacion ?? 'PUB') === 'PUB'
    && (c.fecha_limite == null || diasHasta(c.fecha_limite) >= 0);

  const marcaCartera = estado =>
    `<span class="en-cartera e-${estado}">${ESTADOS_CARTERA[estado] ?? ''}</span>`;

  const porcentaje = x => new Intl.NumberFormat('es-ES',
    { style: 'percent', maximumFractionDigits: 1 }).format(x);

  // "45.000", "45.000,50", "45000.5" o "45000 €". Vacío es "sin importe";
  // lo que no se entiende, NaN.
  function leerImporte(texto) {
    const t = String(texto ?? '').replace(/[€\s]/g, '');
    if (!t) return null;
    if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(t)) return Number(t.replace(/\./g, '').replace(',', '.'));
    if (/^\d+(,\d{1,2})?$/.test(t)) return Number(t.replace(',', '.'));
    if (/^\d+(\.\d{1,2})?$/.test(t)) return Number(t);
    return NaN;
  }
  const importeEditable = n => n == null ? '' : new Intl.NumberFormat('es-ES',
    { useGrouping: 'always', maximumFractionDigits: 2 }).format(n);

  // Los botones de estado y, si ya lo lleva, sus notas. Va en la ficha de
  // la lista de abiertos y en la de la cartera.
  function bloqueCartera(id) {
    if (!CARTERA_DISPONIBLE) return '';
    const c = CARTERA.get(id);
    const abierto = c ? sigueAbierto(c) : true;
    // Con el plazo abierto, ganar o perder todavía no existe.
    const estados = abierto
      ? ['interesa', 'preparando', 'presentada', 'descartada']
      : Object.keys(ESTADOS_CARTERA);
    const avisos = perfil.avisos
      ? 'Te recordamos el plazo por correo 7, 3 y 1 día antes de que cierre.'
      : 'Si enciendes los avisos (la campana de arriba), te recordamos el plazo por correo 7, 3 y 1 día antes.';
    const borrador = BORRADORES.get(id);
    return `
      <div class="bloque-cartera" data-id="${esc(id)}">
        <p class="rotulo-cartera">${c ? 'En tu cartera' : 'Llévalo en tu cartera'}</p>
        <div class="estados-cartera" role="group" aria-label="Estado en tu cartera">${
          estados.map(e => `<button type="button" class="estado-cartera" data-cartera="${esc(id)}"
            data-estado="${e}" aria-pressed="${c?.estado === e}">${ESTADOS_CARTERA[e]}</button>`).join('')}</div>
        ${c ? `
          <div class="notas-cartera">
            <label class="campo-nota">Notas
              <textarea data-nota maxlength="2000" rows="3"
                placeholder="Qué falta, con quién has hablado, por qué no vas...">${esc(borrador?.nota ?? c.nota ?? '')}</textarea></label>
            <label class="campo-oferta">Tu oferta, sin IVA
              <input type="text" data-oferta inputmode="decimal" autocomplete="off"
                placeholder="Por ejemplo, 45.000" value="${esc(borrador?.oferta ?? importeEditable(c.importe_oferta))}"></label>
          </div>
          <div class="pie-cartera">
            <button type="button" class="ver" data-guardar-nota="${esc(id)}">Guardar notas</button>
            <button type="button" class="enlace" data-quitar="${esc(id)}">Quitar de la cartera</button>
          </div>
          <p class="ayuda-cartera">${c.importe_oferta == null && ['preparando', 'presentada', 'perdida'].includes(c.estado)
            ? (c.adjudicacion?.resultado === 'otra'
                ? 'Apunta tu oferta y te diremos a cuánto quedaste de la ganadora.'
                : 'Apunta tu oferta: cuando se adjudique te diremos a cuánto quedaste de la ganadora.')
            : abierto ? avisos : ''}</p>`
        : `<p class="ayuda-cartera">${avisos}</p>`}
      </div>`;
  }

  async function ponerEstado(id, estado, base = null) {
    const antes = CARTERA.get(id);
    const o = DATOS.find(x => x.id_licitacion === id) ?? base;
    if ((!antes && !o) || antes?.estado === estado) return;
    const ahora = new Date().toISOString();
    CARTERA.set(id, antes ? { ...antes, estado, cambiado: ahora } : {
      id_licitacion: id, estado, nota: null, importe_oferta: null,
      creado: ahora, cambiado: ahora, plazo_visto: o.fecha_limite,
      republicada: false, titulo: o.titulo, organo: o.organo,
      provincia: o.provincia, comunidad: o.comunidad,
      presupuesto: o.presupuesto, presupuesto_base: o.presupuesto_base,
      duracion_meses: o.duracion_meses, enlace: o.enlace,
      fecha_limite: o.fecha_limite, estado_licitacion: o.estado_licitacion ?? 'PUB',
      sistema: o.sistema, viabilidad: o.viabilidad, adjudicacion: o.adjudicacion ?? null,
    });
    // Guardar es decir que interesa: la base apunta la corrección si no
    // la había, y la fila deja de preguntar.
    const enLista = DATOS.find(x => x.id_licitacion === id);
    const corregidaAntes = enLista?.correccion;
    if (enLista) enLista.correccion = true;
    escrituras++;
    pintarContadores();
    pintar();

    let r;
    try {
      r = await sb.rpc('poner_en_cartera', { licitacion: id, nuevo_estado: estado });
    } catch (error) {
      r = { error };
    }
    if (r.error || !r.data?.ok) {
      if (antes) CARTERA.set(id, antes); else CARTERA.delete(id);
      if (enLista) enLista.correccion = corregidaAntes;
      pintarContadores();
      pintar();
      recado('No se ha podido guardar. Inténtalo de nuevo.');
      return;
    }
    olvidar('contratos', 'analizables');
    refrescarCartera();

    if (antes) {
      recado(`Marcado como «${ESTADOS_CARTERA[estado]}»`);
      return;
    }
    recado('Guardado en tu cartera', pestana === 'cartera' ? null
      : { texto: 'Ver mi cartera', hacer: () => cambiarPestana('cartera') });
    // Cuenta como un "sí me interesa" nuevo: a las tres, se ajusta el
    // filtro, como con el botón.
    if (enLista && corregidaAntes == null) {
      if (correccionesHechas != null) { correccionesHechas++; pintarLlevas(); }
      if (vigente() && r.data.pendientes >= CORRECCIONES_PARA_AJUSTAR) ajustarFiltro();
    }
  }

  async function quitarDeCartera(id) {
    const antes = CARTERA.get(id);
    if (!antes) return;
    CARTERA.delete(id);
    ABIERTAS.delete(id);
    BORRADORES.delete(id);
    escrituras++;
    pintarContadores();
    pintar();
    let r;
    try {
      r = await sb.rpc('quitar_de_cartera', { licitacion: id });
    } catch (error) {
      r = { error };
    }
    if (r.error || !r.data?.ok) {
      CARTERA.set(id, antes);
      pintarContadores();
      pintar();
      recado('No se ha podido quitar. Inténtalo de nuevo.');
      return;
    }
    olvidar('mi_cartera');
    // Deshacer lo devuelve tal cual, con sus notas.
    recado('Quitado de tu cartera', {
      texto: 'Deshacer',
      hacer: async () => {
        await ponerEstado(id, antes.estado, antes);
        if (antes.nota || antes.importe_oferta != null)
          await guardarNotas(id, null, antes.nota, antes.importe_oferta);
      },
    }, ESPERA_DESHACER);
  }

  // Desde la ficha (`boton`) o, al deshacer, con los valores dados.
  async function guardarNotas(id, boton, nota = null, importe = null) {
    if (boton) {
      const caja = boton.closest('.bloque-cartera');
      const campo = caja.querySelector('[data-oferta]');
      nota = caja.querySelector('[data-nota]').value.trim() || null;
      importe = leerImporte(campo.value);
      if (Number.isNaN(importe)) {
        recado('No entendemos ese importe. Escríbelo así: 45.000 o 45.000,50');
        campo.focus();
        return;
      }
      boton.disabled = true;
    }
    let r;
    try {
      r = await sb.rpc('anotar_en_cartera', { licitacion: id, texto: nota, importe });
    } catch (error) {
      r = { error };
    }
    if (boton?.isConnected) boton.disabled = false;
    if (r.error || !r.data?.ok) {
      recado('No se han podido guardar las notas. Inténtalo de nuevo.');
      return;
    }
    const c = CARTERA.get(id);
    if (c) CARTERA.set(id, { ...c, nota, importe_oferta: importe });
    BORRADORES.delete(id);
    refrescarCartera();
    if (boton) recado('Notas guardadas');
    // Se repinta para que la fila diga "tu oferta" y los campos queden
    // como se guardaron; la ficha sigue abierta (ABIERTAS) y el foco, en
    // el botón.
    pintar();
  }

  async function plazoVisto(id) {
    const c = CARTERA.get(id);
    if (!c) return;
    CARTERA.set(id, { ...c, plazo_visto: c.fecha_limite });
    escrituras++;
    pintar();
    try { await sb.rpc('dar_plazo_por_visto', { licitacion: id }); }
    catch { /* si no llega, vuelve a avisar la próxima vez: nada se pierde */ }
    olvidar('mi_cartera');
  }

  // Los botones de la lista y de las fichas. Se escucha en la lista, que
  // contiene a las dos (la ficha es hermana de la fila, no hija), y una
  // sola vez: la lista se repinta, pero el elemento es el mismo.
  function engancharLista() {
    const lista_ = document.getElementById('lista');
    if (!lista_ || lista_.dataset.enganchada) return;
    lista_.dataset.enganchada = '1';
    lista_.addEventListener('click', ev => {
      const b = ev.target.closest('[data-analizar], [data-cartera], [data-guardar-nota], '
        + '[data-quitar], [data-visto], [data-a-mercado], [data-ir-todo]');
      if (!b) return;
      ev.stopPropagation();
      ev.preventDefault();
      const d = b.dataset;
      if (d.analizar) return pantallaViabilidad(perfil, session, false, d.analizar);
      if (d.cartera) return ponerEstado(d.cartera, d.estado);
      if (d.guardarNota) return guardarNotas(d.guardarNota, b);
      if (d.quitar) return quitarDeCartera(d.quitar);
      if (d.visto) return plazoVisto(d.visto);
      if (d.irTodo !== undefined) return cambiarPestana('todo');
      if (d.aMercado) {
        irA('mercado', { cif: d.aMercado });
        pantallaMercado(perfil, session, true, d.aMercado);
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    });
    lista_.addEventListener('input', ev => {
      const caja = ev.target.closest('.bloque-cartera[data-id]');
      if (!caja || !ev.target.matches('[data-nota], [data-oferta]')) return;
      BORRADORES.set(caja.dataset.id, {
        nota: caja.querySelector('[data-nota]').value,
        oferta: caja.querySelector('[data-oferta]').value,
      });
    });
    // Ctrl/Cmd + Intro en las notas guarda, como en el motivo del descarte.
    lista_.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter' || !(ev.metaKey || ev.ctrlKey)) return;
      const caja = ev.target.closest('.bloque-cartera');
      caja?.querySelector('[data-guardar-nota]')?.click();
    });
  }

  // Quién ganó, en una línea: "Limpiezas X por 42.000 €", y si hay varios
  // lotes, cuántas empresas más.
  function quienGano(adj) {
    const g = (adj?.ganadores ?? []).filter(x => !x.tuyo);
    if (!g.length) return 'otra empresa';
    const primero = `${esc(g[0].empresa ?? 'otra empresa')}${
      g[0].importe != null ? ` por ${euros(g[0].importe)}` : ''}`;
    return g.length > 1
      ? `${primero} y ${plural(g.length - 1, 'empresa más', 'empresas más')} (por lotes)`
      : primero;
  }

  // Lo que se aprende de una adjudicación: a cuánto quedó su oferta de la
  // ganadora y cuántas se presentaron. Solo con un único adjudicatario:
  // con lotes, no sabemos a cuál se presentó. Tampoco cuando hay varios
  // lotes y solo uno tiene ganador (el resto desiertos): `ganadores` trae
  // uno, pero puede que su oferta fuera a otro lote.
  function comparativa(c) {
    const g = c.adjudicacion?.ganadores ?? [];
    if (g.length !== 1 || (c.adjudicacion?.lotes ?? 1) > 1) return '';
    const x = g[0], trozos = [];
    const mia = Number(c.importe_oferta);
    if (!x.tuyo && c.importe_oferta != null && mia > 0 && x.importe != null) {
      const dif = (Number(x.importe) - mia) / mia;
      trozos.push(Math.abs(dif) < 0.005 ? 'La ganadora ofertó prácticamente lo mismo que tú'
        : dif < 0 ? `La ganadora ofertó un ${porcentaje(-dif)} menos que tú`
        : `La ganadora ofertó un ${porcentaje(dif)} más que tú: pesaron otros criterios, no solo el precio`);
    }
    if (x.licitadores) trozos.push(`se presentaron ${plural(x.licitadores, 'oferta', 'ofertas')}`);
    if (x.oferta_baja && x.oferta_alta && x.oferta_alta > x.oferta_baja)
      trozos.push(`entre ${euros(x.oferta_baja)} y ${euros(x.oferta_alta)}`);
    if (!trozos.length) return '';
    const texto = trozos.join(', ');
    return `<span class="situacion tenue">${texto[0].toUpperCase() + texto.slice(1)}.</span>`;
  }

  // La línea de estado de cada fila de la cartera, con la acción que toca.
  function situacion(c) {
    const id = esc(c.id_licitacion);
    const boton = (estado, texto) => `<button type="button" class="accion" data-cartera="${id}"
      data-estado="${estado}">${texto}</button>`;
    const quitar = `<button type="button" class="accion" data-quitar="${id}">Quitar de la cartera</button>`;
    const adj = c.adjudicacion;
    const abierto = sigueAbierto(c);
    const trozos = [];

    // El organismo amplía o adelanta el plazo: se dice hasta que lo ve.
    if (abierto && c.plazo_visto && c.fecha_limite
        && Math.abs(new Date(c.fecha_limite) - new Date(c.plazo_visto)) > 60_000)
      trozos.push(`<span class="situacion aviso-plazo">El organismo ha cambiado el plazo:
        antes ${fechaCorta(plazoEfectivo(c.plazo_visto))}, ahora ${fechaCorta(plazoEfectivo(c.fecha_limite))}.
        <button type="button" class="accion" data-visto="${id}">Entendido</button></span>`);

    if (c.estado === 'interesa' || c.estado === 'preparando') {
      if (adj?.resultado === 'retirada')
        trozos.push(`<span class="situacion">El organismo lo ha anulado. ${quitar}</span>`);
      else if (!abierto)
        trozos.push(`<span class="situacion">¿Presentaste oferta?
          <span class="acciones">${boton('presentada', 'Sí, la presenté')}${
            boton('descartada', 'No me presenté')}</span></span>`);
    } else if (c.estado === 'presentada') {
      const r = adj?.resultado;
      if (r === 'tuya') {
        const mios = (adj.ganadores ?? []).filter(x => x.tuyo);
        const lotes = adj.lotes > 1 && mios.some(x => x.lote)
          ? ` (${mios.length === 1 ? 'lote' : 'lotes'} ${mios.map(x => esc(x.lote)).join(', ')})` : '';
        const ute = mios.find(x => x.en_ute);
        trozos.push(`<span class="situacion buena">Adjudicado a ${ute
          ? `la UTE ${esc(ute.empresa)}, de la que tu empresa es socia` : 'tu empresa'}${lotes}.
          <span class="acciones">${boton('ganada', 'Marcar como ganada')}</span></span>`);
      } else if (r === 'otra') {
        // Sin NIF no sabemos si la ganadora es él: se le pregunta.
        trozos.push(`<span class="situacion">Adjudicado a ${quienGano(adj)}.
          <span class="acciones">${boton('perdida', 'Marcar como perdida')}${
            perfil.cif ? '' : boton('ganada', 'Era mi empresa')}</span></span>`);
      } else if (r === 'desierta') {
        trozos.push(`<span class="situacion">Ha quedado desierto: no se adjudicó a nadie.
          <span class="acciones">${quitar}</span></span>`);
      } else if (r === 'retirada') {
        trozos.push(`<span class="situacion">El organismo lo ha retirado.
          <span class="acciones">${quitar}</span></span>`);
      } else {
        trozos.push(`<span class="situacion tenue">${adj?.evaluando || c.estado_licitacion === 'EV'
          ? 'El organismo está valorando las ofertas.'
          : 'Esperando la adjudicación. Te diremos quién gana en cuanto se publique.'}</span>`);
      }
      trozos.push(comparativa(c));
    } else if (c.estado === 'ganada' || c.estado === 'perdida') {
      if (c.estado === 'perdida' && adj?.resultado === 'otra')
        trozos.push(`<span class="situacion tenue">Lo ganó ${quienGano(adj)}.</span>`);
      trozos.push(comparativa(c));
    }
    return trozos.join('');
  }

  // Quién ganó cada lote, en la ficha, con enlace a su ficha en Empresas.
  function detalleAdjudicacion(c) {
    const adj = c.adjudicacion;
    if (sigueAbierto(c)) return '';
    if (!adj?.resultado) return `<dt>Adjudicación</dt><dd><span style="color:var(--tenue)">${
      adj?.evaluando || c.estado_licitacion === 'EV' ? 'en evaluación' : 'todavía no publicada'}</span></dd>`;
    const textos = {
      desierta: 'Desierto: no se adjudicó a nadie.',
      retirada: 'Anulado o retirado por el organismo.',
    };
    if (textos[adj.resultado]) return `<dt>Adjudicación</dt><dd>${textos[adj.resultado]}</dd>`;
    const TOPE = 6;
    const g = adj.ganadores ?? [];
    const lineas = g.slice(0, TOPE).map(x => `<span class="ganador">${
      adj.lotes > 1 && x.lote ? `Lote ${esc(x.lote)}: ` : ''}${
      x.tuyo ? `<strong>${esc(x.empresa)}</strong> <span class="tuyo">${x.en_ute ? 'tu UTE' : 'tu empresa'}</span>`
      : x.cif ? `<a href="#" class="enlace-ficha" data-a-mercado="${esc(x.cif)}">${esc(x.empresa)}</a>`
      : esc(x.empresa)}${x.importe != null ? ` · ${euros(x.importe)}` : ''}${
      x.licitadores ? ` · ${plural(x.licitadores, 'oferta', 'ofertas')}` : ''}</span>`);
    if (g.length > TOPE) lineas.push(`<span class="ganador" style="color:var(--tenue)">y ${
      plural(g.length - TOPE, 'lote más', 'lotes más')}</span>`);
    return `<dt>Adjudicación</dt><dd>${adj.fecha ? `${fechaCorta(adj.fecha)}<br>` : ''}${lineas.join('')}</dd>`;
  }

  function filaCartera(c, i) {
    const abierta = ABIERTAS.has(c.id_licitacion);
    const abierto = sigueAbierto(c);
    return `
      <div class="fila-envoltorio">
      <div class="fila" data-c="${i}" data-id="${esc(c.id_licitacion)}" role="button" tabindex="0"
           aria-expanded="${abierta}" aria-controls="c${i}">
        ${bloqueFecha(c, 'cerrado')}
        <div><p class="t">${esc(c.titulo || 'Contrato sin título')}</p>
          <p class="meta">${esc([c.organo, lugar(c)].filter(Boolean).join(' · '))}${
            SISTEMAS[c.sistema] ? `<span class="marca-ute marca-sistema">${
              SISTEMAS[c.sistema].marca}</span>` : ''}</p>
          ${marcaCartera(c.estado)}${abierto && VIABILIDAD_VISIBLE && VIABILIDAD_FILA[c.viabilidad]
            ? `<span class="viab ${c.viabilidad}">${VIABILIDAD_FILA[c.viabilidad]}</span>` : ''}
          ${situacion(c)}
          ${c.nota ? `<span class="situacion tenue nota-fila">${esc(c.nota.length > 120
            ? c.nota.slice(0, 117).trimEnd() + '…' : c.nota)}</span>` : ''}
        </div>
        <div class="derecha"><div class="importe">${euros(c.presupuesto) ?? 'sin importe'}</div>
          ${c.importe_oferta != null ? `<span class="marca">tu oferta: ${euros(c.importe_oferta)}</span>` : ''}</div>
      </div>
      <section class="detalle ${abierta ? 'abierto' : ''}" id="c${i}">
        <dl>
          ${c.republicada ? `<dt>Aviso</dt><dd>El organismo volvió a publicar este
            contrato. Te enseñamos la publicación nueva, que es la que vale.</dd>` : ''}
          ${SISTEMAS[c.sistema] ? `<dt>Tipo</dt><dd>${esc(c.sistema)}
            <br><span style="color:var(--tenue)">${SISTEMAS[c.sistema].explica}</span></dd>` : ''}
          <dt>Órgano</dt><dd>${esc(c.organo ?? '—')}</dd>
          <dt>Provincia</dt><dd>${esc(c.provincia
            ?? (c.comunidad ? `sin precisar (${c.comunidad})` : 'no informada'))}</dd>
          <dt>Presupuesto</dt><dd>${euros(c.presupuesto) ?? 'sin importe publicado'}</dd>
          ${duracionTxt(c.duracion_meses) ? `<dt>Duración</dt><dd>${duracionTxt(c.duracion_meses)}</dd>` : ''}
          <dt>Plazo</dt><dd>${plazoLargo(c.fecha_limite)}</dd>
          ${detalleAdjudicacion(c)}
          <dt>En tu cartera</dt><dd>desde el ${fechaCorta(c.creado)}</dd>
        </dl>
        ${abierto ? `<div class="pliego" data-pliego="${esc(c.id_licitacion)}" hidden></div>` : ''}
        ${bloqueCartera(c.id_licitacion)}
        ${VIABILIDAD_VISIBLE && abierto ? `<button class="principal" data-analizar="${esc(c.id_licitacion)}"
                style="margin-right:10px">Analizar viabilidad</button>` : ''}
        ${c.enlace ? `<a class="ver" href="${esc(c.enlace)}" target="_blank" rel="noopener">Ver el expediente</a>` : ''}
      </section></div>`;
  }

  function pintarCartera() {
    const lista = document.getElementById('lista');
    const titular = document.getElementById('titular');
    if (!carteraCargada) {
      titular.textContent = 'Tu cartera';
      lista.innerHTML = `<p class="vacio">Cargando tu cartera...</p>`;
      return;
    }
    const todas = [...CARTERA.values()].map(c => ({ ...c, dias: diasHasta(c.fecha_limite) }));
    const porFecha = (a, b) => (a.dias ?? 9e9) - (b.dias ?? 9e9);
    const recientes = (a, b) => String(b.fecha_limite ?? '').localeCompare(String(a.fecha_limite ?? ''));
    const previas = todas.filter(c => c.estado === 'interesa' || c.estado === 'preparando');
    const porPresentar = previas.filter(sigueAbierto).sort(porFecha);
    const terminadas = previas.filter(c => !sigueAbierto(c)).sort(recientes);
    // Lo que ya tiene resultado, arriba: es lo que pide un clic.
    const esperando = todas.filter(c => c.estado === 'presentada')
      .sort((a, b) => (!!b.adjudicacion?.resultado - !!a.adjudicacion?.resultado) || recientes(a, b));
    const cerradas = todas.filter(c => !ACTIVOS.includes(c.estado))
      .sort((a, b) => String(b.cambiado).localeCompare(String(a.cambiado)));

    // El titular dice lo más urgente; el resto, la línea de debajo.
    titular.textContent = !todas.length ? 'Tu cartera está vacía'
      : porPresentar.length ? `Tienes ${plural(numero(porPresentar.length), 'contrato', 'contratos')} por presentar`
      : terminadas.length ? `${plural(numero(terminadas.length), 'contrato', 'contratos')} con el plazo terminado`
      : esperando.length ? `Esperas el resultado de ${plural(numero(esperando.length), 'oferta', 'ofertas')}`
      : 'Nada pendiente en tu cartera';

    if (!todas.length) {
      lista.innerHTML = `
        <div class="vacio-cartera">
          <p><strong>Aquí llevas los contratos a los que te presentas.</strong></p>
          <p>Pulsa <strong>Sí me interesa</strong> en un contrato, o ábrelo y
          elige <strong>Preparo la oferta</strong>. Lo verás aquí con su plazo
          y, cuando se adjudique, te diremos quién lo ha ganado.</p>
          <p>${perfil.avisos
            ? 'Te recordaremos cada plazo por correo 7, 3 y 1 día antes de que cierre.'
            : 'Si enciendes los avisos (la campana de arriba), te recordaremos cada plazo por correo 7, 3 y 1 día antes.'}</p>
          <button type="button" class="ver" data-ir-todo>Ver los contratos abiertos</button>
        </div>`;
      return;
    }

    // Lo que ha presentado y cómo le ha ido. El porcentaje, solo con tres
    // resueltas: con una o dos, "ganas el 50 %" no dice nada.
    const ganadas = todas.filter(c => c.estado === 'ganada').length;
    const perdidas = todas.filter(c => c.estado === 'perdida').length;
    const presentadas = ganadas + perdidas + esperando.length;
    const resumen = presentadas ? `<p class="resumen-cartera">Has presentado
      ${plural(presentadas, 'oferta', 'ofertas')}: ${[
        ganadas && plural(ganadas, 'ganada', 'ganadas'),
        perdidas && plural(perdidas, 'perdida', 'perdidas'),
        esperando.length && `${numero(esperando.length)} sin resolver`,
      ].filter(Boolean).join(', ')}.${ganadas + perdidas >= 3
        ? ` Has ganado el ${porcentaje(ganadas / (ganadas + perdidas))} de las resueltas.` : ''}</p>`
      : `<p class="resumen-cartera">${plural(numero(todas.length), 'contrato', 'contratos')} en tu cartera.</p>`;

    let i = 0;
    const grupo = (titulo, filas, explica) => filas.length ? `
      <section class="grupo-cartera">
        <h2>${titulo}<span class="cuantas">${numero(filas.length)}</span></h2>
        ${explica ? `<p class="explica-grupo">${explica}</p>` : ''}
        ${filas.map(c => filaCartera(c, i++)).join('')}
      </section>` : '';

    lista.innerHTML = resumen
      + grupo('Por presentar', porPresentar)
      + grupo('El plazo ha terminado', terminadas,
              'Dinos si presentaste oferta y seguimos el resultado por ti.')
      + grupo('Esperando resultado', esperando)
      + (cerradas.length ? `
        <details class="grupo-cartera cerradas" ${cerradasAbiertas ? 'open' : ''}>
          <summary><h2>Cerrados<span class="cuantas">${numero(cerradas.length)}</span></h2></summary>
          ${cerradas.map(c => filaCartera(c, i++)).join('')}
        </details>` : '');

    lista.querySelector('details.cerradas')?.addEventListener('toggle', ev => {
      cerradasAbiertas = ev.target.open;
    });
    lista.querySelectorAll('.fila[data-c]').forEach(f => {
      const alternar = () => {
        const abierta = document.getElementById('c' + f.dataset.c).classList.toggle('abierto');
        f.setAttribute('aria-expanded', String(abierta));
        if (abierta) ABIERTAS.add(f.dataset.id); else ABIERTAS.delete(f.dataset.id);
      };
      // Los botones de la fila los atiende la lista (`engancharLista`).
      f.onclick = ev => { if (!ev.target.closest('button, a')) alternar(); };
      f.onkeydown = ev => {
        if (ev.target !== f || (ev.key !== 'Enter' && ev.key !== ' ')) return;
        ev.preventDefault();
        alternar();
      };
    });
  }

  // ---------- Correcciones ----------

  // A las tres correcciones se regenera el criterio. Con una sola el
  // modelo no puede deducir nada; con tres ya hay patrón, y esperar más
  // solo retrasa la mejora. El coste de una regeneración es irrisorio.
  const CORRECCIONES_PARA_AJUSTAR = 3;

  async function corregir(id, interesa, motivo) {
    // Corregir cambia lo que se muestra, así que lo guardado deja de
    // describir la realidad.
    olvidar('analizables', 'contratos');
    const i = DATOS.findIndex(o => o.id_licitacion === id);
    const antes = i >= 0 ? DATOS[i] : null;
    if (i >= 0) {
      if (interesa) {
        // Confirmado: la fila se queda, pero ya no hay nada que
        // preguntar sobre ella.
        DATOS[i] = { ...DATOS[i], correccion: true };
      } else {
        // Descartado: desaparece al instante. El cliente no debe esperar
        // al servidor para dejar de ver lo que no le sirve.
        DATOS.splice(i, 1);
      }
    }
    repintar();

    // Vuelve a poner la fila donde estaba.
    const devolver = () => {
      if (!antes || !vigente()) return;
      const j = DATOS.findIndex(o => o.id_licitacion === id);
      if (j >= 0) DATOS[j] = antes;
      else DATOS.splice(Math.min(i, DATOS.length), 0, antes);
      repintar();
    };

    // Si no se guarda, se deshace y se dice.
    //
    // Antes el error se tragaba: la librería de Supabase no lanza, devuelve
    // `{ error }`, así que el `catch` no saltaba nunca. La fila desaparecía
    // como si todo hubiera ido bien, la corrección no llegaba a la base y
    // al recargar el contrato volvía a salir, sin que nada lo reintentara.
    // Y el cliente que se toma la molestia de corregir es justo el que más
    // se fija en si le hacemos caso.
    const tras = respuesta => {
      if (respuesta.error) {
        devolver();
        recado('No se ha podido guardar tu respuesta. Inténtalo de nuevo.');
        return;
      }
      if (correccionesHechas != null) { correccionesHechas++; pintarLlevas(); }
      if (vigente() && respuesta.data?.pendientes >= CORRECCIONES_PARA_AJUSTAR)
        ajustarFiltro();
    };

    if (interesa) {
      let respuesta;
      try {
        respuesta = await sb.rpc('corregir', {
          licitacion: id, le_interesa: true, por_que: motivo ?? null,
        });
      } catch (error) {
        respuesta = { error };
      }
      return tras(respuesta);
    }

    // Un descarte se puede deshacer: la fila se va al instante, pero no se
    // envía hasta que pasa el plazo del "Deshacer". Un toque en el botón
    // equivocado, en el móvil y con la lista moviéndose, ya no es un
    // contrato perdido. Si se cierra la pestaña antes, sale igual (ver
    // `enviarDescarte`, en pagehide).
    const { data: { session: ahora } } = await sb.auth.getSession();
    DESCARTES_PENDIENTES.set(id, {
      perfilId: perfil.id, motivo, token: ahora?.access_token,
      temporizador: setTimeout(async () => tras(await enviarDescarte(id)),
                               ESPERA_DESHACER),
    });
    recado('Contrato descartado', {
      texto: 'Deshacer',
      hacer: () => {
        const p = DESCARTES_PENDIENTES.get(id);
        if (!p) return;
        clearTimeout(p.temporizador);
        DESCARTES_PENDIENTES.delete(id);
        devolver();
      },
    }, ESPERA_DESHACER);
  }

  // `origen` es el botón que lo abrió: al cancelar, el foco vuelve a él y
  // no al principio de la página.
  // Por qué salió: el contrato de su historial que más se le parece
  // (veredictos.parecido, lo escribe el puntuador). No el motivo del juez,
  // que sin NIF habla de contratos «ganados» que no ganó. Sin historial
  // (criterio en prosa) no hay frase.
  function porQueSale(id) {
    const parecido = (DATOS.find(o => o.id_licitacion === id)?.parecido || '').trim();
    if (!parecido) return '';
    const corto = parecido.length > 110 ? parecido.slice(0, 107).trimEnd() + '…' : parecido;
    return `<p class="por-que-sale">Te lo enseñamos porque se parece a
      «${esc(corto)}», ${perfil.cif ? 'un contrato que ganaste'
        : 'un contrato de otra empresa parecido a lo que nos contaste de la tuya'}.</p>`;
  }

  function pedirMotivo(id, origen = null) {
    const velo = document.createElement('div');
    velo.className = 'velo';
    const sale = porQueSale(id);
    velo.innerHTML = `
      <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="titulo-motivo">
        <button type="button" class="cerrar-dialogo" id="cancelar-motivo"
                aria-label="Cancelar, no descartar">×</button>
        <h3 id="titulo-motivo">¿Por qué no te interesa?</h3>
        ${sale}
        <p>${sale ? 'Dinos qué no encaja: con' : 'Con'} una frase basta, y nos
        ayuda mucho más que el descarte solo. Puedes saltártelo.</p>
        <textarea id="por-que" aria-labelledby="titulo-motivo"
          placeholder="Por ejemplo: es demasiado grande para nosotros, o no trabajamos en esa zona"></textarea>
        <div class="botonera">
          <button class="enlace" id="saltar">Descartar sin explicar</button>
          <button class="principal" id="enviar">Enviar</button>
        </div>
      </div>`;
    document.body.appendChild(velo);
    const campo = velo.querySelector('#por-que');
    campo.focus();

    const quitar = () => { velo.remove(); origen?.isConnected && origen.focus(); };
    const cerrar = motivo => { velo.remove(); corregir(id, false, motivo); };
    velo.querySelector('#saltar').onclick = () => cerrar(null);
    velo.querySelector('#enviar').onclick = () => cerrar(campo.value.trim() || null);
    // Antes solo se salía tocando fuera, y en el móvil no se adivinaba.
    velo.querySelector('#cancelar-motivo').onclick = quitar;
    velo.onclick = ev => { if (ev.target === velo) quitar(); };
    atraparFoco(velo, quitar);
    campo.onkeydown = ev => {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) cerrar(campo.value.trim() || null);
    };
  }

  async function ajustarFiltro() {
    const aviso = document.createElement('div');
    aviso.className = 'velo';
    aviso.innerHTML = `
      <div class="dialogo" role="dialog" aria-modal="true" aria-live="polite"
           aria-labelledby="titulo-ajuste">
        <h3 id="titulo-ajuste">Estamos ajustando tu filtro</h3>
        <p>Con lo que nos has dicho. Después volveremos a revisar todos
        tus contratos con el filtro nuevo, así que tardará un momento.</p>
      </div>`;
    document.body.appendChild(aviso);

    try {
      const r = await llamar('ajustar');
      // Recribar con el criterio nuevo: si no, la corrección se quedaría
      // en el contrato que la provocó en lugar de propagarse.
      // Con la misma salida que el cribado inicial: si una vuelta no
      // clasifica nada, las siguientes tampoco lo harán.
      let vueltas = 0, sinAvance = 0;
      while (vueltas++ < 200) {
        const c = await llamar('cribar');
        if (c.terminado) break;
        if (c.esperando) continue;   // el puntuador rehace su lista
        sinAvance = c.hechas ? 0 : sinAvance + 1;
        if (sinAvance >= 2) break;
      }
      // Se dice QUÉ ha cambiado, no que algo ha cambiado. Es el momento
      // en que el cliente ve que sus respuestas han servido para algo, y
      // un mensaje genérico lo desperdicia.
      const cambios = Array.isArray(r.cambios) ? r.cambios : [];
      aviso.querySelector('.dialogo').innerHTML = `
        <h3>Tu filtro ha aprendido</h3>
        ${cambios.length ? `
          <div class="aprendido">
            <strong>A partir de ahora:</strong>
            <ul>${cambios.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          </div>` : `
          <p>${esc(r.resumen || 'Hemos ajustado tu filtro con tus correcciones.')}</p>`}
        <p style="font-size:.88rem">Hemos vuelto a revisar todos tus
        contratos con el filtro nuevo.</p>
        <div class="botonera"><button class="principal" id="ver">Ver la lista</button></div>`;
      aviso.querySelector('#ver').onclick = () => location.reload();
      aviso.querySelector('#ver').focus();
    } catch {
      // Las correcciones ya están guardadas: lo que ha fallado es rehacer
      // el filtro con ellas, y se vuelve a intentar en la siguiente.
      aviso.remove();
      recado('No hemos podido ajustar tu filtro ahora. Tus respuestas están guardadas y lo intentaremos de nuevo.');
    }
  }

  let temporizador;
  const repintar = () => {
    const lista = document.getElementById('lista');
    // Un "Deshacer" o un fallo de envío pueden llegar con otra pantalla
    // delante: no hay lista que repintar.
    if (!lista || !vigente()) return;
    lista.classList.add('cambiando');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      pintar();
      lista.classList.remove('cambiando');
    }, 160);
  };

  // ---------- Selector de provincias y comunidades ----------
  //
  // Se agrupan por comunidad porque un profesional que trabaja en
  // Cataluña quiere las cuatro provincias, no ir marcándolas de una en
  // una. Y las uniprovinciales aparecen a nivel raíz: repetir "Madrid"
  // como comunidad y como provincia solo confunde.
  //
  // Todo se calcula en `indexarZonas`, que se repite cuando llegan datos
  // nuevos: calculado una sola vez, las cifras del selector se quedaban
  // con las de la primera carga.
  let porComunidad, cuantasPor, comunidadDe, sinPrecisarPor, comunidades;

  // Contratos sin provincia precisa. No se esconden al filtrar.
  //
  // Las plataformas autonómicas no publican lugar de ejecución, y hay
  // órganos que contratan para toda su comunidad —un departamento de la
  // Generalitat, una consejería de la Junta—. Antes el filtro los tiraba:
  // con Barcelona elegida salían 4 contratos de unos 200 catalanes. Un
  // contrato de ámbito catalán sí le interesa a quien trabaja en
  // Barcelona, así que aparece con cualquiera de las provincias de su
  // comunidad, marcado como "provincia sin precisar".
  //
  // Y si no se sabe ni la comunidad, aparece siempre: es preferible uno
  // de más que perder uno.
  function indexarZonas() {
    porComunidad = {}; cuantasPor = {}; comunidadDe = {}; sinPrecisarPor = {};
    DATOS.forEach(o => {
      if (o.provincia) {
        (porComunidad[o.comunidad || 'Sin comunidad'] ??= new Set()).add(o.provincia);
        cuantasPor[o.provincia] = (cuantasPor[o.provincia] ?? 0) + 1;
        if (o.comunidad) comunidadDe[o.provincia] = o.comunidad;
      } else if (o.comunidad) {
        sinPrecisarPor[o.comunidad] = (sinPrecisarPor[o.comunidad] ?? 0) + 1;
      }
    });
    // Ordenadas por el nombre que SE VE: la uniprovincial se enseña con
    // el de su provincia (ver `visibles`), y ordenando por el de la
    // comunidad "Madrid" caía entre Cataluña y Comunidad Valenciana, y
    // "Murcia" la última.
    comunidades = Object.entries(porComunidad)
      .map(([nombre, provs]) => {
        const lista = [...provs].sort((a,b) => a.localeCompare(b,'es'));
        const uni = lista.length === 1 && sinTildes(nombre).includes(sinTildes(lista[0]));
        return { nombre, provs: lista, rotulo: uni ? lista[0] : nombre };
      })
      .sort((a,b) => a.rotulo.localeCompare(b.rotulo,'es'));
  }
  indexarZonas();

  function enZona(o) {
    if (elegidas.size === 0 || elegidas.has(o.provincia)) return true;
    if (o.provincia) return false;
    return !o.comunidad || [...elegidas].some(p => comunidadDe[p] === o.comunidad);
  }

  const campo = document.getElementById('campo-geo');
  const buscador = document.getElementById('buscador-geo');
  const desplegable = document.getElementById('desplegable');
  let destacada = -1;

  // Sin tildes: quien escribe "avila" o "coruna" quiere lo mismo que
  // quien escribe con acento.
  const plano = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const completa = c => c.provs.every(p => elegidas.has(p));

  function visibles() {
    const q = plano(buscador.value.trim());
    const lista = [];
    comunidades.forEach(c => {
      const coincide = !q || plano(c.nombre).includes(q);
      const hijas = c.provs.filter(p => coincide || plano(p).includes(q));
      if (!hijas.length) return;
      // Uniprovincial: comunidad y provincia son lo mismo, y repetirlo
      // solo confunde. Se compara por inclusión y no por igualdad: la
      // comunidad se llama "Comunidad de Madrid" o "Región de Murcia" y
      // la provincia "Madrid" o "Murcia", y con la igualdad salía
      // "Comunidad de Madrid · 1 provincias" con Madrid colgando debajo.
      if (c.provs.length === 1 && plano(c.nombre).includes(plano(c.provs[0]))) {
        lista.push({ tipo:'provincia', nivel:'raiz', clave:c.provs[0] });
        return;
      }
      lista.push({ tipo:'comunidad', nivel:'raiz', clave:c.nombre, dato:c });
      hijas.forEach(p => lista.push({ tipo:'provincia', nivel:'hija', clave:p }));
    });
    return lista;
  }

  function alternar(item) {
    if (item.tipo === 'comunidad') {
      const todas = completa(item.dato);
      item.dato.provs.forEach(p => todas ? elegidas.delete(p) : elegidas.add(p));
    } else {
      elegidas.has(item.clave) ? elegidas.delete(item.clave) : elegidas.add(item.clave);
    }
  }

  // Lo elegido, resumido en el propio campo. Las etiquetas de antes
  // partían el campo en varias líneas; ahora el detalle vive en el panel.
  function pintarEtiquetas() {
    const nombres = [...elegidas];
    // Una comunidad entera se nombra por la comunidad: "Cataluña" dice
    // más que "Barcelona y 3 más".
    const enteras = comunidades.filter(c => c.provs.length > 1 && completa(c));
    const sueltas = nombres.filter(p => !enteras.some(c => c.provs.includes(p)));
    const piezas = [...enteras.map(c => c.nombre), ...sueltas];
    const texto = !piezas.length ? 'Toda España'
      : piezas.length === 1 ? piezas[0]
      : piezas.length === 2 ? `${piezas[0]} y ${piezas[1]}`
      : `${piezas[0]} y ${piezas.length - 1} más`;
    document.getElementById('resumen-geo').textContent = texto;
    campo.title = piezas.length > 1 ? piezas.join(', ') : '';
    campo.classList.toggle('con-eleccion', elegidas.size > 0);
    document.getElementById('cuenta-geo').textContent = elegidas.size
      ? plural(elegidas.size, 'provincia elegida', 'provincias elegidas')
      : 'Toda España';
    document.getElementById('toda-espana').disabled = !elegidas.size;
  }

  function pintarOpciones() {
    const lista = visibles();
    if (!lista.length) {
      desplegable.innerHTML = '<p class="sinresultado">Ninguna coincidencia.</p>';
      return;
    }
    desplegable.innerHTML = lista.map((item, i) => {
      const esCom = item.tipo === 'comunidad';
      const marcada = esCom ? completa(item.dato) : elegidas.has(item.clave);
      // Las cifras cuentan también lo que el filtro enseñará sin
      // provincia precisa, para que cuadren con la lista.
      const n = esCom
        ? item.dato.provs.reduce((s,p) => s + (cuantasPor[p] ?? 0), 0)
          + (sinPrecisarPor[item.dato.nombre] ?? 0)
        : (cuantasPor[item.clave] ?? 0) + (sinPrecisarPor[comunidadDe[item.clave]] ?? 0);
      const cuantas = esCom ? item.dato.provs.length : 0;
      const extra = esCom
        ? `<span class="abarca">${cuantas} ${cuantas === 1 ? 'provincia' : 'provincias'}</span>` : '';
      return `<button type="button" role="option" data-i="${i}"
                class="opcion ${item.nivel === 'raiz' ? 'raiz' : 'hija'} ${i === destacada ? 'destacada' : ''}"
                aria-selected="${marcada}">
        <span class="casilla"></span>${esc(item.clave)} ${extra}
        <span class="cuantas">${n}</span></button>`;
    }).join('');

    desplegable.querySelectorAll('.opcion').forEach(b => b.onclick = () => {
      alternar(lista[+b.dataset.i]);
      // No se cierra ni se borra lo escrito: elegir varias es el caso
      // normal, y quien busca "castilla" quiere marcar varias de ellas.
      pintarEtiquetas(); pintarOpciones(); repintar();
    });
  }

  const panel = document.getElementById('panel-geo');
  // En el móvil, abrir el panel no saca el teclado: casi siempre se
  // elige tocando, y el teclado taparía media lista.
  const tactil = matchMedia('(hover:none),(pointer:coarse)').matches;

  const abrir = () => {
    if (!panel.hidden) return;
    panel.hidden = false;
    campo.setAttribute('aria-expanded', 'true');
    pintarOpciones();
    if (!tactil) buscador.focus();
  };
  const cerrar = (devolverFoco = false) => {
    if (panel.hidden) return;
    panel.hidden = true;
    campo.setAttribute('aria-expanded', 'false');
    buscador.value = '';
    destacada = -1;
    if (devolverFoco) campo.focus();
  };

  campo.onclick = () => panel.hidden ? abrir() : cerrar();
  campo.onkeydown = ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); abrir(); }
  };
  alPulsar('toda-espana', () => {
    elegidas.clear();
    pintarEtiquetas(); pintarOpciones(); repintar();
  });
  buscador.oninput = () => { destacada = -1; pintarOpciones(); };
  buscador.onkeydown = ev => {
    const lista = visibles();
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      destacada = ev.key === 'ArrowDown'
        ? Math.min(destacada + 1, lista.length - 1)
        : Math.max(destacada - 1, 0);
      pintarOpciones();
      desplegable.querySelector('.destacada')?.scrollIntoView({block:'nearest'});
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const item = destacada >= 0 ? lista[destacada] : (lista.length === 1 ? lista[0] : null);
      if (item) {
        alternar(item);
        pintarEtiquetas(); pintarOpciones(); repintar();
      }
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      cerrar(true);
    }
  };
  // Por la ruta del clic y no por `closest`: al marcar una opción la
  // lista se repinta, y cuando el clic llega aquí la opción ya no está en
  // la página. `closest` no encontraba el selector y cerraba el panel.
  document.addEventListener('click', ev => {
    if (!ev.composedPath().some(n => n.classList?.contains('selector'))) cerrar();
  }, dePantalla());
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !panel.hidden) cerrar(true);
  }, dePantalla());

  // ---------- Pestañas ----------
  // Los contadores ignoran los filtros: dicen cuánto hay en total en cada
  // una. Si mostraran el resultado filtrado, cambiar de pestaña sería un
  // salto a ciegas.
  // Sin número cuando no hay ninguna: un cero al lado de "Novedades"
  // ocupa sitio para decir que no hay nada que ver.
  function pintarContadores() {
    const nuevas = DATOS.filter(o => o.es_novedad).length;
    document.getElementById('c-hoy').textContent = nuevas ? numero(nuevas) : '';
    document.getElementById('c-todo').textContent = numero(DATOS.length);
    // Lo que tiene algo pendiente: por presentar o esperando resultado.
    // Lo cerrado (ganado, perdido, no me presento) no reclama nada.
    const vivas = [...CARTERA.values()].filter(c => ACTIVOS.includes(c.estado)).length;
    document.getElementById('c-cartera').textContent = vivas ? numero(vivas) : '';
  }
  pintarContadores();

  // Si ya ha salido de Novedades en esta visita, lo que vio deja de ser
  // novedad aunque llegue un refresco (ver `ponerDatos`).
  let yaVistas = false;

  function cambiarPestana(cual, volviendo = false) {
    // Al salir de novedades se marca la visita: lo que ha visto deja de
    // serlo. Si se marcara al entrar, recargar vaciaría la lista que
    // está mirando.
    if (pestana === 'hoy' && cual !== 'hoy') {
      marcarLaVisita();
      // Y se refleja aquí mismo. Antes solo se guardaba en la base, así
      // que el contador seguía diciendo 23 hasta recargar la página:
      // marcaba como pendiente algo que el cliente acababa de ver.
      DATOS.forEach(o => o.es_novedad = false);
      yaVistas = true;
      document.getElementById('c-hoy').textContent = '';
    }
    pestana = cual;
    // Cambiar de pestaña también es navegar: atrás debe devolver a la
    // anterior, no sacar de la web.
    if (!volviendo) irA('contratos', { pestana: cual });
    document.getElementById('p-hoy').setAttribute('aria-selected', cual === 'hoy');
    document.getElementById('p-todo').setAttribute('aria-selected', cual === 'todo');
    document.getElementById('p-cartera').setAttribute('aria-selected', cual === 'cartera');
    repintar();
  }
  alPulsar('p-hoy', () => cambiarPestana('hoy'));
  alPulsar('p-todo', () => cambiarPestana('todo'));
  alPulsar('p-cartera', () => cambiarPestana('cartera'));
  if (pestanaInicial !== 'todo') cambiarPestana(pestanaInicial, true);

  // La visita se marca por HABER ENTRADO, no solo por abrir la pestaña
  // de novedades.
  //
  // Antes solo se marcaba al salir de esa pestaña, así que quien no la
  // pulsara nunca dejaba el contador intacto: al recargar volvían a
  // aparecer las mismas de siempre, y "novedad" dejaba de significar
  // nada.
  //
  // Se espera unos segundos para no marcar como visto un arranque que se
  // cierra al instante, y no se toca el contador de esta sesión: lo que
  // está mirando sigue marcado hasta que vuelva.
  setTimeout(marcarLaVisita, 4000);

  // Y al cerrar, por si se va antes de esos segundos.
  window.addEventListener('beforeunload', marcarLaVisita, dePantalla());

  // Lo recordado, antes del primer pintado. Un valor que ya no existe en
  // el selector se descarta en vez de dejar una lista vacía sin motivo.
  const campoVeredicto = document.getElementById('f-veredicto');
  if ([...campoVeredicto.options].some(op => op.value === recordados.veredicto))
    campoVeredicto.value = recordados.veredicto;
  const campoViab = document.getElementById('f-viabilidad');
  if (VIABILIDAD_VISIBLE
      && [...campoViab.options].some(op => op.value === recordados.viabilidad))
    campoViab.value = recordados.viabilidad;
  const campoTamano = document.getElementById('f-tamano');
  if ([...campoTamano.options].some(op => op.value === recordados.tamano))
    campoTamano.value = recordados.tamano;
  try { document.getElementById('f-texto').value = sessionStorage.getItem(CLAVE_TEXTO) ?? ''; }
  catch { /* modo privado */ }
  alPulsar('quitar-filtros', quitarFiltros);

  pintarEtiquetas();
  ['f-veredicto','f-viabilidad','f-tamano','f-sector','f-texto'].forEach(id =>
    document.getElementById(id).addEventListener('input', repintar));
  pintar();

  promesaCartera.then(r => {
    if (!vigente()) return;
    if (r.error) {
      // Sin cartera en la base: la pestaña no aparece. Si se llegó a ella
      // (enlace del correo, atrás del navegador), a la lista de siempre.
      console.warn('Sin cartera:', r.error);
      if (pestana === 'cartera') cambiarPestana('todo', true);
      return;
    }
    ponerCartera(r.data);
  }, () => { if (vigente() && pestana === 'cartera') cambiarPestana('todo', true); });

  // Por detrás: la primera vez puede tardar unos segundos (los escribe el
  // modelo), y la lista no tiene por qué esperarlos.
  cargarSectores(perfil).then(sectores => {
    const campo = document.getElementById('f-sector');
    // Si ya se ha ido a otra pantalla o a otra empresa, no hay dónde pintar.
    if (!campo || !vigente() || perfil.id !== perfilActivoId || sectores.length < 2) return;
    SECTORES = sectores;
    // Se vacía antes de rellenar: así nunca salen repetidos.
    campo.querySelectorAll('option:not([value=""])').forEach(op => op.remove());
    campo.insertAdjacentHTML('beforeend', sectores.map((x, i) =>
      `<option value="${i}">${esc(x.nombre)}</option>`).join(''));
    // Por su id y no por su posición: si los sectores se rehacen, el
    // tercero puede ser otro. Si ya no existe, se queda en "todos".
    const suyo = sectores.findIndex(x => x.id && x.id === recordados.sector);
    if (suyo >= 0) campo.value = String(suyo);
    campo.hidden = false;
    pintar();
  });
}

arrancar();
</script>
</body>
</html>
