<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos públicos para tu negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#f3f5f7;
  --superficie:#ffffff;
  --texto:#172a3d;
  --tenue:#637386;
  --linea:#dbe2e8;
  --fuerte:#96a4b1;
  --si:#19745e;
  --no:#b65347;
  --urge:#bd6827;
  --alto:48px;
  --acento:#c78b35;
  --sombra:0 10px 28px rgba(24,42,61,.08);
}

*{box-sizing:border-box}

html{
  color-scheme:light;
  scroll-behavior:smooth;
}

body{
  min-width:320px;
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  z-index:100;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:var(--acento);
  pointer-events:none;
}

::selection{
  background:rgba(199,139,53,.24);
  color:var(--texto);
}

.envoltorio{
  width:calc(100% - 40px);
  max-width:680px;
  margin:0 auto;
  padding:64px 0 88px;
}

/* En las pantallas con cabecera de servicio el margen superior sobra:
   la barra ya separa lo suficiente. */
.envoltorio.ancho{padding-top:18px}

.ancho{
  max-width:1120px;
}

h1{
  margin:0 0 14px;
  color:var(--texto);
  font-size:clamp(1.85rem,4.5vw,2.7rem);
  font-weight:650;
  line-height:1.13;
  letter-spacing:-.045em;
}

h2{
  margin:0 0 12px;
  color:var(--texto);
  font-size:1.35rem;
  font-weight:650;
  line-height:1.25;
  letter-spacing:-.025em;
}

h3{
  color:var(--texto);
}

p{
  margin-top:0;
}

p.guia{
  max-width:54ch;
  margin:0 0 24px;
  color:var(--tenue);
  line-height:1.62;
}

.centro{
  padding:88px 0 64px;
  text-align:center;
}

.centro p.guia{
  margin-right:auto;
  margin-left:auto;
}

input[type=email],
input[type=text],
textarea{
  width:100%;
  min-height:var(--alto);
  padding:12px 14px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:1rem;
  line-height:1.4;
  box-shadow:0 1px 1px rgba(24,42,61,.03);
  transition:border-color .16s,box-shadow .16s,background-color .16s;
}

input::placeholder,
textarea::placeholder{
  color:#91a0ad;
  opacity:1;
}

input:focus,
textarea:focus{
  outline:0;
  border-color:var(--acento);
  box-shadow:0 0 0 3px rgba(199,139,53,.16);
}

textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.55;
}

label{
  display:block;
  margin:0 0 7px;
  color:var(--tenue);
  font-size:.78rem;
  font-weight:650;
  letter-spacing:.055em;
  text-transform:uppercase;
}

.campo{
  margin-bottom:20px;
  text-align:left;
}

button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:3px solid rgba(199,139,53,.3);
  outline-offset:2px;
}

.principal{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:12px 25px;
  border:1px solid var(--texto);
  border-radius:8px;
  background:var(--texto);
  color:#fff;
  font-size:1rem;
  font-weight:650;
  line-height:1.2;
  box-shadow:0 4px 10px rgba(23,42,61,.14);
  transition:background-color .16s,border-color .16s,box-shadow .16s,transform .16s;
}

.principal:hover{
  border-color:#0d1d2d;
  background:#0d1d2d;
  box-shadow:0 6px 15px rgba(23,42,61,.2);
  transform:translateY(-1px);
}

.principal:active{
  box-shadow:none;
  transform:translateY(0);
}

.principal:disabled{
  opacity:.45;
  cursor:default;
  box-shadow:none;
  transform:none;
}

.secundario{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:11px 21px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-weight:600;
  transition:background-color .16s,border-color .16s,color .16s;
}

.secundario:hover{
  border-color:var(--texto);
  background:#f8fafb;
}

.enlace{
  padding:6px;
  border:0;
  background:none;
  color:var(--tenue);
  font-size:.88rem;
  text-decoration:underline;
  text-decoration-color:transparent;
  text-underline-offset:3px;
  transition:color .16s,text-decoration-color .16s;
}

.enlace:hover{
  color:var(--texto);
  text-decoration-color:currentColor;
}

.aviso{
  margin:18px 0;
  padding:13px 15px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.92rem;
}

.aviso.mal{
  border-color:rgba(182,83,71,.42);
  background:#fff9f7;
  color:var(--no);
}

.aviso.bien{
  border-color:rgba(25,116,94,.38);
  background:#f5fbf8;
  color:var(--si);
}

/* Propuesta de sectores */

.propuesta{
  margin:24px 0;
}

.familia{
  display:flex;
  gap:14px;
  align-items:flex-start;
  margin-bottom:9px;
  padding:17px 18px;
  border:1px solid var(--linea);
  border-radius:10px;
  background:var(--superficie);
  text-align:left;
  box-shadow:0 1px 2px rgba(24,42,61,.025);
}

.familia input{
  width:17px;
  height:17px;
  flex:0 0 17px;
  margin-top:3px;
  accent-color:var(--si);
}

.familia .cuerpo{
  min-width:0;
  flex:1;
}

.familia .que{
  margin:0;
  color:var(--texto);
  font-size:.96rem;
  line-height:1.4;
}

.familia .aviso-corto{
  margin:5px 0 0;
  color:var(--no);
  font-size:.85rem;
}

.familia .volumen{
  flex:0 0 auto;
  color:var(--tenue);
  font-size:.84rem;
  white-space:nowrap;
}

/* Baraja de entrenamiento */

.avance{
  margin:24px 0 0;
}

.barra{
  height:5px;
  overflow:hidden;
  border-radius:99px;
  background:var(--linea);
}

.relleno{
  width:0;
  height:100%;
  border-radius:inherit;
  background:var(--acento);
  transition:width .3s ease;
}

.cuenta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:9px;
  color:var(--tenue);
  font-size:.84rem;
  font-variant-numeric:tabular-nums;
}

.baraja{
  position:relative;
  height:410px;
  margin-top:24px;
  touch-action:pan-y;
}

.carta{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:28px;
  border:1px solid #d7dfe6;
  border-radius:14px;
  background:var(--superficie);
  box-shadow:var(--sombra);
  user-select:none;
  -webkit-user-select:none;
  will-change:transform;
}

.carta.detras-1{
  z-index:2;
  transform:scale(.965) translateY(11px);
  opacity:.58;
  pointer-events:none;
}

.carta.detras-2{
  z-index:1;
  transform:scale(.93) translateY(22px);
  opacity:.3;
  pointer-events:none;
}

.carta.encima{
  z-index:3;
  cursor:grab;
}

.carta.arrastrando{
  cursor:grabbing;
}

.carta.volando{
  transition:transform .34s ease-out,opacity .34s ease-out;
}

.franja{
  position:relative;
  height:34px;
  margin:-4px 0 11px;
}

.sello{
  position:absolute;
  top:0;
  padding:5px 12px;
  border:2px solid;
  border-radius:6px;
  font-size:.78rem;
  font-weight:750;
  letter-spacing:.07em;
  line-height:1.1;
  opacity:0;
  pointer-events:none;
  transition:opacity .1s;
}

.sello.si{
  right:0;
  border-color:var(--si);
  background:#f2fbf7;
  color:var(--si);
}

.sello.no{
  left:0;
  border-color:var(--no);
  background:#fff7f5;
  color:var(--no);
}

.carta .titulo{
  max-width:55ch;
  margin:0 0 13px;
  color:var(--texto);
  font-size:1.12rem;
  font-weight:600;
  line-height:1.42;
}

.carta .datos{
  display:flex;
  flex-wrap:wrap;
  gap:6px 18px;
  margin:0;
  color:var(--tenue);
  font-size:.88rem;
}

.carta .ganador{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid var(--linea);
  color:var(--tenue);
  font-size:.88rem;
}

.carta .ganador strong{
  color:var(--texto);
  font-weight:650;
}

.botones{
  display:flex;
  gap:12px;
  margin-top:24px;
}

.botones button{
  flex:1;
  min-height:50px;
  padding:13px 14px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-size:1rem;
  font-weight:600;
  transition:background-color .16s,border-color .16s,color .16s;
}

.botones .si:hover{
  border-color:var(--si);
  background:#f1faf6;
  color:var(--si);
}

.botones .no:hover{
  border-color:var(--no);
  background:#fff6f3;
  color:var(--no);
}

.atajos{
  margin-top:13px;
  color:var(--tenue);
  font-size:.82rem;
  text-align:center;
}

kbd{
  padding:2px 6px;
  border:1px solid var(--linea);
  border-bottom-color:var(--fuerte);
  border-radius:5px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.78rem;
}

.gestos{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:30px 0 6px;
}

.gesto{
  flex:1;
  max-width:190px;
  padding:16px 13px;
  border:1px solid var(--linea);
  border-radius:10px;
  background:var(--superficie);
  box-shadow:0 1px 2px rgba(24,42,61,.025);
}

.gesto .flecha{
  display:block;
  margin-bottom:6px;
  font-size:1.55rem;
  line-height:1;
}

.gesto.no .flecha{
  color:var(--no);
}

.gesto.si .flecha{
  color:var(--si);
}

.gesto strong{
  display:block;
  color:var(--texto);
  font-size:.93rem;
  font-weight:650;
}

.gesto span{
  color:var(--tenue);
  font-size:.83rem;
}

/* Aplicación y resumen */

.cabecera-app{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  /* Ajustada: es una barra de servicio, no una portada. El espacio que
     ocupaba empujaba hacia abajo lo que el cliente viene a ver. */
  padding:14px 0 13px;
  border-bottom:1px solid var(--linea);
}

.cabecera-app h1{
  margin:0;
  font-size:1.25rem;
  letter-spacing:-.03em;
}

.cabecera-app .quien{
  max-width:42ch;
  overflow:hidden;
  color:var(--tenue);
  font-size:.86rem;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.marcador{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin:28px 0 0;
  overflow:hidden;
  border:1px solid var(--linea);
  border-radius:12px;
  background:var(--superficie);
  box-shadow:0 2px 7px rgba(24,42,61,.035);
  transition:opacity .18s;
}

.marcador > div{
  min-width:0;
  padding:17px 18px 18px;
}

.marcador > div + div{
  border-left:1px solid var(--linea);
}

.marcador span{
  display:block;
  color:var(--texto);
  font-size:1.75rem;
  font-weight:650;
  line-height:1.05;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.035em;
  transition:opacity .18s;
}

.marcador small{
  display:block;
  margin-top:7px;
  color:var(--tenue);
  font-size:.79rem;
  line-height:1.25;
}

.marcador.cambiando span{
  opacity:.25;
}

/* Filtros y pestañas */

.filtros{
  position:sticky;
  z-index:10;
  top:0;
  display:flex;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:10px;
  padding:18px 0 16px;
  border-bottom:1px solid var(--linea);
  background:rgba(243,245,247,.94);
  box-shadow:0 8px 18px rgba(24,42,61,.035);
  backdrop-filter:blur(12px);
}

select,
input[type=search]{
  min-width:0;
  height:var(--alto);
  flex:1 1 220px;
  padding:0 39px 0 13px;
  border:1px solid var(--linea);
  border-radius:8px;
  background-color:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:.92rem;
  line-height:1.2;
  box-shadow:0 1px 1px rgba(24,42,61,.03);
  transition:border-color .16s,box-shadow .16s;
}

select{
  appearance:none;
  background-image:
    linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
    linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:
    calc(100% - 18px) 20px,
    calc(100% - 13px) 20px;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}

input[type=search]{
  padding-right:13px;
}

input[type=search]:focus,
select:focus{
  outline:0;
  border-color:var(--acento);
  box-shadow:0 0 0 3px rgba(199,139,53,.16);
}

/* ---------- Panel de cuenta ---------- */
.panel{max-width:720px;padding:30px 0}
.bloque{
  border:1px solid var(--linea);border-radius:10px;padding:24px;
  background:var(--superficie);box-shadow:0 1px 2px rgba(24,42,61,.025);
}
.bloque + .bloque{margin-top:16px}
.bloque h3{margin:0 0 18px;font-size:1.02rem;font-weight:650}
.bloque dl{display:grid;grid-template-columns:180px 1fr;gap:12px 22px;margin:0}
.bloque dt{color:var(--tenue);font-size:.9rem}
.bloque dd{margin:0;font-size:.95rem}
.filtro-lista{margin:0;padding:0;list-style:none}
.filtro-lista li{
  padding:10px 0 10px 20px;position:relative;font-size:.95rem;line-height:1.5;
}
.filtro-lista li + li{border-top:1px solid var(--linea)}
.filtro-lista li::before{
  content:'';position:absolute;left:5px;top:19px;width:5px;height:5px;
  border-radius:50%;background:var(--acento);
}
.peligro{border-color:rgba(182,83,71,.3)}
.peligro h3{color:var(--no)}

/* ---------- Menú de cuenta ----------
   Un desplegable y no todo en la misma página: el panel crece con
   sectores, órganos y lo que venga de inteligencia, y un muro de datos
   se lee peor que una sección cada vez. */
.menu-envoltorio{position:relative}

/* Botón de cuenta con forma de botón. Como enlace subrayado pasaba
   desapercibido, y es la puerta a todo lo demás. */
.boton-cuenta{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;
  padding:0 13px;border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;
  box-shadow:0 1px 1px rgba(24,42,61,.03);
  transition:border-color .15s,background-color .15s;
}
.boton-cuenta:hover{border-color:var(--fuerte);background:#f8fafb}
.boton-cuenta[aria-expanded="true"]{border-color:var(--acento)}
.boton-cuenta .flechita{
  color:var(--tenue);font-size:.7rem;line-height:1;transition:transform .18s;
}
.boton-cuenta[aria-expanded="true"] .flechita{transform:rotate(180deg)}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:210px;
  background:var(--superficie);border:1px solid var(--fuerte);border-radius:9px;
  padding:5px;box-shadow:0 16px 35px rgba(24,42,61,.16);
}
.menu[hidden]{display:none !important}
.menu button{
  display:block;width:100%;min-height:38px;padding:0 12px;border:0;
  border-radius:6px;background:none;color:var(--texto);font:inherit;
  font-size:.92rem;text-align:left;cursor:pointer;transition:background-color .12s;
}
.menu button:hover{background:rgba(23,42,61,.06)}
.menu button[aria-current="true"]{font-weight:650}
.menu .separa{height:1px;margin:5px 8px;background:var(--linea)}
.menu .peligroso{color:var(--no)}

.seccion[hidden]{display:none !important}

/* ---------- Barras apiladas ----------
   Apiladas y no en paralelo: una barra que se llena al 100 % porque es
   la mayor no dice nada —no sabes si ese sector es la mitad del negocio
   o el 90 %—. Aquí la línea ES el total, así que cada segmento se lee
   como la parte que representa.

   Y dos líneas, contratos e importe, porque no coinciden: si un sector
   ocupa un tercio arriba y dos tercios abajo, ahí está el dinero. */

.reparto + .reparto{margin-top:28px}
.reparto > h4{
  margin:0 0 11px;font-size:.83rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
.apilada{
  display:flex;width:100%;height:34px;border-radius:7px;overflow:hidden;
  background:var(--linea);
}
.apilada .trozo{
  min-width:3px;border:0;padding:0;cursor:pointer;
  transition:opacity .15s,filter .15s;
}
.apilada .trozo:hover,
.apilada .trozo:focus-visible,
.apilada .trozo.activo{filter:brightness(1.12)}
.apilada:hover .trozo:not(:hover){opacity:.45}
.apilada .trozo + .trozo{border-left:1px solid var(--superficie)}

/* Lo que se muestra al pasar por encima o tocar. Reserva su altura para
   que la leyenda no dé un salto al aparecer. */
.detalle-trozo{
  display:flex;align-items:baseline;gap:10px;min-height:26px;
  margin-top:11px;font-size:.9rem;
}
.detalle-trozo .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
  transform:translateY(1px);
}
.detalle-trozo .cual{font-weight:600}
.detalle-trozo .cuanto{color:var(--tenue);font-variant-numeric:tabular-nums}
.detalle-trozo.callado{color:var(--tenue);font-size:.85rem}

.leyenda{
  display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--linea);
}
.leyenda button{
  display:flex;align-items:center;gap:8px;padding:2px 0;border:0;
  background:none;color:var(--texto);font:inherit;font-size:.87rem;
  cursor:pointer;text-align:left;
}
.leyenda .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
}
.leyenda .pct{
  color:var(--tenue);font-variant-numeric:tabular-nums;
}
.leyenda button:hover .cual{text-decoration:underline;text-underline-offset:3px}

.sin-datos{padding:34px 0;color:var(--tenue);text-align:center;font-size:.92rem}

@media(max-width:720px){
  .bloque{padding:19px}
  .bloque dl{grid-template-columns:1fr;gap:3px}
  .bloque dt{margin-top:9px}
  .apilada{height:30px}
  .leyenda{gap:8px 16px}
}


.pestanas{
  display:flex;
  gap:27px;
  margin-top:29px;
  overflow-x:auto;
  border-bottom:1px solid var(--linea);
  scrollbar-width:none;
}

.pestanas::-webkit-scrollbar{
  display:none;
}

.pestana{
  position:relative;
  flex:0 0 auto;
  padding:0 0 13px;
  border:0;
  background:none;
  color:var(--tenue);
  font:inherit;
  font-size:.96rem;
  font-weight:600;
  cursor:pointer;
  transition:color .16s;
}

.pestana:hover{
  color:var(--texto);
}

.pestana[aria-selected="true"]{
  color:var(--texto);
}

.pestana[aria-selected="true"]::after{
  content:'';
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:3px;
  border-radius:3px 3px 0 0;
  background:var(--acento);

<body>
<div class="envoltorio" id="raiz"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// La clave pública está pensada para ir aquí: no otorga nada por sí
// sola. Quien decide qué puede ver cada uno son las políticas de acceso
// de la base de datos.
const SUPABASE_URL = 'https://swgrbzqxagrqdyddmvfy.supabase.co';
const SUPABASE_ANON = 'sb_publishable_asxZq0hsC7OjJ7_F5hcefA_QngjLLQk';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const raiz = document.getElementById('raiz');

// Usuario cuya sesión ya se ha atendido. Evita reiniciar la pantalla
// cada vez que Supabase renueva el token.
let sesionActual = null;

// ---------- Historial del navegador ----------
//
// Sin esto, "atrás" saca al cliente de la web entera. En el móvil, donde
// deslizar hacia atrás es un gesto reflejo, eso rompe la confianza: se
// pierde lo que estaba mirando sin haber pedido salir.
//
// Cada pantalla y cada pestaña dejan una entrada en el historial, así que
// atrás devuelve al punto anterior en lugar de al buscador.

function irA(vista, datos = {}, reemplazar = false) {
  const estado = { vista, ...datos };
  if (reemplazar) history.replaceState(estado, '');
  else history.pushState(estado, '');
}

// Al pulsar atrás se recompone lo que corresponda. Sin estado guardado
// —primera carga, o alguien que llegó por un enlace— se decide como
// siempre, mirando en qué punto está su perfil.
window.addEventListener('popstate', async (ev) => {
  const estado = ev.state;
  if (!estado) return arrancar(true);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaEntrar();
  const { data: perfiles } = await sb.from('perfiles')
    .select('*').eq('usuario_id', session.user.id).limit(1);
  const perfil = perfiles?.[0];
  if (!perfil) return arrancar(true);

  if (estado.vista === 'panel')
    return pantallaPanel(perfil, session, true, estado.seccion ?? 'cuenta');
  return pantallaOportunidades(perfil, session, true, estado.pestana);
});

// Asigna un manejador solo si el elemento existe. Un botón que se queda
// sin pintar por un descuido tumbaba la pantalla entera: el error cortaba
// el JavaScript antes de llegar a la lista de contratos.
const alPulsar = (id, hacer) => {
  const el = document.getElementById(id);
  if (el) el.onclick = hacer;
  else console.warn(`Falta el elemento #${id}`);
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const euros = n => n == null ? null : new Intl.NumberFormat('es-ES',
  {style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const ZONA = 'Europe/Madrid';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Todas las fechas en hora peninsular, sea cual sea la del visitante: un
// plazo que vence a las 23:59 aparecería un día después para quien lo
// consulte desde otro huso, y alguien podría presentarse tarde.
const partes = iso => {
  const v = {};
  new Intl.DateTimeFormat('es-ES', {timeZone:ZONA, day:'numeric', month:'numeric',
    year:'numeric', hour:'2-digit', minute:'2-digit'})
    .formatToParts(new Date(iso)).forEach(p => v[p.type] = p.value);
  return v;
};
const diasHasta = iso => iso
  ? Math.floor((new Date(iso) - new Date()) / 86400000) : null;

async function llamar(accion, cuerpo = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sin_sesion');
  const r = await fetch(`${SUPABASE_URL}/functions/v1/alta`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${session.access_token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ accion, ...cuerpo }),
  });
  const datos = await r.json();
  if (!r.ok || datos.error) throw new Error(datos.error || 'error');
  return datos;
}

// ============================================================
// Enrutado: la pantalla depende del punto en que esté el perfil
// ============================================================

async function arrancar(volviendo = false) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaEntrar();
  sesionActual = session.user.id;

  const { data: perfiles } = await sb.from('perfiles')
    .select('*').eq('usuario_id', session.user.id).limit(1);
  const perfil = perfiles?.[0];

  if (!perfil) return pantallaCodigo(session);
  if (perfil.paso_alta === 'listo') return pantallaOportunidades(perfil, session, volviendo);
  if (perfil.paso_alta === 'cribando') return pantallaCribando(perfil, session);
  if (perfil.paso_alta === 'entrenando' && perfil.cpv_prefijos)
    return pantallaEntrenar(perfil, perfil.cpv_prefijos.split(','), session);
  // El CIF va primero: si la empresa tiene historial, no hace falta que
  // describa nada. Lo que ha ganado dice mejor a qué se presenta que
  // cualquier descripción.
  if (!perfil.descripcion) return pantallaEmpresa(perfil, session);
  return pantallaDescribir(perfil, session);
}

// Supabase renueva el token cada pocos minutos y eso dispara un evento
// SIGNED_IN. Reaccionar a él reiniciaba la pantalla en mitad del alta:
// alguien con veinte tarjetas deslizadas volvía al principio y perdía
// sus respuestas.
//
// Solo importa cuando la sesión aparece por primera vez o desaparece.
sb.auth.onAuthStateChange((evento, sesion) => {
  const usuario = sesion?.user?.id ?? null;

  if (evento === 'SIGNED_OUT') {
    sesionActual = null;
    arrancar();
    return;
  }
  // Una renovación de token trae el mismo usuario: no hay nada que
  // volver a decidir.
  if (usuario && usuario !== sesionActual) {
    sesionActual = usuario;
    arrancar();
  }
});

// ============================================================
// 1 · Entrar
// ============================================================

function pantallaEntrar() {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="centro">
      <h1>Los contratos públicos que te interesan, sin buscarlos</h1>
      <p class="guia">Te enviamos cada mañana solo las licitaciones que encajan
      con tu negocio. Nada de listas de mil contratos entre los que rebuscar.</p>
      <div class="campo" style="max-width:380px;margin:28px auto 0">
        <label for="correo">Tu correo</label>
        <input type="email" id="correo" placeholder="nombre@empresa.es" autocomplete="email">
      </div>
      <button class="principal" id="enviar">Entrar</button>
      <p class="guia" style="margin-top:16px;font-size:.88rem">
      Te mandamos un enlace para entrar. Sin contraseñas que recordar.</p>
      <div id="resultado"></div>
    </div>`;

  const boton = document.getElementById('enviar');
  const correo = document.getElementById('correo');
  correo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });

  boton.onclick = async () => {
    const email = correo.value.trim();
    if (!email.includes('@')) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese correo no parece válido.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Enviando...';
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: window.location.origin },
    });
    document.getElementById('resultado').innerHTML = error
      ? `<div class="aviso mal">No se ha podido enviar: ${esc(error.message)}</div>`
      : `<div class="aviso bien">Te hemos enviado un enlace a ${esc(email)}.
         Ábrelo desde este mismo dispositivo.</div>`;
    boton.disabled = false;
    boton.textContent = 'Entrar';
  };
}

function pantallaCodigo(session) {

  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });

async function pantallaEntrenar(perfil, prefijos, session, items) {
  if (!items) {
    raiz.innerHTML = `<div class="centro"><p class="guia">Preparando ejemplos...</p></div>`;
    try {
      items = (await llamar('material', { prefijos })).licitaciones;
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        No hemos podido cargar los ejemplos.</div></div>`;
      return;
    }
  }

  const respuestas = [];
  let i = 0;

  const intro = () => {
    raiz.className = 'envoltorio';
    raiz.innerHTML = `
      <div class="centro">
        <h1>¿Cuáles de estos contratos te interesan?</h1>
        <p class="guia">Son licitaciones reales de tu sector. Con tus respuestas
        construimos tu filtro: a partir de ahí solo verás lo que encaje.</p>
        <p class="guia">No hay respuestas correctas, solo las tuyas. Son
        ${items.length} y se tarda unos cinco minutos.</p>
        <div class="gestos">
          <div class="gesto no"><span class="flecha">←</span>
            <strong>Izquierda</strong><span>No me interesa</span></div>
          <div class="gesto si"><span class="flecha">→</span>
            <strong>Derecha</strong><span>Sí me interesa</span></div>
        </div>
        <p class="atajos">También valen las flechas del teclado o los botones.</p>
        <button class="principal" id="empezar" style="margin-top:18px">Empezar</button>
      </div>`;
    document.getElementById('empezar').onclick = pintar;
  };

  const tarjeta = (o, clase) => {
    const datos = [o.organo, euros(o.presupuesto)].filter(Boolean);
    return `<article class="carta ${clase}">
      <div class="franja">
        <div class="sello no">NO ME INTERESA</div>
        <div class="sello si">SÍ ME INTERESA</div>
      </div>
      <p class="titulo">${esc(o.titulo)}</p>
      <p class="datos">${datos.map(d => `<span>${esc(d)}</span>`).join('')}</p>
      ${o.adjudicatario ? `<p class="ganador">Lo ganó <strong>${esc(o.adjudicatario)}</strong>${
        o.importe_adjudicacion ? ` por ${euros(o.importe_adjudicacion)}` : ''}</p>` : ''}
    </article>`;
  };

  function pintar() {
    if (i >= items.length) return finalizar();

    const pila = [items[i+2], items[i+1], items[i]].filter(Boolean);
    const clases = pila.length === 3 ? ['detras-2','detras-1','encima']
                 : pila.length === 2 ? ['detras-1','encima'] : ['encima'];
    const si = respuestas.filter(r => r.interesa).length;

    raiz.className = 'envoltorio';
    raiz.innerHTML = `
      <div class="avance">
        <div class="barra"><div class="relleno" style="width:${i/items.length*100}%"></div></div>
        <div class="cuenta"><span>${i} de ${items.length}</span>
        <span>${respuestas.length ? `${si} sí · ${respuestas.length-si} no` : ''}</span></div>
      </div>
      <div class="baraja">${pila.map((o,n) => tarjeta(o, clases[n])).join('')}</div>
      <div class="botones">
        <button class="no" id="b-no">No me interesa</button>
        <button class="si" id="b-si">Sí me interesa</button>
      </div>
      <p class="atajos">Desliza la tarjeta, usa <kbd>←</kbd> <kbd>→</kbd> o pulsa los botones</p>`;

    document.getElementById('b-si').onclick = () => volar(true);
    document.getElementById('b-no').onclick = () => volar(false);
    arrastrable(raiz.querySelector('.carta.encima'));
  }

  const UMBRAL = 110;
  function arrastrable(carta) {
    if (!carta) return;
    let x0 = 0, dx = 0, activo = false;
    const empezar = ev => {
      activo = true; dx = 0;
      x0 = ev.touches ? ev.touches[0].clientX : ev.clientX;
      carta.classList.add('arrastrando');
    };
    const mover = ev => {
      if (!activo) return;
      dx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - x0;
      carta.style.transform = `translateX(${dx}px) rotate(${dx*0.05}deg)`;
      const fuerza = Math.min(Math.abs(dx)/UMBRAL, 1);
      carta.querySelector('.sello.si').style.opacity = dx > 0 ? fuerza : 0;
      carta.querySelector('.sello.no').style.opacity = dx < 0 ? fuerza : 0;
    };
    const soltar = () => {
      if (!activo) return;
      activo = false;
      carta.classList.remove('arrastrando');
      if (Math.abs(dx) >= UMBRAL) return volar(dx > 0);
      // Soltar a medias no decide nada: arrastrar sin querer sería el
      // peor fallo posible aquí.
      carta.classList.add('volando');
      carta.style.transform = '';
      carta.querySelectorAll('.sello').forEach(s => s.style.opacity = 0);
    };
    carta.addEventListener('mousedown', empezar);
    carta.addEventListener('touchstart', empezar, {passive:true});
    document.addEventListener('mousemove', mover);
    document.addEventListener('touchmove', mover, {passive:true});
    document.addEventListener('mouseup', soltar);
    document.addEventListener('touchend', soltar);
  }

  function volar(interesa) {
    const carta = raiz.querySelector('.carta.encima');
    if (carta) {
      carta.classList.add('volando');
      carta.style.transform = `translateX(${interesa?700:-700}px) rotate(${interesa?28:-28}deg)`;
      carta.style.opacity = '0';
    }
    const o = items[i];
    respuestas.push({
      id_licitacion: o.id_licitacion, titulo: o.titulo, organo: o.organo ?? '',
      cpvs: (o.cpvs || []).join(','), presupuesto: o.presupuesto ?? null, interesa,
    });
    i++;
    setTimeout(pintar, carta ? 200 : 0);
  }

  document.addEventListener('keydown', ev => {
    if (!raiz.querySelector('.carta.encima')) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); volar(true); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); volar(false); }
  });

  async function finalizar() {
    raiz.innerHTML = `<div class="centro">
      <h2>Construyendo tu filtro</h2>
      <p class="guia">Un momento...</p></div>`;
    try {
      await llamar('guardar', { respuestas });
      const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
      pantallaCribando(data?.[0] ?? perfil, session);
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        No hemos podido guardar tus respuestas. Recarga e inténtalo de nuevo.</div></div>`;
    }
  }

  intro();
}

async function pantallaCribando(perfil, session, lectura) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="centro">
      <h2>Estamos revisando los contratos abiertos</h2>
      ${lectura?.actividad ? `<p class="guia">Hemos entendido que te dedicas a
      <strong>${esc(lectura.actividad.toLowerCase())}</strong>. Estamos buscando
      contratos abiertos que encajen.</p>` : `
      <p class="guia">Aplicamos tu filtro a todas las licitaciones que siguen
      abiertas ahora mismo.</p>`}
      <p class="guia">Puede tardar unos minutos; no cierres esta página.</p>
      <div class="avance" style="max-width:340px;margin:30px auto 0">
        <div class="barra"><div class="relleno" id="relleno"></div></div>
        <div class="cuenta"><span id="progreso">Empezando...</span><span></span></div>
      </div>
    </div>`;

  // Se piden lotes seguidos hasta terminar. Cada llamada devuelve
  // cuánto queda, así que el progreso es real y no una animación.
  let total = 0;
  while (true) {
    let r;
    try {
      r = await llamar('cribar');
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        Se ha interrumpido. Recarga la página y continuará donde iba.</div></div>`;
      return;
    }
    total = total || r.total || 0;
    if (r.terminado) break;
    const hechas = total - r.quedan;
    document.getElementById('relleno').style.width = `${total ? hechas/total*100 : 0}%`;
    document.getElementById('progreso').textContent = `${hechas} de ${total} contratos`;
  }

  const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
  pantallaOportunidades(data?.[0] ?? perfil, session);
}

// Menú de cuenta. Vive en la cabecera de las dos pantallas —contratos y
// panel— para que llegar a cualquier sección sea un solo clic. Antes
// había que entrar al panel y buscar otro botón dentro, y algo que se
// usa a diario no puede estar a dos pasos.
const SECCIONES = {
  cuenta: 'Mi cuenta',
  filtro: 'Mi filtro',
  sectores: 'Mis sectores',
  organos: 'Mis organismos',
};

function menuCuenta(actual = null) {
  return `
    <div class="menu-envoltorio">
      <button class="boton-cuenta" id="abrir-menu" aria-haspopup="true"
              aria-expanded="false">Mi cuenta<span class="flechita">▾</span></button>
      <div class="menu" id="menu" role="menu" hidden>
        ${Object.keys(SECCIONES).map(k => `<button role="menuitem" data-ir="${k}"
          aria-current="${k === actual}">${SECCIONES[k]}</button>`).join('')}
        <div class="separa"></div>
        <button role="menuitem" class="peligroso" id="salir-menu">Salir</button>
      </div>
    </div>`;
}

function activarMenu(perfil, session) {
  const menu = document.getElementById('menu');
  const abrir = document.getElementById('abrir-menu');
  if (!menu || !abrir) return;

  const cerrar = () => {
    menu.hidden = true;
    abrir.setAttribute('aria-expanded', 'false');
  };
  abrir.onclick = ev => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.menu-envoltorio')) cerrar();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') cerrar();
  });

  menu.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    cerrar();
    pantallaPanel(perfil, session, false, b.dataset.ir);
  });
  alPulsar('salir-menu', () => sb.auth.signOut());
}


async function pantallaPanel(perfil, session, volviendo = false, seccion = 'cuenta') {
  if (!volviendo) irA('panel', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  const { data: p, error } = await sb.rpc('mi_panel');
  if (error || !p) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tu cuenta.</div></div>`;
    return;
  }

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const buscamos = p.que_buscamos ?? [];
  const sectores = p.sectores ?? [];
  const organos = p.organos ?? [];

  // Barras apiladas: la línea entera es el total, y cada segmento la
  // parte que representa. Una barra que se llena al 100 % por ser la
  // mayor no dice nada; ésta responde a "cuánto de mi negocio es esto".
  //
  // Los segmentos por debajo del 2 % se agrupan: por separado serían
  // hilos de dos píxeles imposibles de señalar, y su cifra sigue
  // apareciendo en la leyenda.
  const PALETA = ['#c78b35','#19745e','#3d6a8f','#8a5a7a','#6b7f3f',
                  '#b0653a','#4a7c8c','#8c7a4a'];
  const COLOR_OTROS = '#a8b4bf';

  function apilada(filas, campoNombre, campoValor, unidad) {
    const total = filas.reduce((s, f) => s + (Number(f[campoValor]) || 0), 0);
    if (!total) return '';

    const conValor = filas
      .map((f, i) => ({
        nombre: String(f[campoNombre] ?? '—'),
        valor: Number(f[campoValor]) || 0,
        color: PALETA[i % PALETA.length],
      }))
      .filter(x => x.valor > 0)
      .sort((a, b) => b.valor - a.valor);

    const grandes = conValor.filter(x => x.valor / total >= 0.02);
    const chicos = conValor.filter(x => x.valor / total < 0.02);
    const trozos = [...grandes];
    if (chicos.length) {
      trozos.push({
        nombre: chicos.length === 1 ? chicos[0].nombre
              : `Otros ${chicos.length} ${unidad === 'euros' ? '' : ''}`.trim(),
        valor: chicos.reduce((s, x) => s + x.valor, 0),
        color: COLOR_OTROS,
        agrupa: chicos,
      });
    }

    const comoTexto = v => unidad === 'euros' ? euros(v)
      : `${v} ${v === 1 ? 'contrato' : 'contratos'}`;
    const pct = v => {
      const p = v / total * 100;
      return p >= 10 ? `${Math.round(p)} %` : `${p.toFixed(1).replace('.', ',')} %`;
    };

    const id = 'r' + Math.random().toString(36).slice(2, 8);
    return `
      <div class="reparto" data-reparto="${id}">
        <h4>${unidad === 'euros' ? 'Por importe' : 'Por número de contratos'}</h4>
        <div class="apilada">
          ${trozos.map((t, i) => `<button class="trozo" data-i="${i}"
            style="width:${t.valor / total * 100}%;background:${t.color}"
            data-valor="${esc(comoTexto(t.valor))}"
            aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></button>`).join('')}
        </div>
        <div class="detalle-trozo callado" data-hueco>
          Pasa por encima o toca para ver el detalle
        </div>
        <div class="leyenda">
          ${trozos.map((t, i) => `<button data-i="${i}">
            <span class="punto" style="background:${t.color}"></span>
            <span class="cual">${esc(t.nombre)}</span>
            <span class="pct">${pct(t.valor)}</span>
          </button>`).join('')}
        </div>
      </div>`;
  }

  // Devuelve las dos barras de una misma dimensión.
  function reparto(filas, campoNombre) {
    if (!filas.length) return `<p class="sin-datos">Todavía no hay datos.</p>`;
    return apilada(filas, campoNombre, 'contratos', 'contratos')
         + apilada(filas, campoNombre, 'importe', 'euros');
  }

  const secciones = {
    cuenta: `
      <div class="bloque">
        <h3>Tu empresa</h3>
        <dl>
          <dt>Nombre</dt><dd>${esc(p.empresa ?? '—')}</dd>
          <dt>CIF</dt><dd>${esc(p.cif ?? '—')}</dd>
          <dt>Actividad</dt><dd>${esc(p.actividad ?? '—')}</dd>
          <dt>Correo</dt><dd>${esc(p.email ?? '—')}</dd>
          <dt>Cliente desde</dt><dd>${fecha(p.alta)}</dd>
        </dl>
      </div>
      <div class="bloque">
        <h3>Tu historial</h3>
        <dl>
          <dt>Contratos ganados</dt><dd>${p.contratos_ganados ?? 0}</dd>
          <dt>Importe adjudicado</dt><dd>${
            p.importe_ganado ? euros(Number(p.importe_ganado)) : '—'}</dd>
          <dt>Contratos abiertos que te mostramos</dt><dd>${p.oportunidades ?? 0}</dd>
        </dl>
      </div>`,

    filtro: `
      ${buscamos.length ? `
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        <ul class="filtro-lista">
          ${buscamos.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>` : ''}
      <div class="bloque">
        <h3>Cómo va aprendiendo</h3>
        <dl>
          <dt>Correcciones que has hecho</dt><dd>${p.correcciones?.total ?? 0}${
            p.correcciones?.sin_aplicar
              ? ` · ${p.correcciones.sin_aplicar} sin aplicar todavía` : ''}</dd>
          <dt>Última actualización</dt><dd>${fecha(p.criterio_fecha)}</dd>
        </dl>
        <p class="guia" style="margin:18px 0 0;font-size:.88rem">
        Marca en tu lista los contratos que no te interesan y ajustamos el
        filtro automáticamente.</p>
      </div>
      <div class="bloque peligro">
        <h3>Empezar de cero</h3>
        <p class="guia" style="margin:0 0 18px">Si tu negocio ha cambiado de
        rumbo —una línea nueva, o has dejado de hacer algo— es mejor rehacer
        el filtro que ir corrigiéndolo. Tarda un minuto y no se pierde nada:
        tu historial de contratos sigue ahí.</p>
        <button class="secundario" id="reiniciar">Rehacer mi filtro</button>
        <div id="resultado"></div>
      </div>`,

    sectores: `
      <div class="bloque">
        <h3>Dónde has ganado</h3>
        <p class="guia" style="margin:0 0 22px;font-size:.9rem">Tus contratos
        por sector, en número y en dinero. No siempre coinciden: el sector
        donde más ganas no tiene por qué ser el que más factura.</p>
        ${reparto(sectores, 'sector')}
      </div>`,

    organos: `
      <div class="bloque">
        <h3>A quién le vendes</h3>
        <p class="guia" style="margin:0 0 22px;font-size:.9rem">Los organismos
        que más contratos te han adjudicado.</p>
        ${reparto(organos, 'organo')}
      </div>`,
  };

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>${esc(SECCIONES[seccion] ?? 'Mi cuenta')}</strong>
        <div class="quien">${esc(p.empresa || p.email || '')}</div></div>
      <div style="display:flex;gap:12px;align-items:center">
        ${menuCuenta(seccion)}
        <button class="enlace" id="volver">Volver</button>
      </div>
    </div>
    <div class="panel">${secciones[seccion] ?? secciones.cuenta}</div>`;

  alPulsar('volver', () => history.back());
  activarMenu(perfil, session);

  // ---------- Detalle de cada segmento ----------
  //
  // Al pasar por encima o tocar, la línea de debajo dice qué es y cuánto
  // vale. En el móvil no hay cursor, así que el toque es la única forma
  // de leer un segmento estrecho.
  raiz.querySelectorAll('[data-reparto]').forEach(caja => {
    const hueco = caja.querySelector('[data-hueco]');
    const trozos = [...caja.querySelectorAll('.apilada .trozo')];
    const reposo = hueco.innerHTML;

    const mostrar = i => {
      const t = trozos[i];
      if (!t) return;
      const etiqueta = t.getAttribute('aria-label');
      const corte = etiqueta.lastIndexOf(': ');
      hueco.className = 'detalle-trozo';
      hueco.innerHTML = `
        <span class="punto" style="background:${t.style.background}"></span>
        <span class="cual">${esc(etiqueta.slice(0, corte))}</span>
        <span class="cuanto">${esc(etiqueta.slice(corte + 2))} · ${
          esc(t.dataset.valor ?? '')}</span>`;
      trozos.forEach((x, j) => x.classList.toggle('activo', j === +i));
    };
    const soltar = () => {
      hueco.className = 'detalle-trozo callado';
      hueco.innerHTML = reposo;
      trozos.forEach(x => x.classList.remove('activo'));
    };

    trozos.forEach(t => {
      t.onmouseenter = () => mostrar(t.dataset.i);
      t.onfocus = () => mostrar(t.dataset.i);
      // En táctil el clic es lo único que hay: se queda fijo hasta que
      // se toque otro.
      t.onclick = () => mostrar(t.dataset.i);
    });
    caja.querySelector('.apilada').onmouseleave = soltar;

    caja.querySelectorAll('.leyenda button').forEach(b => {
      b.onmouseenter = () => mostrar(b.dataset.i);
      b.onclick = () => mostrar(b.dataset.i);
    });
    caja.querySelector('.leyenda').onmouseleave = soltar;
  });

  // ---------- Rehacer el filtro ----------
  alPulsar('reiniciar', () => {
    const zona = document.getElementById('resultado');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? Se borrará tu filtro actual y volverás a
      empezar desde tu CIF.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no">Cancelar</button>
        <button class="principal" id="si">Sí, rehacerlo</button>
      </div></div>`;
    alPulsar('no', () => zona.innerHTML = '');
    alPulsar('si', async () => {
      zona.innerHTML = `<div class="aviso">Preparando...</div>`;
      try {
        await llamar('reiniciar');
        arrancar();
      } catch {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
      }
    });
  });
}

// ============================================================
// 7 · Sus oportunidades
// ============================================================

async function pantallaOportunidades(perfil, session, volviendo = false,
                                     pestanaInicial = 'todo') {
  if (!volviendo) irA('contratos', { pestana: 'todo' }, true);
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando tus contratos...</p></div>`;

  const { data, error } = await sb.from('mis_oportunidades')
    .select('*').eq('perfil_id', perfil.id);
  if (error) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tus contratos.</div></div>`;
    return;
  }

  const DATOS = (data ?? []).map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
    .sort((a,b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Tus contratos</strong>
        <div class="quien">${esc(perfil.email ?? '')}</div></div>
      ${menuCuenta()}
    </div>
    <h1 id="titular" style="margin-top:30px"></h1>
    <div class="marcador" id="marcador">
      <div><span id="m-total">—</span><small>abiertos</small></div>
      <div><span id="m-si">—</span><small>encaje claro</small></div>
      <div><span id="m-importe">—</span><small>en juego</small></div>
      <div><span id="m-urge">—</span><small>vencen esta semana</small></div>
    </div>
    <div class="pestanas" role="tablist">
      <button class="pestana" role="tab" id="p-hoy" aria-selected="false">
        Novedades<span class="cuantas" id="c-hoy"></span></button>
      <button class="pestana" role="tab" id="p-todo" aria-selected="true">
        Todos los abiertos<span class="cuantas" id="c-todo"></span></button>
    </div>
    <div class="filtros">
      <select id="f-veredicto">
        <option value="">Cualquier encaje</option>
        <option value="si">Para mí</option>
        <option value="quizas">Puede ser para mí</option>
      </select>
      <input type="search" id="f-texto" placeholder="Buscar por título u órgano">
      <div class="selector">
        <div class="campo-geo" id="campo-geo">
          <input type="text" id="buscador-geo" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="desplegable"
                 aria-label="Filtrar por provincia" placeholder="Toda España">
        </div>
        <div class="desplegable" id="desplegable" role="listbox"
             aria-multiselectable="true" hidden></div>
      </div>
    </div>
    <p class="explica">Cada vez que marcas un contrato como
    <strong>no me interesa</strong> o <strong>sí me interesa</strong>, tu
    filtro aprende. A las pocas correcciones lo ajustamos y vuelves a ver
    la lista con lo que de verdad te encaja.</p>
    <main id="lista"></main>`;

  activarMenu(perfil, session);

  const bloqueFecha = o => {
    if (o.dias == null) return `<div class="fecha sinplazo"><span class="dia">Sin plazo publicado</span></div>`;
    const p = partes(o.fecha_limite);
    const c = o.dias < 0 ? 'vencido' : o.dias === 0 ? 'vence hoy'
            : o.dias === 1 ? 'queda 1 día' : `quedan ${o.dias} días`;
    return `<div class="fecha ${o.dias <= 7 ? 'apura' : ''}">
      <span class="dia">${p.day} ${MESES[+p.month-1]}</span>
      <span class="cuenta-dias">${c}</span></div>`;
  };

  const fechaLarga = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const plazoLargo = s => {
    if (!s) return 'sin plazo publicado';
    const p = partes(s);
    return `${fechaLarga(s)}, a las ${p.hour}:${p.minute} (hora peninsular)`;
  };

  function marcador(lista) {
    const total = lista.reduce((s,o) => s + (o.presupuesto || 0), 0);
    const n = lista.length;
    document.getElementById('titular').textContent = n === 0
      ? 'Ahora mismo no hay contratos abiertos para ti'
      : `Hay ${n} ${n === 1 ? 'contrato abierto' : 'contratos abiertos'} para ti`;
    document.getElementById('m-total').textContent = n;
    document.getElementById('m-si').textContent = lista.filter(o => o.veredicto === 'si').length;
    document.getElementById('m-importe').textContent = new Intl.NumberFormat('es-ES',
      {notation:'compact',style:'currency',currency:'EUR',maximumFractionDigits:1}).format(total);
    document.getElementById('m-urge').textContent =
      lista.filter(o => o.dias != null && o.dias >= 0 && o.dias <= 7).length;
  }

  // Provincias elegidas. Vacío es "toda España", no "ninguna": es lo que
  // espera quien todavía no ha elegido nada.
  const elegidas = new Set();
  let pestana = pestanaInicial;

  function pintar() {
    const ver = document.getElementById('f-veredicto').value;
    const txt = document.getElementById('f-texto').value.toLowerCase().trim();
    const vistos = DATOS.filter(o =>
      (pestana === 'todo' || o.es_novedad) &&
      (elegidas.size === 0 || elegidas.has(o.provincia)) &&
      (!ver || o.veredicto === ver) &&
      (!txt || `${o.titulo} ${o.organo}`.toLowerCase().includes(txt)));

    marcador(vistos);
    document.getElementById('lista').innerHTML = vistos.length ? vistos.map((o,i) => `
      <div class="fila-envoltorio">
      <button class="fila" data-i="${i}">
        ${bloqueFecha(o)}
        <div><p class="t">${esc(o.titulo)}</p>
          <p class="meta">${esc([o.organo, o.provincia].filter(Boolean).join(' · '))}</p>
          ${o.dias_sin_verificar > 90
            ? `<span class="sin-verificar">Sin movimiento desde hace
               ${o.dias_sin_verificar} días · comprueba en el expediente</span>` : ''}
          ${o.correccion
            ? `<span class="confirmado">Confirmado como tuyo</span>`
            : `<span class="acciones">
                 <span class="accion si" data-si="${esc(o.id_licitacion)}">Sí me interesa</span>
                 <span class="accion no" data-no="${esc(o.id_licitacion)}">No me interesa</span>
               </span>`}
        </div>
        <div class="derecha"><div class="importe">${euros(o.presupuesto) ?? 'sin importe'}</div>
          <span class="marca ${o.veredicto}">${o.veredicto === 'si' ? 'para mí' : 'puede ser para mí'}</span></div>
      </button>
      <section class="detalle" id="d${i}">
        ${o.veredicto_motivo ? `<p class="cita">${esc(o.veredicto_motivo)}</p>` : ''}
        <dl>
          <dt>Órgano</dt><dd>${esc(o.organo ?? '—')}</dd>
          <dt>Provincia</dt><dd>${esc(o.provincia ?? 'no informada')}</dd>
          <dt>Presupuesto</dt><dd>${euros(o.presupuesto) ?? 'sin importe publicado'}</dd>
          <dt>Plazo</dt><dd>${plazoLargo(o.fecha_limite)}</dd>
          <dt>Códigos CPV</dt><dd>${esc((o.cpvs || []).join(', ')) || '—'}</dd>
          <dt>Último movimiento</dt><dd>${
            o.dias_sin_verificar === 0 ? 'hoy'
            : o.dias_sin_verificar === 1 ? 'ayer'
            : `hace ${o.dias_sin_verificar} días`}${
            o.dias_sin_verificar > 90
              ? ' — lleva mucho parado, conviene comprobarlo' : ''}</dd>
        </dl>
        ${o.enlace ? `<a class="ver" href="${esc(o.enlace)}" target="_blank" rel="noopener">Ver el expediente</a>` : ''}
      </section></div>`).join('')
      : `<p class="vacio">Ningún contrato encaja con estos filtros.</p>`;

    raiz.querySelectorAll('.fila').forEach(f => f.onclick = ev => {
      // Los botones de corrección viven dentro de la fila para que
      // aparezcan al pasar por encima. Hay que evitar que su clic
      // despliegue también el detalle.
      const accion = ev.target.closest('.accion');
      if (accion) {
        ev.stopPropagation();
        if (accion.dataset.si) corregir(accion.dataset.si, true);
        else pedirMotivo(accion.dataset.no);
        return;
      }
      document.getElementById('d' + f.dataset.i).classList.toggle('abierto');
    });
  }

  // ---------- Correcciones ----------

  // A las tres correcciones se regenera el criterio. Con una sola el
  // modelo no puede deducir nada; con tres ya hay patrón, y esperar más
  // solo retrasa la mejora. El coste de una regeneración es irrisorio.
  const CORRECCIONES_PARA_AJUSTAR = 3;

  async function corregir(id, interesa, motivo) {
    const i = DATOS.findIndex(o => o.id_licitacion === id);
    if (i >= 0) {
      if (interesa) {
        // Confirmado: la fila se queda, pero ya no hay nada que
        // preguntar sobre ella.
        DATOS[i].correccion = true;
      } else {
        // Descartado: desaparece al instante. El cliente no debe esperar
        // al servidor para dejar de ver lo que no le sirve.
        DATOS.splice(i, 1);
      }
    }
    repintar();

    try {
      const { data } = await sb.rpc('corregir', {
        licitacion: id, le_interesa: interesa, por_que: motivo ?? null,
      });
      if (data?.pendientes >= CORRECCIONES_PARA_AJUSTAR) ajustarFiltro();
    } catch { /* la corrección se reintentará al recargar */ }
  }

  function pedirMotivo(id) {
    const velo = document.createElement('div');
    velo.className = 'velo';
    velo.innerHTML = `
      <div class="dialogo">
        <h3>¿Por qué no te interesa?</h3>
        <p>Con una frase basta, y nos ayuda mucho más que el descarte solo.
        Puedes saltártelo.</p>
        <textarea id="por-que" placeholder="Por ejemplo: no trabajo con vestuario que no sea de cuerpos de seguridad"></textarea>
        <div class="botonera">
          <button class="enlace" id="saltar">Descartar sin explicar</button>
          <button class="principal" id="enviar">Enviar</button>
        </div>
      </div>`;
    document.body.appendChild(velo);
    const campo = velo.querySelector('#por-que');
    campo.focus();

    const cerrar = motivo => { velo.remove(); corregir(id, false, motivo); };
    velo.querySelector('#saltar').onclick = () => cerrar(null);
    velo.querySelector('#enviar').onclick = () => cerrar(campo.value.trim() || null);
    velo.onclick = ev => { if (ev.target === velo) velo.remove(); };
    campo.onkeydown = ev => {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) cerrar(campo.value.trim() || null);
      if (ev.key === 'Escape') velo.remove();
    };
  }

  async function ajustarFiltro() {
    const aviso = document.createElement('div');
    aviso.className = 'velo';
    aviso.innerHTML = `
      <div class="dialogo">
        <h3>Estamos ajustando tu filtro</h3>
        <p>Con tus últimas correcciones. Tardará un momento.</p>
      </div>`;
    document.body.appendChild(aviso);

    try {
      const r = await llamar('ajustar');
      // Recribar con el criterio nuevo: si no, la corrección se quedaría
      // en el contrato que la provocó en lugar de propagarse.
      let vueltas = 0;
      while (vueltas++ < 200) {
        const c = await llamar('cribar');
        if (c.terminado) break;
      }
      aviso.querySelector('.dialogo').innerHTML = `
        <h3>Listo</h3>
        <p>${esc(r.resumen || 'Hemos ajustado tu filtro con tus correcciones.')}</p>
        <div class="botonera"><button class="principal" id="ver">Ver la lista</button></div>`;
      aviso.querySelector('#ver').onclick = () => location.reload();
    } catch {
      aviso.remove();
    }
  }

  let temporizador;
  const repintar = () => {
    const lista = document.getElementById('lista');
    const marca = document.getElementById('marcador');
    lista.classList.add('cambiando');
    marca.classList.add('cambiando');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      pintar();
      lista.classList.remove('cambiando');
      marca.classList.remove('cambiando');
    }, 160);
  };

  // ---------- Selector de provincias y comunidades ----------
  //
  // Se agrupan por comunidad porque un profesional que trabaja en
  // Cataluña quiere las cuatro provincias, no ir marcándolas de una en
  // una. Y las uniprovinciales aparecen a nivel raíz: repetir "Madrid"
  // como comunidad y como provincia solo confunde.
  const porComunidad = {};
  DATOS.forEach(o => {
    if (!o.provincia) return;
    const c = o.comunidad || 'Sin comunidad';
    (porComunidad[c] ??= new Set()).add(o.provincia);
  });
  const cuantasPor = {};
  DATOS.forEach(o => { if (o.provincia) cuantasPor[o.provincia] = (cuantasPor[o.provincia] ?? 0) + 1; });

  const comunidades = Object.entries(porComunidad)
    .map(([nombre, provs]) => ({ nombre, provs: [...provs].sort((a,b) => a.localeCompare(b,'es')) }))
    .sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));

  const campo = document.getElementById('campo-geo');
  const buscador = document.getElementById('buscador-geo');
  const desplegable = document.getElementById('desplegable');
  let destacada = -1;

  // Sin tildes: quien escribe "avila" o "coruna" quiere lo mismo que
  // quien escribe con acento.
  const plano = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const completa = c => c.provs.every(p => elegidas.has(p));

  function visibles() {
    const q = plano(buscador.value.trim());
    const lista = [];
    comunidades.forEach(c => {
      const coincide = !q || plano(c.nombre).includes(q);
      const hijas = c.provs.filter(p => coincide || plano(p).includes(q));
      if (!hijas.length) return;
      // Uniprovincial: comunidad y provincia son lo mismo, y repetirlo
      // solo confunde.
      if (c.provs.length === 1 && plano(c.provs[0]) === plano(c.nombre)) {
        lista.push({ tipo:'provincia', nivel:'raiz', clave:c.provs[0] });
        return;
      }
      lista.push({ tipo:'comunidad', nivel:'raiz', clave:c.nombre, dato:c });
      hijas.forEach(p => lista.push({ tipo:'provincia', nivel:'hija', clave:p }));
    });
    return lista;
  }

  function alternar(item) {
    if (item.tipo === 'comunidad') {
      const todas = completa(item.dato);
      item.dato.provs.forEach(p => todas ? elegidas.delete(p) : elegidas.add(p));
    } else {
      elegidas.has(item.clave) ? elegidas.delete(item.clave) : elegidas.add(item.clave);
    }
  }

  function pintarEtiquetas() {
    // Van antes del campo de escritura, así el cursor queda a su derecha
    // y se ve que se puede seguir escribiendo.
    campo.querySelectorAll('.etiqueta').forEach(e => e.remove());
    [...elegidas].forEach(p => {
      const et = document.createElement('span');
      et.className = 'etiqueta';
      et.innerHTML = `${esc(p)}<button type="button" aria-label="Quitar ${esc(p)}">×</button>`;
      et.querySelector('button').onclick = ev => {
        ev.stopPropagation();
        elegidas.delete(p);
        pintarEtiquetas(); pintarOpciones(); repintar();
      };
      campo.insertBefore(et, buscador);
    });
    buscador.placeholder = elegidas.size ? '' : 'Toda España';
  }

  function pintarOpciones() {
    const lista = visibles();
    if (!lista.length) {
      desplegable.innerHTML = '<p class="sinresultado">Ninguna coincidencia.</p>';
      return;
    }
    desplegable.innerHTML = lista.map((item, i) => {
      const esCom = item.tipo === 'comunidad';
      const marcada = esCom ? completa(item.dato) : elegidas.has(item.clave);
      const n = esCom
        ? item.dato.provs.reduce((s,p) => s + (cuantasPor[p] ?? 0), 0)
        : (cuantasPor[item.clave] ?? 0);
      const extra = esCom
        ? `<span class="abarca">${item.dato.provs.length} provincias</span>` : '';
      return `<button type="button" role="option" data-i="${i}"
                class="opcion ${item.nivel === 'raiz' ? 'raiz' : 'hija'} ${i === destacada ? 'destacada' : ''}"
                aria-selected="${marcada}">
        <span class="casilla"></span>${esc(item.clave)} ${extra}
        <span class="cuantas">${n}</span></button>`;
    }).join('');

    desplegable.querySelectorAll('.opcion').forEach(b => b.onclick = () => {
      alternar(lista[+b.dataset.i]);
      // No se cierra: elegir varias es el caso normal.
      buscador.value = '';
      pintarEtiquetas(); pintarOpciones(); repintar();
      buscador.focus();
    });
  }

  const abrir = () => {
    desplegable.hidden = false;
    buscador.setAttribute('aria-expanded','true');
    pintarOpciones();
  };
  const cerrar = () => {
    desplegable.hidden = true;
    buscador.setAttribute('aria-expanded','false');
    destacada = -1;
  };

  campo.onclick = () => { buscador.focus(); abrir(); };
  buscador.onfocus = abrir;
  buscador.oninput = () => { destacada = -1; abrir(); };
  buscador.onkeydown = ev => {
    const lista = visibles();
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      if (desplegable.hidden) abrir();
      destacada = ev.key === 'ArrowDown'
        ? Math.min(destacada + 1, lista.length - 1)
        : Math.max(destacada - 1, 0);
      pintarOpciones();
      desplegable.querySelector('.destacada')?.scrollIntoView({block:'nearest'});
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const item = destacada >= 0 ? lista[destacada] : (lista.length === 1 ? lista[0] : null);
      if (item) {
        alternar(item);
        buscador.value = ''; destacada = -1;
        pintarEtiquetas(); pintarOpciones(); repintar();
      }
    } else if (ev.key === 'Backspace' && !buscador.value && elegidas.size) {
      elegidas.delete([...elegidas].pop());
      pintarEtiquetas(); pintarOpciones(); repintar();
    } else if (ev.key === 'Escape') {
      cerrar(); buscador.blur();
    }
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.selector')) cerrar();
  });

  // ---------- Pestañas ----------
  // Los contadores ignoran los filtros: dicen cuánto hay en total en cada
  // una. Si mostraran el resultado filtrado, cambiar de pestaña sería un
  // salto a ciegas.
  document.getElementById('c-hoy').textContent = DATOS.filter(o => o.es_novedad).length;
  document.getElementById('c-todo').textContent = DATOS.length;

  function cambiarPestana(cual, volviendo = false) {
    // Al salir de novedades se marca la visita: lo que ha visto deja de
    // serlo. Si se marcara al entrar, recargar vaciaría la lista que
    // está mirando.
    if (pestana === 'hoy' && cual !== 'hoy') sb.rpc('marcar_visita');
    pestana = cual;
    // Cambiar de pestaña también es navegar: atrás debe devolver a la
    // anterior, no sacar de la web.
    if (!volviendo) irA('contratos', { pestana: cual });
    document.getElementById('p-hoy').setAttribute('aria-selected', cual === 'hoy');
    document.getElementById('p-todo').setAttribute('aria-selected', cual === 'todo');
    repintar();
  }
  alPulsar('p-hoy', () => cambiarPestana('hoy'));
  alPulsar('p-todo', () => cambiarPestana('todo'));
  if (pestanaInicial !== 'todo') cambiarPestana(pestanaInicial, true);

  // Y al cerrar la pestaña del navegador, por el mismo motivo.
  window.addEventListener('beforeunload', () => {
    if (pestana === 'hoy') sb.rpc('marcar_visita');
  });

  pintarEtiquetas();
  ['f-veredicto','f-texto'].forEach(id =>
    document.getElementById(id).addEventListener('input', repintar));
  pintar();
}

arrancar();
</script>
</body>
</html>
