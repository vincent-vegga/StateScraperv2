<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos públicos para tu negocio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* El tema vive entero en estas variables, así que cambiarlo es
   reasignarlas. El resto de la hoja no sabe de colores concretos. */
:root{
  --fondo:#f3f5f7;
  --superficie:#ffffff;
  --texto:#172a3d;
  --tenue:#637386;
  --linea:#dbe2e8;
  --fuerte:#96a4b1;
  --si:#19745e;
  --no:#b65347;
  --urge:#bd6827;
  --alto:48px;
  --acento:#c78b35;
  --sombra:0 10px 28px rgba(24,42,61,.08);
  /* Papeles que cambian de valor entre temas y no se pueden derivar de
     los anteriores: el fondo al pasar por encima, la letra sobre el
     botón sólido, y los tintes suaves de aviso. */
  --hover:rgba(23,42,61,.045);
  --btn-fondo:#172a3d;
  --btn-fondo-hover:#0d1d2d;
  --btn-texto:#ffffff;
  --tinte-si:rgba(25,116,94,.07);
  --tinte-no:rgba(182,83,71,.07);
  --tinte-acento:rgba(199,139,53,.07);
  /* La barra de filtros se queda fija sobre la lista, así que necesita
     un fondo semiopaco del color de la página. Escrito a mano se
     quedaba blanco en oscuro. */
  --fondo-velado:rgba(243,245,247,.94);
  --sombra-corta:0 1px 1px rgba(24,42,61,.03);
  --sombra-baja:0 1px 2px rgba(24,42,61,.025);
  --sombra-pegajosa:0 8px 18px rgba(24,42,61,.035);
  --sombra-flotante:0 16px 35px rgba(24,42,61,.16);
  --sombra-boton:0 4px 10px rgba(23,42,61,.14);
  --sombra-boton-alta:0 6px 15px rgba(23,42,61,.2);
  --foco:0 0 0 3px rgba(23,42,61,.09);
}

/* Modo oscuro. Los mismos papeles con otros valores: fondo, superficie,
   texto, y los dos colores de veredicto ajustados para que mantengan
   contraste sobre oscuro. */
html[data-tema="oscuro"]{
  color-scheme:dark;
  --fondo:#15171a;
  --superficie:#1d2024;
  --texto:#e8eaed;
  --tenue:#9aa2ac;
  --linea:rgba(232,234,237,.12);
  --fuerte:rgba(232,234,237,.3);
  --si:#7fb89c;
  --no:#d98a7a;
  --urge:#d99a6a;
  --acento:#d6a458;
  --sombra:0 10px 28px rgba(0,0,0,.4);
  --hover:rgba(232,234,237,.06);
  --btn-fondo:#e8eaed;
  --btn-fondo-hover:#ffffff;
  --btn-texto:#15171a;
  --tinte-si:rgba(127,184,156,.1);
  --tinte-no:rgba(217,138,122,.1);
  --tinte-acento:rgba(214,164,88,.1);
  --fondo-velado:rgba(21,23,26,.94);
  /* En oscuro las sombras se ven poco y el relieve lo dan los bordes;
     se mantienen suaves para que no ensucien. */
  --sombra-corta:0 1px 1px rgba(0,0,0,.25);
  --sombra-baja:0 1px 2px rgba(0,0,0,.3);
  --sombra-pegajosa:0 8px 18px rgba(0,0,0,.35);
  --sombra-flotante:0 16px 35px rgba(0,0,0,.55);
  --sombra-boton:0 4px 10px rgba(0,0,0,.3);
  --sombra-boton-alta:0 6px 15px rgba(0,0,0,.4);
  --foco:0 0 0 3px rgba(232,234,237,.12);
}

*{box-sizing:border-box}

html{
  color-scheme:light;
  scroll-behavior:smooth;
}

body{
  min-width:320px;
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

::selection{
  background:rgba(45,95,138,.18);
  color:var(--texto);
}

.envoltorio{
  width:calc(100% - 40px);
  max-width:680px;
  margin:0 auto;
  padding:64px 0 88px;
}

/* En las pantallas con cabecera de servicio el margen superior sobra:
   la barra ya separa lo suficiente. */
.envoltorio.ancho{padding-top:18px}

.ancho{
  max-width:1120px;
}

h1{
  margin:0 0 14px;
  color:var(--texto);
  font-size:clamp(1.85rem,4.5vw,2.7rem);
  font-weight:650;
  line-height:1.13;
  letter-spacing:-.045em;
}

h2{
  margin:0 0 12px;
  color:var(--texto);
  font-size:1.35rem;
  font-weight:650;
  line-height:1.25;
  letter-spacing:-.025em;
}

h3{
  color:var(--texto);
}

p{
  margin-top:0;
}

p.guia{
  max-width:54ch;
  margin:0 0 24px;
  color:var(--tenue);
  line-height:1.62;
}

.centro{
  padding:88px 0 64px;
  text-align:center;
}

.centro p.guia{
  margin-right:auto;
  margin-left:auto;
}

input[type=email],
input[type=text],
textarea{
  width:100%;
  min-height:var(--alto);
  padding:12px 14px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:1rem;
  line-height:1.4;
  box-shadow:var(--sombra-corta);
  transition:border-color .16s,box-shadow .16s,background-color .16s;
}

input::placeholder,
textarea::placeholder{
  /* El mismo tono en los tres filtros. Antes cada campo usaba un gris
     distinto y la fila parecía desalineada sin motivo. */
  color:var(--tenue);
  opacity:1;
}

input:focus,
textarea:focus{
  outline:0;
  border-color:var(--fuerte);
  box-shadow:var(--foco);
}

textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.55;
}

label{
  display:block;
  margin:0 0 7px;
  color:var(--tenue);
  font-size:.78rem;
  font-weight:650;
  letter-spacing:.055em;
  text-transform:uppercase;
}

.campo{
  margin-bottom:20px;
  text-align:left;
}

button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--fuerte);
  outline-offset:2px;
}

.principal{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:12px 25px;
  border:1px solid var(--btn-fondo);
  border-radius:8px;
  background:var(--btn-fondo);
  color:var(--btn-texto);
  font-size:1rem;
  font-weight:650;
  line-height:1.2;
  box-shadow:var(--sombra-boton);
  transition:background-color .16s,border-color .16s,box-shadow .16s,transform .16s;
}

.principal:hover{
  border-color:var(--btn-fondo-hover);
  background:var(--btn-fondo-hover);
  box-shadow:var(--sombra-boton-alta);
  transform:translateY(-1px);
}

.principal:active{
  box-shadow:none;
  transform:translateY(0);
}

.principal:disabled{
  opacity:.45;
  cursor:default;
  box-shadow:none;
  transform:none;
}

.secundario{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:11px 21px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-weight:600;
  transition:background-color .16s,border-color .16s,color .16s;
}

.secundario:hover{
  border-color:var(--texto);
  background:var(--hover);
}

.enlace{
  padding:6px;
  border:0;
  background:none;
  color:var(--tenue);
  font-size:.88rem;
  text-decoration:underline;
  text-decoration-color:transparent;
  text-underline-offset:3px;
  transition:color .16s,text-decoration-color .16s;
}

.enlace:hover{
  color:var(--texto);
  text-decoration-color:currentColor;
}

.aviso{
  margin:18px 0;
  padding:13px 15px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.92rem;
}

.aviso.mal{
  border-color:rgba(182,83,71,.42);
  background:var(--tinte-no);
  color:var(--no);
}

.aviso.bien{
  border-color:rgba(25,116,94,.38);
  background:var(--tinte-si);
  color:var(--si);
}

/* Propuesta de sectores */

.propuesta{
  margin:24px 0;
}

.familia{
  display:flex;
  gap:14px;
  align-items:flex-start;
  margin-bottom:9px;
  padding:17px 18px;
  border:1px solid var(--linea);
  border-radius:10px;
  background:var(--superficie);
  text-align:left;
  box-shadow:var(--sombra-baja);
}

.familia input{
  width:17px;
  height:17px;
  flex:0 0 17px;
  margin-top:3px;
  accent-color:var(--si);
}

.familia .cuerpo{
  min-width:0;
  flex:1;
}

.familia .que{
  margin:0;
  color:var(--texto);
  font-size:.96rem;
  line-height:1.4;
}

.familia .aviso-corto{
  margin:5px 0 0;
  color:var(--no);
  font-size:.85rem;
}

.familia .volumen{
  flex:0 0 auto;
  color:var(--tenue);
  font-size:.84rem;
  white-space:nowrap;
}

/* Baraja de entrenamiento */

.avance{
  margin:24px 0 0;
}

.barra{
  height:5px;
  overflow:hidden;
  border-radius:99px;
  background:var(--linea);
}

.relleno{
  width:0;
  height:100%;
  border-radius:inherit;
  background:var(--acento);
  transition:width .3s ease;
}

.cuenta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:9px;
  color:var(--tenue);
  font-size:.84rem;
  font-variant-numeric:tabular-nums;
}

.baraja{
  position:relative;
  height:410px;
  margin-top:24px;
  touch-action:pan-y;
}

.carta{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:28px;
  border:1px solid var(--linea);
  border-radius:14px;
  background:var(--superficie);
  box-shadow:var(--sombra);
  user-select:none;
  -webkit-user-select:none;
  will-change:transform;
}

.carta.detras-1{
  z-index:2;
  transform:scale(.965) translateY(11px);
  opacity:.58;
  pointer-events:none;
}

.carta.detras-2{
  z-index:1;
  transform:scale(.93) translateY(22px);
  opacity:.3;
  pointer-events:none;
}

.carta.encima{
  z-index:3;
  cursor:grab;
}

.carta.arrastrando{
  cursor:grabbing;
}

.carta.volando{
  transition:transform .34s ease-out,opacity .34s ease-out;
}

.franja{
  position:relative;
  height:34px;
  margin:-4px 0 11px;
}

.sello{
  position:absolute;
  top:0;
  padding:5px 12px;
  border:2px solid;
  border-radius:6px;
  font-size:.78rem;
  font-weight:750;
  letter-spacing:.07em;
  line-height:1.1;
  opacity:0;
  pointer-events:none;
  transition:opacity .1s;
}

.sello.si{
  right:0;
  border-color:var(--si);
  background:var(--tinte-si);
  color:var(--si);
}

.sello.no{
  left:0;
  border-color:var(--no);
  background:var(--tinte-no);
  color:var(--no);
}

.carta .titulo{
  max-width:55ch;
  margin:0 0 13px;
  color:var(--texto);
  font-size:1.12rem;
  font-weight:600;
  line-height:1.42;
}

.carta .datos{
  display:flex;
  flex-wrap:wrap;
  gap:6px 18px;
  margin:0;
  color:var(--tenue);
  font-size:.88rem;
}

.carta .ganador{
  margin-top:auto;
  padding-top:16px;
  border-top:1px solid var(--linea);
  color:var(--tenue);
  font-size:.88rem;
}

.carta .ganador strong{
  color:var(--texto);
  font-weight:650;
}

.botones{
  display:flex;
  gap:12px;
  margin-top:24px;
}

.botones button{
  flex:1;
  min-height:50px;
  padding:13px 14px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-size:1rem;
  font-weight:600;
  transition:background-color .16s,border-color .16s,color .16s;
}

.botones .si:hover{
  border-color:var(--si);
  background:var(--tinte-si);
  color:var(--si);
}

.botones .no:hover{
  border-color:var(--no);
  background:var(--tinte-no);
  color:var(--no);
}

.atajos{
  margin-top:13px;
  color:var(--tenue);
  font-size:.82rem;
  text-align:center;
}

kbd{
  padding:2px 6px;
  border:1px solid var(--linea);
  border-bottom-color:var(--fuerte);
  border-radius:5px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.78rem;
}

.gestos{
  display:flex;
  gap:14px;
  justify-content:center;
  margin:30px 0 6px;
}

.gesto{
  flex:1;
  max-width:190px;
  padding:16px 13px;
  border:1px solid var(--linea);
  border-radius:10px;
  background:var(--superficie);
  box-shadow:var(--sombra-baja);
}

.gesto .flecha{
  display:block;
  margin-bottom:6px;
  font-size:1.55rem;
  line-height:1;
}

.gesto.no .flecha{
  color:var(--no);
}

.gesto.si .flecha{
  color:var(--si);
}

.gesto strong{
  display:block;
  color:var(--texto);
  font-size:.93rem;
  font-weight:650;
}

.gesto span{
  color:var(--tenue);
  font-size:.83rem;
}

/* Aplicación y resumen */

.cabecera-app{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  /* Ajustada: es una barra de servicio, no una portada. El espacio que
     ocupaba empujaba hacia abajo lo que el cliente viene a ver. */
  padding:14px 0 13px;
  border-bottom:1px solid var(--linea);
}

.cabecera-app h1{
  margin:0;
  font-size:1.25rem;
  letter-spacing:-.03em;
}

.cabecera-app .quien{
  max-width:42ch;
  overflow:hidden;
  color:var(--tenue);
  font-size:.86rem;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Lista sencilla de pares nombre-cifra. La usa la pantalla de
   confirmación para enseñar los sectores de la empresa encontrada. */
.listado{
  margin:24px 0;border:1px solid var(--linea);border-radius:10px;
  padding:4px 18px;background:var(--superficie);
}
.listado > div{
  display:flex;justify-content:space-between;gap:16px;padding:12px 0;
  font-size:.94rem;
}
.listado > div + div{border-top:1px solid var(--linea)}
.listado > div > span:last-child{
  color:var(--tenue);font-variant-numeric:tabular-nums;
}

/* Filtros y pestañas */

.filtros{
  position:sticky;
  z-index:10;
  top:0;
  display:flex;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:10px;
  padding:18px 0 16px;
  border-bottom:1px solid var(--linea);
  background:var(--fondo-velado);
  box-shadow:var(--sombra-pegajosa);
  backdrop-filter:blur(12px);
}

select,
input[type=search]{
  min-width:0;
  height:var(--alto);
  flex:1 1 220px;
  padding:0 39px 0 13px;
  border:1px solid var(--linea);
  border-radius:8px;
  background-color:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:.92rem;
  line-height:1.2;
  box-shadow:var(--sombra-corta);
  transition:border-color .16s,box-shadow .16s;
}

select{
  appearance:none;
  background-image:
    linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
    linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:
    calc(100% - 18px) 20px,
    calc(100% - 13px) 20px;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}

input[type=search]{
  padding-right:13px;
}

input[type=search]:focus,
select:focus{
  outline:0;
  border-color:var(--fuerte);
  box-shadow:var(--foco);
}

/* ---------- Panel de cuenta ---------- */
.panel{max-width:720px;padding:30px 0}
.bloque{
  border:1px solid var(--linea);border-radius:10px;padding:24px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.bloque + .bloque{margin-top:16px}
.bloque h3{margin:0 0 18px;font-size:1.02rem;font-weight:650}
.bloque dl{display:grid;grid-template-columns:180px 1fr;gap:12px 22px;margin:0}
.bloque dt{color:var(--tenue);font-size:.9rem}
.bloque dd{margin:0;font-size:.95rem}
.filtro-lista{margin:0;padding:0;list-style:none}
.filtro-lista li{
  padding:10px 0 10px 20px;position:relative;font-size:.95rem;line-height:1.5;
}
.filtro-lista li + li{border-top:1px solid var(--linea)}
.filtro-lista li::before{
  content:'';position:absolute;left:5px;top:19px;width:5px;height:5px;
  border-radius:50%;background:var(--fuerte);
}
.peligro{border-color:rgba(182,83,71,.3)}
.peligro h3{color:var(--no)}

/* ---------- Menú de cuenta ----------
   Un desplegable y no todo en la misma página: el panel crece con
   sectores, órganos y lo que venga de inteligencia, y un muro de datos
   se lee peor que una sección cada vez. */
.menu-envoltorio{position:relative}

/* ---------- Navegación principal ----------
   Contratos y Mercado son áreas pares, no una dentro de otra: qué me
   interesa presentar, y qué pasa en mi sector. Meterlas en el menú de
   cuenta escondería la segunda. Las pestañas de Novedades y Todos se
   quedan dentro de Contratos, que es donde pertenecen. */
.principales{display:flex;gap:20px;margin-top:6px}
.principales button{
  border:0;background:none;padding:0;cursor:pointer;font:inherit;
  font-size:.92rem;color:var(--tenue);transition:color .15s;
}
.principales button:hover{color:var(--texto)}
.principales button[aria-current="true"]{color:var(--texto);font-weight:650}

/* ---------- Mercado ----------
   La ficha SUSTITUYE a las listas en lugar de apilarse encima. Apilando,
   abrir una empresa empujaba las listas hacia abajo y la página saltaba
   bajo el cursor. Así solo hay dos estados: las listas, o una ficha. */

/* Se enseñan tres filas y el resto se despliega. Un bloque cerrado no
   dice qué hay dentro; con unas cuantas asomando se ve de qué va y si
   merece abrirlo. */
.seccion-mercado{
  border:1px solid var(--linea);border-radius:10px;background:var(--superficie);
  box-shadow:var(--sombra-baja);padding:20px;
}
.seccion-mercado + .seccion-mercado{margin-top:14px}
.seccion-mercado > h3{
  display:flex;align-items:baseline;gap:11px;margin:0 0 4px;
  font-size:1rem;font-weight:650;
}
.seccion-mercado > h3 .cuantas{
  margin-left:auto;color:var(--tenue);font-size:.86rem;font-weight:400;
}
.mas{
  display:block;width:100%;margin-top:4px;padding:11px 0;
  border:0;border-top:1px solid var(--linea);background:none;
  color:var(--tenue);font:inherit;font-size:.88rem;cursor:pointer;
  transition:color .15s;
}
.mas:hover{color:var(--texto)}
.oculta{display:none}

.volver-listas{
  display:inline-flex;align-items:center;gap:7px;
  border:0;background:none;padding:6px 0;color:var(--tenue);
  font:inherit;font-size:.9rem;cursor:pointer;transition:color .15s;
}
.volver-listas:hover{color:var(--texto)}

.vacio-seguimiento{
  padding:8px 0 4px;color:var(--tenue);font-size:.92rem;line-height:1.6;
}

/* ---------- Mercado ---------- */
.buscador-cif{display:flex;gap:9px;margin:26px 0 8px;flex-wrap:wrap}
.buscador-cif input{flex:1 1 220px;text-transform:uppercase;letter-spacing:.03em}

.tarjeta-empresa{
  border:1px solid var(--linea);border-radius:10px;padding:24px;
  background:var(--superficie);margin-top:20px;box-shadow:var(--sombra-baja);
}
.tarjeta-empresa .arriba{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
  flex-wrap:wrap;margin-bottom:20px;
}
.tarjeta-empresa h3{margin:0 0 5px;font-size:1.15rem;font-weight:650}
.tarjeta-empresa .cifras{
  display:flex;gap:26px;flex-wrap:wrap;margin:0;color:var(--tenue);
  font-size:.9rem;
}
.tarjeta-empresa .cifras strong{
  color:var(--texto);font-weight:650;font-variant-numeric:tabular-nums;
}

.seguir{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;
  padding:0 14px;border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,background-color .15s;
}
.seguir:hover{border-color:var(--fuerte);background:var(--hover)}
.seguir[aria-pressed="true"]{border-color:var(--texto);background:var(--texto);
  color:var(--btn-texto)}

.tabla{width:100%;border-collapse:collapse;margin-top:4px;font-size:.92rem}
.tabla th{
  text-align:left;padding:9px 12px 9px 0;color:var(--tenue);
  font-size:.79rem;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;border-bottom:1px solid var(--linea);
}
.tabla th.num, .tabla td.num{text-align:right;
  font-variant-numeric:tabular-nums;padding-right:0}
.tabla td{padding:12px 12px 12px 0;border-bottom:1px solid var(--linea)}
.tabla tr:last-child td{border-bottom:0}
.tabla tbody tr{cursor:pointer;transition:background-color .12s}
.tabla tbody tr:hover{background:var(--hover)}
.tabla .quien{font-weight:600}
.tabla .marca-sigo{color:var(--si);font-size:.78rem;margin-left:8px}

.ultimos-contratos > div{
  padding:13px 0;border-bottom:1px solid var(--linea);
}
.ultimos-contratos > div:last-child{border-bottom:0}
.ultimos-contratos .que{font-size:.94rem;line-height:1.42;margin:0 0 4px}
.ultimos-contratos .quien{color:var(--tenue);font-size:.86rem}

@media(max-width:720px){
  .tabla th:nth-child(2), .tabla td:nth-child(2){display:none}
}

/* Confirmación breve. Un icono sin etiqueta no dice qué ha pasado al
   pulsarlo, y el texto al pasar por encima no existe en el móvil. */
.recado{
  /* Arriba: es donde está la campana que lo provoca, así que el aviso
     aparece cerca de la acción en lugar de al otro extremo. */
  position:fixed;left:50%;top:18px;z-index:60;
  transform:translateX(-50%) translateY(-10px);
  padding:11px 18px;border-radius:99px;
  background:var(--btn-fondo);color:var(--btn-texto);
  font-size:.9rem;box-shadow:var(--sombra-flotante);
  opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;
}
.recado.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* Campana de avisos. Sin animación: una campana que vibra significa
   "hay algo nuevo", no "el aviso está encendido", y si vibrase siempre
   dejaría de decir nada. Encendido es el estado normal; apagado se
   marca tachándola. */
.campana{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;padding:0;
  border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);cursor:pointer;
  box-shadow:var(--sombra-corta);
  transition:border-color .15s,background-color .15s,color .15s;
}
.campana:hover{border-color:var(--fuerte);background:var(--hover)}
.campana svg{width:17px;height:17px;display:block}
.campana[aria-pressed="false"]{color:var(--tenue)}
.campana[aria-pressed="false"] .tachado{display:block}
.campana .tachado{display:none}

/* Botón de cuenta con forma de botón. Como enlace subrayado pasaba
   desapercibido, y es la puerta a todo lo demás. */
.boton-cuenta{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;
  padding:0 13px;border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;
  box-shadow:var(--sombra-corta);
  transition:border-color .15s,background-color .15s;
}
.boton-cuenta:hover{border-color:var(--fuerte);background:var(--hover)}
.boton-cuenta[aria-expanded="true"]{border-color:var(--fuerte);background:var(--hover)}
.boton-cuenta .flechita{
  color:var(--tenue);font-size:.7rem;line-height:1;transition:transform .18s;
}
.boton-cuenta[aria-expanded="true"] .flechita{transform:rotate(180deg)}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:210px;
  background:var(--superficie);border:1px solid var(--fuerte);border-radius:9px;
  padding:5px;box-shadow:var(--sombra-flotante);
}
.menu[hidden]{display:none !important}
.menu button{
  display:block;width:100%;min-height:38px;padding:0 12px;border:0;
  border-radius:6px;background:none;color:var(--texto);font:inherit;
  font-size:.92rem;text-align:left;cursor:pointer;transition:background-color .12s;
}
.menu button:hover{background:var(--hover)}
.menu button[aria-current="true"]{font-weight:650}
.menu .separa{height:1px;margin:5px 8px;background:var(--linea)}

/* Interruptor de tema. Dentro del menú y no en la barra: se toca una
   vez y no vuelve a tocarse. */
.menu .tema{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.palanca{
  position:relative;width:38px;height:21px;flex:0 0 38px;
  border-radius:99px;background:var(--linea);
  transition:background-color .2s;
}
.palanca::after{
  content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;
  border-radius:50%;background:var(--tenue);
  transition:transform .2s,background-color .2s;
}
.menu .tema[aria-pressed="true"] .palanca{background:var(--fuerte)}
.menu .tema[aria-pressed="true"] .palanca::after{
  transform:translateX(17px);background:var(--texto);
}
.menu .peligroso{color:var(--no)}

.seccion[hidden]{display:none !important}

/* ---------- Barras apiladas ----------
   Apiladas y no en paralelo: una barra que se llena al 100 % porque es
   la mayor no dice nada —no sabes si ese sector es la mitad del negocio
   o el 90 %—. Aquí la línea ES el total, así que cada segmento se lee
   como la parte que representa.

   Y dos líneas, contratos e importe, porque no coinciden: si un sector
   ocupa un tercio arriba y dos tercios abajo, ahí está el dinero. */

.reparto + .reparto{margin-top:28px}
.reparto > h4{
  margin:0 0 11px;font-size:.83rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
.apilada{
  display:flex;width:100%;height:34px;border-radius:7px;overflow:hidden;
  background:var(--linea);
}
.apilada .trozo{
  min-width:3px;border:0;padding:0;cursor:pointer;
  transition:opacity .15s,filter .15s;
}
.apilada .trozo:hover,
.apilada .trozo:focus-visible,
.apilada .trozo.activo{filter:brightness(1.12)}
.apilada:hover .trozo:not(:hover){opacity:.45}
.apilada .trozo + .trozo{border-left:1px solid var(--superficie)}

/* Lo que se muestra al pasar por encima o tocar. Reserva su altura para
   que la leyenda no dé un salto al aparecer. */
.detalle-trozo{
  display:flex;align-items:baseline;gap:10px;min-height:26px;
  margin-top:11px;font-size:.9rem;
}
.detalle-trozo .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
  transform:translateY(1px);
}
.detalle-trozo .cual{font-weight:600}
.detalle-trozo .cuanto{color:var(--tenue);font-variant-numeric:tabular-nums}
.detalle-trozo.callado{color:var(--tenue);font-size:.85rem}

.leyenda{
  display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--linea);
}
.leyenda button{
  display:flex;align-items:center;gap:8px;padding:2px 0;border:0;
  background:none;color:var(--texto);font:inherit;font-size:.87rem;
  cursor:pointer;text-align:left;
}
.leyenda .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
}
.leyenda .pct{
  color:var(--tenue);font-variant-numeric:tabular-nums;
}
.leyenda button:hover .cual{text-decoration:underline;text-underline-offset:3px}

.sin-datos{padding:34px 0;color:var(--tenue);text-align:center;font-size:.92rem}

@media(max-width:720px){
  .bloque{padding:19px}
  .bloque dl{grid-template-columns:1fr;gap:3px}
  .bloque dt{margin-top:9px}
  .apilada{height:30px}
  .leyenda{gap:8px 16px}
}


.pestanas{
  display:flex;
  gap:27px;
  margin-top:29px;
  overflow-x:auto;
  border-bottom:1px solid var(--linea);
  scrollbar-width:none;
}

.pestanas::-webkit-scrollbar{
  display:none;
}

.pestana{
  position:relative;
  flex:0 0 auto;
  padding:0 0 13px;
  border:0;
  background:none;
  color:var(--tenue);
  font:inherit;
  font-size:.96rem;
  font-weight:600;
  cursor:pointer;
  transition:color .16s;
}

.pestana:hover{
  color:var(--texto);
}

.pestana[aria-selected="true"]{
  color:var(--texto);
}

.pestana[aria-selected="true"]::after{
  content:'';
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:2px;
  border-radius:2px 2px 0 0;
  /* Del color del texto, no del acento: marca dónde estás sin reclamar
     atención. El acento se reserva para lo que sí la necesita. */
  background:var(--texto);
}

.pestana .cuantas{
  margin-left:6px;
  color:var(--tenue);
  font-size:.8rem;
  font-weight:500;
}

/* Acciones de cada contrato */

.acciones{
  display:flex;
  gap:8px;
  margin-top:11px;
  opacity:0;
  transition:opacity .15s;
}

.fila-envoltorio:hover .acciones,
.fila-envoltorio:focus-within .acciones{
  opacity:1;
}

@media(hover:none),(pointer:coarse){
  .acciones{
    opacity:1;
  }
}

.accion{
  min-height:29px;
  padding:4px 10px;
  border:1px solid var(--linea);
  border-radius:6px;
  background:var(--superficie);
  color:var(--tenue);
  font:inherit;
  font-size:.78rem;
  cursor:pointer;
  transition:color .15s,border-color .15s,background-color .15s;
}

.accion.si:hover{
  border-color:var(--si);
  background:var(--tinte-si);
  color:var(--si);
}

.accion.no:hover{
  border-color:var(--no);
  background:var(--tinte-no);
  color:var(--no);
}

.confirmado{
  display:inline-block;
  margin-top:10px;
  color:var(--si);
  font-size:.79rem;
  font-weight:600;
}

.sin-verificar{
  display:inline-block;
  margin-top:8px;
  color:var(--no);
  font-size:.78rem;
}

.explica{
  margin:21px 0 0;
  padding:15px 17px;
  border:1px solid var(--linea);
  border-radius:9px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.9rem;
  line-height:1.6;
}

.explica strong{
  color:var(--texto);
  font-weight:650;
}

.explica{position:relative;padding-right:44px}
/* Aparece al acercarse: presente cuando se busca, invisible mientras se
   lee. */
.explica .cerrar{
  position:absolute;top:8px;right:9px;
  width:26px;height:26px;padding:0;border:0;border-radius:6px;
  background:none;color:var(--tenue);font-size:1.05rem;line-height:1;
  cursor:pointer;opacity:0;transition:opacity .15s,background-color .15s;
}
.explica:hover .cerrar,
.explica:focus-within .cerrar{opacity:1}
.explica .cerrar:hover{background:var(--hover);color:var(--texto)}
@media(hover:none),(pointer:coarse){ .explica .cerrar{opacity:1} }

/* Selector geográfico */

.selector{
  position:relative;
  min-width:0;
  flex:1 1 260px;
  align-self:stretch;
}

.campo-geo{
  display:flex;
  min-height:var(--alto);
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  padding:6px 10px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  cursor:text;
  box-shadow:var(--sombra-corta);
  transition:border-color .16s,box-shadow .16s;
}

.campo-geo:focus-within{
  border-color:var(--fuerte);
  box-shadow:var(--foco);
}

.campo-geo input{
  min-width:130px;
  min-height:28px;
  flex:1 1 130px;
  padding:4px 0;
  border:0;
  border-radius:0;
  background:none;
  box-shadow:none;
  color:var(--texto);
  font:inherit;
  font-size:.92rem;
  outline:0;
}

.campo-geo input:focus{
  border:0;
  box-shadow:none;
}

.campo-geo input::placeholder{
  color:var(--tenue);
}

.etiqueta{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 5px 4px 11px;
  border:1px solid var(--fuerte);
  border-radius:99px;
  background:var(--hover);
  color:var(--texto);
  font-size:.81rem;
  font-weight:600;
  line-height:1.2;
}

.etiqueta button{
  padding:0 3px;
  border:0;
  background:none;
  color:var(--tenue);
  cursor:pointer;
  font-size:1rem;
  line-height:1;
  transition:color .15s;
}

.etiqueta button:hover{
  color:var(--texto);
}

.desplegable{
  position:absolute;
  z-index:30;
  top:calc(100% + 6px);
  right:0;
  left:0;
  max-height:290px;
  overflow-y:auto;
  padding:5px;
  border:1px solid var(--fuerte);
  border-radius:9px;
  background:var(--superficie);
  box-shadow:var(--sombra-flotante);
}

.desplegable[hidden]{
  display:none !important;
}

.opcion{
  display:flex;
  width:100%;
  min-height:38px;
  align-items:center;
  gap:11px;
  padding:0 9px;
  border:0;
  border-radius:6px;
  background:none;
  color:var(--texto);
  font:inherit;
  font-size:.91rem;
  text-align:left;
  cursor:pointer;
}

.opcion:hover,
.opcion.destacada{
  background:var(--hover);
}

.opcion.raiz{
  font-weight:650;
}

.opcion.hija{
  padding-left:25px;
  font-weight:400;
}

.casilla{
  position:relative;
  width:16px;
  height:16px;
  flex:0 0 16px;
  border:1px solid var(--fuerte);
  border-radius:4px;
  background:var(--superficie);
}

.opcion[aria-selected="true"] .casilla{
  border-color:var(--si);
  background:var(--si);
}

.opcion[aria-selected="true"] .casilla::after{
  content:'';
  position:absolute;
  top:1px;
  left:4px;
  width:4px;
  height:8px;
  border:solid var(--superficie);
  border-width:0 2px 2px 0;
  transform:rotate(43deg);
}

.opcion .cuantas{
  margin-left:auto;
  color:var(--tenue);
  font-size:.82rem;
}

.opcion .abarca{
  color:var(--tenue);
  font-size:.82rem;
  font-weight:400;
}

.sinresultado{
  padding:14px 10px;
  color:var(--tenue);
  font-size:.9rem;
}

#lista{
  transition:opacity .16s ease;
}

#lista.cambiando{
  opacity:0;
}

.fila{
  display:grid;
  width:100%;
  min-width:0;
  grid-template-columns:86px minmax(0,1fr) auto;
  gap:23px;
  align-items:start;
  padding:21px 12px;
  border:0;
  border-bottom:1px solid var(--linea);
  background:none;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  animation:entrar .3s ease both;
  transition:background-color .15s;
}

.fila:hover{
  background:var(--hover);
}

.fila:focus-visible{
  position:relative;
  z-index:1;
  outline:2px solid var(--fuerte);
  outline-offset:-3px;
}

.fila:hover .t{
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:3px;
}

@keyframes entrar{
  from{
    opacity:0;
    transform:translateY(6px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.fecha{
  /* Altura fija, no mínima: así todas las celdas miden lo mismo y la
     lista mantiene el ritmo aunque el texto cambie. */
  height:64px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:0 8px;
  border:1px solid var(--linea);
  border-top:3px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
}

.fecha .dia{
  display:block;
  color:var(--texto);
  font-size:1.22rem;
  font-weight:650;
  line-height:1.15;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;
  /* En una línea siempre. Con "9 sep" cabía y con "10 sep" se partía en
     dos, así que unas celdas quedaban más altas que otras y la lista
     perdía el ritmo. */
  white-space:nowrap;
}

.fecha .cuenta-dias{
  display:block;
  margin-top:5px;
  color:var(--tenue);
  font-size:.76rem;
  line-height:1.2;
  white-space:nowrap;
}

/* Sin color de alarma.
   Siempre hay algo venciendo, así que un aviso naranja permanente
   reclama una acción que no se puede tomar: el ojo aprende a
   ignorarlo y deja de servir. El texto ya dice "vence hoy"; basta con
   una línea superior más marcada y la cuenta en negrita para que la
   fila se encuentre al recorrer la lista. */
.fecha.apura{
  border-top-color:var(--texto);
}

.fecha.apura .cuenta-dias{
  color:var(--texto);
  font-weight:650;
}

.fecha.sinplazo{
  border-top-color:var(--linea);
  background:transparent;
}

.fecha.sinplazo .dia{
  color:var(--tenue);
  font-size:.86rem;
  font-weight:500;
  letter-spacing:0;
}

.t{
  max-width:64ch;
  margin:0 0 5px;
  color:var(--texto);
  font-size:1rem;
  font-weight:600;
  line-height:1.42;
}

.meta{
  margin:0;
  color:var(--tenue);
  font-size:.87rem;
  line-height:1.45;
}

.derecha{
  min-width:116px;
  text-align:right;
  white-space:nowrap;
}

.importe{
  color:var(--texto);
  font-weight:650;
  font-variant-numeric:tabular-nums;
}

.marca{
  display:block;
  margin-top:5px;
  color:var(--tenue);
  font-size:.77rem;
  line-height:1.25;
}

.marca.si{
  color:var(--si);
  font-weight:600;
}

.detalle{
  display:none;
  padding:3px 12px 28px 102px;
  border-bottom:1px solid var(--linea);
  background:var(--hover);
}

.detalle.abierto{
  display:block;
}

.detalle dl{
  display:grid;
  grid-template-columns:155px minmax(0,1fr);
  gap:10px 22px;
  margin:0 0 21px;
}

.detalle dt{
  color:var(--tenue);
  font-size:.86rem;
}

.detalle dd{
  min-width:0;
  margin:0;
  color:var(--texto);
  font-size:.93rem;
}

.cita{
  max-width:66ch;
  margin:0 0 21px;
  padding:12px 16px;
  border-left:3px solid var(--fuerte);
  background:var(--tinte-acento);
  color:var(--tenue);
  font-size:.92rem;
}

.ver{
  display:inline-flex;
  min-height:40px;
  align-items:center;
  padding:8px 17px;
  border:1px solid var(--fuerte);
  border-radius:7px;
  color:var(--texto);
  font-size:.9rem;
  font-weight:600;
  text-decoration:none;
  transition:border-color .15s,background-color .15s;
}

.ver:hover{
  border-color:var(--texto);
  background:var(--hover);
}

.vacio{
  padding:72px 0;
  color:var(--tenue);
  text-align:center;
}

/* Modal */

.velo{
  position:fixed;
  z-index:50;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(18,35,50,.58);
  backdrop-filter:blur(3px);
}

.dialogo{
  width:100%;
  max-width:480px;
  padding:28px;
  border:1px solid var(--fuerte);
  border-radius:14px;
  background:var(--superficie);
  box-shadow:var(--sombra-flotante);
}

.dialogo h3{
  margin:0 0 10px;
  font-size:1.14rem;
  font-weight:650;
  line-height:1.3;
}

.dialogo p{
  margin:0 0 17px;
  color:var(--tenue);
  font-size:.9rem;
}

.dialogo textarea{
  min-height:92px;
  background:var(--fondo);
  font-size:.92rem;
}

.dialogo .botonera{
  display:flex;
  gap:10px;
  justify-content:flex-end;

</head>
<body>
<div class="envoltorio" id="raiz"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// La clave pública está pensada para ir aquí: no otorga nada por sí
// sola. Quien decide qué puede ver cada uno son las políticas de acceso
// de la base de datos.
const SUPABASE_URL = 'https://swgrbzqxagrqdyddmvfy.supabase.co';
const SUPABASE_ANON = 'sb_publishable_asxZq0hsC7OjJ7_F5hcefA_QngjLLQk';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const raiz = document.getElementById('raiz');

// Usuario cuya sesión ya se ha atendido. Evita reiniciar la pantalla
// cada vez que Supabase renueva el token.
let sesionActual = null;

// ---------- Tema ----------
//
// Todo el color de la hoja sale de las variables de :root, así que
// cambiar de tema es reasignarlas: basta con un atributo en <html>.
//
// Se recuerda entre sesiones. Sin elección guardada se respeta lo que
// tenga configurado el sistema, que es lo que espera quien ya lo ha
// decidido en su equipo.
const temaActual = () => document.documentElement.dataset.tema || 'claro';

function ponerTema(cual) {
  document.documentElement.dataset.tema = cual;
  try { localStorage.setItem('tema', cual); } catch { /* modo privado */ }
}

(function temaInicial() {
  let guardado = null;
  try { guardado = localStorage.getItem('tema'); } catch { /* modo privado */ }
  // Claro por defecto, sin mirar la preferencia del sistema: es el tema
  // en el que está pensado el producto, y quien prefiera el oscuro lo
  // encuentra en su menú.
  document.documentElement.dataset.tema = guardado || 'claro';
})();

// ---------- Historial del navegador ----------
//
// Sin esto, "atrás" saca al cliente de la web entera. En el móvil, donde
// deslizar hacia atrás es un gesto reflejo, eso rompe la confianza: se
// pierde lo que estaba mirando sin haber pedido salir.
//
// Cada pantalla y cada pestaña dejan una entrada en el historial, así que
// atrás devuelve al punto anterior en lugar de al buscador.

function irA(vista, datos = {}, reemplazar = false) {
  const estado = { vista, ...datos };
  if (reemplazar) history.replaceState(estado, '');
  else history.pushState(estado, '');
}

// Al pulsar atrás se recompone lo que corresponda. Sin estado guardado
// —primera carga, o alguien que llegó por un enlace— se decide como
// siempre, mirando en qué punto está su perfil.
window.addEventListener('popstate', async (ev) => {
  const estado = ev.state;
  if (!estado) return arrancar(true);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaEntrar();
  const { data: perfiles } = await sb.from('perfiles')
    .select('*').eq('usuario_id', session.user.id).limit(1);
  const perfil = perfiles?.[0];
  if (!perfil) return arrancar(true);

  if (estado.vista === 'mercado') return pantallaMercado(perfil, session, true);
  if (estado.vista === 'panel')
    return pantallaPanel(perfil, session, true, estado.seccion ?? 'cuenta');
  return pantallaOportunidades(perfil, session, true, estado.pestana);
});

// Asigna un manejador solo si el elemento existe. Un botón que se queda
// sin pintar por un descuido tumbaba la pantalla entera: el error cortaba
// el JavaScript antes de llegar a la lista de contratos.
const alPulsar = (id, hacer) => {
  const el = document.getElementById(id);
  if (el) el.onclick = hacer;
  else console.warn(`Falta el elemento #${id}`);
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const euros = n => n == null ? null : new Intl.NumberFormat('es-ES',
  {style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
const ZONA = 'Europe/Madrid';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Todas las fechas en hora peninsular, sea cual sea la del visitante: un
// plazo que vence a las 23:59 aparecería un día después para quien lo
// consulte desde otro huso, y alguien podría presentarse tarde.
const partes = iso => {
  const v = {};
  new Intl.DateTimeFormat('es-ES', {timeZone:ZONA, day:'numeric', month:'numeric',
    year:'numeric', hour:'2-digit', minute:'2-digit'})
    .formatToParts(new Date(iso)).forEach(p => v[p.type] = p.value);
  return v;
};
const diasHasta = iso => iso
  ? Math.floor((new Date(iso) - new Date()) / 86400000) : null;

async function llamar(accion, cuerpo = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sin_sesion');
  const r = await fetch(`${SUPABASE_URL}/functions/v1/alta`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${session.access_token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ accion, ...cuerpo }),
  });
  const datos = await r.json();
  if (!r.ok || datos.error) throw new Error(datos.error || 'error');
  return datos;
}

// ============================================================
// Enrutado: la pantalla depende del punto en que esté el perfil
// ============================================================

async function arrancar(volviendo = false) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaEntrar();
  sesionActual = session.user.id;

  const { data: perfiles } = await sb.from('perfiles')
    .select('*').eq('usuario_id', session.user.id).limit(1);
  const perfil = perfiles?.[0];

  if (!perfil) return pantallaCodigo(session);
  if (perfil.paso_alta === 'listo') return pantallaOportunidades(perfil, session, volviendo);
  if (perfil.paso_alta === 'cribando') return pantallaCribando(perfil, session);
  if (perfil.paso_alta === 'entrenando' && perfil.cpv_prefijos)
    return pantallaEntrenar(perfil, perfil.cpv_prefijos.split(','), session);
  // El CIF va primero: si la empresa tiene historial, no hace falta que
  // describa nada. Lo que ha ganado dice mejor a qué se presenta que
  // cualquier descripción.
  if (!perfil.descripcion) return pantallaEmpresa(perfil, session);
  return pantallaDescribir(perfil, session);
}

// Supabase renueva el token cada pocos minutos y eso dispara un evento
// SIGNED_IN. Reaccionar a él reiniciaba la pantalla en mitad del alta:
// alguien con veinte tarjetas deslizadas volvía al principio y perdía
// sus respuestas.
//
// Solo importa cuando la sesión aparece por primera vez o desaparece.
sb.auth.onAuthStateChange((evento, sesion) => {
  const usuario = sesion?.user?.id ?? null;

  if (evento === 'SIGNED_OUT') {
    sesionActual = null;
    arrancar();
    return;
  }
  // Una renovación de token trae el mismo usuario: no hay nada que
  // volver a decidir.
  if (usuario && usuario !== sesionActual) {
    sesionActual = usuario;
    arrancar();
  }
});

// ============================================================
// 1 · Entrar
// ============================================================

function pantallaEntrar() {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="centro">
      <h1>Los contratos públicos que te interesan, sin buscarlos</h1>
      <p class="guia">Te enviamos cada mañana solo las licitaciones que encajan
      con tu negocio. Nada de listas de mil contratos entre los que rebuscar.</p>
      <div class="campo" style="max-width:380px;margin:28px auto 0">
        <label for="correo">Tu correo</label>
        <input type="email" id="correo" placeholder="nombre@empresa.es" autocomplete="email">
      </div>
      <button class="principal" id="enviar">Entrar</button>
      <p class="guia" style="margin-top:16px;font-size:.88rem">
      Te mandamos un enlace para entrar. Sin contraseñas que recordar.</p>
      <div id="resultado"></div>
    </div>`;

  const boton = document.getElementById('enviar');
  const correo = document.getElementById('correo');
  correo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });

  boton.onclick = async () => {
    const email = correo.value.trim();
    if (!email.includes('@')) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese correo no parece válido.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Enviando...';
    const { error } = await sb.auth.signInWithOtp({
      email, options: { emailRedirectTo: window.location.origin },
    });
    document.getElementById('resultado').innerHTML = error
      ? `<div class="aviso mal">No se ha podido enviar: ${esc(error.message)}</div>`
      : `<div class="aviso bien">Te hemos enviado un enlace a ${esc(email)}.
         Ábrelo desde este mismo dispositivo.</div>`;
    boton.disabled = false;
    boton.textContent = 'Entrar';
  };
}

// ============================================================
// 2 · Código de acceso
// ============================================================

function pantallaCodigo(session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="centro">
      <h1>Introduce tu código de acceso</h1>
      <p class="guia">Es el código que te hemos facilitado al contratar el
      servicio. Solo hace falta esta vez.</p>
      <div class="campo" style="max-width:340px;margin:26px auto 0">
        <input type="text" id="codigo" placeholder="CÓDIGO" autocomplete="off"
               style="text-align:center;letter-spacing:.08em">
      </div>
      <button class="principal" id="canjear">Continuar</button>
      <div id="resultado"></div>
      <button class="enlace" id="salir" style="margin-top:26px">Salir</button>
    </div>`;

  const boton = document.getElementById('canjear');
  const campo = document.getElementById('codigo');
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  document.getElementById('salir').onclick = () => sb.auth.signOut();

  const mensajes = {
    codigo_no_valido: 'Ese código no existe. Revísalo.',
    codigo_caducado: 'Ese código ha caducado.',
    codigo_agotado: 'Ese código ya se ha usado.',
    sin_sesion: 'La sesión ha expirado. Vuelve a entrar.',
  };

  boton.onclick = async () => {
    boton.disabled = true;
    const { data, error } = await sb.rpc('canjear_codigo',
      { codigo_entrada: campo.value.trim() });
    if (error || !data?.ok) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">${esc(mensajes[data?.error] ?? 'No se ha podido validar el código.')}</div>`;
      boton.disabled = false;
      return;
    }
    arrancar();
  };
}

// ============================================================
// 3 · Identificar la empresa por su CIF
// ============================================================

function pantallaEmpresa(perfil, session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div style="padding:52px 0">
      <h1>¿Cuál es el CIF de tu empresa?</h1>
      <p class="guia">Con él encontramos los contratos públicos que ya has
      ganado. De ahí sabemos a qué te presentas, sin que tengas que
      explicárnoslo.</p>
      <div class="campo" style="max-width:280px">
        <input type="text" id="cif" placeholder="B12345678" autocomplete="off"
               style="text-transform:uppercase;letter-spacing:.04em">
      </div>
      <button class="principal" id="buscar">Buscar</button>
      <button class="enlace" id="sin-cif">No tengo contratos públicos todavía</button>
      <div id="resultado"></div>
    </div>`;

  const boton = document.getElementById('buscar');
  const campo = document.getElementById('cif');
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  document.getElementById('sin-cif').onclick = () => pantallaDescribir(perfil, session);

  boton.onclick = async () => {
    const cif = campo.value.trim();
    if (cif.length < 8) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese CIF no parece completo.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Buscando...';
    try {
      const r = await llamar('buscar_empresa', { cif });
      if (!r.empresas.length) {
        document.getElementById('resultado').innerHTML = `
          <div class="aviso">No encontramos contratos con ese CIF. Puede que
          tu empresa aún no haya ganado ninguno, o que conste con otro
          identificador.</div>
          <button class="secundario" id="por-nombre" style="margin-top:14px">Buscar por nombre</button>`;
        document.getElementById('por-nombre').onclick = () => pantallaPorNombre(perfil, session);
      } else {
        pantallaConfirmar(perfil, r.empresas[0], r.ultimos, session);
      }
    } catch {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">No hemos podido buscar. Inténtalo de nuevo.</div>`;
    }
    boton.disabled = false;
    boton.textContent = 'Buscar';
  };
}

function pantallaPorNombre(perfil, session) {
  raiz.innerHTML = `
    <div style="padding:52px 0">
      <h1>¿Cómo se llama tu empresa?</h1>
      <p class="guia">Tal como aparecería en un contrato público. No hace
      falta que incluyas la forma societaria.</p>
      <div class="campo"><input type="text" id="nombre" placeholder="Confecciones Ibéricas"></div>
      <button class="principal" id="buscar">Buscar</button>
      <button class="enlace" id="sin-historial">No encuentro mi empresa</button>
      <div id="resultado"></div>
    </div>`;

  document.getElementById('sin-historial').onclick = () => pantallaDescribir(perfil, session);
  const boton = document.getElementById('buscar');
  boton.onclick = async () => {
    const empresa = document.getElementById('nombre').value.trim();
    if (empresa.length < 3) return;
    boton.disabled = true;
    boton.textContent = 'Buscando...';
    try {
      const r = await llamar('buscar_empresa', { empresa });
      if (!r.empresas.length) {
        document.getElementById('resultado').innerHTML = `
          <div class="aviso">Sin resultados con ese nombre.</div>`;
      } else if (r.empresas.length === 1) {
        pantallaConfirmar(perfil, r.empresas[0], r.ultimos, session);
      } else {
        // Varias coincidencias: elige él, que sabe cuál es la suya.
        document.getElementById('resultado').innerHTML = `
          <p class="guia" style="margin-top:22px">Hemos encontrado varias. ¿Cuál es la tuya?</p>
          ${r.empresas.map((e, i) => `
            <button class="secundario" data-i="${i}"
                    style="display:block;width:100%;text-align:left;margin-bottom:8px">
              <strong>${esc(e.nombre)}</strong><br>
              <span style="color:var(--tenue);font-size:.88rem">${esc(e.cif)} ·
              ${e.contratos} contratos</span>
            </button>`).join('')}`;
        raiz.querySelectorAll('[data-i]').forEach(b => b.onclick = () =>
          pantallaConfirmar(perfil, r.empresas[+b.dataset.i], [], session));
      }
    } catch {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">No hemos podido buscar.</div>`;
    }
    boton.disabled = false;
    boton.textContent = 'Buscar';
  };
}

function pantallaConfirmar(perfil, empresa, ultimos, session) {
  const euro = n => n ? euros(n) : null;
  const sectores = empresa.sectores ?? [];

  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div style="padding:52px 0">
      <h1>${esc(empresa.nombre)}</h1>
      <p class="guia">Hemos encontrado <strong>${empresa.contratos}</strong>
      contratos públicos adjudicados a tu empresa${
        empresa.importe_total ? `, por un total de ${euro(empresa.importe_total)}` : ''}.</p>

      ${sectores.length ? `
        <div class="listado">
          ${sectores.slice(0, 5).map(s => `
            <div><span>${esc(s.sector ?? '—')}</span>
              <span>${s.contratos}</span></div>`).join('')}
        </div>` : ''}

      ${ultimos && ultimos.length ? `
        <p class="guia" style="margin-top:26px">Los últimos:</p>
        ${ultimos.slice(0, 4).map(u => `
          <div style="padding:12px 0;border-bottom:1px solid var(--linea)">
            <div style="font-size:.96rem;line-height:1.4">${esc(u.titulo)}</div>
            <div style="color:var(--tenue);font-size:.86rem;margin-top:4px">
              ${esc(u.organo ?? '')}${u.importe ? ` · ${euro(u.importe)}` : ''}</div>
          </div>`).join('')}` : ''}

      <button class="principal" id="seguir" style="margin-top:28px">Sí, es mi empresa</button>
      <button class="enlace" id="no-es">No es mi empresa</button>
      <div id="resultado"></div>
    </div>`;

  document.getElementById('no-es').onclick = () => pantallaEmpresa(perfil, session);

  const boton = document.getElementById('seguir');
  boton.onclick = async () => {
    boton.disabled = true;
    boton.textContent = 'Analizando tu historial...';
    try {
      // Sin tarjetas: de aquí sale directamente su criterio. Lo que ha
      // ganado dice a qué se dedica mejor que treinta respuestas suyas.
      const r = await llamar('confirmar_empresa', { cif: empresa.cif });
      const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
      pantallaCribando(data?.[0] ?? perfil, session, r);
    } catch {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Algo ha fallado. Inténtalo de nuevo.</div>`;
      boton.disabled = false;
      boton.textContent = 'Sí, es mi empresa';
    }
  };
}

// ============================================================
// 4 · Describir el negocio (sin historial)
// ============================================================

function pantallaDescribir(perfil, session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div style="padding:52px 0">
      <h1>¿A qué se dedica tu empresa?</h1>
      <p class="guia">Escríbelo con tus palabras, como se lo contarías a
      alguien. No hace falta que uses términos técnicos ni que conozcas los
      códigos de la contratación pública: de eso nos encargamos nosotros.</p>
      <div class="campo">
        <textarea id="descripcion" placeholder="Por ejemplo: vendemos equipamiento para policías locales. Uniformidad, calzado, chalecos, material de defensa, linternas y accesorios.">${esc(perfil.descripcion ?? '')}</textarea>
      </div>
      <button class="principal" id="analizar">Continuar</button>
      <div id="resultado"></div>
    </div>`;

  const boton = document.getElementById('analizar');
  boton.onclick = async () => {
    const descripcion = document.getElementById('descripcion').value.trim();
    if (descripcion.length < 15) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Cuéntanos un poco más, con una frase basta.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Analizando...';
    try {
      const r = await llamar('proponer', { descripcion });
      pantallaFamilias(perfil, r, session);
    } catch (error) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">No hemos podido analizarlo. Inténtalo de nuevo.</div>`;
      boton.disabled = false;
      boton.textContent = 'Continuar';
    }
  };
}

function pantallaFamilias(perfil, propuesta, session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div style="padding:52px 0">
      <h1>Esto es lo que vamos a buscar por ti</h1>
      <p class="guia">${esc(propuesta.resumen)} Desmarca lo que no encaje.
      Es preferible dejar de más: el siguiente paso afina el resultado.</p>
      <div class="propuesta">
        ${propuesta.prefijos.map((p, i) => `
          <label class="familia">
            <input type="checkbox" checked data-prefijo="${esc(p.prefijo)}">
            <span class="cuerpo">
              <span class="que">${esc(p.que_trae)}</span>
              ${p.aviso ? `<span class="aviso-corto">${esc(p.aviso)}</span>` : ''}
            </span>
            <span class="volumen">${p.volumen ?? '—'} al año</span>
          </label>`).join('')}
      </div>
      <button class="principal" id="seguir">Ver ejemplos</button>
      <button class="enlace" id="atras">Cambiar la descripción</button>
      <div id="resultado"></div>
    </div>`;

  document.getElementById('atras').onclick = () => pantallaDescribir(perfil, session);

  const boton = document.getElementById('seguir');
  boton.onclick = async () => {
    const prefijos = [...raiz.querySelectorAll('.familia input:checked')]
      .map(c => c.dataset.prefijo);
    if (!prefijos.length) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Deja marcada al menos una.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Buscando ejemplos...';
    try {
      const r = await llamar('material', { prefijos });
      pantallaEntrenar(perfil, prefijos, session, r.licitaciones);
    } catch (error) {
      document.getElementById('resultado').innerHTML = error.message === 'catalogo_vacio'
        ? `<div class="aviso mal">No hemos encontrado contratos con esas
           categorías. Prueba a describir tu negocio de otra forma.</div>`
        : `<div class="aviso mal">Algo ha fallado. Inténtalo de nuevo.</div>`;
      boton.disabled = false;
      boton.textContent = 'Ver ejemplos';
    }
  };
}

async function pantallaEntrenar(perfil, prefijos, session, items) {
  if (!items) {
    raiz.innerHTML = `<div class="centro"><p class="guia">Preparando ejemplos...</p></div>`;
    try {
      items = (await llamar('material', { prefijos })).licitaciones;
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        No hemos podido cargar los ejemplos.</div></div>`;
      return;
    }
  }

  const respuestas = [];
  let i = 0;

  const intro = () => {
    raiz.className = 'envoltorio';
    raiz.innerHTML = `
      <div class="centro">
        <h1>¿Cuáles de estos contratos te interesan?</h1>
        <p class="guia">Son licitaciones reales de tu sector. Con tus respuestas
        construimos tu filtro: a partir de ahí solo verás lo que encaje.</p>
        <p class="guia">No hay respuestas correctas, solo las tuyas. Son
        ${items.length} y se tarda unos cinco minutos.</p>
        <div class="gestos">
          <div class="gesto no"><span class="flecha">←</span>
            <strong>Izquierda</strong><span>No me interesa</span></div>
          <div class="gesto si"><span class="flecha">→</span>
            <strong>Derecha</strong><span>Sí me interesa</span></div>
        </div>
        <p class="atajos">También valen las flechas del teclado o los botones.</p>
        <button class="principal" id="empezar" style="margin-top:18px">Empezar</button>
      </div>`;
    document.getElementById('empezar').onclick = pintar;
  };

  const tarjeta = (o, clase) => {
    const datos = [o.organo, euros(o.presupuesto)].filter(Boolean);
    return `<article class="carta ${clase}">
      <div class="franja">
        <div class="sello no">NO ME INTERESA</div>
        <div class="sello si">SÍ ME INTERESA</div>
      </div>
      <p class="titulo">${esc(o.titulo)}</p>
      <p class="datos">${datos.map(d => `<span>${esc(d)}</span>`).join('')}</p>
      ${o.adjudicatario ? `<p class="ganador">Lo ganó <strong>${esc(o.adjudicatario)}</strong>${
        o.importe_adjudicacion ? ` por ${euros(o.importe_adjudicacion)}` : ''}</p>` : ''}
    </article>`;
  };

  function pintar() {
    if (i >= items.length) return finalizar();

    const pila = [items[i+2], items[i+1], items[i]].filter(Boolean);
    const clases = pila.length === 3 ? ['detras-2','detras-1','encima']
                 : pila.length === 2 ? ['detras-1','encima'] : ['encima'];
    const si = respuestas.filter(r => r.interesa).length;

    raiz.className = 'envoltorio';
    raiz.innerHTML = `
      <div class="avance">
        <div class="barra"><div class="relleno" style="width:${i/items.length*100}%"></div></div>
        <div class="cuenta"><span>${i} de ${items.length}</span>
        <span>${respuestas.length ? `${si} sí · ${respuestas.length-si} no` : ''}</span></div>
      </div>
      <div class="baraja">${pila.map((o,n) => tarjeta(o, clases[n])).join('')}</div>
      <div class="botones">
        <button class="no" id="b-no">No me interesa</button>
        <button class="si" id="b-si">Sí me interesa</button>
      </div>
      <p class="atajos">Desliza la tarjeta, usa <kbd>←</kbd> <kbd>→</kbd> o pulsa los botones</p>`;

    document.getElementById('b-si').onclick = () => volar(true);
    document.getElementById('b-no').onclick = () => volar(false);
    arrastrable(raiz.querySelector('.carta.encima'));
  }

  const UMBRAL = 110;
  function arrastrable(carta) {
    if (!carta) return;
    let x0 = 0, dx = 0, activo = false;
    const empezar = ev => {
      activo = true; dx = 0;
      x0 = ev.touches ? ev.touches[0].clientX : ev.clientX;
      carta.classList.add('arrastrando');
    };
    const mover = ev => {
      if (!activo) return;
      dx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - x0;
      carta.style.transform = `translateX(${dx}px) rotate(${dx*0.05}deg)`;
      const fuerza = Math.min(Math.abs(dx)/UMBRAL, 1);
      carta.querySelector('.sello.si').style.opacity = dx > 0 ? fuerza : 0;
      carta.querySelector('.sello.no').style.opacity = dx < 0 ? fuerza : 0;
    };
    const soltar = () => {
      if (!activo) return;
      activo = false;
      carta.classList.remove('arrastrando');
      if (Math.abs(dx) >= UMBRAL) return volar(dx > 0);
      // Soltar a medias no decide nada: arrastrar sin querer sería el
      // peor fallo posible aquí.
      carta.classList.add('volando');
      carta.style.transform = '';
      carta.querySelectorAll('.sello').forEach(s => s.style.opacity = 0);
    };
    carta.addEventListener('mousedown', empezar);
    carta.addEventListener('touchstart', empezar, {passive:true});
    document.addEventListener('mousemove', mover);
    document.addEventListener('touchmove', mover, {passive:true});
    document.addEventListener('mouseup', soltar);
    document.addEventListener('touchend', soltar);
  }

  function volar(interesa) {
    const carta = raiz.querySelector('.carta.encima');
    if (carta) {
      carta.classList.add('volando');
      carta.style.transform = `translateX(${interesa?700:-700}px) rotate(${interesa?28:-28}deg)`;
      carta.style.opacity = '0';
    }
    const o = items[i];
    respuestas.push({
      id_licitacion: o.id_licitacion, titulo: o.titulo, organo: o.organo ?? '',
      cpvs: (o.cpvs || []).join(','), presupuesto: o.presupuesto ?? null, interesa,
    });
    i++;
    setTimeout(pintar, carta ? 200 : 0);
  }

  document.addEventListener('keydown', ev => {
    if (!raiz.querySelector('.carta.encima')) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); volar(true); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); volar(false); }
  });

  async function finalizar() {
    raiz.innerHTML = `<div class="centro">
      <h2>Construyendo tu filtro</h2>
      <p class="guia">Un momento...</p></div>`;
    try {
      await llamar('guardar', { respuestas });
      const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
      pantallaCribando(data?.[0] ?? perfil, session);
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        No hemos podido guardar tus respuestas. Recarga e inténtalo de nuevo.</div></div>`;
    }
  }

  intro();
}

async function pantallaCribando(perfil, session, lectura) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="centro">
      <h2>Estamos revisando los contratos abiertos</h2>
      ${lectura?.actividad ? `<p class="guia">Hemos entendido que te dedicas a
      <strong>${esc(lectura.actividad.toLowerCase())}</strong>. Estamos buscando
      contratos abiertos que encajen.</p>` : `
      <p class="guia">Aplicamos tu filtro a todas las licitaciones que siguen
      abiertas ahora mismo.</p>`}
      <p class="guia">Puede tardar unos minutos; no cierres esta página.</p>
      <div class="avance" style="max-width:340px;margin:30px auto 0">
        <div class="barra"><div class="relleno" id="relleno"></div></div>
        <div class="cuenta"><span id="progreso">Empezando...</span><span></span></div>
      </div>
    </div>`;

  // Se piden lotes seguidos hasta terminar. Cada llamada devuelve
  // cuánto queda, así que el progreso es real y no una animación.
  let total = 0;
  while (true) {
    let r;
    try {
      r = await llamar('cribar');
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        Se ha interrumpido. Recarga la página y continuará donde iba.</div></div>`;
      return;
    }
    total = total || r.total || 0;
    if (r.terminado) break;
    const hechas = total - r.quedan;
    document.getElementById('relleno').style.width = `${total ? hechas/total*100 : 0}%`;
    document.getElementById('progreso').textContent = `${hechas} de ${total} contratos`;
  }

  const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
  pantallaOportunidades(data?.[0] ?? perfil, session);
}

// Paleta fría, sin rojos ni naranjas.
//
// En la interfaz el color ya significa algo: --no y --urge son rojizos,
// y --acento marca lo que reclama atención. Pintar con esos tonos una
// categoría neutra hace que el gráfico parezca una alarma: media barra
// naranja se lee como "algo va mal" aunque solo diga "equipamiento
// médico".
//
// La regla habitual en sistemas de diseño: los colores con significado
// se reservan, y las categorías usan una escala cualitativa aparte.
// Aquí, azules y verdeazulados que descienden en tono, lo bastante
// distintos entre sí para no confundirse.
const PALETA = ['#2d5f8a','#3f8f8c','#5c7fb8','#6aa88b','#7a6ea8',
                '#4a8fa8','#8a9a5b','#5e7a94'];
const COLOR_OTROS = '#aab6c2';

function apilada(filas, campoNombre, campoValor, unidad) {
  const total = filas.reduce((s, f) => s + (Number(f[campoValor]) || 0), 0);
  if (!total) return '';

  const conValor = filas
    .map((f, i) => ({
      nombre: String(f[campoNombre] ?? '—'),
      valor: Number(f[campoValor]) || 0,
      color: PALETA[i % PALETA.length],
    }))
    .filter(x => x.valor > 0)
    .sort((a, b) => b.valor - a.valor);

  const grandes = conValor.filter(x => x.valor / total >= 0.02);
  const chicos = conValor.filter(x => x.valor / total < 0.02);
  const trozos = [...grandes];
  if (chicos.length) {
    trozos.push({
      nombre: chicos.length === 1 ? chicos[0].nombre
            : `Otros ${chicos.length} ${unidad === 'euros' ? '' : ''}`.trim(),
      valor: chicos.reduce((s, x) => s + x.valor, 0),
      color: COLOR_OTROS,
      agrupa: chicos,
    });
  }

  const comoTexto = v => unidad === 'euros' ? euros(v)
    : `${v} ${v === 1 ? 'contrato' : 'contratos'}`;
  const pct = v => {
    const p = v / total * 100;
    return p >= 10 ? `${Math.round(p)} %` : `${p.toFixed(1).replace('.', ',')} %`;
  };

  const id = 'r' + Math.random().toString(36).slice(2, 8);
  return `
    <div class="reparto" data-reparto="${id}">
      <h4>${unidad === 'euros' ? 'Por importe' : 'Por número de contratos'}</h4>
      <div class="apilada">
        ${trozos.map((t, i) => `<button class="trozo" data-i="${i}"
          style="width:${t.valor / total * 100}%;background:${t.color}"
          data-valor="${esc(comoTexto(t.valor))}"
          aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></button>`).join('')}
      </div>
      <div class="detalle-trozo callado" data-hueco>
        Pasa por encima o toca para ver el detalle
      </div>
      <div class="leyenda">
        ${trozos.map((t, i) => `<button data-i="${i}">
          <span class="punto" style="background:${t.color}"></span>
          <span class="cual">${esc(t.nombre)}</span>
          <span class="pct">${pct(t.valor)}</span>
        </button>`).join('')}
      </div>
    </div>`;
}

// Devuelve las dos barras de una misma dimensión.
function reparto(filas, campoNombre) {
  if (!filas.length) return `<p class="sin-datos">Todavía no hay datos.</p>`;
  return apilada(filas, campoNombre, 'contratos', 'contratos')
       + apilada(filas, campoNombre, 'importe', 'euros');
}

// Detalle de cada segmento de las barras apiladas. Al pasar por encima o
// tocar, la línea de debajo dice qué es y cuánto vale. En el móvil no hay
// cursor, así que el toque es la única forma de leer un segmento estrecho.
function activarBarras(donde) {
  donde.querySelectorAll('[data-reparto]').forEach(caja => {
    const hueco = caja.querySelector('[data-hueco]');
    const trozos = [...caja.querySelectorAll('.apilada .trozo')];
    if (!hueco || !trozos.length) return;
    const reposo = hueco.innerHTML;

    const mostrar = i => {
      const t = trozos[i];
      if (!t) return;
      const etiqueta = t.getAttribute('aria-label');
      const corte = etiqueta.lastIndexOf(': ');
      hueco.className = 'detalle-trozo';
      hueco.innerHTML = `
        <span class="punto" style="background:${t.style.background}"></span>
        <span class="cual">${esc(etiqueta.slice(0, corte))}</span>
        <span class="cuanto">${esc(etiqueta.slice(corte + 2))} · ${
          esc(t.dataset.valor ?? '')}</span>`;
      trozos.forEach((x, j) => x.classList.toggle('activo', j === +i));
    };
    const soltar = () => {
      hueco.className = 'detalle-trozo callado';
      hueco.innerHTML = reposo;
      trozos.forEach(x => x.classList.remove('activo'));
    };

    trozos.forEach(t => {
      t.onmouseenter = () => mostrar(t.dataset.i);
      t.onfocus = () => mostrar(t.dataset.i);
      // En táctil el clic es lo único que hay: se queda fijo hasta que se
      // toque otro.
      t.onclick = () => mostrar(t.dataset.i);
    });
    caja.querySelector('.apilada').onmouseleave = soltar;

    caja.querySelectorAll('.leyenda button').forEach(b => {
      b.onmouseenter = () => mostrar(b.dataset.i);
      b.onclick = () => mostrar(b.dataset.i);
    });
    caja.querySelector('.leyenda').onmouseleave = soltar;
  });
}

// Navegación principal. Va en la cabecera y no en el menú de cuenta
// porque Contratos y Mercado son áreas pares: qué me interesa presentar,
// y qué pasa en mi sector.
function navPrincipal(donde) {
  return `
    <div class="principales">
      <button data-nav="contratos" aria-current="${donde === 'contratos'}">Contratos</button>
      <button data-nav="mercado" aria-current="${donde === 'mercado'}">Mercado</button>
    </div>`;
}

function activarNav(perfil, session, donde) {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    if (b.dataset.nav === donde) return;
    if (b.dataset.nav === 'mercado') pantallaMercado(perfil, session);
    else pantallaOportunidades(perfil, session);
  });
}

async function pantallaMercado(perfil, session, volviendo = false) {
  if (!volviendo) irA('mercado');

  raiz.innerHTML = `

    mira quién se lleva los de tus sectores y guárdala para seguirla.</p>

    <div class="buscador-cif">
      <input type="text" id="cif-buscar" placeholder="CIF de una empresa"

  const zona = document.getElementById('zona');
  const campo = document.getElementById('cif-buscar');

  // ---------- Estado: listas ----------
  async function verListas() {
    zona.innerHTML = `<p class="guia">Cargando...</p>`;
    const [comp, seg] = await Promise.all([
      sb.rpc('competencia'),
      sb.rpc('mi_seguimiento'),
    ]);
    const competencia = comp.data ?? [];
    const seguidas = seg.data ?? [];

    // Tres filas a la vista y el resto detrás de un botón.
    const ASOMAN = 3;

    const fila = (f, i) => `<tr data-cif="${esc(f.cif)}"
        class="${i >= ASOMAN ? 'oculta' : ''}">
        <td class="quien">${esc(f.nombre ?? f.cif)}${
          f.sigo ? '<span class="marca-sigo">siguiendo</span>' : ''}</td>
        <td class="num">${f.contratos}</td>
        <td class="num">${f.importe ? euros(Number(f.importe)) : '—'}</td>
      </tr>`;

    const tabla = (filas, id) => `
      <table class="tabla" id="${id}">
        <thead><tr><th>Empresa</th><th class="num">Contratos</th>
          <th class="num">Importe</th></tr></thead>
        <tbody>${filas.map(fila).join('')}</tbody>
      </table>
      ${filas.length > ASOMAN ? `<button class="mas" data-tabla="${id}">
        Ver las ${filas.length - ASOMAN} restantes</button>` : ''}`;

    // La lista de seguimiento se enseña SIEMPRE, aunque esté vacía: si no
    // aparece, nadie descubre que existe.
    zona.innerHTML = `
      <div class="seccion-mercado">
        <h3>Tu lista de seguimiento
          <span class="cuantas">${seguidas.length || 'vacía'}</span></h3>
        ${seguidas.length ? tabla(seguidas, 't-seguimiento') : `
          <p class="vacio-seguimiento">Todavía no sigues a ninguna empresa.
          Busca una por su CIF o elígela de la lista de abajo, y pulsa
          <strong>Seguir</strong> en su ficha para tenerla aquí a mano.</p>`}
      </div>

      <div class="seccion-mercado">
        <h3>Quién gana más en tus sectores
          <span class="cuantas">${competencia.length}</span></h3>
        <p class="guia" style="margin:0 0 14px;font-size:.9rem">Empresas que
        han ganado contratos de los mismos códigos que tú. Pulsa una para ver
        su ficha.</p>
        ${competencia.length ? tabla(competencia, 't-competencia')
          : '<p class="sin-datos">Todavía no hay datos de tus sectores.</p>'}
      </div>`;

    zona.querySelectorAll('tr[data-cif]').forEach(f =>
      f.onclick = () => verEmpresa(f.dataset.cif));

    zona.querySelectorAll('[data-tabla]').forEach(b => b.onclick = () => {

        .querySelectorAll('.oculta').forEach(t => t.classList.remove('oculta'));

    });

  // ---------- Estado: ficha ----------
  async function verEmpresa(cif) {
    zona.innerHTML = `<p class="guia">Buscando...</p>`;
    const { data, error } = await sb.rpc('ficha_empresa', { cif_buscado: cif });
    if (error || !data || !data.contratos) {
      zona.innerHTML = `
        <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
        <div class="aviso">No hemos encontrado contratos adjudicados con ese
        CIF. Puede que no haya ganado ninguno todavía.</div>`;
      alPulsar('volver-listas', () => { campo.value = ''; verListas(); });
      return;
    }
    pintarFicha(data);
  }

  function pintarFicha(e) {
    const sectores = e.sectores ?? [];
    const organos = e.organos ?? [];
    const ultimos = e.ultimos ?? [];

    zona.innerHTML = `
      <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
      <div class="tarjeta-empresa" style="margin-top:8px">
        <div class="arriba">

              ${e.ultimo ? `<span>último en ${esc(new Date(e.ultimo)

            </p>

          <button class="seguir" id="seguir" aria-pressed="${!!e.sigo}"
                  data-cif="${esc(e.cif)}" data-nombre="${esc(e.nombre ?? e.cif)}">
            ${e.sigo ? 'Siguiendo' : 'Seguir'}</button>
        </div>

        ${sectores.length ? `<div style="margin-bottom:26px">
          ${reparto(sectores, 'sector')}</div>` : ''}

        ${organos.length ? `
          <h4 style="margin:0 0 12px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">A quién le vende</h4>
          <table class="tabla"><tbody>
            ${organos.map(o => `<tr style="cursor:default">
              <td class="quien">${esc(o.organo)}</td>
              <td class="num">${o.contratos}</td>
              <td class="num">${o.importe ? euros(Number(o.importe)) : '—'}</td>
            </tr>`).join('')}
          </tbody></table>` : ''}

        ${ultimos.length ? `
          <h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">Sus últimos contratos</h4>
          <div class="ultimos-contratos">
            ${ultimos.map(u => `<div>
              <p class="que">${esc(u.titulo)}</p>
              <span class="quien">${esc(u.organo ?? '')}${
                u.importe ? ` · ${euros(Number(u.importe))}` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
      </div>`;

    activarBarras(zona);
    alPulsar('volver-listas', () => { campo.value = ''; verListas(); });

    alPulsar('seguir', async () => {
      const b = document.getElementById('seguir');
      const { data } = await sb.rpc('seguir', {
        cif_empresa: b.dataset.cif, nombre_empresa: b.dataset.nombre });
      b.setAttribute('aria-pressed', String(!!data));
      b.textContent = data ? 'Siguiendo' : 'Seguir';
      recado(data
        ? 'Añadida a tu lista de seguimiento'
        : 'Quitada de tu lista de seguimiento');
    });
  }

  alPulsar('buscar-cif', () => {
    const cif = campo.value.trim();
    if (cif.length >= 8) verEmpresa(cif);
  });
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('buscar-cif').click();
  });

  verListas();
}
