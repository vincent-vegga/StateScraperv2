      const empresas = new Set(g.flatMap(x => x.ganadores.map(y => y.cif))
        .filter(Boolean)).size;
      const total = g.reduce((s, x) => s + (Number(x.total) || 0), 0);
      const mia = g.some(x => x.es_mia);
      const sigo = g.some(x => x.la_sigo);

      return `<details class="grupo-mov">
        <summary>
          <div>
            <p class="gano">${empresas} ${empresas === 1 ? 'empresa' : 'empresas'}
              ${mia ? '<span class="marca-mia">tu empresa entre ellas</span>'
              : sigo ? '<span class="marca-mia">una que sigues</span>' : ''}</p>
            <p class="que">${esc(primera.titulo ?? '')}</p>
            <span class="donde">${enlaceOrgano(primera.organo)}${
              primera.provincia ? ` · ${esc(primera.provincia)}` : ''}</span>
            <span class="cuantas-veces">${plural(g.length, 'compra', 'compras')}
              <span class="flechita">▾</span></span>
          </div>
          <div class="cifra">
            <strong>${total ? euros(total) : '—'}</strong>
            <span class="baja">${esc(fecha(primera.fecha))}</span>
          </div>
        </summary>
        <div class="dentro">${g.map(unaLinea).join('')}</div>
      </details>`;
    }).join('') : `<p class="vacio">No hay adjudicaciones de tus sectores en
      este periodo${provincia ? ` en ${esc(provincia)}` : ''}.</p>`;

    const cuando = textoPeriodo(periodo, anios);

    // La provincia va ARRIBA, antes de las cifras: es un filtro de todo lo
    // que viene después, y debajo del resumen pasaba por un dato más.
    document.getElementById('datos-mov').innerHTML = `
      ${provincias.length > 1 ? `
        <div class="filtro-provincia">
          <label for="f-provincia">Ver solo</label>
          <select id="f-provincia">
            <option value="">Toda España</option>
            ${provincias.map(pr => `<option value="${esc(pr)}"${
              pr === provincia ? ' selected' : ''}>${esc(pr)}</option>`).join('')}
          </select>
        </div>` : ''}

      <div class="pulso">
        <h4>En tu sector${provincia ? ` · ${esc(provincia)}` : ''} · ${esc(cuando)}</h4>
        <dl>
          <div><dt>Adjudicaciones</dt><dd>${numero(cuantos)}</dd></div>
          <div><dt>Importe total</dt><dd>${
            Number(r.importe) ? eurosConDetalle(r.importe) : '—'}</dd></div>
          <div><dt>Empresas distintas</dt><dd>${numero(r.empresas ?? 0)}</dd></div>
          ${Number(r.importe_mediano) ? `<div><dt>Importe mediano</dt>
            <dd>${euros(Number(r.importe_mediano))}</dd></div>` : ''}
          ${r.mias ? `<div><dt>Las has ganado tú</dt>
            <dd>${numero(r.mias)}</dd></div>` : ''}
          <p class="destacado">Cada contrato cuenta una vez aunque tenga
          varios lotes o varias empresas ganadoras. El importe mediano es el
          del contrato de en medio: la mitad se adjudicó por menos y la
          mitad por más, y unos pocos contratos enormes no lo mueven. Cada
          contrato cuenta en el año en que se formalizó, y los contratos
          menores no entran. En «Quién más ha facturado», cada empresa suma solo su
          parte.</p>
        </dl>
      </div>

      ${(r.por_empresa?.length || r.por_organo?.length) ? `
      <div class="dos-columnas">
        ${bloqueRanking(r.por_empresa, 'Quién más ha facturado', 'empresas')}
        ${bloqueRanking(r.por_organo, 'Quién ha adjudicado más', 'organos')}
      </div>` : ''}

      <div style="margin-top:32px">
        ${cuantos > lista.length ? `<p class="guia" style="font-size:.88rem">
          Las ${numero(lista.length)} adjudicaciones más recientes de ${
          numero(cuantos)}. Las cifras y los rankings de arriba cuentan
          todas.</p>` : ''}
        ${cuerpo}
        ${cuantos > lista.length && topeMov < TECHO_MOV ? `
          <button class="mas" id="mas-mov">Ver ${TANDA_MOV} más
            <span class="flechita">▾</span></button>` : ''}
      </div>`;

    // Antes no había forma de pasar de las 300 más recientes.
    const masMov = document.getElementById('mas-mov');
    if (masMov) masMov.onclick = () => {
      const boton = masMov;
      boton.disabled = true;
      boton.firstChild.textContent = 'Cargando... ';
      topeMov = Math.min(TECHO_MOV, topeMov + TANDA_MOV);
      cargar(true);
    };

    // El nombre de la empresa abre su ficha en Mercado y el del organismo
    // la suya en Organismos. preventDefault evita que, dentro de un grupo
    // desplegable, el clic pliegue o despliegue el resumen.
    document.getElementById('datos-mov').onclick = ev => {
      const e = ev.target.closest('[data-a-mercado]');
      const o = ev.target.closest('[data-a-organismo]');
      if (!e && !o) return;
      ev.preventDefault();
      if (e) {
        irA('mercado', { cif: e.dataset.aMercado });
        pantallaMercado(perfil, session, true, e.dataset.aMercado);
      } else {
        pantallaOrganismos(perfil, session, false, o.dataset.aOrganismo);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
    };

    const selProv = document.getElementById('f-provincia');
    if (selProv) selProv.onchange = () => {
      provincia = selProv.value || null;
      cargar();
    };

    // Cada tramo dice de qué contrato es. Sin esto la barra solo compara
    // tamaños; con esto se puede ir al detalle sin bajar a la lista.
    raiz.querySelectorAll('[data-ranking]').forEach(caja => {
      const hueco = caja.querySelector('[data-hueco-ranking]');
      const reposo = hueco.innerHTML;
      const tramos = [...caja.querySelectorAll('.tramo')];

      const mostrar = t => {
        const contexto = [t.dataset.quien, t.dataset.importe]
          .filter(Boolean).join(' · ');
        hueco.innerHTML =
          `<span class="titulo-tramo">${esc(t.dataset.titulo)}</span>` +
          (contexto ? `<span class="meta-tramo">${esc(contexto)}</span>` : '');
        tramos.forEach(x => x.classList.toggle('activo', x === t));
      };
      const soltar = () => {
        hueco.innerHTML = reposo;
        tramos.forEach(x => x.classList.remove('activo'));
      };

      // Se escucha en la tarjeta entera y no tramo a tramo: así el
      // detalle solo se borra al salir de la tarjeta, no cada vez que el
      // cursor cruza de un tramo al siguiente.
      caja.addEventListener('mouseover', ev => {
        const t = ev.target.closest('.tramo');
        if (t) mostrar(t);
      });
      caja.addEventListener('mouseleave', soltar);
      tramos.forEach(t => {
        t.onfocus = () => mostrar(t);
        t.onclick = () => mostrar(t);
      });
    });
  }

  await cargar();
}

// Topes de tamaño para la competencia: lo que gana la empresa al año en
// contratos públicos (0 = todas). Una pyme no quiere ver primero al líder
// del sector, sino a quien le quita los contratos a su escala. Son los
// mismos que usa `mi_tamano_competencia` para proponer uno a quien entró
// con NIF. De menos a más: son las paradas del deslizador.
const TAMANOS_COMPETENCIA = [500000, 2000000, 10000000, 0];
const textoTamano = t => t ? `Hasta ${eurosRedondos(t)}` : 'Todas';

// El deslizador del tope. Hecho a mano y no con <input type="range">: el
// nativo salta de parada en parada; este sigue al dedo y, al soltar,
// encaja en la más cercana. Para el teclado y los lectores de pantalla es
// un deslizador como cualquier otro (role="slider", flechas, Inicio, Fin).
function htmlTamanos(paso) {
  const ultimo = TAMANOS_COMPETENCIA.length - 1;
  const en = i => `${i / ultimo * 100}%`;
  return `
    <div class="tamanos" style="--pos:${paso / ultimo}">
      <span class="etiqueta-tamanos" id="tamanos-titulo">Lo que ganan al año</span>
      <div class="pista-tamanos">
        <div class="riel">
          <div class="carril"><i class="lleno"></i>${TAMANOS_COMPETENCIA.map((_, i) =>
            `<b style="left:${en(i)}"></b>`).join('')}</div>
          <div class="pulgar" role="slider" tabindex="0"
            aria-labelledby="tamanos-titulo" aria-valuemin="0"
            aria-valuemax="${ultimo}"><span class="globo"></span></div>
        </div>
        <div class="marcas">${TAMANOS_COMPETENCIA.map((t, i) =>
          `<button type="button" tabindex="-1" data-paso="${i}" style="left:${en(i)}"
            >${t ? eurosRedondos(t) : 'Todas'}</button>`).join('')}</div>
      </div>
    </div>`;
}

// `alElegir(tope)` llega un poco después de que el pulgar se pare: con
// varias flechas seguidas, una sola vez, y sin cortar la animación.
function deslizadorTamanos(bloque, inicial, alElegir) {
  const ultimo = TAMANOS_COMPETENCIA.length - 1;
  const riel = bloque.querySelector('.riel');
  const pulgar = bloque.querySelector('.pulgar');
  const globo = bloque.querySelector('.globo');
  const puntos = [...bloque.querySelectorAll('.carril b')];
  const marcas = [...bloque.querySelectorAll('.marcas button')];
  let paso = inicial;
  let espera = null;

  // Pone el pulgar en `pos` (de 0 a 1) y marca la parada más cercana.
  const pintar = pos => {
    const cerca = Math.round(pos * ultimo);
    bloque.style.setProperty('--pos', pos);
    puntos.forEach((b, i) => b.classList.toggle('dentro', i / ultimo <= pos + 1e-6));
    marcas.forEach((b, i) => b.classList.toggle('actual', i === cerca));
    globo.textContent = textoTamano(TAMANOS_COMPETENCIA[cerca]);
  };

  const fijar = i => {
    i = Math.max(0, Math.min(ultimo, i));
    pintar(i / ultimo);
    pulgar.setAttribute('aria-valuenow', i);
    pulgar.setAttribute('aria-valuetext', textoTamano(TAMANOS_COMPETENCIA[i]));
    if (i === paso) return;
    paso = i;
    clearTimeout(espera);
    espera = setTimeout(() => {
      if (bloque.isConnected) alElegir(TAMANOS_COMPETENCIA[paso]);
    }, 300);
  };

  const posDe = ev => {
    const r = riel.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  };

  // Un toque lleva el pulgar deslizándose hasta la parada; arrastrar lo
  // lleva pegado al dedo y encaja al soltar. Por debajo de 4 px es un
  // toque: un dedo nunca está quieto del todo.
  let inicio = null;
  riel.addEventListener('pointerdown', ev => {
    if (ev.button > 0) return;
    ev.preventDefault();
    inicio = ev.clientX;
    riel.setPointerCapture(ev.pointerId);
    riel.classList.add('con-puntero');
    pulgar.focus({ preventScroll: true });
  });
  riel.addEventListener('pointermove', ev => {
    if (inicio == null) return;
    if (!riel.classList.contains('arrastrando')) {
      if (Math.abs(ev.clientX - inicio) < 4) return;
      riel.classList.add('arrastrando');
    }
    pintar(posDe(ev));
  });
  riel.addEventListener('pointerup', ev => {
    if (inicio == null) return;
    inicio = null;
    riel.classList.remove('arrastrando');
    fijar(Math.round(posDe(ev) * ultimo));
  });
  // Si el navegador se queda el gesto (el dedo se fue hacia arriba para
  // desplazar la página), vuelve a donde estaba.
  riel.addEventListener('pointercancel', () => {
    inicio = null;
    riel.classList.remove('arrastrando');
    fijar(paso);
  });

  pulgar.addEventListener('blur', () => riel.classList.remove('con-puntero'));
  pulgar.addEventListener('keydown', ev => {
    riel.classList.remove('con-puntero');
    const paso1 = { ArrowLeft: -1, ArrowDown: -1, PageDown: -1,
                    ArrowRight: 1, ArrowUp: 1, PageUp: 1 }[ev.key];
    if (paso1) fijar(paso + paso1);
    else if (ev.key === 'Home') fijar(0);
    else if (ev.key === 'End') fijar(ultimo);
    else return;
    ev.preventDefault();
  });
  marcas.forEach((b, i) => b.onclick = () => fijar(i));

  fijar(inicial);
}

async function pantallaMercado(perfil, session, volviendo = false, cif = null) {
  if (!volviendo) irA('mercado');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Empresas</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('mercado')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién gana en tu sector</h1>
    <p class="guia">Los contratos públicos son datos abiertos: quién los
    gana, por cuánto y de qué organismo. ${perfil.cif ? 'Mira tu propio historial, busca'
      : 'Busca'} una empresa por su nombre o su NIF, o averigua quién se lleva
    los contratos de tus sectores.</p>

    <!-- Por nombre también: casi nadie se sabe el NIF de su competencia. -->
    <div class="buscador-cif">
      <input type="search" id="cif-buscar" placeholder="Nombre o NIF de una empresa"
             autocomplete="off" aria-label="Nombre o NIF de una empresa">
      <button class="principal" id="buscar-cif">Buscar</button>
      ${perfil.cif ? `<button class="secundario" id="ver-mia">Ver mi
        empresa</button>` : ''}
    </div>

    <div class="hueco-periodo" id="periodo-emp"></div>

    <div id="zona" style="margin-top:22px"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'mercado');

  const zona = document.getElementById('zona');
  const campo = document.getElementById('cif-buscar');

  // Ver la propia empresa es la misma acción que buscar otra, así que va
  // junto al buscador y no abajo con las listas.
  alPulsar('ver-mia', () => verEmpresa(perfil.cif));

  // El periodo vale para las listas y para la ficha: al cambiarlo se
  // repinta lo que haya a la vista.
  const [aniosEmp, tam] = await Promise.all([
    aniosDelSector(), pedir('mi_tamano_competencia')]);
  let periodoEmp = periodoGuardado(aniosEmp);
  // El tope de tamaño de la competencia. Si no llega, todas: como antes.
  let topeEmp = Number(tam.data?.tope) || 0;
  let repintarVista = null;
  let repintarSeguimiento = null;
  let vueltaEmp = 0;
  selectorPeriodo(document.getElementById('periodo-emp'), aniosEmp, periodoEmp, p => {
    periodoEmp = p;
    repintarVista?.();
  });
  const cuandoEmp = () => aniosEmp.length ? enPeriodo(periodoEmp, aniosEmp) : '';

  // Mientras llega lo nuevo, lo anterior se atenúa en vez de sustituirse
  // por "Cargando...": así no salta la página al cambiar de periodo.
  const esperando = texto => {
    if (zona.children.length) zona.classList.add('cambiando');
    else zona.innerHTML = `<p class="guia">${texto}</p>`;
  };

  // Cambiar de forma repinta la ficha y guarda la elección para todos los
  // gráficos. Enganchado una sola vez sobre el contenedor, que no se
  // sustituye al redibujar.
  let ultimaEmpresa = null;
  // Qué enseña la ficha: 'resumen', 'contratos', 'vigentes' u 'otros'
  // (UTEs y acuerdos marco). Se guarda con el NIF para que sobreviva al
  // cambio de periodo y al de forma de los gráficos, que repintan la
  // ficha entera.
  let vistaFicha = { cif: null, cual: null };
  // Lo elegido en la pestaña Contratos. Se queda al cambiar de periodo o
  // de pestaña; otra ficha empieza sin filtros.
  let filtroContratos = { cif: null };
  const POR_PAGINA = 20;
  // Los vigentes no dependen del periodo: se piden una vez por empresa, al
  // abrir la ficha y sin esperarlos, para poner la cifra en la pestaña.
  const VIGENTES = new Map();
  const pedirVigentes = cif => {
    if (!VIGENTES.has(cif)) {
      VIGENTES.set(cif, sb.rpc('vigentes_empresa', { cif_buscado: cif })
        .then(({ data, error }) => {
          if (error || !data) throw error ?? new Error('sin datos');
          return data;
        })
        .catch(err => { VIGENTES.delete(cif); throw err; }));
    }
    return VIGENTES.get(cif);
  };
  // En Vigentes el periodo no cuenta: el selector se apaga.
  const periodoAplica = si => document.getElementById('periodo-emp')
    ?.classList.toggle('no-aplica', !si);
  // "A quién le vende", por contratos o por importe. Como la forma de los
  // gráficos, una preferencia: vale para todas las fichas y se guarda.
  let ordenOrganos = (() => {
    try { return localStorage.getItem('orden-organos') || 'contratos'; }
    catch { return 'contratos'; }
  })();
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-orden-organos]');
    if (!b || !ultimaEmpresa) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ordenOrganos = b.dataset.ordenOrganos;
    try { localStorage.setItem('orden-organos', ordenOrganos); } catch {}
    pintarFicha(ultimaEmpresa);
  });
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaEmpresa) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintarFicha(ultimaEmpresa);
  });

  // Elegir un tope se guarda para la próxima vez; si no se puede guardar,
  // vale igual mientras siga en la pantalla. Volver al que ya estaba no
  // guarda nada: así, quien entró con NIF y no ha tocado nada sigue con el
  // que le corresponde si cambia lo que gana.
  const elegirTope = tope => {
    if (tope === topeEmp) return;
    topeEmp = tope;
    sb.rpc('cambiar_tamano_competencia', { tope })
      .then(() => olvidar('mi_tamano_competencia'), () => {});
    verListas({ soloCompetencia: true });
  };

  // ---------- Estado: listas ----------

  // Tres filas a la vista y el resto detrás de un botón.
  const ASOMAN = 3;

  // `soloCompetencia`: al mover el tope solo cambia la lista de
  // competencia. Repintar todo le cortaba la animación al deslizador y le
  // quitaba el foco; así se queda donde está y la lista cambia debajo.
  async function verListas({ soloCompetencia = false } = {}) {
    repintarVista = verListas;
    periodoAplica(true);
    const turno = ++vueltaEmp;
    const hueco = soloCompetencia ? document.getElementById('lista-competencia') : null;
    if (hueco) hueco.classList.add('cambiando');
    else esperando('Cargando...');
    const [comp, seg] = await Promise.all([
      pedir('competencia_periodo', argsPeriodo(periodoEmp, { tope: topeEmp })),
      hueco ? { data: null, error: null } : pedir('seguimiento_periodo', argsPeriodo(periodoEmp)),
    ]);
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');

    // Un fallo NO se enseña como «no hay empresas».
    //
    // Con `comp.data ?? []`, cualquier error se convertía en una lista
    // vacía y la pantalla afirmaba que el cliente no tiene competencia.
    // Eso no es una pantalla en blanco: es un dato falso.
    if (comp.error || seg.error) {
      const fallo = comp.error || seg.error;
      zona.innerHTML = `<div class="aviso mal">
        No hemos podido cargar las empresas de tu sector.
        <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
          ${esc(fallo.message || '')}</div>
        <div style="margin-top:14px">
          <button class="secundario" id="reintentar-emp">Reintentar</button>
        </div></div>`;
      alPulsar('reintentar-emp', verListas);
      return;
    }

    const competencia = comp.data ?? [];
    const seguidas = seg.data ?? [];
    const tope = topeEmp;
    // Un tope que no está entre las paradas (no debería pasar) cae en
    // "Todas", que es lo que la base aplica con 0.
    const ultimo = TAMANOS_COMPETENCIA.length - 1;
    const paso = TAMANOS_COMPETENCIA.includes(tope)
      ? TAMANOS_COMPETENCIA.indexOf(tope) : ultimo;

    // Lo que gana al año va en su columna; en el móvil no cabe y pasa a
    // una línea bajo el nombre.
    const fila = (f, i, sigo) => `<tr data-cif="${esc(f.cif)}"
        class="${i >= ASOMAN ? 'oculta' : ''}" style="--i:${Math.min(i, ASOMAN)}">
        <td class="quien">${esc(f.nombre ?? f.cif)}${eurosRedondos(f.anual) ? `
          <span class="anual-movil">Gana ${eurosRedondos(f.anual)} al año</span>` : ''}</td>
        <td class="num">${f.contratos}</td>
        <td class="num">${f.importe ? euros(Number(f.importe)) : '—'}</td>
        <td class="num anual">${eurosRedondos(f.anual) ?? '—'}</td>
        <td class="fin"><button class="seguir chico" aria-pressed="${sigo}"
          data-seguir="${esc(f.cif)}" data-nombre="${esc(f.nombre ?? f.cif)}"
          >${sigo ? 'Siguiendo' : 'Seguir'}</button></td>
      </tr>`;

    const tabla = (filas, id, todasSeguidas = false) => `
      <table class="tabla" id="${id}">
        <thead><tr><th>Empresa</th><th class="num">Contratos</th>
          <th class="num">Importe</th>
          <th class="num anual" title="Media de lo que ha ganado al año en contratos públicos en los dos últimos años, en todos sus sectores">Gana al año</th>
          <th class="fin"></th></tr></thead>
        <tbody>${filas.map((f, i) =>
          fila(f, i, todasSeguidas || !!f.sigo)).join('')}</tbody>
      </table>
      ${filas.length > ASOMAN ? `<button class="mas" data-tabla="${id}"
        aria-expanded="false"
        data-mas="${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}"
        data-menos="Ver menos">${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}
        <span class="flechita">▾</span></button>` : ''}`;

    const frase = `Empresas que han ganado contratos de los mismos códigos
      que tú${cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}${tope ? `, solo las
      que ganan hasta ${eurosRedondos(tope)} al año en contratos públicos,
      sumando todos sus sectores` : ''}. Contratos e importe cuentan solo lo
      que han ganado en tus sectores; en su ficha, que se abre al pulsarla,
      está todo lo suyo.`;
    const listaCompetencia = competencia.length ? tabla(competencia, 't-competencia')
      : `<p class="sin-datos">${tope
          ? 'Ninguna empresa de ese tamaño ha ganado contratos de tus sectores en este periodo.'
          : 'No hay adjudicaciones de tus sectores en este periodo.'}</p>`;

    // Solo la competencia: el deslizador y la lista de seguimiento se
    // quedan como están. Si mientras tanto se abrió una ficha, ya no hay
    // hueco y se pinta todo.
    if (hueco?.isConnected) {
      hueco.innerHTML = listaCompetencia;
      hueco.classList.remove('cambiando');
      document.getElementById('frase-competencia').innerHTML = frase;
      document.getElementById('cuantas-competencia').textContent = competencia.length;
      const nueva = hueco.querySelector('.tabla');
      if (nueva) {
        nueva.classList.add('entra');
        // Fuera al terminar: si no, desplegar las restantes las animaría
        // otra vez.
        setTimeout(() => nueva.classList.remove('entra'), 700);
      }
      enlazar(hueco);
      return;
    }

    // La lista de seguimiento se enseña SIEMPRE, aunque esté vacía: si no
    // aparece, nadie descubre que existe.
    const htmlSeguimiento = lista => `
        <h3>Tu lista de seguimiento
          <span class="cuantas">${lista.length || 'vacía'}</span></h3>
        ${lista.length ? tabla(lista, 't-seguimiento', true) : `
          <p class="vacio-seguimiento">Todavía no sigues a ninguna empresa.
          Búscala por su nombre o su NIF, o elígela de la lista de abajo, y
          pulsa <strong>Seguir</strong> para tenerla aquí a mano.</p>`}`;

    // Al seguir una desde la competencia, sube aquí. Antes no se repintaba
    // nada y arriba seguía diciendo "vacía" justo después de "Añadida a tu
    // lista de seguimiento".
    repintarSeguimiento = async () => {
      const caja = document.getElementById('sec-seguimiento');
      if (!caja) return;
      const { data, error } = await pedir('seguimiento_periodo',
        argsPeriodo(periodoEmp), { alVuelo: false });
      if (error || !caja.isConnected) return;
      caja.innerHTML = htmlSeguimiento(data ?? []);
      enlazar(caja);
    };

    zona.innerHTML = `
      <div class="seccion-mercado" id="sec-seguimiento">
        ${htmlSeguimiento(seguidas)}
      </div>

      <div class="seccion-mercado">
        <h3>Quién gana más en tus sectores
          <span class="cuantas" id="cuantas-competencia">${competencia.length}</span></h3>
        <p class="guia" id="frase-competencia"
          style="margin:0 0 14px;font-size:.9rem">${frase}</p>
        ${htmlTamanos(paso)}
        <div id="lista-competencia">${listaCompetencia}</div>
      </div>`;

    deslizadorTamanos(zona.querySelector('.tamanos'), paso, elegirTope);
    enlazar(zona);
  }

  // Filas, botones de seguir y "ver las restantes" de lo que haya dentro de
  // `raiz`: las dos listas, o solo la de competencia al cambiar el tope.
  function enlazar(raiz) {
    raiz.querySelectorAll('tr[data-cif]').forEach(f =>
      f.onclick = ev => {
        // El botón de seguir vive dentro de la fila para que aparezca a su
        // altura; hay que evitar que su clic abra además la ficha.
        if (ev.target.closest('[data-seguir]')) return;
        verEmpresa(f.dataset.cif);
      });

    raiz.querySelectorAll('[data-seguir]').forEach(b => b.onclick = async () => {
      // Quieto mientras responde el servidor: `seguir` alterna, así que
      // un doble clic seguía y dejaba de seguir.
      if (b.disabled) return;
      const antes = b.getAttribute('aria-pressed') === 'true';
      // Se pinta al instante y se corrige si el servidor dice otra cosa.
      b.setAttribute('aria-pressed', String(!antes));
      b.textContent = !antes ? 'Siguiendo' : 'Seguir';
      b.disabled = true;
      try {
        // Supabase no lanza: devuelve `{ error }`. Sin mirarlo, un fallo
        // acababa en "Quitada de tu lista de seguimiento".
        const { data, error } = await sb.rpc('seguir', {
          cif_empresa: b.dataset.seguir, nombre_empresa: b.dataset.nombre });
        if (error) throw error;
        b.disabled = false;
        b.setAttribute('aria-pressed', String(!!data));
        b.textContent = data ? 'Siguiendo' : 'Seguir';
        if (data) recadoSeguir('de lo que gane');
        else recado('Quitada de tu lista de seguimiento');
        olvidar('seguimiento_periodo', 'competencia_periodo',
                'movimientos_periodo', 'resumen_periodo', 'mis_seguimientos');

        // Al seguirla desde la competencia, su fila se va: ya está arriba
        // en la lista de seguimiento y saldría dos veces. Si deja de
        // seguirla, vuelve a aparecer al recargar.
        //
        // Dejar de seguir desde la propia lista de seguimiento NO la
        // repinta: la fila se iría de debajo del cursor. Se pone al día al
        // volver a entrar.
        const enCompetencia = b.closest('#t-competencia');
        if (data && enCompetencia) {
          const suya = b.closest('tr');
          // Se descubre la siguiente oculta para que sigan viéndose tres.
          const escondida = enCompetencia.querySelector('tbody tr.oculta');
          if (escondida) escondida.classList.remove('oculta');
          suya.remove();
          const cuenta = document.getElementById('cuantas-competencia');
          if (cuenta) cuenta.textContent = enCompetencia.querySelectorAll('tbody tr').length;
          repintarSeguimiento?.();
        }
      } catch {
        b.disabled = false;
        b.setAttribute('aria-pressed', String(antes));
        b.textContent = antes ? 'Siguiendo' : 'Seguir';
        recado('No se ha podido guardar. Inténtalo de nuevo.');
      }
    });

    // Alterna: se puede volver a cerrar. Antes el botón desaparecía al
    // pulsarlo y la lista se quedaba abierta para siempre.
    raiz.querySelectorAll('[data-tabla]').forEach(b => {
      const filas = [...document.getElementById(b.dataset.tabla)
        .querySelectorAll('tbody tr')];
      b.onclick = () => {
        const abierto = b.getAttribute('aria-expanded') === 'true';
        filas.forEach((t, i) => t.classList.toggle('oculta', abierto && i >= ASOMAN));
        b.setAttribute('aria-expanded', String(!abierto));
        b.firstChild.textContent = abierto
          ? b.dataset.mas + ' ' : b.dataset.menos + ' ';
      };
    });
  }

  // ---------- Estado: ficha ----------
  //
  // Deja marca en el historial: sin ella, atrás salía de Mercado entero
  // en vez de devolver a las listas.
  //
  // `desde` es el nombre de la ficha en la que se pulsó el enlace (un socio,
  // una UTE): queda en el historial para que el botón de volver diga
  // adónde vuelve.
  async function verEmpresa(cif, restaurando = false, desde = null) {
    if (!restaurando) {
      irA('mercado', { cif, ...(desde ? { desde } : {}) });
      // Cada ficha nueva empieza en su vista por defecto (ver pintarFicha).
      vistaFicha = { cif: null, cual: null };
    }
    repintarVista = () => verEmpresa(cif, true);
    periodoAplica(true);
    // Sin esperarlos: llegan mientras se pinta la ficha (ver pintarFicha).
    pedirVigentes(cif).catch(() => {});
    // El buscador enseña el NIF de la ficha abierta: al llegar por un
    // enlace se quedaba con el de la anterior.
    campo.value = cif;
    const turno = ++vueltaEmp;
    esperando('Buscando...');
    // Las UTEs van aparte (utes_y_socios, 20261001120000) y en paralelo:
    // si fallan, la ficha sale igual, sin esa sección.
    const [{ data, error }, { data: utes }] = await Promise.all([
      sb.rpc('ficha_empresa', { cif_buscado: cif, ...argsPeriodo(periodoEmp) }),
      UTES_VISIBLE
        ? sb.rpc('utes_y_socios', { cif_buscado: cif, ...argsPeriodo(periodoEmp) })
        : { data: null },
    ]);
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');
    if (data) {
      data.utes = utes?.utes ?? [];
      data.socios = utes?.socios ?? [];
      // La lista llega cortada en 30; el total, aparte.
      data.n_utes = Math.max(utes?.n_utes ?? 0, data.utes.length);
    }
    // Una empresa que en el periodo solo está homologada en acuerdos
    // marco, o que solo ha ganado en UTE, no tiene contratos propios,
    // pero sí algo que enseñar.
    if (error || !data || (!data.contratos && !data.marcos?.length
                           && !data.utes.length && !data.socios.length)) {
      // Con nombre es que existe y ha ganado algo, pero no en este
      // periodo: decir "no hemos encontrado ese NIF" sería falso.
      zona.innerHTML = `
        <button class="volver-listas" id="volver-listas">${textoVolver()}</button>
        <div class="aviso">${data?.nombre
          ? `${esc(data.nombre)} no tiene contratos adjudicados
             ${esc(cuandoEmp())}. Prueba con otro periodo.`
          : `No hemos encontrado contratos adjudicados con ese NIF. Puede
             que no haya ganado ninguno todavía.`}</div>`;
      alPulsar('volver-listas', () => history.back());
      return;
    }
    pintarFicha(data);
    // Al abrir otra ficha, arriba: si no, desde el final de una ficha
    // larga se caía en mitad de la nueva sin ver su nombre. Al cambiar de
    // periodo (restaurando) se queda donde estaba.
    // Al instante: la página tiene desplazamiento suave, y deslizarse
    // medio segundo por encima de la ficha nueva parece otro salto.
    if (!restaurando) window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // Con `desde` en el historial se vuelve a la ficha anterior, no a las
  // listas, y el botón lo dice.
  const textoVolver = () => history.state?.desde
    ? `← Volver a ${esc(history.state.desde)}` : '← Volver a las listas';

  // Una fila de la lista de contratos: cuándo, de quién, cuánto y cuánto dura.
  const filaContrato = u => `<div>
      <p class="que">${tituloConEnlace(u.titulo, u.enlace)}</p>
      <span class="quien">${[
        u.fecha ? fechaCorta(u.fecha) : '',
        esc(u.organo ?? ''),
        u.importe ? euros(Number(u.importe)) : '',
        duracionTxt(u.duracion_meses),
        importeAnualTxt(u.importe, u.duracion_meses),
      ].filter(Boolean).join(' · ')}</span>
    </div>`;

  // La pestaña Contratos: de 20 en 20, con lo elegido en `filtroContratos`.
  // `mas` añade la página siguiente debajo; si no, empieza de cero.
  let vueltaContratos = 0;
  async function cargarContratos(e, mas = false) {
    const lista = document.getElementById('lista-contratos');
    const cuenta = document.getElementById('cuenta-contratos');
    const boton = document.getElementById('mas-contratos');
    if (!lista) return;
    const f = filtroContratos;
    const turno = ++vueltaContratos;
    const saltar = mas ? lista.children.length : 0;
    if (mas) { boton.disabled = true; boton.textContent = 'Cargando...'; }
    else lista.classList.add('cambiando');
    const { data, error } = await sb.rpc('contratos_empresa', {
      cif_buscado: e.cif, ...argsPeriodo(periodoEmp),
      buscar: f.buscar || null, sector_elegido: f.sector, organo_elegido: f.organo,
      orden: f.orden, saltar, cuantos: POR_PAGINA,
      // "N más en otros años" solo cuenta años que el selector ofrece.
      rango_desde: aniosEmp[0]?.anio ?? null, rango_hasta: aniosEmp.at(-1)?.anio ?? null });
    if (turno !== vueltaContratos || !lista.isConnected) return;
    lista.classList.remove('cambiando');
    boton.disabled = false;
    if (error || !data) {
      // Un fallo no se enseña como "ninguno".
      if (!mas) lista.innerHTML = '';
      cuenta.textContent = 'No hemos podido cargar sus contratos. Inténtalo de nuevo.';
      boton.hidden = !mas;
      boton.textContent = 'Reintentar';
      return;
    }
    const filas = (data.contratos ?? []).map(filaContrato).join('');
    if (mas) lista.insertAdjacentHTML('beforeend', filas);
    else lista.innerHTML = filas;

    const total = Number(data.total) || 0;
    const fuera = Number(data.fuera_del_periodo) || 0;
    const vistos = lista.children.length;
    const filtrado = !!(f.buscar || f.sector || f.organo);
    const cuando = cuandoEmp() ? ` ${cuandoEmp()}` : '';
    cuenta.textContent = !total
      ? `Ninguno${cuando} con lo que has elegido.${fuera
          ? ` Hay ${plural(fuera, 'otro', 'otros')} en otros años: cambia el periodo arriba.` : ''}`
      : `${vistos < total ? `${vistos} de ` : ''}${plural(total, 'contrato', 'contratos')}${
          filtrado ? ` que coinciden` : ''}${cuando}${
          filtrado && fuera ? ` · ${fuera} más en otros años` : ''}`;
    boton.hidden = vistos >= total;
    boton.textContent = `Ver ${Math.min(POR_PAGINA, total - vistos)} más`;
  }

  // La pestaña Vigentes. "En su plazo" es seguro; "solo si se prorrogó",
  // no: el plazo inicial ya pasó y que se prorrogara no se publica.
  function filaVigente(v, enPlazo) {
    const notas = [esc(v.organo ?? ''), v.importe ? euros(Number(v.importe)) : ''];
    if (enPlazo) {
      notas.push(`termina el ${fechaCorta(v.fin)}`);
      if (v.prorroga === 'si' && v.fin_maximo) {
        notas.push(`prorrogable hasta el ${fechaCorta(v.fin_maximo)}`);
      } else if (v.prorroga === 'pliego') {
        notas.push('puede tener prórrogas (ver el pliego)');
      }
    } else {
      notas.push(`el plazo inicial terminó el ${fechaCorta(v.fin)}`,
                 `como tarde hasta el ${fechaCorta(v.fin_maximo)}`);
    }
    if (v.clase === 'basado') notas.push('basado en un acuerdo marco');
    return `<div>
      <p class="que">${tituloConEnlace(v.titulo, v.enlace)}</p>
      <span class="quien">${notas.filter(Boolean).join(' · ')}</span>
    </div>`;
  }

  async function pintarVigentes(e) {
    let v;
    try { v = await pedirVigentes(e.cif); }
    catch {
      const hueco = document.getElementById('vigentes');
      if (hueco && ultimaEmpresa?.cif === e.cif) hueco.innerHTML = `<div class="aviso mal">
        No hemos podido cargar sus contratos vigentes. Inténtalo de nuevo.</div>`;
      return;
    }
    const hueco = document.getElementById('vigentes');
    if (!hueco || ultimaEmpresa?.cif !== e.cif) return;
    const nPlazo = Number(v.n_en_plazo) || 0;
    const nProrroga = Number(v.n_prorrogados) || 0;
    const titulo = t => `<h4 style="margin:22px 0 4px;font-size:.83rem;font-weight:650;
      color:var(--tenue);letter-spacing:.05em;text-transform:uppercase">${t}</h4>`;
    const masDe = (grupo, vistos, total) => vistos < total
      ? `<button type="button" class="mas" data-mas-vigentes="${grupo}">Ver ${
          Math.min(POR_PAGINA, total - vistos)} más</button>` : '';
    const abierto = hueco.querySelector('.prorrogados')?.open ?? false;

    hueco.innerHTML = !nPlazo && !nProrroga
      ? `<p class="sin-datos">No tiene contratos abiertos hoy, o los que tiene no
          publican su duración.</p>`
      : `
        ${titulo(`En su plazo · ${nPlazo}`)}
        ${nPlazo ? `
          <div class="ultimos-contratos">
            ${v.en_plazo.map(x => filaVigente(x, true)).join('')}
          </div>
          ${masDe('en_plazo', v.en_plazo.length, nPlazo)}`
          : `<p class="guia" style="font-size:.86rem">Ninguno con el plazo inicial en curso.</p>`}
        ${nProrroga ? `
          <details class="prorrogados"${abierto ? ' open' : ''}>
            <summary>Solo si se prorrogó · ${nProrroga}</summary>
            <p class="guia" style="margin:10px 0 6px;font-size:.86rem">Su plazo inicial
              ya terminó, pero el contrato prevé prórrogas que lo llevarían hasta hoy.
              Que se haya prorrogado no se publica: puede seguir abierto o no.</p>
            <div class="ultimos-contratos">
              ${v.prorrogados.map(x => filaVigente(x, false)).join('')}
            </div>
            ${masDe('prorrogados', v.prorrogados.length, nProrroga)}
          </details>` : ''}`;

    hueco.querySelectorAll('[data-mas-vigentes]').forEach(b => b.onclick = async () => {
      const grupo = b.dataset.masVigentes;
      b.disabled = true;
      b.textContent = 'Cargando...';
      const { data, error } = await sb.rpc('vigentes_empresa', {
        cif_buscado: e.cif, grupo, saltar: v[grupo].length, cuantos: POR_PAGINA });
      if (error || !data) {
        b.disabled = false;
        b.textContent = 'Reintentar';
        return;
      }
      // Se añaden a lo guardado: al volver a la pestaña siguen ahí.
      v[grupo].push(...(data[grupo] ?? []));
      pintarVigentes(e);
    });
  }

  function pintarFicha(e) {
    const sectores = e.sectores ?? [];
    // La base trae los 8 con más contratos, pero los empates (todos con uno,
    // a menudo) llegaban en cualquier orden: a igualdad, el de más importe.
    // Por importe trae otros 8: el que más le paga puede tener un solo
    // contrato y no estar entre los de más contratos.
    const porImporte = ordenOrganos === 'importe';
    const euroDe = o => Number(o.importe) || 0;
    const organos = [...((porImporte ? e.organos_importe : null) ?? e.organos ?? [])]
      .sort(porImporte
        ? (a, b) => (euroDe(b) - euroDe(a)) || (b.contratos - a.contratos)
        : (a, b) => (b.contratos - a.contratos) || (euroDe(b) - euroDe(a)));
    const marcos = e.marcos ?? [];
    const utes = e.utes ?? [];
    const socios = e.socios ?? [];
    const nUtes = Math.max(e.n_utes ?? 0, utes.length);
    const raros = nUtes + marcos.length;

    // Por defecto, el resumen. Si en el periodo no tiene contratos pero sí
    // UTEs o acuerdos marco, se abre en esos: una vista vacía no enseña nada.
    // Al volver atrás a esta ficha, la vista que se dejó (va en el historial).
    if (vistaFicha.cif !== e.cif || !vistaFicha.cual) {
      const guardada = history.state?.cif === e.cif ? history.state.vistaFicha : null;
      vistaFicha = { cif: e.cif,
        cual: guardada ?? (!e.contratos && raros ? 'otros' : 'resumen') };
    }
    const vista = vistaFicha.cual === 'otros' && !raros ? 'resumen' : vistaFicha.cual;
    if (filtroContratos.cif !== e.cif) {
      filtroContratos = { cif: e.cif, buscar: '', sector: null, organo: null, orden: 'fecha' };
    }
    const fc = filtroContratos;
    // Los organismos para el filtro: los de más contratos y los de más
    // importe, sin repetir. Son los que la ficha trae (8 y 8).
    const nombresOrganos = [...new Set([...(e.organos ?? []), ...(e.organos_importe ?? [])]
      .sort((a, b) => b.contratos - a.contratos).map(o => o.organo).filter(Boolean))];
    if (fc.organo && !nombresOrganos.includes(fc.organo)) nombresOrganos.unshift(fc.organo);
    const nombresSectores = sectores.map(x => x.sector).filter(Boolean);
    if (fc.sector && !nombresSectores.includes(fc.sector)) nombresSectores.unshift(fc.sector);
    const opcion = (valor, texto, elegido) => `<option value="${esc(valor)}"${
      valor === elegido ? ' selected' : ''}>${esc(texto)}</option>`;

    // Otra empresa que se abre al pulsar: solo el nombre, con aspecto de
    // enlace. `desde` deja dicho en el historial de dónde se viene.
    const enlaceEmpresa = (cif, nombre) => `<a href="#" class="enlace-ficha"
      data-ver-cif="${esc(cif)}">${esc(nombre ?? cif)}</a>`;
    const yLista = enumerar;
    const etiquetaRaros = utes.length && marcos.length ? 'UTEs y acuerdos marco'
      : utes.length ? 'UTEs' : 'Acuerdos marco';
    const resumenRaros = yLista([
      nUtes ? plural(nUtes, 'UTE', 'UTEs') : '',
      marcos.length ? plural(marcos.length, 'acuerdo marco', 'acuerdos marco') : '',
    ].filter(Boolean));
    const titulo = t => `<h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">${t}</h4>`;

    zona.innerHTML = `
      <button class="volver-listas" id="volver-listas">${textoVolver()}</button>
      <div class="tarjeta-empresa" style="margin-top:8px">
        <div class="arriba">
          <div>
            <h3>${esc(e.nombre ?? e.cif)}</h3>
            ${socios.length ? `
              <p class="cifras" style="margin-top:-2px">
                <span>UTE formada por ${yLista(socios.map(s => enlaceEmpresa(s.cif, s.nombre)))}
                  <span style="color:var(--tenue)" title="Sacados del nombre de la UTE.
Cuánto le toca a cada socio no se publica.">· puede haber más socios</span></span>
              </p>` : ''}
            <p class="cifras">
              ${!e.contratos && raros
                // Solo UTEs o acuerdos marco: "0 contratos" sería cierto,
                // pero parece que la ficha está vacía.
                ? `<span>Sin contratos propios${cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}
                    · ${esc(resumenRaros)}</span>`
                : `<span><strong>${e.contratos}</strong> ${e.contratos === 1 ? 'contrato' : 'contratos'}${
                e.lotes > e.contratos ? ` (${e.lotes} lotes)` : ''}${
                cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}</span>`}
              ${e.importe ? `<span><strong>${euros(Number(e.importe))}</strong>
                adjudicados</span>` : ''}
              ${e.ultimo ? `<span>último en ${esc(new Date(e.ultimo)
                .toLocaleDateString('es-ES', {timeZone:ZONA, month:'long',
                year:'numeric'}))}</span>` : ''}
            </p>
          </div>
          ${e.cif === perfil.cif ? '' : `
            <button class="seguir" id="seguir" aria-pressed="${!!e.sigo}"
                    data-cif="${esc(e.cif)}" data-nombre="${esc(e.nombre ?? e.cif)}">
              ${e.sigo ? 'Siguiendo' : 'Seguir'}</button>`}
        </div>

        <div class="forma vista-ficha" role="group" aria-label="Qué enseñar de esta empresa">
          <button data-vista="resumen"
            aria-pressed="${vista === 'resumen'}">Resumen</button>
          <button data-vista="contratos"
            aria-pressed="${vista === 'contratos'}">Contratos<span class="n">${e.contratos}</span></button>
          <button data-vista="vigentes"
            aria-pressed="${vista === 'vigentes'}">Vigentes<span class="n" id="n-vigentes"></span></button>
          ${raros ? `<button data-vista="otros"
            aria-pressed="${vista === 'otros'}">${etiquetaRaros}<span class="n">${raros}</span></button>` : ''}
        </div>

        ${vista === 'resumen' ? `
          ${!e.contratos ? `<p class="sin-datos">Sin contratos propios${
            cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}.</p>` : ''}

        ${sectores.length ? `
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div class="forma" role="group" aria-label="Forma de los gráficos">
              <button data-forma="barras"
                aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
              <button data-forma="quesito"
                aria-pressed="${formaActual() === 'quesito'}">Circular</button>
            </div>
          </div>
          <div style="margin-bottom:26px">${reparto(sectores, 'sector', 'sector')}</div>` : ''}

        ${organos.length ? `
          <div style="display:flex;align-items:center;gap:12px;margin:0 0 12px">
          <h4 style="margin:0;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">${organos.length >= 8
                       // La base corta en 8: con 14 contratos y 8 organismos
                       // parecía que faltaban cifras.
                       ? 'Los 8 organismos a los que más vende' : 'A quién le vende'}</h4>
          ${organos.length > 1 ? `
            <div class="forma" role="group" aria-label="Ordenar organismos por">
              <button data-orden-organos="contratos"
                aria-pressed="${!porImporte}">Contratos</button>
              <button data-orden-organos="importe"
                aria-pressed="${porImporte}">Importe</button>
            </div>` : ''}
          </div>
          <table class="tabla"><tbody>
            ${organos.map(o => `<tr style="cursor:default">
              <td class="quien"><a href="#" class="enlace-ficha"
                data-a-organismo="${esc(o.organo)}">${esc(o.organo)}</a></td>
              <td class="num"><a href="#" class="enlace-ficha"
                data-contratos-organo="${esc(o.organo)}"
                title="Ver sus contratos con este organismo">${o.contratos}</a></td>
              <td class="num">${o.importe ? euros(Number(o.importe))
                // Corto: la columna mide 112 px (92 en el móvil) y no parte
                // líneas. El porqué va en el texto flotante.
                : `<span style="color:var(--tenue)" title="${SIN_IMPORTE}">sin importe</span>`}</td>
            </tr>`).join('')}
          </tbody></table>` : ''}

        ` : ''}

        ${vista === 'contratos' ? (!e.contratos ? `<p class="sin-datos">Sin contratos propios${
            cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}.</p>` : `
          <div class="filtros-contratos">
            <input type="search" id="buscar-contratos" value="${esc(fc.buscar)}"
              placeholder="Buscar por título u organismo" aria-label="Buscar en sus contratos">
            ${nombresSectores.length > 1 || fc.sector ? `
              <select id="sector-contratos" aria-label="Sector">
                ${opcion('', 'Todos los sectores', fc.sector ?? '')}
                ${nombresSectores.map(x => opcion(x, x, fc.sector)).join('')}
              </select>` : ''}
            ${nombresOrganos.length > 1 || fc.organo ? `
              <select id="organo-contratos" aria-label="Organismo">
                ${opcion('', 'Todos los organismos', fc.organo ?? '')}
                ${nombresOrganos.map(x => opcion(x, x, fc.organo)).join('')}
              </select>` : ''}
            <select id="orden-contratos" aria-label="Ordenar">
              ${opcion('fecha', 'Más recientes', fc.orden)}
              ${opcion('importe', 'Mayor importe', fc.orden)}
            </select>
          </div>
          <p class="cuenta-contratos" id="cuenta-contratos" aria-live="polite"></p>
          <div class="ultimos-contratos" id="lista-contratos"></div>
          <button type="button" class="mas" id="mas-contratos" hidden></button>`) : ''}

        ${vista === 'vigentes' ? `
          <p class="guia" style="margin:0 0 6px;font-size:.86rem">Lo que tiene abierto
            hoy, sin mirar el periodo de arriba. El final se calcula con la fecha de
            formalización y la duración publicada: los contratos que no publican su
            duración no salen.</p>
          <div id="vigentes"><p class="guia">Cargando...</p></div>` : ''}

        ${vista === 'otros' ? `
          ${utes.length ? `
            ${titulo('UTEs en las que participa')}
            <p class="guia" style="margin:0 0 6px;font-size:.86rem">Uniones temporales
              con otras empresas. No cuentan en sus cifras: el importe es el de
              toda la UTE, y cuánto le toca a cada socio no se publica.${
              nUtes > utes.length ? ` Aquí, las ${utes.length} más recientes de ${nUtes}.` : ''}</p>
            <div class="ultimos-contratos">
              ${utes.map(u => `<div>
                <p class="que">${enlaceEmpresa(u.cif, u.nombre)}</p>
                <span class="quien">${plural(u.contratos, 'contrato', 'contratos')}${
                  Number(u.importe_ute) ? ` · ${euros(Number(u.importe_ute))} la UTE entera` : ''}${
                  u.socios?.length ? ` · con ${yLista(u.socios.map(s =>
                    enlaceEmpresa(s.cif, s.nombre)))}` : ''}</span>
              </div>`).join('')}
            </div>` : ''}

        ${marcos.length ? `
          ${titulo('Acuerdos marco en los que está homologada')}
          <p class="guia" style="margin:0 0 6px;font-size:.86rem">Cualquier organismo
            adherido le puede encargar sin nueva licitación. No cuentan en las
            cifras de arriba: el dinero llega por los contratos que salen de ellos.</p>
          <div class="ultimos-contratos">
            ${marcos.map(m => `<div>
              <p class="que">${tituloConEnlace(m.titulo, m.enlace)}</p>
              <span class="quien">${esc(m.organo ?? '')}${
                m.lotes > 1 ? ` · ${plural(m.lotes, 'lote', 'lotes')}` : ''}${
                m.fecha ? ` · desde ${esc(new Date(m.fecha).toLocaleDateString('es-ES',
                  {timeZone:ZONA, month:'long', year:'numeric'}))}` : ''}${
                m.valor_marco ? ` · marco de ${euros(Number(m.valor_marco))} en total` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
        ` : ''}
      </div>`;

    zona.querySelectorAll('[data-ver-cif]').forEach(a => {
      a.onclick = ev => {
        ev.preventDefault();
        verEmpresa(a.dataset.verCif, false, e.nombre ?? e.cif);
      };
    });
    // El organismo abre su ficha en la pestaña Organismos.
    zona.querySelectorAll('[data-a-organismo]').forEach(a => {
      a.onclick = ev => {
        ev.preventDefault();
        pantallaOrganismos(perfil, session, false, a.dataset.aOrganismo);
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
    });
    zona.querySelectorAll('[data-vista]').forEach(b => {
      b.onclick = () => {
        if (b.getAttribute('aria-pressed') === 'true') return;
        vistaFicha = { cif: e.cif, cual: b.dataset.vista };
        // Sin entrada nueva en el historial: cambiar de vista no es cambiar
        // de página, y "atrás" debe seguir llevando a la ficha anterior.
        history.replaceState({ ...history.state, vistaFicha: b.dataset.vista }, '');
        pintarFicha(e);
      };
    });

    // Del resumen a la lista: un sector del gráfico o el número de
    // contratos de un organismo abren la pestaña Contratos ya filtrada.
    const aContratos = filtro => {
      filtroContratos = { ...filtroContratos, buscar: '', sector: null, organo: null, ...filtro };
      vistaFicha = { cif: e.cif, cual: 'contratos' };
      history.replaceState({ ...history.state, vistaFicha: 'contratos' }, '');
      pintarFicha(e);
      const pestanas = zona.querySelector('.vista-ficha');
      if (pestanas && pestanas.getBoundingClientRect().top < 0) {
        pestanas.scrollIntoView({ block: 'start', behavior: 'instant' });
      }
    };
    activarBarras(zona, vista === 'resumen'
      ? { texto: 'Ver sus contratos', alPulsar: sector => aContratos({ sector }) } : null);
    zona.querySelectorAll('[data-contratos-organo]').forEach(a => {
      a.onclick = ev => {
        ev.preventDefault();
        aContratos({ organo: a.dataset.contratosOrgano });
      };
    });
    alPulsar('volver-listas', () => history.back());
    periodoAplica(vista !== 'vigentes');

    // La cifra de la pestaña Vigentes llega cuando llega.
    pedirVigentes(e.cif).then(v => {
      const n = document.getElementById('n-vigentes');
      if (n && ultimaEmpresa?.cif === e.cif) n.textContent = v.n_en_plazo + v.n_prorrogados;
    }, () => {});

    if (vista === 'contratos' && e.contratos) {
      // Escribir no repinta la ficha (se perdería el foco): solo la lista,
      // y un rato después de la última tecla.
      let espera = null;
      const buscador = document.getElementById('buscar-contratos');
      buscador.oninput = () => {
        clearTimeout(espera);
        espera = setTimeout(() => {
          filtroContratos.buscar = buscador.value.trim();
          cargarContratos(e);
        }, 300);
      };
      [['sector-contratos', 'sector'], ['organo-contratos', 'organo'],
       ['orden-contratos', 'orden']].forEach(([id, campo]) => {
        const sel = document.getElementById(id);
        if (sel) sel.onchange = () => {
          filtroContratos[campo] = sel.value || (campo === 'orden' ? 'fecha' : null);
          cargarContratos(e);
        };
      });
      alPulsar('mas-contratos', () => cargarContratos(e, true));
      cargarContratos(e);
    }
    if (vista === 'vigentes') pintarVigentes(e);

    // El interruptor se atiende por delegación, más abajo: volver a
    // engancharlo en cada dibujado lo duplicaba.
    ultimaEmpresa = e;

    alPulsar('seguir', async () => {
      const b = document.getElementById('seguir');
      // Como en las listas: quieto mientras responde, y un fallo se dice
      // como fallo (sin mirar `error`, salía "Quitada de tu lista").
      if (b.disabled) return;
      b.disabled = true;
      let respuesta;
      try {
        respuesta = await sb.rpc('seguir', {
          cif_empresa: b.dataset.cif, nombre_empresa: b.dataset.nombre });
      } catch (error) { respuesta = { error }; }
      b.disabled = false;
      if (respuesta.error) {
        recado('No se ha podido guardar. Inténtalo de nuevo.');
        return;
      }
      const data = respuesta.data;
      e.sigo = !!data;
      b.setAttribute('aria-pressed', String(!!data));
      b.textContent = data ? 'Siguiendo' : 'Seguir';
      if (data) recadoSeguir('de lo que gane');
      else recado('Quitada de tu lista de seguimiento');
      olvidar('mi_seguimiento', 'competencia', 'movimientos_mercado',
              'seguimiento_periodo', 'competencia_periodo',
              'movimientos_periodo', 'resumen_periodo', 'mis_seguimientos');
    });
  }

  // Un NIF abre la ficha directamente; cualquier otra cosa se busca por
  // nombre con la misma búsqueda del alta (tabla `empresas`, por
  // trigramas), y se elige de la lista.
  const pareceNif = t => /^([A-Z]\d{7}[A-Z0-9]|\d{8}[A-Z]|[XYZ]\d{7}[A-Z]|U\d{8})$/
    .test(t.replace(/[^a-zA-Z0-9]/g, '').toUpperCase());
  const mensajeBusqueda = html => {
    repintarVista = null;
    periodoAplica(true);
    zona.classList.remove('cambiando');
    zona.innerHTML = `<button class="volver-listas" id="volver-busqueda">
      ← Volver a las listas</button>${html}`;
    alPulsar('volver-busqueda', () => { campo.value = ''; verListas(); });
  };
  async function buscarPorNombre(texto) {
    const turno = ++vueltaEmp;
    esperando('Buscando...');
    let r;
    try { r = await llamar('buscar_empresa', { empresa: texto }); }
    catch {
      if (turno !== vueltaEmp) return;
      return mensajeBusqueda(`<div class="aviso mal">No hemos podido buscar.
        Inténtalo de nuevo.</div>`);
    }
    if (turno !== vueltaEmp) return;
    const empresas = r.empresas ?? [];
    if (empresas.length === 1) return verEmpresa(empresas[0].cif);
    if (!empresas.length) return mensajeBusqueda(`<div class="aviso">Ninguna
      empresa con contratos públicos se llama así. Prueba con una parte del
      nombre o con su NIF.</div>`);
    mensajeBusqueda(`
      <p class="guia" style="margin:10px 0 4px">${plural(empresas.length,
        'empresa coincide', 'empresas coinciden')} con «${esc(texto)}»:</p>
      <div class="coincidencias">${empresas.map(e => `
        <button data-elige-cif="${esc(e.cif)}">
          <strong>${esc(e.nombre ?? e.cif)}</strong>
          <span class="nif">${esc(e.cif)}${e.contratos != null
            ? ` · ${plural(numero(e.contratos), 'contrato', 'contratos')}` : ''}</span>
        </button>`).join('')}</div>`);
    zona.querySelectorAll('[data-elige-cif]').forEach(b =>
      b.onclick = () => verEmpresa(b.dataset.eligeCif));
  }

  alPulsar('buscar-cif', () => {
    const texto = campo.value.trim();
    if (pareceNif(texto)) verEmpresa(texto);
    else if (texto.length >= 3) buscarPorNombre(texto);
    else campo.focus();
  });
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('buscar-cif').click();
  });

  if (cif) { campo.value = cif; verEmpresa(cif, true); }
  else verListas();
}

// ============================================================
// 7 · Panel de la cuenta
// ============================================================

// Menú de cuenta. Vive en la cabecera de las dos pantallas —contratos y
// panel— para que llegar a cualquier sección sea un solo clic. Antes
// había que entrar al panel y buscar otro botón dentro, y algo que se
// usa a diario no puede estar a dos pasos.
// Mi cuenta guarda lo que configura el servicio. Los sectores y los
// organismos se han ido a Mercado: son inteligencia sobre la propia
// empresa, el mismo dato que se ve de un competidor, y tenerlos aquí los
// separaba de donde pertenecen.
const SECCIONES = {
  cuenta: 'Mi cuenta',
  filtro: 'Mi filtro',
  avisos: 'Mis avisos',
};

// Los diálogos retienen el foco mientras están abiertos, y Escape los
// cierra. Sin esto, el tabulador se iba a la lista de detrás, que ni se ve.
function atraparFoco(velo, alEscapar = null) {
  velo.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && alEscapar) { ev.preventDefault(); alEscapar(); return; }
    if (ev.key !== 'Tab') return;
    const enfocables = [...velo.querySelectorAll(
      'button:not([disabled]), textarea, input, a[href], [tabindex="0"]')];
    if (!enfocables.length) return;
    const primero = enfocables[0], ultimo = enfocables.at(-1);
    if (ev.shiftKey && document.activeElement === primero) {
      ev.preventDefault(); ultimo.focus();
    } else if (!ev.shiftKey && document.activeElement === ultimo) {
      ev.preventDefault(); primero.focus();
    }
  });
}

// Confirmación efímera. Se usa donde la acción no deja rastro visible
// por sí sola, como la campana: un icono que cambia de forma no explica
// qué ha pasado.
//
// `accion` ({ texto, hacer }) añade un botón, como el "Deshacer" de un
// descarte; entonces dura lo que se le diga, que es lo que hay para pulsarlo.
let recadoTemporizador;
function recado(texto, accion = null, duracion = 3200) {
  let caja = document.getElementById('recado');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'recado';
    caja.className = 'recado';
    caja.setAttribute('role', 'status');
    document.body.appendChild(caja);
  }
  caja.textContent = texto;
  if (accion) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'accion-recado';
    b.textContent = accion.texto;
    b.onclick = () => {
      clearTimeout(recadoTemporizador);
      caja.classList.remove('visible');
      accion.hacer();
    };
    caja.append(' ', b);
  }
  // Sin la clase, un recado sin botón no recibe clics: no tapa lo de debajo.
  caja.classList.toggle('con-accion', !!accion);
  requestAnimationFrame(() => caja.classList.add('visible'));
  clearTimeout(recadoTemporizador);
  recadoTemporizador = setTimeout(() => caja.classList.remove('visible'), duracion);
}

// Seguir avisa (Decisión 56). Lo que se dice al empezar a seguir algo
// depende de la campana: con ella apagada no llega ningún correo, y
// decir "te avisaremos" sería prometer algo que no va a pasar.
function recadoSeguir(deQue) {
  const encendida = document.getElementById('campana')
    ?.getAttribute('aria-pressed') === 'true';
  recado(encendida
    ? `Te avisaremos por correo ${deQue}`
    : `Guardado. Enciende la campana para que te avisemos ${deQue}`,
    null, 4200);
}

// La campana enciende y apaga el correo diario. Va suelta y no dentro
// del menú porque su estado tiene que verse de un vistazo: si alguien
// apagó los avisos hace un mes, debe notarlo sin abrir nada.
// La campana enciende y apaga el aviso; la flechita pegada a ella abre el
// atajo al configurador (qué sectores y qué zona llegan en el correo), que
// si no queda enterrado en Mi cuenta.
function campanaAvisos() {
  return `
    <div class="menu-envoltorio campana-grupo">
      <button class="campana" id="campana" aria-pressed="true"
              aria-label="Avisos por correo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>

          fill="none" stroke="currentColor" stroke-width="1.5"

        <button role="menuitem" data-ir-avisos>Configurar mis avisos</button>
      </div>
    </div>`;
}

function activarCampana(yaSabido = null) {
  const boton = document.getElementById('campana');
  if (!boton) return;

  // Sin texto al pasar por encima: el mensaje de confirmación ya lo
  // explica, y el del navegador tarda en salir, no existe en el móvil y
  // deja el mismo texto dos veces en pantalla.
  const pintar = encendido =>
    boton.setAttribute('aria-pressed', String(encendido));

  // El panel ya ha consultado mi_panel, así que se le pasa el dato en
  // vez de repetir la llamada.
  if (yaSabido !== null) pintar(yaSabido !== false);
  else sb.rpc('mi_panel').then(({ data }) => pintar(data?.avisos !== false));

  boton.onclick = async () => {
    const quiero = boton.getAttribute('aria-pressed') !== 'true';
    // Se pinta al instante: el cliente no debe esperar al servidor para
    // ver que su decisión se ha registrado.
    pintar(quiero);
    recado(quiero
      ? 'Recibirás el aviso diario por correo'
      : 'Ya no recibirás el aviso diario');
    // Supabase no lanza: devuelve `{ error }`. Con solo un `catch`, un
    // fallo dejaba la campana pintada como si se hubiera guardado.
    let respuesta;
    try { respuesta = await sb.rpc('cambiar_avisos', { quiero }); }
    catch (error) { respuesta = { error }; }
    if (respuesta.error) {
      pintar(!quiero);
      recado('No se ha podido guardar. Inténtalo de nuevo.');
      return;
    }
    pintar(respuesta.data !== false);
  };
}

        <div class="separa"></div>

                aria-pressed="false">Modo oscuro<span class="palanca"></span></button>

function activarMenu(perfil, session) {
  // Cada pantalla de la aplicación pasa por aquí una vez al pintarse: es
  // el momento de soltar los oyentes de la anterior.
  estrenarPantalla();

  const menu = document.getElementById('menu');
  const abrir = document.getElementById('abrir-menu');
  if (!menu || !abrir) return;

  const cerrar = () => {
    menu.hidden = true;
    abrir.setAttribute('aria-expanded', 'false');
  };
  abrir.onclick = ev => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.menu-envoltorio')) cerrar();
  }, dePantalla());
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') cerrar();
  }, dePantalla());

  menu.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    cerrar();
    pantallaPanel(perfil, session, false, b.dataset.ir);
  });
  alPulsar('salir-menu', () => sb.auth.signOut());

  const boton = document.getElementById('tema');
  if (boton) {
    boton.setAttribute('aria-pressed', String(temaActual() === 'oscuro'));
    boton.onclick = ev => {
      ev.stopPropagation();
      const nuevo = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
      ponerTema(nuevo);
      boton.setAttribute('aria-pressed', String(nuevo === 'oscuro'));
    };
  }
}


async function pantallaPanel(perfil, session, volviendo = false, seccion = 'cuenta') {
  if (!volviendo) irA('panel', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  // Barras apiladas: la línea entera es el total, y cada segmento la
  // parte que representa. Una barra que se llena al 100 % por ser la
  // mayor no dice nada; ésta responde a "cuánto de mi negocio es esto".
  //
