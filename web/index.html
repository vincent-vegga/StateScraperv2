    // porcentaje suelto no distingue un organismo de otro; lo que
    // informa es la diferencia.
    const comparar = (valor, referencia, sufijo) => {
      if (!referencia) return '';
      const dif = Math.round((valor - referencia) * 10) / 10;
      if (Math.abs(dif) < 0.5) return 'igual que tu sector';
      return `${Math.abs(dif).toString().replace('.', ',')} ${sufijo} ${
        dif > 0 ? 'más' : 'menos'} que tu sector`;
    };

    if (d.baja_media && d.con_baja >= MINIMO_PARA_MEDIA) {
      const roza = comparar(d.baja_media, d.baja_sector, 'puntos');
      trozos.push(`<div>
        <dt>Se adjudica al</dt>
        <dd>${d.baja_media} %
          <span class="matiz">del presupuesto${roza ? ` · ${roza}` : ''}
          <br>medido en ${d.con_baja} ${
            d.con_baja === 1 ? 'contrato' : 'contratos'}</span>
        </dd></div>`);
    }

    if (d.licitadores_medio && d.con_licitadores >= MINIMO_PARA_MEDIA) {
      // Que la mitad de los contratos vayan con un solo licitador sí es
      // propio de ese organismo, y responde a si merece la pena
      // presentarse.
      const solos = d.sin_competencia > d.con_licitadores / 2;
      const roza = comparar(d.licitadores_medio, d.licitadores_sector, '');
      trozos.push(`<div class="${solos ? 'alerta' : ''}">
        <dt>Se presentan</dt>
        <dd>${String(d.licitadores_medio).replace('.', ',')}
          <span class="matiz">${Number(d.licitadores_medio) === 1 ? 'empresa' : 'empresas'} de media${roza ? ` · ${roza}` : ''}
          ${d.sin_competencia ? `<br><strong>${d.sin_competencia}</strong> de
            ${d.con_licitadores} con un solo licitador` : ''}</span>
        </dd></div>`);
    }

    if (d.procedimientos?.length) {
      const p = d.procedimientos[0];
      trozos.push(`<div>
        <dt>Suele adjudicar por</dt>
        <dd style="font-size:1.02rem">${esc(p.cual)}
          <span class="matiz">${p.cuantos} de sus ${d.contratos}${
            d.procedimientos.length > 1
              ? ` · ${d.procedimientos.length === 2 ? 'y otra vía'
                  : `y otras ${d.procedimientos.length - 1} vías`}` : ''}</span>
        </dd></div>`);
    }

    if (!trozos.length) {
      return `<p class="poca-muestra">Este organismo tiene pocos contratos
        publicados en tus sectores como para decir cómo adjudica.</p>`;
    }
    return `<dl class="como-adjudica">${trozos.join('')}</dl>`;
  }

  function pintar(cual, d) {
    const empresas = d.empresas ?? [];
    const contratos = d.contratos_lista ?? [];

    zona.innerHTML = `
      <div class="ficha-organo">
        <div class="arriba">
          <div>
            <h2>${esc(d.organo)}</h2>
            <p class="cifras">
              <span><strong>${d.contratos}</strong> ${
                d.contratos === 1 ? 'contrato' : 'contratos'}${aniosSector.length
                ? ` ${esc(enPeriodo(periodoGuardado(aniosSector), aniosSector))}` : ''}</span>
              <span><strong>${d.n_empresas ?? empresas.length}</strong> ${
                (d.n_empresas ?? empresas.length) === 1 ? 'empresa' : 'empresas'}</span>
              ${d.importe ? `<span><strong>${euros(Number(d.importe))}</strong>
                adjudicados</span>` : ''}
              ${d.provincia ? `<span>${esc(d.provincia)}</span>` : ''}
            </p>
          </div>
        </div>
        <div class="hueco-periodo" id="periodo-org"></div>
        <div class="cuerpo-ficha">

        ${bloqueAdjudicacion(d)}

        <div class="dos-paneles">
          <div class="panel-organo">
            <div style="display:flex;align-items:center;margin-bottom:10px">
              <h4 style="margin:0">A quién le compra</h4>
              <div class="forma" role="group" aria-label="Forma del gráfico">
                <button data-forma="barras"
                  aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
                <button data-forma="quesito"
                  aria-pressed="${formaActual() === 'quesito'}">Circular</button>
              </div>
            </div>
            ${apilada(empresas, 'nombre', 'contratos', 'contratos', false,
                      'cif', false)}
            <div class="lista-empresas" style="margin-top:18px">
              ${empresas.slice(0, 10).map(e => `
                <div class="${e.es_mia ? 'mia' : ''}" data-cif="${esc(e.cif ?? '')}">
                  <span class="quien">${esc(e.nombre ?? '—')}</span>
                  <span class="cuanto">${e.contratos}
                    <span>${e.importe ? euros(Number(e.importe)) : '—'}</span></span>
                </div>`).join('')}
            </div>
          </div>

          <div class="panel-organo">
            <h4 id="rotulo-contratos">Sus contratos</h4>
            <div class="contratos-organo" id="contratos-organo"></div>
          </div>
        </div>
        </div>
      </div>`;

    ultimoOrgano = cual; ultimaFicha = d; ultimasEmpresas = empresas;
    ultimosContratos = contratos;
    ponerSelector(cual);

    // ---------- Los contratos siguen a lo que señalas ----------
    //
    // Al pasar por encima de una empresa —en el gráfico o en la lista—,
    // la columna de la derecha enseña SUS contratos. Sin eso el gráfico
    // solo dice cuánto se lleva cada una; con eso dice qué le ha
    // comprado.
    const cajaContratos = document.getElementById('contratos-organo');
    const rotulo = document.getElementById('rotulo-contratos');

    // Al señalar una empresa salen también los contratos en los que ganó
    // un lote sin ser la principal, y con SU parte, no con el total.
    const pintarContratos = (cifs, quien) => {
      const ganadoresDe = c => c.cifs ?? [c.cif];
      const filtrados = cifs
        ? contratos.filter(c => ganadoresDe(c).some(x => cifs.includes(x)))
        : contratos;
      const cifra = c => {
        if (cifs?.length === 1 && c.partes) return c.partes[cifs[0]];
        return c.total ?? c.importe;
      };
      rotulo.textContent = quien ? `Contratos de ${quien}` : 'Sus contratos';
      cajaContratos.innerHTML = filtrados.length
        ? filtrados.slice(0, 14).map(c => `
            <div class="${c.es_mia ? 'mia' : ''}">
              <p class="que">${esc(c.titulo ?? '')}</p>
              <span class="quien">${esc(c.empresa ?? '')}${
                c.otros ? ` y ${c.otros} más` : ''}${
                cifra(c) ? ` · ${euros(Number(cifra(c)))}` : ''}</span>
              ${(c.licitadores || c.baja || c.oferta_baja) ? `
                <span class="detalle-contrato">
                  ${c.licitadores ? `<span><strong>${c.licitadores}</strong>
                    ${c.licitadores === 1 ? 'licitador' : 'licitadores'}</span>` : ''}
                  ${c.baja ? `<span>al <strong>${c.baja} %</strong></span>` : ''}
                  ${c.oferta_baja && c.oferta_alta
                    && Number(c.oferta_alta) > Number(c.oferta_baja)
                    ? `<span>de ${euros(Number(c.oferta_baja))} a ${
                       euros(Number(c.oferta_alta))}</span>` : ''}
                </span>` : ''}
            </div>`).join('')
        : `<p class="sin-datos">Sin contratos en el periodo elegido.</p>`;
    };
    pintarContratos(null, null);

    const señalar = el => {
      const clave = el.dataset.clave ?? el.dataset.cif ?? '';
      if (!clave) return pintarContratos(null, null);
      const cifs = clave.split(',').filter(Boolean);
      const suya = empresas.find(e => e.cif === cifs[0]);
      pintarContratos(cifs, cifs.length === 1 ? (suya?.nombre ?? null) : null);
    };

    // El detalle y el interruptor se atienden por delegación desde
    // `zona`, enganchados UNA vez al abrir la pantalla. Volver a
    // engancharlos en cada dibujado los duplicaba y bastaba con que uno
    // fallara para que el botón dejara de responder.
    señalarAhora = señalar;
    limpiarAhora = () => pintarContratos(null, null);

    activarBarras(zona);

  }

  if (organo) { campo.value = organo; abrir(organo); }
  else zona.innerHTML = `<p class="guia" style="margin-top:26px">
    Escribe el nombre de un organismo para ver su ficha.</p>`;
}

// ---------- Movimientos del mercado ----------
//
// Los contratos que se han adjudicado en su sector durante el último mes.
//
// Va en la web y no en el correo: el correo es para lo que caduca —una
// licitación que cierra el jueves exige acción hoy— y una adjudicación ya
// cerrada no. Meterla ahí le restaría urgencia a lo que sí la tiene.
// Clasifica lo adjudicado que aún no tenga veredicto. Enseña progreso
// porque la primera vez son unos segundos, y una pantalla parada sin
// explicación se lee como que algo va mal.
async function cribarMercado() {
  const { data: cola } = await sb.rpc('mercado_sin_cribar', { dias: 30 });
  const total = (cola ?? []).length;
  if (!total) return;

  const zona = document.getElementById('zona');
  zona.innerHTML = `
    <div class="paso ancha" style="min-height:40vh">
      <h1 style="font-size:1.5rem">Revisando tu mercado</h1>
      <p class="lema">${total === 1
        ? 'Estamos comprobando si la adjudicación de este mes es de verdad de tu sector.'
        : `Estamos comprobando cuáles de las ${total} adjudicaciones de este mes
           son de verdad de tu sector.`}
      Solo hace falta la primera vez.</p>
      <div class="avance" style="margin-top:24px">
        <div class="barra"><div class="relleno" id="relleno-mercado"></div></div>
        <div class="cuenta"><span id="paso-mercado">Empezando...</span><span></span></div>
      </div>
    </div>`;

  let quedan = total;
  for (let vuelta = 0; vuelta < 30; vuelta++) {
    let r;
    try {
      r = await llamar('cribar_mercado', { dias: 30 });
    } catch {
      break;   // Si falla, se enseña sin filtrar antes que no enseñar nada.
    }

    // Si una vuelta clasifica y NO guarda nada, seguir es dar vueltas:
    // la siguiente encontrará los mismos contratos y la pantalla se
    // quedaría girando para siempre.
    if (r?.cribados > 0 && !r?.guardados) break;

    const antes = quedan;
    quedan = r?.quedan ?? 0;
    const hechas = total - quedan;
    const barra = document.getElementById('relleno-mercado');
    if (barra) barra.style.width = `${total ? hechas / total * 100 : 100}%`;
    const texto = document.getElementById('paso-mercado');
    if (texto) texto.textContent = `${hechas} de ${total}`;
    if (r?.terminado || !quedan || quedan >= antes) break;
  }
}

async function pantallaMovimientos(perfil, session, volviendo = false,
                                   provinciaElegida = '') {
  if (!volviendo) irA('movimientos');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Movimientos</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('movimientos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <div id="zona"><p class="guia" style="margin-top:30px">Cargando...</p></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'movimientos');

  // Se criba antes de enseñar, la primera vez.
  //
  // El sector se define cruzando códigos CPV y eso trae empresas que no
  // compiten: a un proveedor de equipamiento médico le salían empresas
  // de mantenimiento de escuelas y de semáforos. El clasificador que ya
  // filtra sus contratos abiertos sabe distinguirlas.
  //
  // Solo pasa una vez: el veredicto se guarda, y lo que entra a diario
  // lo criba el propio scraper.
  await cribarMercado();

  // El periodo, compartido con Organismos y Empresas. Por defecto, el
  // último año con datos.
  const anios = await aniosDelSector();
  let periodo = periodoGuardado(anios);
  let provincia = provinciaElegida || null;

  // La estructura primero, los datos después: reemplazar la pantalla
  // entera por «Cargando...» da sensación de salto en cada cambio de
  // pestaña o de periodo. Así la cabecera y el selector no parpadean.
  document.getElementById('zona').innerHTML = `
    <div class="cabeza-movimientos">
      <div>
        <h1 style="margin:0 0 12px">Qué se ha adjudicado en tu sector</h1>
        <p class="guia" style="margin:0">Los contratos adjudicados en el
        periodo elegido con los mismos códigos que los tuyos. Quién los ganó,
        de qué organismo y por cuánto.</p>
      </div>
      <div class="hueco-periodo" id="periodo-mov"></div>
    </div>
    <div id="datos-mov">
      <div class="pulso"><h4>En tu sector</h4>
        <p class="guia" style="margin:0;font-size:.9rem">Cargando...</p></div>
    </div>`;

  if (!anios.length) {
    document.getElementById('datos-mov').innerHTML = `<p class="vacio">
      Todavía no hay adjudicaciones registradas en tus sectores.</p>`;
    return;
  }

  selectorPeriodo(document.getElementById('periodo-mov'), anios, periodo, p => {
    periodo = p;
    cargar();
  });

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    { timeZone: ZONA, day: 'numeric', month: 'short', year: 'numeric' }) : '';

  // Cada petición lleva su número: si el cliente cambia de periodo dos
  // veces seguidas, la respuesta lenta de la primera no pisa la segunda.
  let vuelta = 0;

  async function cargar() {
    const turno = ++vuelta;
    const datos = document.getElementById('datos-mov');
    if (!datos) return;
    datos.classList.add('cambiando');

    // Cifras y rankings sobre el periodo ENTERO, calculados en la base.
    // La lista solo trae los más recientes: con un año son miles.
    const extra = { provincia_elegida: provincia };
    const [res, mov] = await Promise.all([
      pedir('resumen_periodo', argsPeriodo(periodo, extra)),
      pedir('movimientos_periodo', argsPeriodo(periodo, { ...extra, tope: 300 })),
    ]);
    if (turno !== vuelta || !document.getElementById('datos-mov')) return;
    datos.classList.remove('cambiando');

    // Un fallo NO se enseña como "no hay nada".
    //
    // Cuando la consulta se cae —un tiempo de espera agotado mientras el
    // catálogo escribe, por ejemplo— la pantalla decía "Todavía no hay
    // adjudicaciones en tus sectores". Y eso es mentira: las hay, pero no
    // se han podido leer. El cliente concluye que su sector está parado.
    if (res.error || mov.error) {
      const fallo = res.error || mov.error;
      datos.innerHTML = `
        <div class="aviso mal" style="margin-top:26px">
          No hemos podido cargar los movimientos.
          <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
            ${esc(fallo.message || 'Error desconocido')}</div>
          <div style="margin-top:14px">
            <button class="secundario" id="reintentar">Reintentar</button>
          </div>
        </div>`;
      alPulsar('reintentar', cargar);
      return;
    }
    pintarDatos(res.data ?? {}, mov.data ?? []);
  }

  function pintarDatos(r, filas) {
    // Una fila por licitación, con TODOS sus ganadores. `total` es el
    // importe del expediente e `importe` la parte de la principal.
    const lista = filas.map(m => ({
      ...m,
      total: m.total ?? m.importe,
      ganadores: m.ganadores?.length ? m.ganadores : [{
        cif: m.cif, nombre: m.empresa, importe: m.importe, lotes: 1,
        es_mia: m.es_mia, la_sigo: m.la_sigo }],
    }));
    const provincias = r.provincias ?? [];
    const cuantos = Number(r.contratos) || 0;

    function bloqueRanking(filas, titulo, id) {
      if (!filas?.length) return '';
      // Todas las barras ocupan lo mismo: el importe total ya está
      // escrito a la derecha, así que la barra no tiene que repetirlo. Lo
      // que muestra es OTRA cosa: cómo se reparte ese dinero entre sus
      // contratos, y si depende de uno grande o lo tiene repartido.
      //
      // Tres tramos y el resto agrupado. Con diez o quince, los pequeños
      // quedaban en hilos de dos píxeles imposibles de señalar, y uno
      // grande se comía la barra entera.
      return `
        <div class="ranking" data-ranking="${id}">
          <h4>${titulo}</h4>
          <ol>${filas.map((f, i) => {
            const euros_ = Number(f.euros) || 0;
            const tramos = [...(f.tramos ?? [])];
            if (f.resto_n) tramos.push({
              titulo: f.resto_n === 1 ? 'Otro contrato' : `Otros ${f.resto_n} contratos`,
              quien: '', importe: f.resto_importe, agrupado: true,
            });
            return `<li class="${f.es_mia ? 'mia' : f.la_sigo ? 'sigo' : ''}">
              <div class="fila-ranking">
                <span class="cual">${esc(f.nombre)}${
                  f.provincia && id === 'organos'
                    ? `<span class="cuanto"> · ${esc(f.provincia)}</span>` : ''}</span>
                <span class="cuanto">${f.n} · ${euros_ ? euros(euros_) : 'sin importe'}</span>
              </div>
              <div class="barra-tramos">
                ${tramos.map((c, j) => `<button class="tramo"
                  style="width:${euros_
                    ? (Number(c.importe) || 0) / euros_ * 100
                    // En un acuerdo marco se sabe quién gana pero no
                    // cuánto: tramos iguales, en vez de una barra vacía.
                    : 100 / tramos.length}%;
                         background:${c.agrupado ? COLOR_OTROS : PALETA[(i + j) % PALETA.length]}"
                  data-titulo="${esc(c.titulo ?? '')}"
                  data-quien="${esc(c.quien ?? '')}"
                  data-importe="${esc(euros(Number(c.importe)) ?? '')}"
                  aria-label="${esc(c.titulo ?? '')}"></button>`).join('')}
              </div>
            </li>`;
          }).join('')}</ol>
          <div class="detalle-tramo" data-hueco-ranking>
            <span class="titulo-tramo" style="font-weight:400;color:var(--tenue)">
              Cada barra reparte ese dinero entre sus contratos. Toca o
              pasa por encima de un tramo para ver cuál es.</span>
          </div>
        </div>`;
    }

    // Sin el porcentaje sobre el presupuesto.
    //
    // Medido sobre 263.412 contratos: la media salía en 4.896 % y 100.862
    // estaban por encima del presupuesto. Los dos campos no comparan lo
    // mismo —importes de acuerdos marco frente a presupuestos de
    // contratos basados, lotes sueltos frente al expediente entero— y
    // publicarlo sería peor que no dar el dato: alguien podría calcular
    // una oferta con él.
    //
    // Una línea por contrato, no por compra.
    //
    // Un acuerdo marco de stents publica CADA compra derivada como su
    // propio expediente: salían 41 líneas con el mismo título y distinta
    // empresa. Se agrupan por organismo y título, y el detalle se
    // despliega.
    const grupos = new Map();
    lista.forEach(m => {
      const k = m.grupo || m.id_licitacion;
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(m);
    });

    // Con varios ganadores: la principal "y 12 más". Si entre los demás
    // está tu empresa o una que sigues, se dice cuál y qué se llevó: es
    // lo único de esos doce que le importa.
    const unaLinea = m => {
      const [principal, ...resto] = m.ganadores;
      const destacados = resto.filter(g => g.es_mia || g.la_sigo);
      const marca = principal?.es_mia ? 'tu empresa'
        : principal?.la_sigo ? 'la sigues'
        : m.es_mia ? 'tu empresa entre ellas'
        : m.la_sigo ? 'una que sigues' : '';
      return `<div class="movimiento ${m.es_mia ? 'mia' : m.la_sigo ? 'sigo' : ''}">
        <div>
          <p class="gano">${esc(m.empresa ?? '—')}${
            resto.length ? ` <span class="cuanto">y ${resto.length} más</span>` : ''}${
            marca ? `<span class="marca-mia">${marca}</span>` : ''}</p>
          <p class="que">${esc(m.titulo ?? '')}</p>
          <span class="donde">${esc([m.organo, m.provincia].filter(Boolean).join(' · '))}</span>
          ${destacados.map(g => `<span class="donde">${
            g.es_mia ? 'Tu empresa' : esc(g.nombre ?? g.cif)}: ${
            plural(g.lotes ?? 1, 'lote', 'lotes')}${
            g.importe ? ` · ${euros(Number(g.importe))}` : ''}</span>`).join('')}
        </div>
        <div class="cifra">
          <strong>${m.total ? euros(Number(m.total)) : '—'}</strong>
          <span class="baja">${esc(fecha(m.fecha))}</span>
        </div>
      </div>`;
    };

    const cuerpo = lista.length ? [...grupos.values()].map(g => {
      if (g.length === 1) return unaLinea(g[0]);

      // Del grupo se enseña la compra más reciente, y el resto debajo.
      const primera = g[0];
      const empresas = new Set(g.flatMap(x => x.ganadores.map(y => y.cif))
        .filter(Boolean)).size;
      const total = g.reduce((s, x) => s + (Number(x.total) || 0), 0);
      const mia = g.some(x => x.es_mia);
      const sigo = g.some(x => x.la_sigo);

      return `<details class="grupo-mov">
        <summary>
          <div>
            <p class="gano">${empresas} ${empresas === 1 ? 'empresa' : 'empresas'}
              ${mia ? '<span class="marca-mia">tu empresa entre ellas</span>'
              : sigo ? '<span class="marca-mia">una que sigues</span>' : ''}</p>
            <p class="que">${esc(primera.titulo ?? '')}</p>
            <span class="donde">${esc([primera.organo, primera.provincia]
              .filter(Boolean).join(' · '))}</span>
            <span class="cuantas-veces">${plural(g.length, 'compra', 'compras')}
              <span class="flechita">▾</span></span>
          </div>
          <div class="cifra">
            <strong>${total ? euros(total) : '—'}</strong>
            <span class="baja">${esc(fecha(primera.fecha))}</span>
          </div>
        </summary>
        <div class="dentro">${g.map(unaLinea).join('')}</div>
      </details>`;
    }).join('') : `<p class="vacio">No hay adjudicaciones de tus sectores en
      este periodo${provincia ? ` en ${esc(provincia)}` : ''}.</p>`;

    const cuando = textoPeriodo(periodo, anios);

    document.getElementById('datos-mov').innerHTML = `
      <div class="pulso">
        <h4>${esc(cuando)} en tu sector${provincia ? ` · ${esc(provincia)}` : ''}</h4>
        <dl>
          <div><dt>Adjudicaciones</dt><dd>${cuantos}</dd></div>
          <div><dt>Importe total</dt><dd>${
            Number(r.importe) ? euros(Number(r.importe)) : '—'}</dd></div>
          <div><dt>Empresas distintas</dt><dd>${r.empresas ?? 0}</dd></div>
          ${Number(r.importe_mediano) ? `<div><dt>Importe mediano</dt>
            <dd>${euros(Number(r.importe_mediano))}</dd></div>` : ''}
          ${r.mias ? `<div><dt>Las has ganado tú</dt>
            <dd>${r.mias}</dd></div>` : ''}
          <p class="destacado">Cada contrato cuenta una vez aunque tenga
          varios lotes o varias empresas ganadoras. El importe mediano es el
          del contrato de en medio: la mitad se adjudicó por menos y la
          mitad por más, y unos pocos contratos enormes no lo mueven. Cada
          contrato cuenta en el año en que se formalizó, y los contratos
          menores no entran. En «Quién más ha facturado», cada empresa suma solo su
          parte.</p>
        </dl>
      </div>

      ${provincias.length > 1 ? `
        <div class="filtro-provincia">
          <label for="f-provincia">Ver solo</label>
          <select id="f-provincia">
            <option value="">Toda España</option>
            ${provincias.map(pr => `<option value="${esc(pr)}"${
              pr === provincia ? ' selected' : ''}>${esc(pr)}</option>`).join('')}
          </select>
        </div>` : ''}

      ${(r.por_empresa?.length || r.por_organo?.length) ? `
      <div class="dos-columnas">
        ${bloqueRanking(r.por_empresa, 'Quién más ha facturado', 'empresas')}
        ${bloqueRanking(r.por_organo, 'Quién ha adjudicado más', 'organos')}
      </div>` : ''}

      <div style="margin-top:32px">
        ${cuantos > lista.length ? `<p class="guia" style="font-size:.88rem">
          Las ${lista.length} adjudicaciones más recientes de ${
          new Intl.NumberFormat('es-ES').format(cuantos)}. Las cifras y los
          rankings de arriba cuentan todas.</p>` : ''}
        ${cuerpo}
      </div>`;

    const selProv = document.getElementById('f-provincia');
    if (selProv) selProv.onchange = () => {
      provincia = selProv.value || null;
      cargar();
    };

    // Cada tramo dice de qué contrato es. Sin esto la barra solo compara
    // tamaños; con esto se puede ir al detalle sin bajar a la lista.
    raiz.querySelectorAll('[data-ranking]').forEach(caja => {
      const hueco = caja.querySelector('[data-hueco-ranking]');
      const reposo = hueco.innerHTML;
      const tramos = [...caja.querySelectorAll('.tramo')];

      const mostrar = t => {
        const contexto = [t.dataset.quien, t.dataset.importe]
          .filter(Boolean).join(' · ');
        hueco.innerHTML =
          `<span class="titulo-tramo">${esc(t.dataset.titulo)}</span>` +
          (contexto ? `<span class="meta-tramo">${esc(contexto)}</span>` : '');
        tramos.forEach(x => x.classList.toggle('activo', x === t));
      };
      const soltar = () => {
        hueco.innerHTML = reposo;
        tramos.forEach(x => x.classList.remove('activo'));
      };

      // Se escucha en la tarjeta entera y no tramo a tramo: así el
      // detalle solo se borra al salir de la tarjeta, no cada vez que el
      // cursor cruza de un tramo al siguiente.
      caja.addEventListener('mouseover', ev => {
        const t = ev.target.closest('.tramo');
        if (t) mostrar(t);
      });
      caja.addEventListener('mouseleave', soltar);
      tramos.forEach(t => {
        t.onfocus = () => mostrar(t);
        t.onclick = () => mostrar(t);
      });
    });
  }

  await cargar();
}

async function pantallaMercado(perfil, session, volviendo = false, cif = null) {
  if (!volviendo) irA('mercado');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Empresas</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('mercado')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién gana en tu sector</h1>
    <p class="guia">Los contratos públicos son datos abiertos: quién los
    gana, por cuánto y de qué organismo. Mira tu propio historial, busca
    una empresa por su NIF, o averigua quién se lleva los contratos de tus
    sectores.</p>

    <div class="buscador-cif">
      <input type="text" id="cif-buscar" placeholder="NIF de una empresa"
             autocomplete="off">
      <button class="principal" id="buscar-cif">Buscar</button>
      ${perfil.cif ? `<button class="secundario" id="ver-mia">Ver mi
        empresa</button>` : ''}
    </div>

    <div class="hueco-periodo" id="periodo-emp"></div>

    <div id="zona" style="margin-top:22px"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'mercado');

  const zona = document.getElementById('zona');
  const campo = document.getElementById('cif-buscar');

  // Ver la propia empresa es la misma acción que buscar otra, así que va
  // junto al buscador y no abajo con las listas.
  alPulsar('ver-mia', () => verEmpresa(perfil.cif));

  // El periodo vale para las listas y para la ficha: al cambiarlo se
  // repinta lo que haya a la vista.
  const aniosEmp = await aniosDelSector();
  let periodoEmp = periodoGuardado(aniosEmp);
  let repintarVista = null;
  let vueltaEmp = 0;
  selectorPeriodo(document.getElementById('periodo-emp'), aniosEmp, periodoEmp, p => {
    periodoEmp = p;
    repintarVista?.();
  });
  const cuandoEmp = () => aniosEmp.length ? enPeriodo(periodoEmp, aniosEmp) : '';

  // Mientras llega lo nuevo, lo anterior se atenúa en vez de sustituirse
  // por "Cargando...": así no salta la página al cambiar de periodo.
  const esperando = texto => {
    if (zona.children.length) zona.classList.add('cambiando');
    else zona.innerHTML = `<p class="guia">${texto}</p>`;
  };

  // Cambiar de forma repinta la ficha y guarda la elección para todos los
  // gráficos. Enganchado una sola vez sobre el contenedor, que no se
  // sustituye al redibujar.
  let ultimaEmpresa = null;
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaEmpresa) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintarFicha(ultimaEmpresa);
  });

  // ---------- Estado: listas ----------
  async function verListas() {
    repintarVista = verListas;
    const turno = ++vueltaEmp;
    esperando('Cargando...');
    const [comp, seg] = await Promise.all([
      pedir('competencia_periodo', argsPeriodo(periodoEmp)),
      pedir('seguimiento_periodo', argsPeriodo(periodoEmp)),
    ]);
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');

    // Un fallo NO se enseña como «no hay empresas».
    //
    // Con `comp.data ?? []`, cualquier error se convertía en una lista
    // vacía y la pantalla afirmaba que el cliente no tiene competencia.
    // Eso no es una pantalla en blanco: es un dato falso.
    if (comp.error || seg.error) {
      const fallo = comp.error || seg.error;
      zona.innerHTML = `<div class="aviso mal">
        No hemos podido cargar las empresas de tu sector.
        <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
          ${esc(fallo.message || '')}</div>
        <div style="margin-top:14px">
          <button class="secundario" id="reintentar-emp">Reintentar</button>
        </div></div>`;
      alPulsar('reintentar-emp', verListas);
      return;
    }

    const competencia = comp.data ?? [];
    const seguidas = seg.data ?? [];

    // Tres filas a la vista y el resto detrás de un botón.
    const ASOMAN = 3;

    const fila = (f, i, sigo) => `<tr data-cif="${esc(f.cif)}"
        class="${i >= ASOMAN ? 'oculta' : ''}">
        <td class="quien">${esc(f.nombre ?? f.cif)}</td>
        <td class="num">${f.contratos}</td>
        <td class="num">${f.importe ? euros(Number(f.importe)) : '—'}</td>
        <td class="fin"><button class="seguir chico" aria-pressed="${sigo}"
          data-seguir="${esc(f.cif)}" data-nombre="${esc(f.nombre ?? f.cif)}"
          >${sigo ? 'Siguiendo' : 'Seguir'}</button></td>
      </tr>`;

    const tabla = (filas, id, todasSeguidas = false) => `
      <table class="tabla" id="${id}">
        <thead><tr><th>Empresa</th><th class="num">Contratos</th>
          <th class="num">Importe</th><th class="fin"></th></tr></thead>
        <tbody>${filas.map((f, i) =>
          fila(f, i, todasSeguidas || !!f.sigo)).join('')}</tbody>
      </table>
      ${filas.length > ASOMAN ? `<button class="mas" data-tabla="${id}"
        aria-expanded="false"
        data-mas="${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}"
        data-menos="Ver menos">${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}
        <span class="flechita">▾</span></button>` : ''}`;

    // La lista de seguimiento se enseña SIEMPRE, aunque esté vacía: si no
    // aparece, nadie descubre que existe.
    zona.innerHTML = `
      <div class="seccion-mercado">
        <h3>Tu lista de seguimiento
          <span class="cuantas">${seguidas.length || 'vacía'}</span></h3>
        ${seguidas.length ? tabla(seguidas, 't-seguimiento', true) : `
          <p class="vacio-seguimiento">Todavía no sigues a ninguna empresa.
          Busca una por su NIF o elígela de la lista de abajo, y pulsa
          <strong>Seguir</strong> en su ficha para tenerla aquí a mano.</p>`}
      </div>

      <div class="seccion-mercado">
        <h3>Quién gana más en tus sectores
          <span class="cuantas">${competencia.length}</span></h3>
        <p class="guia" style="margin:0 0 14px;font-size:.9rem">Empresas que
        han ganado contratos de los mismos códigos que tú${
          cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}. Pulsa una para ver
        su ficha.</p>
        ${competencia.length ? tabla(competencia, 't-competencia')
          : '<p class="sin-datos">No hay adjudicaciones de tus sectores en este periodo.</p>'}
      </div>`;

    zona.querySelectorAll('tr[data-cif]').forEach(f =>
      f.onclick = ev => {
        // El botón de seguir vive dentro de la fila para que aparezca a su
        // altura; hay que evitar que su clic abra además la ficha.
        if (ev.target.closest('[data-seguir]')) return;
        verEmpresa(f.dataset.cif);
      });

    zona.querySelectorAll('[data-seguir]').forEach(b => b.onclick = async () => {
      const antes = b.getAttribute('aria-pressed') === 'true';
      // Se pinta al instante y se corrige si el servidor dice otra cosa.
      b.setAttribute('aria-pressed', String(!antes));
      b.textContent = !antes ? 'Siguiendo' : 'Seguir';
      try {
        const { data } = await sb.rpc('seguir', {
          cif_empresa: b.dataset.seguir, nombre_empresa: b.dataset.nombre });
        b.setAttribute('aria-pressed', String(!!data));
        b.textContent = data ? 'Siguiendo' : 'Seguir';
        recado(data
          ? 'Añadida a tu lista de seguimiento'
          : 'Quitada de tu lista de seguimiento');
        olvidar('seguimiento_periodo', 'competencia_periodo',
                'movimientos_periodo', 'resumen_periodo');

        // Al seguirla desde la competencia, su fila se va: ya está arriba
        // en la lista de seguimiento y saldría dos veces. Si deja de
        // seguirla, vuelve a aparecer al recargar.
        //
        // La lista de seguimiento NO se repinta: hacerlo movería lo que
        // el cliente está mirando. Se pone al día al volver a entrar.
        const enCompetencia = b.closest('#t-competencia');
        if (data && enCompetencia) {
          const suya = b.closest('tr');
          // Se descubre la siguiente oculta para que sigan viéndose tres.
          const escondida = enCompetencia.querySelector('tbody tr.oculta');
          if (escondida) escondida.classList.remove('oculta');
          suya.remove();
        }
      } catch {
        b.setAttribute('aria-pressed', String(antes));
        b.textContent = antes ? 'Siguiendo' : 'Seguir';
        recado('No se ha podido guardar. Inténtalo de nuevo.');
      }
    });

    // Alterna: se puede volver a cerrar. Antes el botón desaparecía al
    // pulsarlo y la lista se quedaba abierta para siempre.
    zona.querySelectorAll('[data-tabla]').forEach(b => {
      const filas = [...document.getElementById(b.dataset.tabla)
        .querySelectorAll('tbody tr')];
      b.onclick = () => {
        const abierto = b.getAttribute('aria-expanded') === 'true';
        filas.forEach((t, i) => t.classList.toggle('oculta', abierto && i >= ASOMAN));
        b.setAttribute('aria-expanded', String(!abierto));
        b.firstChild.textContent = abierto
          ? b.dataset.mas + ' ' : b.dataset.menos + ' ';
      };
    });
  }

  // ---------- Estado: ficha ----------
  //
  // Deja marca en el historial: sin ella, atrás salía de Mercado entero
  // en vez de devolver a las listas.
  async function verEmpresa(cif, restaurando = false) {
    if (!restaurando) irA('mercado', { cif });
    repintarVista = () => verEmpresa(cif, true);
    const turno = ++vueltaEmp;
    esperando('Buscando...');
    const { data, error } = await sb.rpc('ficha_empresa',
      { cif_buscado: cif, ...argsPeriodo(periodoEmp) });
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');
    // Una empresa que en el periodo solo está homologada en acuerdos
    // marco no tiene contratos, pero sí algo que enseñar.
    if (error || !data || (!data.contratos && !data.marcos?.length)) {
      // Con nombre es que existe y ha ganado algo, pero no en este
      // periodo: decir "no hemos encontrado ese NIF" sería falso.
      zona.innerHTML = `
        <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
        <div class="aviso">${data?.nombre
          ? `${esc(data.nombre)} no tiene contratos adjudicados
             ${esc(cuandoEmp())}. Prueba con otro periodo.`
          : `No hemos encontrado contratos adjudicados con ese NIF. Puede
             que no haya ganado ninguno todavía.`}</div>`;
      alPulsar('volver-listas', () => history.back());
      return;
    }
    pintarFicha(data);
  }

  function pintarFicha(e) {
    const sectores = e.sectores ?? [];
    const organos = e.organos ?? [];
    const ultimos = e.ultimos ?? [];
    const marcos = e.marcos ?? [];

    zona.innerHTML = `
      <button class="volver-listas" id="volver-listas">← Volver a las listas</button>
      <div class="tarjeta-empresa" style="margin-top:8px">
        <div class="arriba">
          <div>
            <h3>${esc(e.nombre ?? e.cif)}</h3>
            <p class="cifras">
              <span><strong>${e.contratos}</strong> ${e.contratos === 1 ? 'contrato' : 'contratos'}${
                e.lotes > e.contratos ? ` (${e.lotes} lotes)` : ''}${
                cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}</span>
              ${e.importe ? `<span><strong>${euros(Number(e.importe))}</strong>
                adjudicados</span>` : ''}
              ${e.ultimo ? `<span>último en ${esc(new Date(e.ultimo)
                .toLocaleDateString('es-ES', {timeZone:ZONA, month:'long',
                year:'numeric'}))}</span>` : ''}
            </p>
          </div>
          ${e.cif === perfil.cif ? '' : `
            <button class="seguir" id="seguir" aria-pressed="${!!e.sigo}"
                    data-cif="${esc(e.cif)}" data-nombre="${esc(e.nombre ?? e.cif)}">
              ${e.sigo ? 'Siguiendo' : 'Seguir'}</button>`}
        </div>

        ${sectores.length ? `
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div class="forma" role="group" aria-label="Forma de los gráficos">
              <button data-forma="barras"
                aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
              <button data-forma="quesito"
                aria-pressed="${formaActual() === 'quesito'}">Circular</button>
            </div>
          </div>
          <div style="margin-bottom:26px">${reparto(sectores, 'sector')}</div>` : ''}

        ${organos.length ? `
          <h4 style="margin:0 0 12px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">A quién le vende</h4>
          <table class="tabla"><tbody>
            ${organos.map(o => `<tr style="cursor:default">
              <td class="quien">${esc(o.organo)}</td>
              <td class="num">${o.contratos}</td>
              <td class="num">${o.importe ? euros(Number(o.importe))
                // Corto: la columna mide 112 px (92 en el móvil) y no parte
                // líneas. El porqué va en el texto flotante.
                : `<span style="color:var(--tenue)" title="${SIN_IMPORTE}">sin importe</span>`}</td>
            </tr>`).join('')}
          </tbody></table>` : ''}

        ${ultimos.length ? `
          <h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">Sus últimos contratos</h4>
          <div class="ultimos-contratos">
            ${ultimos.map(u => `<div>
              <p class="que">${esc(u.titulo)}</p>
              <span class="quien">${esc(u.organo ?? '')}${
                u.importe ? ` · ${euros(Number(u.importe))}` : ''}</span>
            </div>`).join('')}
          </div>` : ''}

        ${marcos.length ? `
          <h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">Acuerdos marco en los que está homologada</h4>
          <p class="guia" style="margin:0 0 6px;font-size:.86rem">Cualquier organismo
            adherido le puede encargar sin nueva licitación. No cuentan en las
            cifras de arriba: el dinero llega por los contratos que salen de ellos.</p>
          <div class="ultimos-contratos">
            ${marcos.map(m => `<div>
              <p class="que">${esc(m.titulo)}</p>
              <span class="quien">${esc(m.organo ?? '')}${
                m.lotes > 1 ? ` · ${plural(m.lotes, 'lote', 'lotes')}` : ''}${
                m.fecha ? ` · desde ${esc(new Date(m.fecha).toLocaleDateString('es-ES',
                  {timeZone:ZONA, month:'long', year:'numeric'}))}` : ''}${
                m.valor_marco ? ` · marco de ${euros(Number(m.valor_marco))} en total` : ''}</span>
            </div>`).join('')}
          </div>` : ''}
      </div>`;

    activarBarras(zona);
    alPulsar('volver-listas', () => history.back());

    // El interruptor se atiende por delegación, más abajo: volver a
    // engancharlo en cada dibujado lo duplicaba.
    ultimaEmpresa = e;

    alPulsar('seguir', async () => {
      const b = document.getElementById('seguir');
      const { data } = await sb.rpc('seguir', {
        cif_empresa: b.dataset.cif, nombre_empresa: b.dataset.nombre });
      b.setAttribute('aria-pressed', String(!!data));
      b.textContent = data ? 'Siguiendo' : 'Seguir';
      recado(data
        ? 'Añadida a tu lista de seguimiento'
        : 'Quitada de tu lista de seguimiento');
      olvidar('mi_seguimiento', 'competencia', 'movimientos_mercado',
              'seguimiento_periodo', 'competencia_periodo',
              'movimientos_periodo', 'resumen_periodo');
    });
  }

  alPulsar('buscar-cif', () => {
    const cif = campo.value.trim();
    if (cif.length >= 8) verEmpresa(cif);
  });
  campo.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') document.getElementById('buscar-cif').click();
  });

  if (cif) { campo.value = cif; verEmpresa(cif, true); }
  else verListas();
}

// ============================================================
// 7 · Panel de la cuenta
// ============================================================

// Menú de cuenta. Vive en la cabecera de las dos pantallas —contratos y
// panel— para que llegar a cualquier sección sea un solo clic. Antes
// había que entrar al panel y buscar otro botón dentro, y algo que se
// usa a diario no puede estar a dos pasos.
// Mi cuenta guarda lo que configura el servicio. Los sectores y los
// organismos se han ido a Mercado: son inteligencia sobre la propia
// empresa, el mismo dato que se ve de un competidor, y tenerlos aquí los
// separaba de donde pertenecen.
const SECCIONES = {
  cuenta: 'Mi cuenta',
  filtro: 'Mi filtro',
  avisos: 'Mis avisos',
};

// Confirmación efímera. Se usa donde la acción no deja rastro visible
// por sí sola, como la campana: un icono que cambia de forma no explica
// qué ha pasado.
let recadoTemporizador;
function recado(texto) {
  let caja = document.getElementById('recado');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'recado';
    caja.className = 'recado';
    caja.setAttribute('role', 'status');
    document.body.appendChild(caja);
  }
  caja.textContent = texto;
  requestAnimationFrame(() => caja.classList.add('visible'));
  clearTimeout(recadoTemporizador);
  recadoTemporizador = setTimeout(() => caja.classList.remove('visible'), 3200);
}

// La campana enciende y apaga el correo diario. Va suelta y no dentro
// del menú porque su estado tiene que verse de un vistazo: si alguien
// apagó los avisos hace un mes, debe notarlo sin abrir nada.
// La campana enciende y apaga el aviso; la flechita pegada a ella abre el
// atajo al configurador (qué sectores y qué zona llegan en el correo), que
// si no queda enterrado en Mi cuenta.
function campanaAvisos() {
  return `
    <div class="menu-envoltorio campana-grupo">
      <button class="campana" id="campana" aria-pressed="true"
              aria-label="Avisos por correo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          <line class="tachado" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </button>
      <button class="campana-flecha" id="abrir-avisos" aria-haspopup="true"
              aria-expanded="false" aria-label="Opciones del aviso por correo">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 6.5 5 3.5 8 6.5"
          fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="menu menu-avisos" id="menu-avisos" role="menu" hidden>
        <button role="menuitem" data-ir-avisos>Configurar mis avisos</button>
      </div>
    </div>`;
}

function activarCampana(yaSabido = null) {
  const boton = document.getElementById('campana');
  if (!boton) return;

  // Sin texto al pasar por encima: el mensaje de confirmación ya lo
  // explica, y el del navegador tarda en salir, no existe en el móvil y
  // deja el mismo texto dos veces en pantalla.
  const pintar = encendido =>
    boton.setAttribute('aria-pressed', String(encendido));

  // El panel ya ha consultado mi_panel, así que se le pasa el dato en
  // vez de repetir la llamada.
  if (yaSabido !== null) pintar(yaSabido !== false);
  else sb.rpc('mi_panel').then(({ data }) => pintar(data?.avisos !== false));

  boton.onclick = async () => {
    const quiero = boton.getAttribute('aria-pressed') !== 'true';
    // Se pinta al instante: el cliente no debe esperar al servidor para
    // ver que su decisión se ha registrado.
    pintar(quiero);
    recado(quiero
      ? 'Recibirás el aviso diario por correo'
      : 'Ya no recibirás el aviso diario');
    // Supabase no lanza: devuelve `{ error }`. Con solo un `catch`, un
    // fallo dejaba la campana pintada como si se hubiera guardado.
    let respuesta;
    try { respuesta = await sb.rpc('cambiar_avisos', { quiero }); }
    catch (error) { respuesta = { error }; }
    if (respuesta.error) {
      pintar(!quiero);
      recado('No se ha podido guardar. Inténtalo de nuevo.');
      return;
    }
    pintar(respuesta.data !== false);
  };
}

function menuCuenta(actual = null) {
  return `
    <div class="menu-envoltorio">
      <button class="boton-cuenta" id="abrir-menu" aria-haspopup="true"
              aria-expanded="false">Mi cuenta<span class="flechita">▾</span></button>
      <div class="menu" id="menu" role="menu" hidden>
        ${Object.keys(SECCIONES).map(k => `<button role="menuitem" data-ir="${k}"
          aria-current="${k === actual}">${SECCIONES[k]}</button>`).join('')}
        ${PERFILES.length < TOPE_EMPRESAS && PERFILES.every(p => p.paso_alta === 'listo')
          ? `<div class="separa"></div>
        <button role="menuitem" data-anadir-empresa>Añadir otra empresa</button>` : ''}
        <div class="separa"></div>
        <button role="menuitem" class="tema" id="tema"
                aria-pressed="false">Modo oscuro<span class="palanca"></span></button>
        <div class="separa"></div>
        <button role="menuitem" class="peligroso" id="salir-menu">Salir</button>
      </div>
    </div>`;
}

function activarMenu(perfil, session) {
  const menu = document.getElementById('menu');
  const abrir = document.getElementById('abrir-menu');
  if (!menu || !abrir) return;

  const cerrar = () => {
    menu.hidden = true;
    abrir.setAttribute('aria-expanded', 'false');
  };
  abrir.onclick = ev => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
  };
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.menu-envoltorio')) cerrar();
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') cerrar();
  });

  menu.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    cerrar();
    pantallaPanel(perfil, session, false, b.dataset.ir);
  });
  alPulsar('salir-menu', () => sb.auth.signOut());

  const boton = document.getElementById('tema');
  if (boton) {
    boton.setAttribute('aria-pressed', String(temaActual() === 'oscuro'));
    boton.onclick = ev => {
      ev.stopPropagation();
      const nuevo = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
      ponerTema(nuevo);
      boton.setAttribute('aria-pressed', String(nuevo === 'oscuro'));
    };
  }
}


async function pantallaPanel(perfil, session, volviendo = false, seccion = 'cuenta') {
  if (!volviendo) irA('panel', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  const { data: p, error } = await sb.rpc('mi_panel');
  if (error || !p) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tu cuenta.</div></div>`;
    return;
  }

  const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const buscamos = p.que_buscamos ?? [];

  // Barras apiladas: la línea entera es el total, y cada segmento la
  // parte que representa. Una barra que se llena al 100 % por ser la
  // mayor no dice nada; ésta responde a "cuánto de mi negocio es esto".
  //
  // Los segmentos por debajo del 2 % se agrupan: por separado serían
  // hilos de dos píxeles imposibles de señalar, y su cifra sigue
  // apareciendo en la leyenda.

  const secciones = {
    cuenta: `
      <div class="bloque">
        <h3>Tu empresa</h3>
        <dl>
          <dt>Nombre</dt><dd>${esc(p.empresa ?? '—')}</dd>
          <dt>NIF</dt><dd>${esc(p.cif ?? '—')}</dd>
          <dt>Actividad</dt><dd>${esc(p.actividad ?? '—')}</dd>
          <dt>Correo</dt><dd>${esc(p.email ?? '—')}</dd>
          <dt>Cliente desde</dt><dd>${fecha(p.alta)}</dd>
          <dt>Aviso diario por correo</dt><dd>${
            p.avisos === false
              ? 'desactivado — actívalo con la campana de arriba'
              : 'activado'}</dd>
        </dl>
      </div>
      <div class="bloque">
        <h3>Tu historial</h3>
        <dl>
          <dt>Contratos ganados</dt><dd>${p.contratos_ganados ?? 0}${
            p.lotes_ganados > p.contratos_ganados
              ? ` <span style="color:var(--tenue)">(${p.lotes_ganados} lotes)</span>` : ''}</dd>
          <dt>Importe adjudicado</dt><dd>${
            p.importe_ganado ? euros(Number(p.importe_ganado)) : '—'}</dd>
          <dt>Contratos abiertos que te mostramos</dt><dd>${p.oportunidades ?? 0}</dd>
        </dl>
      </div>`,

    filtro: `
      ${buscamos.length ? `
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        <ul class="filtro-lista">
          ${buscamos.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>` : ''}
      <div class="bloque">
        <h3>Cómo va aprendiendo</h3>
        <dl>
          <dt>Correcciones que has hecho</dt><dd>${p.correcciones?.total ?? 0}${
            p.correcciones?.sin_aplicar
              ? ` · ${p.correcciones.sin_aplicar} sin aplicar todavía` : ''}</dd>
          <dt>Última actualización</dt><dd>${fecha(p.criterio_fecha)}</dd>
        </dl>
        <p class="guia" style="margin:18px 0 0;font-size:.88rem">
        Marca en tu lista los contratos que no te interesan y ajustamos el
        filtro automáticamente.</p>
        <div id="recuperar"></div>
      </div>
      <div class="bloque peligro">
        <h3>Empezar de cero</h3>
        <p class="guia" style="margin:0 0 18px">Si tu negocio ha cambiado de
        rumbo —una línea nueva, o has dejado de hacer algo— es mejor rehacer
        el filtro que ir corrigiéndolo. Tarda un minuto y no se pierde nada:
        tu historial de contratos sigue ahí.</p>
        <button class="secundario" id="reiniciar">Rehacer mi filtro</button>
        <div id="resultado"></div>
      </div>
      ${PERFILES.length > 1 ? `
      <div class="bloque peligro">
        <h3>Quitar esta empresa</h3>
        <p class="guia" style="margin:0 0 18px">Deja de vigilar
        ${esc(nombreEmpresa(perfil))} y libera su hueco. Se borran su filtro,
        sus correcciones y las empresas que sigues desde ella. Tus otras
        empresas no cambian.</p>
        <button class="secundario" id="quitar-empresa">Quitar esta empresa</button>
        <div id="resultado-quitar"></div>
      </div>` : ''}`,

  };

  secciones.avisos = `<div id="avisos-panel">
    <p class="guia">Cargando tus avisos...</p></div>`;

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>${esc(SECCIONES[seccion] ?? 'Mi cuenta')}</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('panel')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta(seccion)}
      </div>
    </div>
    <div class="panel">${secciones[seccion] ?? secciones.cuenta}</div>`;

  // La misma barra que en las demás pantallas, sin ninguna marcada. Antes
  // solo había un botón "Mis contratos" y para ir a Movimientos, Empresas
  // u Organismos había que pasar por la lista o tirar del botón atrás del
  // navegador, que además recorría una a una las secciones del panel.
  activarNav(perfil, session, 'panel');
  activarMenu(perfil, session);
  activarCampana(p.avisos);
  if (seccion === 'avisos') montarAvisos(perfil, p.avisos !== false);

  // Si ocultó la explicación de la lista, aquí puede recuperarla.
  const hueco = document.getElementById('recuperar');
  let oculta = false;
  try { oculta = localStorage.getItem('sin-explicacion') === '1'; } catch { /* nada */ }
  if (hueco && oculta) {
    hueco.innerHTML = `<button class="enlace" id="volver-explica"
      style="padding-left:0;margin-top:10px">Volver a mostrar la explicación
      en mi lista</button>`;
    alPulsar('volver-explica', () => {
      try { localStorage.removeItem('sin-explicacion'); } catch { /* nada */ }
      hueco.innerHTML = `<p class="guia" style="margin:10px 0 0;font-size:.88rem">
        Hecho. Volverá a aparecer en tu lista.</p>`;
    });
  }

  // ---------- Quitar esta empresa ----------
  alPulsar('quitar-empresa', () => {
    const zona = document.getElementById('resultado-quitar');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? No se puede deshacer: para volver a
      vigilarla habría que darla de alta otra vez.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no-quitar">Cancelar</button>
        <button class="principal" id="si-quitar">Sí, quitarla</button>
      </div></div>`;
    alPulsar('no-quitar', () => zona.innerHTML = '');
    alPulsar('si-quitar', async () => {
      zona.innerHTML = `<div class="aviso">Quitando...</div>`;
      const { data, error } = await sb.rpc('quitar_empresa', { perfil: perfil.id });
      if (error || !data?.ok) {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
        return;
      }
      fijarEmpresa(PERFILES.find(p => p.id !== perfil.id)?.id ?? null);
      arrancar();
    });
  });

  // ---------- Rehacer el filtro ----------
  alPulsar('reiniciar', () => {
    const zona = document.getElementById('resultado');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? Se borrará tu filtro actual y volverás a
      empezar desde tu NIF.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no">Cancelar</button>
        <button class="principal" id="si">Sí, rehacerlo</button>
      </div></div>`;
    alPulsar('no', () => zona.innerHTML = '');
    alPulsar('si', async () => {
      zona.innerHTML = `<div class="aviso">Preparando...</div>`;
      try {
        await llamar('reiniciar');
        arrancar();
      } catch {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
      }
    });
  });
}

// ---------- Mis avisos: qué llega en el correo diario ----------
//
// Por sector y por zona. Lo que se elige aquí filtra el correo, no la
// lista: en la web siempre se ve todo, y el correo es lo que merece
// interrumpir.
//
// Las reglas son las mismas que usa la base al preparar el correo
// (novedades_de_perfil) y la lista al filtrar: el recuento de abajo dice
// la verdad sobre lo que llegará.
async function montarAvisos(perfil, encendido) {
  const [cfg, zonas, sectores, contratos] = await Promise.all([
    sb.rpc('mis_avisos'), pedir('zonas_espana'),
    cargarSectores(perfil), pedirContratos(perfil.id)]);
  const zona = document.getElementById('avisos-panel');
  // Se ha ido a otra pantalla o a otra empresa mientras cargaba.
  if (!zona || perfil.id !== perfilActivoId) return;
  if (cfg.error || zonas.error || !cfg.data) {
    zona.innerHTML = `<div class="aviso mal">No hemos podido cargar tus avisos.</div>`;
    return;
  }

  const provs = new Set(cfg.data.provincias ?? []);
  const elegidos = new Set(cfg.data.sectores ?? []);
  const todosSectores = !elegidos.size;
  const lista = contratos.data ?? [];

  const porComunidad = {}, comunidadDe = {};
  (zonas.data ?? []).forEach(z => {
    (porComunidad[z.comunidad] ??= []).push(z.provincia);
    comunidadDe[z.provincia] = z.comunidad;
  });
  const comunidades = Object.keys(porComunidad).sort((a, b) => a.localeCompare(b, 'es'));
  // "Comunidad de Madrid" con Madrid dentro: se enseña solo la provincia.
  const plano = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const uniprovincial = c => porComunidad[c].length === 1
    && plano(c).includes(plano(porComunidad[c][0]));

  zona.innerHTML = `
    ${encendido ? '' : `<div class="aviso">El aviso diario está desactivado.
      Actívalo con la campana de arriba para recibirlo.</div>`}
    ${sectores.length > 1 ? `
    <div class="bloque">
      <h3>Sectores</h3>
      <p class="guia" style="margin:0 0 14px">De qué quieres que te avisemos.</p>
      <div class="casillas">
        ${sectores.map(x => `<label class="casilla-linea">
          <input type="checkbox" autocomplete="off" data-sector="${esc(x.id)}"
                 ${todosSectores || elegidos.has(x.id) ? 'checked' : ''}>
          <span>${esc(x.nombre)}</span></label>`).join('')}
      </div>
    </div>` : ''}
    <div class="bloque">
      <h3>Zona</h3>
      <p class="guia" style="margin:0 0 14px">Los contratos de ámbito
      autonómico, sin provincia concreta, te llegan si eliges alguna
      provincia de esa comunidad.</p>
      <label class="casilla-linea toda">
        <input type="checkbox" autocomplete="off" id="toda-espana" ${provs.size ? '' : 'checked'}>
        <span>Toda España</span></label>
      <div class="zonas">
        ${comunidades.map(c => uniprovincial(c) ? `
          <div class="comunidad">
            <label class="casilla-linea"><input type="checkbox" autocomplete="off"
              data-prov="${esc(porComunidad[c][0])}"><span>${esc(porComunidad[c][0])}</span></label>
          </div>` : `
          <div class="comunidad">
            <div class="fila-comunidad">
              <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-com="${esc(c)}">
                <span>${esc(c)}</span></label>
              <button type="button" class="enlace ver-provs" data-ver="${esc(c)}"
                aria-expanded="false">${porComunidad[c].length} provincias</button>
            </div>
            <div class="provs" data-de="${esc(c)}" hidden>
              ${porComunidad[c].sort((a, b) => a.localeCompare(b, 'es')).map(pv => `
                <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-prov="${esc(pv)}">
                  <span>${esc(pv)}</span></label>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="bloque resumen-avisos">
      <p id="avisos-cuenta"></p>
      <button class="principal" id="guardar-avisos">Guardar mis avisos</button>
      <div id="avisos-resultado"></div>
    </div>`;

  const casillasSector = [...zona.querySelectorAll('[data-sector]')];
  const casillasProv = [...zona.querySelectorAll('[data-prov]')];
  const sectoresElegidos = () => sectores.filter(x =>
    casillasSector.find(c => c.dataset.sector === x.id)?.checked);

  // Lo que se ve marcado sale siempre de `provs`: una sola fuente. Las
  // casillas llevan autocomplete="off" para que el navegador no les
  // devuelva, al volver atrás, un estado anterior distinto del guardado.
  function pintarZona() {
    document.getElementById('toda-espana').checked = provs.size === 0;
    casillasProv.forEach(c => c.checked = provs.has(c.dataset.prov));
    zona.querySelectorAll('[data-com]').forEach(c => {
      const suyas = porComunidad[c.dataset.com];
      const n = suyas.filter(pv => provs.has(pv)).length;
      c.checked = n === suyas.length;
      c.indeterminate = n > 0 && n < suyas.length;
      // Con algunas elegidas, se enseñan: si no, no se ve cuáles.
      if (c.indeterminate) desplegar(c.dataset.com, true);
    });
    contar();
  }

  function desplegar(c, abierto) {
    const caja = zona.querySelector(`.provs[data-de="${CSS.escape(c)}"]`);
    const boton = zona.querySelector(`[data-ver="${CSS.escape(c)}"]`);
    if (!caja) return;
    caja.hidden = !abierto;
    boton.setAttribute('aria-expanded', String(abierto));
  }

  function contar() {
    const secs = sectoresElegidos();
    const entra = o =>
      (!casillasSector.length || secs.length === sectores.length
        || secs.some(x => enSector(o, x))) &&
      (provs.size === 0 || provs.has(o.provincia) ||
        (!o.provincia && (!o.comunidad ||
          [...provs].some(pv => comunidadDe[pv] === o.comunidad))));
    const n = lista.filter(entra).length;
    document.getElementById('avisos-cuenta').innerHTML =
      `De los <strong>${plural(lista.length, 'contrato abierto', 'contratos abiertos')}</strong>
       que tienes ahora, <strong>${n}</strong> ${n === 1 ? 'entraría' : 'entrarían'}
       en tus avisos. Cada día te llegan solo los nuevos.`;
  }

  document.getElementById('toda-espana').onchange = ev => {
    if (ev.target.checked) provs.clear();
    else ev.target.checked = true;   // se desmarca eligiendo una provincia
    pintarZona();
  };
  casillasProv.forEach(c => c.onchange = () => {
    c.checked ? provs.add(c.dataset.prov) : provs.delete(c.dataset.prov);
    pintarZona();
  });
  zona.querySelectorAll('[data-com]').forEach(c => c.onchange = () => {
    const suyas = porComunidad[c.dataset.com];
    const todas = suyas.every(pv => provs.has(pv));
    suyas.forEach(pv => todas ? provs.delete(pv) : provs.add(pv));
    pintarZona();
  });
  zona.querySelectorAll('[data-ver]').forEach(b => b.onclick = () =>
    desplegar(b.dataset.ver, b.getAttribute('aria-expanded') !== 'true'));
  casillasSector.forEach(c => c.onchange = contar);

  alPulsar('guardar-avisos', async () => {
    const resultado = document.getElementById('avisos-resultado');
    const secs = sectoresElegidos();
    if (casillasSector.length && !secs.length) {
      resultado.innerHTML = `<div class="aviso mal">Elige al menos un sector.</div>`;
      return;
    }
    const boton = document.getElementById('guardar-avisos');
    boton.disabled = true;
    // Todos marcados se guarda como "ninguno elegido" (= todos): así, si
    // mañana aparece un sector nuevo, también entra.
    const { data, error } = await sb.rpc('guardar_avisos', {
      provincias: [...provs],
      sectores: secs.length === sectores.length ? [] : secs.map(x => x.id),
    });
    boton.disabled = false;
    if (error || !data?.ok) {
      resultado.innerHTML = `<div class="aviso mal">No se ha podido guardar. Inténtalo de nuevo.</div>`;
      return;
    }
    resultado.innerHTML = '';
    recado('Avisos guardados');
  });

  pintarZona();
}

// ============================================================
// 8 · Bienvenida
// ============================================================
//
// Una pantalla propia y con entrada animada. Metida en la primera fila
// de la lista no se distinguía de lo habitual: sin nada que la señalara
// como excepcional, se leía como un elemento más y se pasaba de largo.
//
// Y se recuerda en el PERFIL, no en el navegador: quien entra desde el
// móvil la vería otra vez, y quien limpia los datos del navegador
// también. Es una propiedad de la persona, no del aparato.
function pantallaBienvenida(perfil, session) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="bienvenida">
      <div class="entra">
        <p class="saluda">${esc(perfil.empresa || '')}</p>
        <h1>Te damos la bienvenida</h1>
      </div>
      <div class="entra">
        <p class="lema">Hemos montado tu filtro leyendo los contratos que
        has ganado. Pero <strong>solo tú sabes a qué te presentarías de
        verdad</strong>.</p>
      </div>
      <div class="entra">
        <div class="dos-botones">
          <span class="muestra si">Sí me interesa</span>
          <span class="muestra no">No me interesa</span>
        </div>
        <p class="lema">Verás estos botones en cada contrato. Úsalos cuando
        algo no encaje: a las pocas correcciones <strong>ajustamos tu
        filtro</strong> y dejas de ver lo que no es para ti.</p>
      </div>
      <div class="entra">
        <button class="principal" id="empezar">Ver mis contratos</button>
      </div>
    </div>`;

  alPulsar('empezar', () => {
    // Se marca antes de salir: si falla la escritura, peor es repetirla
    // que perder la lista.
    sb.rpc('marcar_bienvenida').then(() => {}, () => {});
    pantallaOportunidades({ ...perfil, vio_bienvenida: true }, session);
  });
}

// ============================================================
// 9 · Sus oportunidades
// ============================================================

async function pantallaOportunidades(perfil, session, volviendo = false,
                                     pestanaInicial = 'todo') {
  const miLista = ++listaVigente;
  const vigente = () => miLista === listaVigente;
  if (!volviendo) irA('contratos', { pestana: 'todo' }, true);
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando tus contratos...</p></div>`;


  const { data, error } = await pedirContratos(perfil.id, nuevos => {
    // Si algo cambió por detrás, se repinta sin que el cliente
    // haya tenido que esperar.
    if (!vigente()) return;
    DATOS.length = 0;
    (nuevos ?? []).map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
      .sort((a, b) => (a.dias ?? 9e9) - (b.dias ?? 9e9))
      .forEach(o => DATOS.push(o));
    if (document.getElementById('lista')) pintar();
  });
  // Mientras llegaban los datos se ha abierto otra lista: esa manda.
  if (!vigente()) return;
  if (error) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tus contratos.</div></div>`;
    return;
  }

  const DATOS = (data ?? []).map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
    .sort((a,b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));

  // Para el cribado de fondo del arranque: cuando termina, pide la lista
  // de nuevo y la repinta aquí mismo, conservando pestaña y filtros.
  refrescarListaAbierta = async () => {
    olvidar('contratos');
    const { data: nuevos, error: fallo } = await pedirContratos(perfil.id);
    if (fallo || !document.getElementById('lista')) return;
    DATOS.length = 0;
    (nuevos ?? []).map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
      .sort((a, b) => (a.dias ?? 9e9) - (b.dias ?? 9e9))
      .forEach(o => DATOS.push(o));
    const cuenta = document.getElementById('c-todo');
    if (cuenta) cuenta.textContent = DATOS.length;
    pintar();
  };

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Tus contratos</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('contratos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <h1 id="titular" style="margin-top:30px"></h1>
    <div class="pestanas" role="tablist">
      <button class="pestana" role="tab" id="p-todo" aria-selected="true">
        Todos los abiertos<span class="cuantas" id="c-todo"></span></button>
      <button class="pestana" role="tab" id="p-hoy" aria-selected="false">
        Novedades<span class="cuantas" id="c-hoy"></span></button>
    </div>
    <div class="filtros">
      <select id="f-veredicto">
        <option value="">Cualquier encaje</option>
        <option value="si">Para mí</option>
        <option value="quizas">Puede ser para mí</option>
      </select>
      <select id="f-sector" aria-label="Filtrar por sector" hidden>
        <option value="">Todos los sectores</option>
      </select>
      <input type="search" id="f-texto" placeholder="Buscar por título u órgano">
      <div class="selector">
        <button type="button" class="campo-geo" id="campo-geo"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="panel-geo"
                aria-label="Filtrar por provincia"><span id="resumen-geo">Toda España</span></button>
        <div class="panel-geo" id="panel-geo" hidden>
          <input type="search" id="buscador-geo" autocomplete="off"
                 role="combobox" aria-expanded="true" aria-controls="desplegable"
                 aria-label="Buscar provincia o comunidad"
                 placeholder="Buscar provincia o comunidad">
          <div class="desplegable" id="desplegable" role="listbox"
               aria-multiselectable="true"></div>
          <div class="pie-geo">
            <span id="cuenta-geo"></span>
            <button type="button" class="enlace" id="toda-espana">Toda España</button>
          </div>
        </div>
      </div>
      <button type="button" class="quitar-filtros" id="quitar-filtros" hidden>
        Quitar filtros</button>
    </div>
    <p class="explica" id="explica">Cada vez que marcas un contrato como
    <strong>no me interesa</strong> o <strong>sí me interesa</strong>, tu
    filtro aprende. A las pocas correcciones lo ajustamos y vuelves a ver
    la lista con lo que de verdad te encaja.
    <button class="cerrar" id="cerrar-explica"
            aria-label="Dejar de mostrar esta explicación">×</button></p>
    <main id="lista"></main>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'contratos');

  // ---------- La explicación se puede ocultar ----------
  //
  // Se recuerda para no volver a mostrarla, pero se puede recuperar desde
  // el panel: quien la cierre el primer día no debería quedarse sin saber
  // para qué sirven los botones.
  const explica = document.getElementById('explica');
  try {
    if (localStorage.getItem('sin-explicacion') === '1') explica?.remove();
  } catch { /* modo privado */ }
  alPulsar('cerrar-explica', () => {
    explica?.remove();
    try { localStorage.setItem('sin-explicacion', '1'); } catch { /* nada */ }
  });

  const bloqueFecha = o => {
    if (o.dias == null) return `<div class="fecha sinplazo"><span class="dia">Sin plazo</span></div>`;
    const p = partes(o.fecha_limite);
    // Corto para que quepa en una línea: con "quedan 5 días" la celda
    // crecía a dos y rompía el ritmo de la lista. La fecha está justo
    // encima, así que "hoy" o "en 5 días" se entiende igual.
    const c = o.dias < 0 ? 'vencido'
            : o.dias === 0 ? 'hoy'
            : o.dias === 1 ? 'mañana'
            : `en ${o.dias} días`;
    // Tres días, no siete. Con siete se marcaba media lista, y un aviso
    // que sale en la mayoría de las filas deja de avisar: se convierte
    // en ruido y enseña a ignorarlo.
    return `<div class="fecha ${o.dias <= 3 ? 'apura' : ''}">
      <span class="dia">${p.day} ${MESES[+p.month-1]}</span>
      <span class="cuenta-dias">${c}</span></div>`;
  };

  const fechaLarga = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const plazoLargo = s => {
    if (!s) return 'sin plazo publicado';
    const p = partes(s);
    return `${fechaLarga(s)}, a las ${p.hour}:${p.minute} (hora peninsular)`;
  };
  // Sin provincia se dice la comunidad, y que la provincia no se sabe:
  // si no, un contrato catalán que aparece al filtrar por Girona parece
  // un error del filtro.
  const lugar = o => o.provincia
    ?? (o.comunidad ? `${o.comunidad}, provincia sin precisar` : null);

  // Solo el titular. Los cuatro recuadros de antes —abiertos, encaje
  // claro, importe, vencimientos— duplicaban lo que ya dicen el titular
  // y los filtros de debajo. La misma función en dos sitios confunde
  // más de lo que ayuda, y quien usa esto es un profesional que sabe
  // lo que busca.
  function pintarTitular(lista) {
    const n = lista.length;
    const titular = document.getElementById('titular');
    if (n > 0) {
      titular.textContent =
        `Hay ${n} ${n === 1 ? 'contrato abierto' : 'contratos abiertos'} para ti`;
      return;
    }
    // Sin nada que enseñar, el motivo importa: no es lo mismo estar al
    // día en novedades que no tener ningún contrato abierto.
    titular.textContent = pestana === 'hoy'
      ? 'No hay novedades para ti'
      : 'Ahora mismo no hay contratos abiertos para ti';
  }

  // Provincias elegidas. Vacío es "toda España", no "ninguna": es lo que
  // espera quien todavía no ha elegido nada.
  const elegidas = new Set();
  let pestana = pestanaInicial;

  // ---------- Los filtros se recuerdan ----------
  //
  // Quien trabaja en Asturias no debería volver a marcar Asturias cada
  // vez que entra. Encaje, sector y provincias se guardan en este
  // navegador y por empresa: con dos NIF en la cuenta, cada una tiene los
  // suyos. La búsqueda por texto solo dura la sesión: un "limpieza"
  // escrito ayer y todavía puesto hoy parece una lista rota.
  //
  // En el navegador y no en la base: es cómo prefiere mirar la lista,
  // no un dato de la empresa, y así no cuesta una llamada por clic.
  const CLAVE_FILTROS = 'filtros-contratos:' + perfil.id;
  const CLAVE_TEXTO = 'texto-contratos:' + perfil.id;
  let recordados = {};
  try { recordados = JSON.parse(localStorage.getItem(CLAVE_FILTROS)) ?? {}; }
  catch { /* modo privado o dato roto: se empieza sin filtros */ }
  (Array.isArray(recordados.provincias) ? recordados.provincias : [])
    .forEach(p => elegidas.add(String(p)));

  function guardarFiltros() {
    const campoSector = document.getElementById('f-sector');
    // Mientras los sectores no han llegado, el selector está vacío: no se
    // pisa el que había guardado.
    const sector = SECTORES.length
      ? (SECTORES[campoSector.value]?.id ?? null)
      : (recordados.sector ?? null);
    recordados = {
      veredicto: document.getElementById('f-veredicto').value || null,
      sector,
      provincias: [...elegidas],
    };
    try {
      localStorage.setItem(CLAVE_FILTROS, JSON.stringify(recordados));
      sessionStorage.setItem(CLAVE_TEXTO, document.getElementById('f-texto').value);
    } catch { /* modo privado: se filtra igual, solo que no se recuerda */ }
  }

  const hayFiltros = () =>
    !!(document.getElementById('f-veredicto').value
       || document.getElementById('f-sector').value
       || document.getElementById('f-texto').value.trim()
       || elegidas.size);

  function quitarFiltros() {
    document.getElementById('f-veredicto').value = '';
    document.getElementById('f-sector').value = '';
    document.getElementById('f-texto').value = '';
    elegidas.clear();
    pintarEtiquetas();
    repintar();
  }

  // La visita se marca por HABER ENTRADO, no solo por abrir la pestaña de
  // novedades.
  //
  // Antes solo se marcaba al salir de esa pestaña, así que quien no la
  // pulsara nunca dejaba el contador intacto: al recargar volvían a
  // aparecer las mismas de siempre, y "novedad" dejaba de significar nada.
  //
  // Una sola vez por sesión, y sin tocar el contador de esta: lo que está
  // mirando sigue marcado hasta que vuelva.
  let yaMarcada = false;
  const marcarLaVisita = () => {
    if (yaMarcada) return;
    yaMarcada = true;
    // El `.then` no es decorativo: la librería de Supabase no envía la
    // petición hasta que alguien espera el resultado. Llamarla y soltarla
    // no hacía nada, y el fallo era invisible porque tampoco daba error.
    sb.rpc('marcar_visita').then(
      ({ error }) => { if (error) console.warn('No se marcó la visita:', error); },
      error => console.warn('No se marcó la visita:', error),
    );
  };

  // Sectores de la empresa; vacío hasta que llegan, y el selector oculto
  // mientras tanto o si tiene menos de dos.
  let SECTORES = [];

  function pintar() {
    if (!vigente() || !document.getElementById('lista')) return;
    guardarFiltros();
    document.getElementById('quitar-filtros').hidden = !hayFiltros();
    const ver = document.getElementById('f-veredicto').value;
    const txt = document.getElementById('f-texto').value.toLowerCase().trim();
    const campoSector = document.getElementById('f-sector');
    const sector = SECTORES[campoSector.value];
    const vistos = DATOS.filter(o =>
      (pestana === 'todo' || o.es_novedad) &&
      enZona(o) &&
      (!ver || o.veredicto === ver) &&
      (!sector || enSector(o, sector)) &&
      (!txt || `${o.titulo} ${o.organo}`.toLowerCase().includes(txt)));

    // Cuántos hay en cada sector con la pestaña actual: elegir uno que
    // resulta vacío es un clic perdido y parece un fallo.
    [...campoSector.options].forEach(op => {
      const s = SECTORES[op.value];
      if (!s) return;
      const n = DATOS.filter(o => (pestana === 'todo' || o.es_novedad)
                                  && enSector(o, s)).length;
      op.textContent = `${s.nombre} (${n})`;
    });

    pintarTitular(vistos);
    document.getElementById('lista').innerHTML = vistos.length ? vistos.map((o,i) => `
      <div class="fila-envoltorio">
      <button class="fila" data-i="${i}">
        ${bloqueFecha(o)}
        <div><p class="t">${esc(o.titulo)}</p>
          <p class="meta">${esc([o.organo, lugar(o)].filter(Boolean).join(' · '))}</p>
          ${o.dias_sin_verificar > 90
            ? `<span class="sin-verificar">Sin movimiento desde hace
               ${o.dias_sin_verificar} días · comprueba en el expediente</span>` : ''}
          ${o.correccion
            ? `<span class="confirmado">Confirmado como tuyo</span>`
            : `<span class="acciones">
                 <span class="accion si" data-si="${esc(o.id_licitacion)}">Sí me interesa</span>
                 <span class="accion no" data-no="${esc(o.id_licitacion)}">No me interesa</span>
               </span>`}

        </div>
        <div class="derecha"><div class="importe">${euros(o.presupuesto) ?? 'sin importe'}</div>
          <span class="marca ${o.veredicto}">${o.veredicto === 'si' ? 'para mí' : 'puede ser para mí'}</span></div>
      </button>
      <section class="detalle" id="d${i}">
        <!-- El motivo del cribado NO se enseña.
             Es el razonamiento interno del clasificador —"mantenimiento de
             dispositivos CR, pero no se especifica que sean de diagnóstico
             por imagen"— y leerlo solo consigue que el cliente discuta con
             la máquina en vez de decirle si le interesa o no. Para eso
             están los dos botones. -->
        <dl>
          <dt>Órgano</dt><dd>${esc(o.organo ?? '—')}</dd>
          <dt>Provincia</dt><dd>${esc(o.provincia
            ?? (o.comunidad ? `sin precisar (${o.comunidad})` : 'no informada'))}</dd>
          <dt>Presupuesto</dt><dd>${euros(o.presupuesto) ?? 'sin importe publicado'}</dd>
          <dt>Plazo</dt><dd>${plazoLargo(o.fecha_limite)}</dd>
          <dt>Códigos CPV</dt><dd>${esc((o.cpvs || []).join(', ')) || '—'}</dd>
          <dt>Último movimiento</dt><dd>${
