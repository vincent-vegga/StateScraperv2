// Descartes que esperan a enviarse, por id de licitación: { perfilId,
// motivo, temporizador }. Viven fuera de la pantalla para sobrevivir a un
// cambio de pestaña mientras corre la cuenta atrás (ver `corregir`).
const DESCARTES_PENDIENTES = new Map();
const ESPERA_DESHACER = 6000;

// Envía ya un descarte pendiente. Por fetch y no por la librería por dos
// motivos: con la empresa del descarte fija en `x-perfil` (si entre medias
// se cambia de empresa, la librería mandaría la nueva), y con keepalive,
// que es lo único que llega a salir cuando se está cerrando la pestaña.
//
// Devuelve { data, error } como `sb.rpc`.
async function enviarDescarte(id, alSalir = false) {
  const p = DESCARTES_PENDIENTES.get(id);
  if (!p) return { data: null, error: null };
  DESCARTES_PENDIENTES.delete(id);
  clearTimeout(p.temporizador);
  let token = p.token;
  if (!alSalir) {
    const { data: { session } } = await sb.auth.getSession();
    token = session?.access_token ?? token;
  }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/corregir`, {
      method: 'POST', keepalive: alSalir,
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${token}`,
                 'Content-Type': 'application/json', 'x-perfil': p.perfilId },
      body: JSON.stringify({ licitacion: id, le_interesa: false,
                             por_que: p.motivo ?? null }),
    });
    if (!r.ok) return { data: null, error: new Error(`HTTP ${r.status}`) };
    return { data: await r.json().catch(() => null), error: null };
  } catch (error) {
    return { data: null, error };
  }
}
window.addEventListener('pagehide', () => {
  for (const id of [...DESCARTES_PENDIENTES.keys()]) enviarDescarte(id, true);
});

async function pantallaOportunidades(perfil, session, volviendo = false,
                                     pestanaInicial = 'todo') {
  const miLista = ++listaVigente;
  const vigente = () => miLista === listaVigente;
  if (!volviendo) irA('contratos', { pestana: 'todo' }, true);
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando tus contratos...</p></div>`;


  const { data, error } = await pedirContratos(perfil.id, nuevos => {
    // Si algo cambió por detrás, se repinta sin que el cliente
    // haya tenido que esperar.
    if (!vigente() || !document.getElementById('lista')) return;
    ponerDatos(nuevos);
  });
  // Mientras llegaban los datos se ha abierto otra lista: esa manda.
  if (!vigente()) return;
  if (error) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tus contratos.</div></div>`;
    return;
  }

  const preparar = filas => (filas ?? [])
    // Lo descartado que aún espera a enviarse (ver `corregir`) no vuelve
    // a salir porque llegue un refresco.
    .filter(o => !DESCARTES_PENDIENTES.has(o.id_licitacion))
    .map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
    .sort((a, b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));
  const DATOS = preparar(data);

  // Datos nuevos llegados por detrás (refresco de la caché o cribado de
  // fondo). Antes solo se repintaba la lista: el contador de la pestaña y
  // las cifras del selector de provincias se quedaban con los de la
  // primera carga y no cuadraban con lo que se veía.
  function ponerDatos(nuevos) {
    const vistas = new Set(DATOS.filter(o => !o.es_novedad).map(o => o.id_licitacion));
    DATOS.length = 0;
    preparar(nuevos).forEach(o => {
      // Lo que ya se ha dado por visto en esta sesión no vuelve a ser
      // novedad por refrescar.
      if (yaVistas && vistas.has(o.id_licitacion)) o.es_novedad = false;
      DATOS.push(o);
    });
    indexarZonas();
    pintarContadores();
    pintarEtiquetas();
    if (!panel.hidden) pintarOpciones();
    pintar();
  }

  // Para el cribado de fondo del arranque: cuando termina, pide la lista
  // de nuevo y la repinta aquí mismo, conservando pestaña y filtros.
  refrescarListaAbierta = async () => {
    olvidar('contratos');
    const { data: nuevos, error: fallo } = await pedirContratos(perfil.id);
    if (fallo || !vigente() || !document.getElementById('lista')) return;
    ponerDatos(nuevos);
  };

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Tus contratos</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('contratos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <h1 id="titular" style="margin-top:30px"></h1>
    <div class="pestanas" role="tablist">
      <button class="pestana" role="tab" id="p-todo" aria-selected="true">
        Todos los abiertos<span class="cuantas" id="c-todo"></span></button>
      <button class="pestana" role="tab" id="p-hoy" aria-selected="false">
        Novedades<span class="cuantas" id="c-hoy"></span></button>
    </div>
    <div class="filtros">
      <select id="f-veredicto">
        <option value="">Cualquier encaje</option>
        <option value="si">Para mí</option>
        <option value="quizas">Puede ser para mí</option>
      </select>
      <!-- Lo que dice Viabilidad de cada contrato, calculado de antemano
           (viabilidad_guardada). "Sin los cerrados" es el uso de verdad:
           quitarse de delante lo que ya tiene dueño. -->
      <select id="f-viabilidad" aria-label="Filtrar por opciones de ganar"
              ${VIABILIDAD_VISIBLE ? '' : 'hidden'}>
        <option value="">Viabilidad: todas</option>
        <option value="abierto">Tienes opciones</option>
        <option value="no-cerrado">Sin los cerrados</option>
        <option value="dificil">Difícil</option>
        <option value="cerrado">Parece cerrado</option>
      </select>
      <select id="f-sector" aria-label="Filtrar por sector" hidden>
        <option value="">Todos los sectores</option>
      </select>
      <input type="search" id="f-texto" placeholder="Buscar por título u órgano"
             aria-label="Buscar por título u órgano">
      <div class="selector">
        <button type="button" class="campo-geo" id="campo-geo"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="panel-geo"
                aria-label="Filtrar por provincia"><span id="resumen-geo">Toda España</span></button>
        <div class="panel-geo" id="panel-geo" hidden>
          <input type="search" id="buscador-geo" autocomplete="off"
                 role="combobox" aria-expanded="true" aria-controls="desplegable"
                 aria-label="Buscar provincia o comunidad"
                 placeholder="Buscar provincia o comunidad">
          <div class="desplegable" id="desplegable" role="listbox"
               aria-multiselectable="true"></div>
          <div class="pie-geo">
            <span id="cuenta-geo"></span>
            <button type="button" class="enlace" id="toda-espana">Toda España</button>
          </div>
        </div>
      </div>
      <button type="button" class="quitar-filtros" id="quitar-filtros" hidden>
        Quitar filtros</button>
    </div>
    <p class="explica" id="explica">Cada vez que marcas un contrato como
    <strong>no me interesa</strong> o <strong>sí me interesa</strong>, tu
    filtro aprende. A las pocas correcciones lo ajustamos y vuelves a ver
    la lista con lo que de verdad te encaja.
    <button class="cerrar" id="cerrar-explica"
            aria-label="Dejar de mostrar esta explicación">×</button></p>
    <main id="lista"></main>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'contratos');

  // ---------- La explicación se puede ocultar ----------
  //
  // Se recuerda para no volver a mostrarla, pero se puede recuperar desde
  // el panel: quien la cierre el primer día no debería quedarse sin saber
  // para qué sirven los botones.
  const explica = document.getElementById('explica');
  try {
    if (localStorage.getItem('sin-explicacion') === '1') explica?.remove();
  } catch { /* modo privado */ }
  alPulsar('cerrar-explica', () => {
    explica?.remove();
    try { localStorage.setItem('sin-explicacion', '1'); } catch { /* nada */ }
  });

  const bloqueFecha = o => {
    if (o.dias == null) return `<div class="fecha sinplazo"><span class="dia">Sin plazo</span></div>`;
    // El día que vale de verdad: un plazo a las 00:00 es el final del
    // anterior (ver `plazoEfectivo`).
    const p = partes(plazoEfectivo(o.fecha_limite));
    // Corto para que quepa en una línea: con "quedan 5 días" la celda
    // crecía a dos y rompía el ritmo de la lista. La fecha está justo
    // encima, así que "hoy" o "en 5 días" se entiende igual.
    //
    // De otro año, el año en vez de la cuenta: "6 feb · en 1221 días" no
    // decía de qué año era, y una cifra así no se lee de un vistazo.
    const c = o.dias < 0 ? 'vencido'
            : o.dias === 0 ? 'hoy'
            : o.dias === 1 ? 'mañana'
            : +p.year !== anioEnCurso() ? `de ${p.year}`
            : `en ${o.dias} días`;
    // Tres días, no siete. Con siete se marcaba media lista, y un aviso
    // que sale en la mayoría de las filas deja de avisar: se convierte
    // en ruido y enseña a ignorarlo.
    return `<div class="fecha ${o.dias <= 3 ? 'apura' : ''}">
      <span class="dia">${p.day} ${MESES[+p.month-1]}</span>
      <span class="cuenta-dias">${c}</span></div>`;
  };

  const fechaLarga = s => s ? new Date(s).toLocaleDateString('es-ES',
    {timeZone:ZONA, day:'numeric', month:'long', year:'numeric'}) : '—';
  const plazoLargo = s => {
    if (!s) return 'sin plazo publicado';
    // "5 de octubre, a las 00:00" se leía como que quedaba todo el día 5.
    if (esMedianoche(s))
      return `${fechaLarga(plazoEfectivo(s))}, hasta medianoche (hora peninsular)`;
    const p = partes(s);
    return `${fechaLarga(s)}, a las ${p.hour}:${p.minute} (hora peninsular)`;
  };
  // Sin provincia se dice la comunidad, y que la provincia no se sabe:
  // si no, un contrato catalán que aparece al filtrar por Girona parece
  // un error del filtro.
  const lugar = o => o.provincia
    ?? (o.comunidad ? `${o.comunidad}, provincia sin precisar` : null);

  // Lo que no es un contrato normal, dicho en la fila: en algunos sectores
  // los sistemas dinámicos llenan la lista y, vistos igual que un
  // contrato, parecen oportunidades que no son. El basado en un acuerdo
  // marco es el que más importa: si no estás homologado, no puedes
  // presentarte. La etiqueta es corta; la explicación va en el detalle,
  // porque un texto al pasar por encima no existe en el móvil.
  // El veredicto de Viabilidad en la fila, solo cuando avisa de algo.
  // "Tienes opciones" sale en tres de cada cuatro contratos (medido el
  // 04/10/2026: 2.150 de 2.865) y una marca en casi todas las filas deja
  // de avisar; para quedarse con esos está el filtro.
  const VIABILIDAD_FILA = {
    mio: 'Es tuyo: ganaste la anterior',
    dificil: 'Difícil',
    cerrado: 'Parece cerrado',
  };

  const SISTEMAS = {
    'Sistema dinámico de adquisición': {
      marca: 'SISTEMA DINÁMICO',
      explica: 'Es una inscripción en un catálogo de proveedores que sigue abierto. Entrar no es ganar un contrato: los encargos llegan después, entre los inscritos.',
    },
    'Acuerdo marco': {
      marca: 'ACUERDO MARCO',
      explica: 'Se homologa a una o varias empresas. El dinero llega después, con los contratos basados en el acuerdo.',
    },
    'Contrato basado en acuerdo marco': {
      marca: 'SOLO HOMOLOGADOS',
      explica: 'Es un encargo dentro de un acuerdo marco: solo pueden presentarse las empresas ya homologadas en él.',
    },
  };

  // Solo el titular. Los cuatro recuadros de antes —abiertos, encaje
  // claro, importe, vencimientos— duplicaban lo que ya dicen el titular
  // y los filtros de debajo. La misma función en dos sitios confunde
  // más de lo que ayuda, y quien usa esto es un profesional que sabe
  // lo que busca.
  //
  // `total` es lo que hay en la pestaña sin filtros. Con filtros puestos se
  // dice "N de M": "Hay 3 contratos abiertos para ti" con 182 detrás de un
  // filtro recordado de hace días se leía como que solo había 3.
  function pintarTitular(lista, total) {
    const n = lista.length;
    const titular = document.getElementById('titular');
    const filtrado = hayFiltros() && total > n;
    if (n > 0) {
      titular.textContent = filtrado
        ? `${numero(n)} de ${plural(numero(total), 'contrato abierto', 'contratos abiertos')} con estos filtros`
        : `Hay ${plural(numero(n), 'contrato abierto', 'contratos abiertos')} para ti`;
      return;
    }
    // Sin nada que enseñar, el motivo importa: no es lo mismo estar al
    // día en novedades que no tener ningún contrato abierto, ni que lo
    // escondan los filtros.
    titular.textContent = filtrado
      ? (pestana === 'hoy' ? 'Ninguna novedad con estos filtros'
                           : 'Ningún contrato con estos filtros')
      : pestana === 'hoy'
        ? 'No hay novedades para ti'
        : 'Ahora mismo no hay contratos abiertos para ti';
  }

  // Provincias elegidas. Vacío es "toda España", no "ninguna": es lo que
  // espera quien todavía no ha elegido nada.
  const elegidas = new Set();
  let pestana = pestanaInicial;

  // ---------- Los filtros se recuerdan ----------
  //
  // Quien trabaja en Asturias no debería volver a marcar Asturias cada
  // vez que entra. Encaje, sector y provincias se guardan en este
  // navegador y por empresa: con dos NIF en la cuenta, cada una tiene los
  // suyos. La búsqueda por texto solo dura la sesión: un "limpieza"
  // escrito ayer y todavía puesto hoy parece una lista rota.
  //
  // En el navegador y no en la base: es cómo prefiere mirar la lista,
  // no un dato de la empresa, y así no cuesta una llamada por clic.
  const CLAVE_FILTROS = 'filtros-contratos:' + perfil.id;
  const CLAVE_TEXTO = 'texto-contratos:' + perfil.id;
  let recordados = {};
  try { recordados = JSON.parse(localStorage.getItem(CLAVE_FILTROS)) ?? {}; }
  catch { /* modo privado o dato roto: se empieza sin filtros */ }
  (Array.isArray(recordados.provincias) ? recordados.provincias : [])
    .forEach(p => elegidas.add(String(p)));

  function guardarFiltros() {
    const campoSector = document.getElementById('f-sector');
    // Mientras los sectores no han llegado, el selector está vacío: no se
    // pisa el que había guardado.
    const sector = SECTORES.length
      ? (SECTORES[campoSector.value]?.id ?? null)
      : (recordados.sector ?? null);
    recordados = {
      veredicto: document.getElementById('f-veredicto').value || null,
      viabilidad: document.getElementById('f-viabilidad').value || null,
      sector,
      provincias: [...elegidas],
    };
    try {
      localStorage.setItem(CLAVE_FILTROS, JSON.stringify(recordados));
      sessionStorage.setItem(CLAVE_TEXTO, document.getElementById('f-texto').value);
    } catch { /* modo privado: se filtra igual, solo que no se recuerda */ }
  }

  const hayFiltros = () =>
    !!(document.getElementById('f-veredicto').value
       || document.getElementById('f-viabilidad').value
       || document.getElementById('f-sector').value
       || document.getElementById('f-texto').value.trim()
       || elegidas.size);

  function quitarFiltros() {
    document.getElementById('f-veredicto').value = '';
    document.getElementById('f-viabilidad').value = '';
    document.getElementById('f-sector').value = '';
    document.getElementById('f-texto').value = '';
    elegidas.clear();
    pintarEtiquetas();
    repintar();
  }

  // La visita se marca por HABER ENTRADO, no solo por abrir la pestaña de
  // novedades.
  //
  // Antes solo se marcaba al salir de esa pestaña, así que quien no la
  // pulsara nunca dejaba el contador intacto: al recargar volvían a
  // aparecer las mismas de siempre, y "novedad" dejaba de significar nada.
  //
  // Una sola vez por sesión, y sin tocar el contador de esta: lo que está
  // mirando sigue marcado hasta que vuelva.
  let yaMarcada = false;
  const marcarLaVisita = () => {
    if (yaMarcada) return;
    yaMarcada = true;
    // El `.then` no es decorativo: la librería de Supabase no envía la
    // petición hasta que alguien espera el resultado. Llamarla y soltarla
    // no hacía nada, y el fallo era invisible porque tampoco daba error.
    sb.rpc('marcar_visita').then(
      ({ error }) => { if (error) console.warn('No se marcó la visita:', error); },
      error => console.warn('No se marcó la visita:', error),
    );
  };

  // Sectores de la empresa; vacío hasta que llegan, y el selector oculto
  // mientras tanto o si tiene menos de dos.
  let SECTORES = [];

  function pintar() {
    if (!vigente() || !document.getElementById('lista')) return;
    guardarFiltros();
    document.getElementById('quitar-filtros').hidden = !hayFiltros();
    const ver = document.getElementById('f-veredicto').value;
    const viab = document.getElementById('f-viabilidad').value;
    // "Tienes opciones" incluye lo que ya es tuyo; "sin los cerrados" deja
    // también lo que aún no tiene veredicto: no saberlo no es estar cerrado.
    const pasaViab = o => !viab
      || (viab === 'abierto' ? ['abierto', 'mio'].includes(o.viabilidad)
        : viab === 'no-cerrado' ? o.viabilidad !== 'cerrado'
        : o.viabilidad === viab);
    // Sin tildes y palabra a palabra, como en Organismos: "jardineria"
    // encontraba 3 contratos y "jardinería", 12.
    const txt = document.getElementById('f-texto').value.trim();
    const campoSector = document.getElementById('f-sector');
    const sector = SECTORES[campoSector.value];
    const enPestana = DATOS.filter(o => pestana === 'todo' || o.es_novedad);
    const vistos = enPestana.filter(o =>
      enZona(o) &&
      (!ver || o.veredicto === ver) &&
      pasaViab(o) &&
      (!sector || enSector(o, sector)) &&
      (!txt || coincide(`${o.titulo} ${o.organo}`, txt)));

    // Cuántos hay en cada sector con la pestaña actual: elegir uno que
    // resulta vacío es un clic perdido y parece un fallo.
    [...campoSector.options].forEach(op => {
      const s = SECTORES[op.value];
      if (!s) return;
      const n = DATOS.filter(o => (pestana === 'todo' || o.es_novedad)
                                  && enSector(o, s)).length;
      op.textContent = `${s.nombre} (${n})`;
    });

    pintarTitular(vistos, enPestana.length);
    // La fila es un `div` con papel de botón y no un <button>: dentro van
    // los dos botones de corrección, y un botón no puede llevar otros. Con
    // <span> por botones no se llegaba a ellos con el teclado y el lector
    // de pantalla los leía como texto suelto.
    document.getElementById('lista').innerHTML = vistos.length ? vistos.map((o,i) => `
      <div class="fila-envoltorio">
      <div class="fila" data-i="${i}" role="button" tabindex="0"
           aria-expanded="false" aria-controls="d${i}">
        ${bloqueFecha(o)}
        <div><p class="t">${esc(o.titulo)}</p>
          <p class="meta">${esc([o.organo, lugar(o)].filter(Boolean).join(' · '))}${
            SISTEMAS[o.sistema] ? `<span class="marca-ute marca-sistema">${
              SISTEMAS[o.sistema].marca}</span>` : ''}</p>
          ${VIABILIDAD_VISIBLE && VIABILIDAD_FILA[o.viabilidad] ? `<span class="viab ${
            o.viabilidad}">${VIABILIDAD_FILA[o.viabilidad]}</span>` : ''}
          ${o.dias_sin_verificar > 90
            ? `<span class="sin-verificar">Sin movimiento desde hace
               ${o.dias_sin_verificar} días · comprueba en el expediente</span>` : ''}
          ${o.correccion
            ? `<span class="confirmado">Confirmado como tuyo</span>`
            : `<span class="acciones">
                 <button type="button" class="accion si" data-si="${esc(o.id_licitacion)}">Sí me interesa</button>
                 <button type="button" class="accion no" data-no="${esc(o.id_licitacion)}">No me interesa</button>
               </span>`}

        </div>
        <div class="derecha"><div class="importe">${euros(o.presupuesto) ?? 'sin importe'}</div>
          <span class="marca ${o.veredicto}">${o.veredicto === 'si' ? 'para mí' : 'puede ser para mí'}</span></div>
      </div>
      <section class="detalle" id="d${i}">
        <!-- El motivo del cribado NO se enseña.
             Es el razonamiento interno del clasificador —"mantenimiento de
             dispositivos CR, pero no se especifica que sean de diagnóstico
             por imagen"— y leerlo solo consigue que el cliente discuta con
             la máquina en vez de decirle si le interesa o no. Para eso
             están los dos botones. -->
        <dl>
          ${SISTEMAS[o.sistema] ? `<dt>Tipo</dt><dd>${esc(o.sistema)}
            <br><span style="color:var(--tenue)">${SISTEMAS[o.sistema].explica}</span></dd>` : ''}
          <dt>Órgano</dt><dd>${esc(o.organo ?? '—')}</dd>
          <dt>Provincia</dt><dd>${esc(o.provincia
            ?? (o.comunidad ? `sin precisar (${o.comunidad})` : 'no informada'))}</dd>
          <dt>Presupuesto</dt><dd>${euros(o.presupuesto) ?? 'sin importe publicado'}</dd>
          <dt>Duración</dt><dd>${duracionTxt(o.duracion_meses)
            ? `${duracionTxt(o.duracion_meses)}${
                importeAnualTxt(o.presupuesto_base, o.duracion_meses)
                  ? ` · base de licitación ${importeAnualTxt(o.presupuesto_base, o.duracion_meses)}` : ''}${
                o.prorrogas_texto
                  ? `<br><span style="color:var(--tenue)">Prórrogas: ${esc(o.prorrogas_texto)}</span>` : ''}`
            : '<span style="color:var(--tenue)">no publicada por el organismo</span>'}</dd>
          <dt>Plazo</dt><dd>${plazoLargo(o.fecha_limite)}</dd>
          <dt>Códigos CPV</dt><dd>${esc((o.cpvs || []).join(', ')) || '—'}</dd>
          <dt>Último movimiento</dt><dd>${
            o.dias_sin_verificar == null ? '—'
            : o.dias_sin_verificar === 0 ? 'hoy'
            : o.dias_sin_verificar === 1 ? 'ayer'
            : `hace ${o.dias_sin_verificar} días`}${
            o.dias_sin_verificar > 90
              ? ' — lleva mucho parado, conviene comprobarlo' : ''}</dd>
        </dl>
        ${VIABILIDAD_VISIBLE ? `<button class="principal" data-analizar="${esc(o.id_licitacion)}"
                style="margin-right:10px">Analizar viabilidad</button>` : ''}
        ${o.enlace ? `<a class="ver" href="${esc(o.enlace)}" target="_blank" rel="noopener">Ver el expediente</a>` : ''}
      </section></div>`).join('')
      // En Novedades, "estás al día" solo si de verdad no hay ninguna: si
      // las esconden los filtros, se dice eso y se da la salida.
      : pestana === 'hoy' && !(hayFiltros() && enPestana.length)
        ? `<p class="vacio">Estás al día. Aquí aparecerá lo que entre
           a partir de ahora.</p>`
        : `<p class="vacio">${pestana === 'hoy'
            ? `${plural(numero(enPestana.length), 'novedad', 'novedades')}, pero
               ninguna encaja con estos filtros.`
            : 'Ningún contrato encaja con estos filtros.'}${
            hayFiltros() ? `<button type="button" class="quitar-filtros"
              data-quitar-filtros>Quitar filtros</button>` : ''}</p>`;
    // Con los filtros recordados, una lista vacía puede venir de algo
    // que se eligió hace días: la salida tiene que estar justo ahí.
    document.querySelector('[data-quitar-filtros]')
      ?.addEventListener('click', quitarFiltros);

    // El botón de analizar vive en el DETALLE, que es hermano de la
    // fila y no hijo suyo. Enganchado a `.fila` como los demás, el clic
    // no llegaba nunca: hay que escuchar en la lista, que contiene los
    // dos.
    const lista_ = document.getElementById('lista');
    if (!lista_.dataset.conAnalisis) {
      lista_.dataset.conAnalisis = '1';
      lista_.addEventListener('click', ev => {
        const b = ev.target.closest('[data-analizar]');
        if (!b) return;
        ev.stopPropagation();
        pantallaViabilidad(perfil, session, false, b.dataset.analizar);
      });
    }

    raiz.querySelectorAll('.fila').forEach(f => {
      const alternar = () => {
        const abierta = document.getElementById('d' + f.dataset.i)
          .classList.toggle('abierto');
        // Lo dice al lector de pantalla y, por CSS, deja el título entero.
        f.setAttribute('aria-expanded', String(abierta));
      };
      f.onclick = ev => {
        // Los botones de corrección viven dentro de la fila para que
        // aparezcan a su altura. Hay que evitar que su clic despliegue
        // también el detalle.
        const accion = ev.target.closest('.accion');
        if (accion) {
          ev.stopPropagation();
          if (accion.dataset.si) corregir(accion.dataset.si, true);
          else pedirMotivo(accion.dataset.no, accion);
          return;
        }
        alternar();
      };
      // Lo que un <button> traía de serie: Intro y espacio la despliegan.
      f.onkeydown = ev => {
        if (ev.target !== f || (ev.key !== 'Enter' && ev.key !== ' ')) return;
        ev.preventDefault();
        alternar();
      };
    });
  }

  // ---------- Correcciones ----------

  // A las tres correcciones se regenera el criterio. Con una sola el
  // modelo no puede deducir nada; con tres ya hay patrón, y esperar más
  // solo retrasa la mejora. El coste de una regeneración es irrisorio.
  const CORRECCIONES_PARA_AJUSTAR = 3;

  async function corregir(id, interesa, motivo) {
    // Corregir cambia lo que se muestra, así que lo guardado deja de
    // describir la realidad.
    olvidar('analizables', 'contratos');
    const i = DATOS.findIndex(o => o.id_licitacion === id);
    const antes = i >= 0 ? DATOS[i] : null;
    if (i >= 0) {
      if (interesa) {
        // Confirmado: la fila se queda, pero ya no hay nada que
        // preguntar sobre ella.
        DATOS[i] = { ...DATOS[i], correccion: true };
      } else {
        // Descartado: desaparece al instante. El cliente no debe esperar
        // al servidor para dejar de ver lo que no le sirve.
        DATOS.splice(i, 1);
      }
    }
    repintar();

    // Vuelve a poner la fila donde estaba.
    const devolver = () => {
      if (!antes || !vigente()) return;
      const j = DATOS.findIndex(o => o.id_licitacion === id);
      if (j >= 0) DATOS[j] = antes;
      else DATOS.splice(Math.min(i, DATOS.length), 0, antes);
      repintar();
    };

    // Si no se guarda, se deshace y se dice.
    //
    // Antes el error se tragaba: la librería de Supabase no lanza, devuelve
    // `{ error }`, así que el `catch` no saltaba nunca. La fila desaparecía
    // como si todo hubiera ido bien, la corrección no llegaba a la base y
    // al recargar el contrato volvía a salir, sin que nada lo reintentara.
    // Y el cliente que se toma la molestia de corregir es justo el que más
    // se fija en si le hacemos caso.
    const tras = respuesta => {
      if (respuesta.error) {
        devolver();
        recado('No se ha podido guardar tu respuesta. Inténtalo de nuevo.');
        return;
      }
      if (vigente() && respuesta.data?.pendientes >= CORRECCIONES_PARA_AJUSTAR)
        ajustarFiltro();
    };

    if (interesa) {
      let respuesta;
      try {
        respuesta = await sb.rpc('corregir', {
          licitacion: id, le_interesa: true, por_que: motivo ?? null,
        });
      } catch (error) {
        respuesta = { error };
      }
      return tras(respuesta);
    }

    // Un descarte se puede deshacer: la fila se va al instante, pero no se
    // envía hasta que pasa el plazo del "Deshacer". Un toque en el botón
    // equivocado, en el móvil y con la lista moviéndose, ya no es un
    // contrato perdido. Si se cierra la pestaña antes, sale igual (ver
    // `enviarDescarte`, en pagehide).
    const { data: { session: ahora } } = await sb.auth.getSession();
    DESCARTES_PENDIENTES.set(id, {
      perfilId: perfil.id, motivo, token: ahora?.access_token,
      temporizador: setTimeout(async () => tras(await enviarDescarte(id)),
                               ESPERA_DESHACER),
    });
    recado('Contrato descartado', {
      texto: 'Deshacer',
      hacer: () => {
        const p = DESCARTES_PENDIENTES.get(id);
        if (!p) return;
        clearTimeout(p.temporizador);
        DESCARTES_PENDIENTES.delete(id);
        devolver();
      },
    }, ESPERA_DESHACER);
  }

  // `origen` es el botón que lo abrió: al cancelar, el foco vuelve a él y
  // no al principio de la página.
  // Por qué salió: el contrato de su historial que más se le parece
  // (veredictos.parecido, lo escribe el puntuador). No el motivo del juez,
  // que sin NIF habla de contratos «ganados» que no ganó. Sin historial
  // (criterio en prosa) no hay frase.
  function porQueSale(id) {
    const parecido = (DATOS.find(o => o.id_licitacion === id)?.parecido || '').trim();
    if (!parecido) return '';
    const corto = parecido.length > 110 ? parecido.slice(0, 107).trimEnd() + '…' : parecido;
    return `<p class="por-que-sale">Te lo enseñamos porque se parece a
      «${esc(corto)}», ${perfil.cif ? 'un contrato que ganaste'
        : 'un contrato de otra empresa parecido a lo que nos contaste de la tuya'}.</p>`;
  }

  function pedirMotivo(id, origen = null) {
    const velo = document.createElement('div');
    velo.className = 'velo';
    const sale = porQueSale(id);
    velo.innerHTML = `
      <div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="titulo-motivo">
        <button type="button" class="cerrar-dialogo" id="cancelar-motivo"
                aria-label="Cancelar, no descartar">×</button>
        <h3 id="titulo-motivo">¿Por qué no te interesa?</h3>
        ${sale}
        <p>${sale ? 'Dinos qué no encaja: con' : 'Con'} una frase basta, y nos
        ayuda mucho más que el descarte solo. Puedes saltártelo.</p>
        <textarea id="por-que" aria-labelledby="titulo-motivo"
          placeholder="Por ejemplo: es demasiado grande para nosotros, o no trabajamos en esa zona"></textarea>
        <div class="botonera">
          <button class="enlace" id="saltar">Descartar sin explicar</button>
          <button class="principal" id="enviar">Enviar</button>
        </div>
      </div>`;
    document.body.appendChild(velo);
    const campo = velo.querySelector('#por-que');
    campo.focus();

    const quitar = () => { velo.remove(); origen?.isConnected && origen.focus(); };
    const cerrar = motivo => { velo.remove(); corregir(id, false, motivo); };
    velo.querySelector('#saltar').onclick = () => cerrar(null);
    velo.querySelector('#enviar').onclick = () => cerrar(campo.value.trim() || null);
    // Antes solo se salía tocando fuera, y en el móvil no se adivinaba.
    velo.querySelector('#cancelar-motivo').onclick = quitar;
    velo.onclick = ev => { if (ev.target === velo) quitar(); };
    atraparFoco(velo, quitar);
    campo.onkeydown = ev => {
      if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) cerrar(campo.value.trim() || null);
    };
  }

  async function ajustarFiltro() {
    const aviso = document.createElement('div');
    aviso.className = 'velo';
    aviso.innerHTML = `
      <div class="dialogo" role="dialog" aria-modal="true" aria-live="polite"
           aria-labelledby="titulo-ajuste">
        <h3 id="titulo-ajuste">Estamos ajustando tu filtro</h3>
        <p>Con lo que nos has dicho. Después volveremos a revisar todos
        tus contratos con el filtro nuevo, así que tardará un momento.</p>
      </div>`;
    document.body.appendChild(aviso);

    try {
      const r = await llamar('ajustar');
      // Recribar con el criterio nuevo: si no, la corrección se quedaría
      // en el contrato que la provocó en lugar de propagarse.
      // Con la misma salida que el cribado inicial: si una vuelta no
      // clasifica nada, las siguientes tampoco lo harán.
      let vueltas = 0, sinAvance = 0;
      while (vueltas++ < 200) {
        const c = await llamar('cribar');
        if (c.terminado) break;
        if (c.esperando) continue;   // el puntuador rehace su lista
        sinAvance = c.hechas ? 0 : sinAvance + 1;
        if (sinAvance >= 2) break;
      }
      // Se dice QUÉ ha cambiado, no que algo ha cambiado. Es el momento
      // en que el cliente ve que sus respuestas han servido para algo, y
      // un mensaje genérico lo desperdicia.
      const cambios = Array.isArray(r.cambios) ? r.cambios : [];
      aviso.querySelector('.dialogo').innerHTML = `
        <h3>Tu filtro ha aprendido</h3>
        ${cambios.length ? `
          <div class="aprendido">
            <strong>A partir de ahora:</strong>
            <ul>${cambios.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
          </div>` : `
          <p>${esc(r.resumen || 'Hemos ajustado tu filtro con tus correcciones.')}</p>`}
        <p style="font-size:.88rem">Hemos vuelto a revisar todos tus
        contratos con el filtro nuevo.</p>
        <div class="botonera"><button class="principal" id="ver">Ver la lista</button></div>`;
      aviso.querySelector('#ver').onclick = () => location.reload();
      aviso.querySelector('#ver').focus();
    } catch {
      // Las correcciones ya están guardadas: lo que ha fallado es rehacer
      // el filtro con ellas, y se vuelve a intentar en la siguiente.
      aviso.remove();
      recado('No hemos podido ajustar tu filtro ahora. Tus respuestas están guardadas y lo intentaremos de nuevo.');
    }
  }

  let temporizador;
  const repintar = () => {
    const lista = document.getElementById('lista');
    // Un "Deshacer" o un fallo de envío pueden llegar con otra pantalla
    // delante: no hay lista que repintar.
    if (!lista || !vigente()) return;
    lista.classList.add('cambiando');
    clearTimeout(temporizador);
    temporizador = setTimeout(() => {
      pintar();
      lista.classList.remove('cambiando');
    }, 160);
  };

  // ---------- Selector de provincias y comunidades ----------
  //
  // Se agrupan por comunidad porque un profesional que trabaja en
  // Cataluña quiere las cuatro provincias, no ir marcándolas de una en
  // una. Y las uniprovinciales aparecen a nivel raíz: repetir "Madrid"
  // como comunidad y como provincia solo confunde.
  //
  // Todo se calcula en `indexarZonas`, que se repite cuando llegan datos
  // nuevos: calculado una sola vez, las cifras del selector se quedaban
  // con las de la primera carga.
  let porComunidad, cuantasPor, comunidadDe, sinPrecisarPor, comunidades;

  // Contratos sin provincia precisa. No se esconden al filtrar.
  //
  // Las plataformas autonómicas no publican lugar de ejecución, y hay
  // órganos que contratan para toda su comunidad —un departamento de la
  // Generalitat, una consejería de la Junta—. Antes el filtro los tiraba:
  // con Barcelona elegida salían 4 contratos de unos 200 catalanes. Un
  // contrato de ámbito catalán sí le interesa a quien trabaja en
  // Barcelona, así que aparece con cualquiera de las provincias de su
  // comunidad, marcado como "provincia sin precisar".
  //
  // Y si no se sabe ni la comunidad, aparece siempre: es preferible uno
  // de más que perder uno.
  function indexarZonas() {
    porComunidad = {}; cuantasPor = {}; comunidadDe = {}; sinPrecisarPor = {};
    DATOS.forEach(o => {
      if (o.provincia) {
        (porComunidad[o.comunidad || 'Sin comunidad'] ??= new Set()).add(o.provincia);
        cuantasPor[o.provincia] = (cuantasPor[o.provincia] ?? 0) + 1;
        if (o.comunidad) comunidadDe[o.provincia] = o.comunidad;
      } else if (o.comunidad) {
        sinPrecisarPor[o.comunidad] = (sinPrecisarPor[o.comunidad] ?? 0) + 1;
      }
    });
    // Ordenadas por el nombre que SE VE: la uniprovincial se enseña con
    // el de su provincia (ver `visibles`), y ordenando por el de la
    // comunidad "Madrid" caía entre Cataluña y Comunidad Valenciana, y
    // "Murcia" la última.
    comunidades = Object.entries(porComunidad)
      .map(([nombre, provs]) => {
        const lista = [...provs].sort((a,b) => a.localeCompare(b,'es'));
        const uni = lista.length === 1 && sinTildes(nombre).includes(sinTildes(lista[0]));
        return { nombre, provs: lista, rotulo: uni ? lista[0] : nombre };
      })
      .sort((a,b) => a.rotulo.localeCompare(b.rotulo,'es'));
  }
  indexarZonas();

  function enZona(o) {
    if (elegidas.size === 0 || elegidas.has(o.provincia)) return true;
    if (o.provincia) return false;
    return !o.comunidad || [...elegidas].some(p => comunidadDe[p] === o.comunidad);
  }

  const campo = document.getElementById('campo-geo');
  const buscador = document.getElementById('buscador-geo');
  const desplegable = document.getElementById('desplegable');
  let destacada = -1;

  // Sin tildes: quien escribe "avila" o "coruna" quiere lo mismo que
  // quien escribe con acento.
  const plano = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const completa = c => c.provs.every(p => elegidas.has(p));

  function visibles() {
    const q = plano(buscador.value.trim());
    const lista = [];
    comunidades.forEach(c => {
      const coincide = !q || plano(c.nombre).includes(q);
      const hijas = c.provs.filter(p => coincide || plano(p).includes(q));
      if (!hijas.length) return;
      // Uniprovincial: comunidad y provincia son lo mismo, y repetirlo
      // solo confunde. Se compara por inclusión y no por igualdad: la
      // comunidad se llama "Comunidad de Madrid" o "Región de Murcia" y
      // la provincia "Madrid" o "Murcia", y con la igualdad salía
      // "Comunidad de Madrid · 1 provincias" con Madrid colgando debajo.
      if (c.provs.length === 1 && plano(c.nombre).includes(plano(c.provs[0]))) {
        lista.push({ tipo:'provincia', nivel:'raiz', clave:c.provs[0] });
        return;
      }
      lista.push({ tipo:'comunidad', nivel:'raiz', clave:c.nombre, dato:c });
      hijas.forEach(p => lista.push({ tipo:'provincia', nivel:'hija', clave:p }));
    });
    return lista;
  }

  function alternar(item) {
    if (item.tipo === 'comunidad') {
      const todas = completa(item.dato);
      item.dato.provs.forEach(p => todas ? elegidas.delete(p) : elegidas.add(p));
    } else {
      elegidas.has(item.clave) ? elegidas.delete(item.clave) : elegidas.add(item.clave);
    }
  }

  // Lo elegido, resumido en el propio campo. Las etiquetas de antes
  // partían el campo en varias líneas; ahora el detalle vive en el panel.
  function pintarEtiquetas() {
    const nombres = [...elegidas];
    // Una comunidad entera se nombra por la comunidad: "Cataluña" dice
    // más que "Barcelona y 3 más".
    const enteras = comunidades.filter(c => c.provs.length > 1 && completa(c));
    const sueltas = nombres.filter(p => !enteras.some(c => c.provs.includes(p)));
    const piezas = [...enteras.map(c => c.nombre), ...sueltas];
    const texto = !piezas.length ? 'Toda España'
      : piezas.length === 1 ? piezas[0]
      : piezas.length === 2 ? `${piezas[0]} y ${piezas[1]}`
      : `${piezas[0]} y ${piezas.length - 1} más`;
    document.getElementById('resumen-geo').textContent = texto;
    campo.title = piezas.length > 1 ? piezas.join(', ') : '';
    campo.classList.toggle('con-eleccion', elegidas.size > 0);
    document.getElementById('cuenta-geo').textContent = elegidas.size
      ? plural(elegidas.size, 'provincia elegida', 'provincias elegidas')
      : 'Toda España';
    document.getElementById('toda-espana').disabled = !elegidas.size;
  }

  function pintarOpciones() {
    const lista = visibles();
    if (!lista.length) {
      desplegable.innerHTML = '<p class="sinresultado">Ninguna coincidencia.</p>';
      return;
    }
    desplegable.innerHTML = lista.map((item, i) => {
      const esCom = item.tipo === 'comunidad';
      const marcada = esCom ? completa(item.dato) : elegidas.has(item.clave);
      // Las cifras cuentan también lo que el filtro enseñará sin
      // provincia precisa, para que cuadren con la lista.
      const n = esCom
        ? item.dato.provs.reduce((s,p) => s + (cuantasPor[p] ?? 0), 0)
          + (sinPrecisarPor[item.dato.nombre] ?? 0)
        : (cuantasPor[item.clave] ?? 0) + (sinPrecisarPor[comunidadDe[item.clave]] ?? 0);
      const cuantas = esCom ? item.dato.provs.length : 0;
      const extra = esCom
        ? `<span class="abarca">${cuantas} ${cuantas === 1 ? 'provincia' : 'provincias'}</span>` : '';
      return `<button type="button" role="option" data-i="${i}"
                class="opcion ${item.nivel === 'raiz' ? 'raiz' : 'hija'} ${i === destacada ? 'destacada' : ''}"
                aria-selected="${marcada}">
        <span class="casilla"></span>${esc(item.clave)} ${extra}
        <span class="cuantas">${n}</span></button>`;
    }).join('');

    desplegable.querySelectorAll('.opcion').forEach(b => b.onclick = () => {
      alternar(lista[+b.dataset.i]);
      // No se cierra ni se borra lo escrito: elegir varias es el caso
      // normal, y quien busca "castilla" quiere marcar varias de ellas.
      pintarEtiquetas(); pintarOpciones(); repintar();
    });
  }

  const panel = document.getElementById('panel-geo');
  // En el móvil, abrir el panel no saca el teclado: casi siempre se
  // elige tocando, y el teclado taparía media lista.
  const tactil = matchMedia('(hover:none),(pointer:coarse)').matches;

  const abrir = () => {
    if (!panel.hidden) return;
    panel.hidden = false;
    campo.setAttribute('aria-expanded', 'true');
    pintarOpciones();
    if (!tactil) buscador.focus();
  };
  const cerrar = (devolverFoco = false) => {
    if (panel.hidden) return;
    panel.hidden = true;
    campo.setAttribute('aria-expanded', 'false');
    buscador.value = '';
    destacada = -1;
    if (devolverFoco) campo.focus();
  };

  campo.onclick = () => panel.hidden ? abrir() : cerrar();
  campo.onkeydown = ev => {
    if (ev.key === 'ArrowDown') { ev.preventDefault(); abrir(); }
  };
  alPulsar('toda-espana', () => {
    elegidas.clear();
    pintarEtiquetas(); pintarOpciones(); repintar();
  });
  buscador.oninput = () => { destacada = -1; pintarOpciones(); };
  buscador.onkeydown = ev => {
    const lista = visibles();
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault();
      destacada = ev.key === 'ArrowDown'
        ? Math.min(destacada + 1, lista.length - 1)
        : Math.max(destacada - 1, 0);
      pintarOpciones();
      desplegable.querySelector('.destacada')?.scrollIntoView({block:'nearest'});
    } else if (ev.key === 'Enter') {
      ev.preventDefault();
      const item = destacada >= 0 ? lista[destacada] : (lista.length === 1 ? lista[0] : null);
      if (item) {
        alternar(item);
        pintarEtiquetas(); pintarOpciones(); repintar();
      }
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      cerrar(true);
    }
  };
  // Por la ruta del clic y no por `closest`: al marcar una opción la
  // lista se repinta, y cuando el clic llega aquí la opción ya no está en
  // la página. `closest` no encontraba el selector y cerraba el panel.
  document.addEventListener('click', ev => {
    if (!ev.composedPath().some(n => n.classList?.contains('selector'))) cerrar();
  }, dePantalla());
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !panel.hidden) cerrar(true);
  }, dePantalla());

  // ---------- Pestañas ----------
  // Los contadores ignoran los filtros: dicen cuánto hay en total en cada
  // una. Si mostraran el resultado filtrado, cambiar de pestaña sería un
  // salto a ciegas.
  // Sin número cuando no hay ninguna: un cero al lado de "Novedades"
  // ocupa sitio para decir que no hay nada que ver.
  function pintarContadores() {
    const nuevas = DATOS.filter(o => o.es_novedad).length;
    document.getElementById('c-hoy').textContent = nuevas ? numero(nuevas) : '';
    document.getElementById('c-todo').textContent = numero(DATOS.length);
  }
  pintarContadores();

  // Si ya ha salido de Novedades en esta visita, lo que vio deja de ser
  // novedad aunque llegue un refresco (ver `ponerDatos`).
  let yaVistas = false;

  function cambiarPestana(cual, volviendo = false) {
    // Al salir de novedades se marca la visita: lo que ha visto deja de
    // serlo. Si se marcara al entrar, recargar vaciaría la lista que
    // está mirando.
    if (pestana === 'hoy' && cual !== 'hoy') {
      marcarLaVisita();
      // Y se refleja aquí mismo. Antes solo se guardaba en la base, así
      // que el contador seguía diciendo 23 hasta recargar la página:
      // marcaba como pendiente algo que el cliente acababa de ver.
      DATOS.forEach(o => o.es_novedad = false);
      yaVistas = true;
      document.getElementById('c-hoy').textContent = '';
    }
    pestana = cual;
    // Cambiar de pestaña también es navegar: atrás debe devolver a la
    // anterior, no sacar de la web.
    if (!volviendo) irA('contratos', { pestana: cual });
    document.getElementById('p-hoy').setAttribute('aria-selected', cual === 'hoy');
    document.getElementById('p-todo').setAttribute('aria-selected', cual === 'todo');
    repintar();
  }
  alPulsar('p-hoy', () => cambiarPestana('hoy'));
  alPulsar('p-todo', () => cambiarPestana('todo'));
  if (pestanaInicial !== 'todo') cambiarPestana(pestanaInicial, true);

  // La visita se marca por HABER ENTRADO, no solo por abrir la pestaña
  // de novedades.
  //
  // Antes solo se marcaba al salir de esa pestaña, así que quien no la
  // pulsara nunca dejaba el contador intacto: al recargar volvían a
  // aparecer las mismas de siempre, y "novedad" dejaba de significar
  // nada.
  //
  // Se espera unos segundos para no marcar como visto un arranque que se
  // cierra al instante, y no se toca el contador de esta sesión: lo que
  // está mirando sigue marcado hasta que vuelva.
  setTimeout(marcarLaVisita, 4000);

  // Y al cerrar, por si se va antes de esos segundos.
  window.addEventListener('beforeunload', marcarLaVisita, dePantalla());

  // Lo recordado, antes del primer pintado. Un valor que ya no existe en
  // el selector se descarta en vez de dejar una lista vacía sin motivo.
  const campoVeredicto = document.getElementById('f-veredicto');
  if ([...campoVeredicto.options].some(op => op.value === recordados.veredicto))
    campoVeredicto.value = recordados.veredicto;
  const campoViab = document.getElementById('f-viabilidad');
  if (VIABILIDAD_VISIBLE
      && [...campoViab.options].some(op => op.value === recordados.viabilidad))
    campoViab.value = recordados.viabilidad;
  try { document.getElementById('f-texto').value = sessionStorage.getItem(CLAVE_TEXTO) ?? ''; }
  catch { /* modo privado */ }
  alPulsar('quitar-filtros', quitarFiltros);

  pintarEtiquetas();
  ['f-veredicto','f-viabilidad','f-sector','f-texto'].forEach(id =>
    document.getElementById(id).addEventListener('input', repintar));
  pintar();

  // Por detrás: la primera vez puede tardar unos segundos (los escribe el
  // modelo), y la lista no tiene por qué esperarlos.
  cargarSectores(perfil).then(sectores => {
    const campo = document.getElementById('f-sector');
    // Si ya se ha ido a otra pantalla o a otra empresa, no hay dónde pintar.
    if (!campo || !vigente() || perfil.id !== perfilActivoId || sectores.length < 2) return;
    SECTORES = sectores;
    // Se vacía antes de rellenar: así nunca salen repetidos.
    campo.querySelectorAll('option:not([value=""])').forEach(op => op.remove());
    campo.insertAdjacentHTML('beforeend', sectores.map((x, i) =>
      `<option value="${i}">${esc(x.nombre)}</option>`).join(''));
    // Por su id y no por su posición: si los sectores se rehacen, el
    // tercero puede ser otro. Si ya no existe, se queda en "todos".
    const suyo = sectores.findIndex(x => x.id && x.id === recordados.sector);
    if (suyo >= 0) campo.value = String(suyo);
    campo.hidden = false;
    pintar();
  });
}

arrancar();
</script>
</body>
</html>
