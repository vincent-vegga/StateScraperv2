  // apareciendo en la leyenda.

  const secciones = {
    cuenta: `
      <div class="bloque">
        <h3>Tu empresa</h3>
        <dl>
          <dt>Nombre</dt><dd>${p.cif ? esc(p.empresa ?? '—') : `
            <!-- Sin NIF el nombre no sale de ningún contrato: lo pone el
                 cliente. Si no, arriba se veía su correo en su lugar. -->
            <span id="nombre-empresa">${esc(p.empresa || 'Sin nombre')}</span>
            <button class="enlace" id="cambiar-nombre"
              style="padding:0 0 0 8px">${p.empresa ? 'Cambiar' : 'Ponerle nombre'}</button>`}</dd>
          <dt>NIF</dt><dd>${esc(p.cif ?? '—')}</dd>
          <dt>Actividad</dt><dd>${esc(p.actividad ?? '—')}</dd>
          <dt>Correo</dt><dd>${esc(p.email ?? '—')}</dd>
          <dt>Cliente desde</dt><dd>${fecha(p.alta)}</dd>
          <dt>Aviso diario por correo</dt><dd>${
            p.avisos === false
              ? 'desactivado — actívalo con la campana de arriba'
              : 'activado'}</dd>
        </dl>
      </div>
      <div class="bloque">
        <h3>Tu historial</h3>
        <dl>
          <dt>Contratos ganados</dt><dd>${p.contratos_ganados ?? 0}${
            p.lotes_ganados > p.contratos_ganados
              ? ` <span style="color:var(--tenue)">(${p.lotes_ganados} lotes)</span>` : ''}</dd>
          <dt>Importe adjudicado</dt><dd>${
            p.importe_ganado ? euros(Number(p.importe_ganado)) : '—'}</dd>
          <dt>Contratos abiertos que te mostramos</dt><dd>${p.oportunidades ?? 0}</dd>
        </dl>
      </div>
      <!-- Borrar la cuenta: al final de todo y como un enlace discreto, a
           propósito. No es algo que se haga sin buscarlo, y dos pasos
           (aviso y escribir BORRAR) evitan hacerlo sin querer. -->
      <div class="borrar-cuenta">
        <button class="enlace" id="borrar-cuenta" aria-expanded="false">Borrar mi cuenta</button>
        <div id="zona-borrar" hidden></div>
      </div>`,

    filtro: `
      ${buscamos.length ? `
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        <ul class="filtro-lista">
          ${buscamos.map(f => `<li>${esc(f)}</li>`).join('')}
        </ul>
      </div>` : `
      <!-- Sin historial no hay lista de lo que buscamos: se enseña lo que
           el cliente contó y los sectores que salieron de ahí. Antes esta
           pantalla no decía nada de su filtro. -->
      <div class="bloque">
        <h3>Qué buscamos por ti</h3>
        ${p.actividad ? `<p class="guia" style="margin:0 0 12px">Lo que nos
          contaste: «${esc(p.actividad)}»</p>` : ''}
        <ul class="filtro-lista" id="sectores-filtro"></ul>
      </div>`}
      <div class="bloque">
        <h3>Cómo va aprendiendo</h3>
        <dl>
          <dt>Correcciones que has hecho</dt><dd>${p.correcciones?.total ?? 0}${
            p.correcciones?.sin_aplicar
              ? ` · ${p.correcciones.sin_aplicar} sin aplicar todavía` : ''}</dd>
          <dt>Última actualización</dt><dd>${fecha(p.criterio_fecha)}</dd>
        </dl>
        <p class="guia" style="margin:18px 0 0;font-size:.88rem">
        Marca en tu lista los contratos que te interesan y los que no, y
        ajustamos el filtro automáticamente.</p>
        <div id="recuperar"></div>
      </div>
      <div class="bloque peligro">
        <h3>Empezar de cero</h3>
        <p class="guia" style="margin:0 0 18px">Si tu negocio ha cambiado de
        rumbo —una línea nueva, o has dejado de hacer algo— es mejor rehacer
        el filtro que ir corrigiéndolo. Tarda un minuto y no se pierde nada:
        tu historial de contratos sigue ahí.</p>
        <button class="secundario" id="reiniciar">Rehacer mi filtro</button>
        <div id="resultado"></div>
      </div>
      ${PERFILES.length > 1 ? `
      <div class="bloque peligro">
        <h3>Quitar esta empresa</h3>
        <p class="guia" style="margin:0 0 18px">Deja de vigilar
        ${esc(nombreEmpresa(perfil))} y libera su hueco. Se borran su filtro,
        sus correcciones y las empresas que sigues desde ella. Tus otras
        empresas no cambian.</p>
        <button class="secundario" id="quitar-empresa">Quitar esta empresa</button>
        <div id="resultado-quitar"></div>
      </div>` : ''}`,

  };

  secciones.avisos = `<div id="avisos-panel">
    <p class="guia">Cargando tus avisos...</p></div>`;

  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>${esc(SECCIONES[seccion] ?? 'Mi cuenta')}</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('panel')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta(seccion)}
      </div>
    </div>
    <div class="panel">${secciones[seccion] ?? secciones.cuenta}</div>`;

  // La misma barra que en las demás pantallas, sin ninguna marcada. Antes
  // solo había un botón "Mis contratos" y para ir a Movimientos, Empresas
  // u Organismos había que pasar por la lista o tirar del botón atrás del
  // navegador, que además recorría una a una las secciones del panel.
  activarNav(perfil, session, 'panel');
  activarMenu(perfil, session);
  activarCampana(p.avisos);
  if (seccion === 'avisos') montarAvisos(perfil, p.avisos !== false);

  // Los sectores de quien no tiene historial, en "Mi filtro".
  const listaSectores = document.getElementById('sectores-filtro');
  if (listaSectores) cargarSectores(perfil).then(sectores => {
    if (!listaSectores.isConnected) return;
    if (sectores.length) listaSectores.innerHTML = sectores
      .map(s => `<li>${esc(s.nombre)}</li>`).join('');
    else listaSectores.remove();
  });

  // ---------- Nombre de la empresa (solo sin NIF) ----------
  // Sin alPulsar: el botón solo existe en "Mi cuenta" y sin NIF, y en las
  // demás secciones dejaba un aviso de que faltaba.
  const botonNombre = document.getElementById('cambiar-nombre');
  if (botonNombre) botonNombre.onclick = () => {
    const hueco = document.getElementById('nombre-empresa').parentElement;
    hueco.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="text" id="campo-nombre" maxlength="120"
          value="${esc(perfil.empresa ?? '')}" aria-label="Nombre de tu empresa"
          placeholder="Nombre de tu empresa" style="flex:1 1 200px">
        <button class="principal" id="guardar-nombre">Guardar</button>
        <button class="enlace" id="cancelar-nombre">Cancelar</button>
      </div>`;
    const campo = document.getElementById('campo-nombre');
    campo.focus();
    campo.onkeydown = ev => {
      if (ev.key === 'Enter') document.getElementById('guardar-nombre').click();
      if (ev.key === 'Escape') pantallaPanel(perfil, session, true, seccion);
    };
    alPulsar('cancelar-nombre', () => pantallaPanel(perfil, session, true, seccion));
    alPulsar('guardar-nombre', async () => {
      const nombre = campo.value.trim();
      if (!nombre) { campo.focus(); return; }
      const boton = document.getElementById('guardar-nombre');
      boton.disabled = true;
      const { error } = await sb.from('perfiles').update({ empresa: nombre })
        .eq('id', perfil.id);
      if (error) {
        boton.disabled = false;
        recado('No se ha podido guardar. Inténtalo de nuevo.');
        return;
      }
      // El mismo objeto que guarda PERFILES: así la cabecera y el selector
      // de empresas lo enseñan ya en todas las pantallas.
      perfil.empresa = nombre;
      recado('Nombre guardado');
      pantallaPanel(perfil, session, true, seccion);
    });
  };

  // ---------- Borrar la cuenta ----------
  //
  // Primero un aviso que dice qué se pierde; el botón no se activa hasta
  // escribir BORRAR. El servidor lo vuelve a comprobar (accion
  // `borrar_cuenta` en la función de alta).
  const botonBorrar = document.getElementById('borrar-cuenta');
  if (botonBorrar) botonBorrar.onclick = () => {
    const zona = document.getElementById('zona-borrar');
    const abierta = !zona.hidden;
    zona.hidden = abierta;
    botonBorrar.setAttribute('aria-expanded', String(!abierta));
    if (abierta) { zona.innerHTML = ''; return; }
    zona.innerHTML = `
      <div class="aviso mal">
        <strong>Esto no se puede deshacer.</strong> Se borra tu cuenta
        (${esc(p.email ?? 'este correo')}) con ${PERFILES.length > 1
          ? `sus ${PERFILES.length} empresas` : 'tu empresa'}: el filtro, las
        correcciones que has hecho, las empresas que sigues y tus avisos.
        Dejarás de recibir el correo diario y, para volver, haría falta un
        código de acceso nuevo.
        <label for="confirmar-borrar" style="display:block;margin:14px 0 6px">
          Escribe <strong>BORRAR</strong> para confirmarlo:</label>
        <input type="text" id="confirmar-borrar" autocomplete="off"
               autocapitalize="characters" spellcheck="false">
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">
          <button class="secundario" id="no-borrar">Cancelar</button>
          <button class="principal peligroso" id="si-borrar" disabled>Borrar mi cuenta para siempre</button>
        </div>
        <div id="resultado-borrar"></div>
      </div>`;
    const campo = document.getElementById('confirmar-borrar');
    const si = document.getElementById('si-borrar');
    campo.focus();
    campo.oninput = () => { si.disabled = campo.value.trim().toUpperCase() !== 'BORRAR'; };
    document.getElementById('no-borrar').onclick = () => botonBorrar.click();
    si.onclick = async () => {
      si.disabled = true;
      si.textContent = 'Borrando...';
      try {
        await llamar('borrar_cuenta', { confirmacion: 'BORRAR' });
      } catch {
        si.disabled = false;
        si.textContent = 'Borrar mi cuenta para siempre';
        document.getElementById('resultado-borrar').innerHTML = `<p style="margin:12px 0 0">
          No se ha podido borrar. Inténtalo de nuevo o escríbenos.</p>`;
        return;
      }
      // Lo que este navegador recordaba de la cuenta: filtros, empresa
      // activa, explicación oculta. Ya no tiene a quién pertenecer.
      try {
        Object.keys(localStorage).filter(k => /^(filtros-contratos:|empresa-activa$|sin-explicacion$)/.test(k))
          .forEach(k => localStorage.removeItem(k));
        sessionStorage.clear();
      } catch { /* modo privado */ }
      // Solo en local: en el servidor la sesión ya no existe.
      await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      recado('Tu cuenta se ha borrado');
    };
  };

  // Si ocultó la explicación de la lista, aquí puede recuperarla.
  const hueco = document.getElementById('recuperar');
  let oculta = false;
  try { oculta = localStorage.getItem('sin-explicacion') === '1'; } catch { /* nada */ }
  if (hueco && oculta) {
    hueco.innerHTML = `<button class="enlace" id="volver-explica"
      style="padding-left:0;margin-top:10px">Volver a mostrar la explicación
      en mi lista</button>`;
    alPulsar('volver-explica', () => {
      try { localStorage.removeItem('sin-explicacion'); } catch { /* nada */ }
      hueco.innerHTML = `<p class="guia" style="margin:10px 0 0;font-size:.88rem">
        Hecho. Volverá a aparecer en tu lista.</p>`;
    });
  }

  // ---------- Quitar esta empresa ----------
  alPulsar('quitar-empresa', () => {
    const zona = document.getElementById('resultado-quitar');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? No se puede deshacer: para volver a
      vigilarla habría que darla de alta otra vez.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no-quitar">Cancelar</button>
        <button class="principal" id="si-quitar">Sí, quitarla</button>
      </div></div>`;
    alPulsar('no-quitar', () => zona.innerHTML = '');
    alPulsar('si-quitar', async () => {
      zona.innerHTML = `<div class="aviso">Quitando...</div>`;
      const { data, error } = await sb.rpc('quitar_empresa', { perfil: perfil.id });
      if (error || !data?.ok) {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
        return;
      }
      fijarEmpresa(PERFILES.find(p => p.id !== perfil.id)?.id ?? null);
      arrancar();
    });
  });

  // ---------- Rehacer el filtro ----------
  alPulsar('reiniciar', () => {
    const zona = document.getElementById('resultado');
    zona.innerHTML = `
      <div class="aviso">¿Seguro? Se borrará tu filtro actual y volverás a
      empezar ${p.cif ? 'desde tu NIF' : 'el alta: tu NIF, si ya tienes contratos, o a qué te dedicas'}.
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="secundario" id="no">Cancelar</button>
        <button class="principal" id="si">Sí, rehacerlo</button>
      </div></div>`;
    alPulsar('no', () => zona.innerHTML = '');
    alPulsar('si', async () => {
      zona.innerHTML = `<div class="aviso">Preparando...</div>`;
      try {
        await llamar('reiniciar');
        arrancar();
      } catch {
        zona.innerHTML = `<div class="aviso mal">No se ha podido. Inténtalo de nuevo.</div>`;
      }
    });
  });
}

// ---------- Mis avisos: qué llega en el correo diario ----------
//
// Por sector y por zona. Lo que se elige aquí filtra el correo, no la
// lista: en la web siempre se ve todo, y el correo es lo que merece
// interrumpir.
//
// Las reglas son las mismas que usa la base al preparar el correo
// (novedades_de_perfil) y la lista al filtrar: el recuento de abajo dice
// la verdad sobre lo que llegará.
async function montarAvisos(perfil, encendido) {
  const [cfg, zonas, sectores, contratos, seg] = await Promise.all([
    sb.rpc('mis_avisos'), pedir('zonas_espana'),
    cargarSectores(perfil), pedirContratos(perfil.id),
    sb.rpc('mis_seguimientos')]);
  const zona = document.getElementById('avisos-panel');
  // Se ha ido a otra pantalla o a otra empresa mientras cargaba.
  if (!zona || perfil.id !== perfilActivoId) return;
  if (cfg.error || zonas.error || !cfg.data) {
    zona.innerHTML = `<div class="aviso mal">No hemos podido cargar tus avisos.</div>`;
    return;
  }

  const provs = new Set(cfg.data.provincias ?? []);
  const elegidos = new Set(cfg.data.sectores ?? []);
  const todosSectores = !elegidos.size;
  const lista = contratos.data ?? [];

  const porComunidad = {}, comunidadDe = {};
  (zonas.data ?? []).forEach(z => {
    (porComunidad[z.comunidad] ??= []).push(z.provincia);
    comunidadDe[z.provincia] = z.comunidad;
  });
  // "Comunidad de Madrid" con Madrid dentro: se enseña solo la provincia.
  const plano = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const uniprovincial = c => porComunidad[c].length === 1
    && plano(c).includes(plano(porComunidad[c][0]));
  // Por el nombre que SE VE: ordenando por el de la comunidad, "Madrid"
  // caía entre Ceuta y Comunidad Valenciana, y "Murcia" al final.
  const rotuloZona = c => uniprovincial(c) ? porComunidad[c][0] : c;
  const comunidades = Object.keys(porComunidad)
    .sort((a, b) => rotuloZona(a).localeCompare(rotuloZona(b), 'es'));

  zona.innerHTML = `
    ${encendido ? '' : `<div class="aviso aviso-apagado">El aviso diario está
      desactivado. Al guardar se activa, o puedes activarlo con la campana de
      arriba.</div>`}
    ${sectores.length > 1 ? `
    <div class="bloque">
      <h3>Sectores</h3>
      <p class="guia" style="margin:0 0 14px">De qué quieres que te avisemos.</p>
      <div class="casillas">
        ${sectores.map(x => `<label class="casilla-linea">
          <input type="checkbox" autocomplete="off" data-sector="${esc(x.id)}"
                 ${todosSectores || elegidos.has(x.id) ? 'checked' : ''}>
          <span>${esc(x.nombre)}</span></label>`).join('')}
      </div>
    </div>` : ''}
    <div class="bloque">
      <h3>Zona</h3>
      <p class="guia" style="margin:0 0 14px">Los contratos de ámbito
      autonómico, sin provincia concreta, te llegan si eliges alguna
      provincia de esa comunidad.</p>
      <label class="casilla-linea toda">
        <input type="checkbox" autocomplete="off" id="toda-espana" ${provs.size ? '' : 'checked'}>
        <span>Toda España</span></label>
      <div class="zonas">
        ${comunidades.map(c => uniprovincial(c) ? `
          <div class="comunidad">
            <label class="casilla-linea"><input type="checkbox" autocomplete="off"
              data-prov="${esc(porComunidad[c][0])}"><span>${esc(porComunidad[c][0])}</span></label>
          </div>` : `
          <div class="comunidad">
            <div class="fila-comunidad">
              <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-com="${esc(c)}">
                <span>${esc(c)}</span></label>
              <button type="button" class="enlace ver-provs" data-ver="${esc(c)}"
                aria-expanded="false">${porComunidad[c].length} provincias</button>
            </div>
            <div class="provs" data-de="${esc(c)}" hidden>
              ${porComunidad[c].sort((a, b) => a.localeCompare(b, 'es')).map(pv => `
                <label class="casilla-linea"><input type="checkbox" autocomplete="off" data-prov="${esc(pv)}">
                  <span>${esc(pv)}</span></label>`).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
    ${seg.error ? '' : bloqueLoQueSigues(seg.data ?? {})}
    <div class="bloque resumen-avisos">
      <p id="avisos-cuenta"></p>
      <!-- Con la campana apagada, guardar sin encenderla dejaba a alguien
           configurando un correo que nunca le iba a llegar. -->
      <button class="principal" id="guardar-avisos">${encendido
        ? 'Guardar mis avisos' : 'Guardar y activar el aviso diario'}</button>
      <div id="avisos-resultado"></div>
    </div>`;

  const casillasSector = [...zona.querySelectorAll('[data-sector]')];
  const casillasProv = [...zona.querySelectorAll('[data-prov]')];
  const sectoresElegidos = () => sectores.filter(x =>
    casillasSector.find(c => c.dataset.sector === x.id)?.checked);

  // Lo que se ve marcado sale siempre de `provs`: una sola fuente. Las
  // casillas llevan autocomplete="off" para que el navegador no les
  // devuelva, al volver atrás, un estado anterior distinto del guardado.
  function pintarZona() {
    document.getElementById('toda-espana').checked = provs.size === 0;
    casillasProv.forEach(c => c.checked = provs.has(c.dataset.prov));
    zona.querySelectorAll('[data-com]').forEach(c => {
      const suyas = porComunidad[c.dataset.com];
      const n = suyas.filter(pv => provs.has(pv)).length;
      c.checked = n === suyas.length;
      c.indeterminate = n > 0 && n < suyas.length;
      // Con algunas elegidas, se enseñan: si no, no se ve cuáles.
      if (c.indeterminate) desplegar(c.dataset.com, true);
    });
    contar();
  }

  function desplegar(c, abierto) {
    const caja = zona.querySelector(`.provs[data-de="${CSS.escape(c)}"]`);
    const boton = zona.querySelector(`[data-ver="${CSS.escape(c)}"]`);
    if (!caja) return;
    caja.hidden = !abierto;
    boton.setAttribute('aria-expanded', String(abierto));
  }

  function contar() {
    const secs = sectoresElegidos();
    const entra = o =>
      (!casillasSector.length || secs.length === sectores.length
        || secs.some(x => enSector(o, x))) &&
      (provs.size === 0 || provs.has(o.provincia) ||
        (!o.provincia && (!o.comunidad ||
          [...provs].some(pv => comunidadDe[pv] === o.comunidad))));
    const n = lista.filter(entra).length;
    document.getElementById('avisos-cuenta').innerHTML =
      `De los <strong>${plural(lista.length, 'contrato abierto', 'contratos abiertos')}</strong>
       que tienes ahora, <strong>${n}</strong> ${n === 1 ? 'entraría' : 'entrarían'}
       en tus avisos. Cada día te llegan solo los nuevos.`;
  }

  document.getElementById('toda-espana').onchange = ev => {
    if (ev.target.checked) provs.clear();
    else ev.target.checked = true;   // se desmarca eligiendo una provincia
    pintarZona();
  };
  casillasProv.forEach(c => c.onchange = () => {
    c.checked ? provs.add(c.dataset.prov) : provs.delete(c.dataset.prov);
    pintarZona();
  });
  zona.querySelectorAll('[data-com]').forEach(c => c.onchange = () => {
    const suyas = porComunidad[c.dataset.com];
    const todas = suyas.every(pv => provs.has(pv));
    suyas.forEach(pv => todas ? provs.delete(pv) : provs.add(pv));
    pintarZona();
  });
  zona.querySelectorAll('[data-ver]').forEach(b => b.onclick = () =>
    desplegar(b.dataset.ver, b.getAttribute('aria-expanded') !== 'true'));
  casillasSector.forEach(c => c.onchange = contar);

  alPulsar('guardar-avisos', async () => {
    const resultado = document.getElementById('avisos-resultado');
    const secs = sectoresElegidos();
    if (casillasSector.length && !secs.length) {
      resultado.innerHTML = `<div class="aviso mal">Elige al menos un sector.</div>`;
      return;
    }
    const boton = document.getElementById('guardar-avisos');
    boton.disabled = true;
    // Todos marcados se guarda como "ninguno elegido" (= todos): así, si
    // mañana aparece un sector nuevo, también entra.
    const { data, error } = await sb.rpc('guardar_avisos', {
      provincias: [...provs],
      sectores: secs.length === sectores.length ? [] : secs.map(x => x.id),
    });
    boton.disabled = false;
    if (error || !data?.ok) {
      resultado.innerHTML = `<div class="aviso mal">No se ha podido guardar. Inténtalo de nuevo.</div>`;
      return;
    }
    resultado.innerHTML = '';
    if (encendido) { recado('Avisos guardados'); return; }

    let activar;
    try { activar = await sb.rpc('cambiar_avisos', { quiero: true }); }
    catch (fallo) { activar = { error: fallo }; }
    if (activar.error) {
      recado('Avisos guardados, pero no hemos podido activarlos. Usa la campana de arriba.');
      return;
    }
    encendido = true;
    document.getElementById('campana')?.setAttribute('aria-pressed', 'true');
    zona.querySelector('.aviso-apagado')?.remove();
    boton.textContent = 'Guardar mis avisos';
    recado('Avisos guardados. Te llegarán cada mañana por correo');
  });

  activarLoQueSigues(zona);
  pintarZona();
}

// Lo que sigue, dentro de la configuración de avisos (Decisión 56): qué
// más trae el correo además de los contratos nuevos, y dónde se deja de
// seguir algo sin ir a buscarlo a su ficha.
function bloqueLoQueSigues(d) {
  const empresas = d.empresas ?? [], organismos = d.organismos ?? [],

  const quitar = (tipo, valor, extra = '') => `<button type="button"

  const lista = (filas, vacio) => filas.length
    ? `<ul>${filas.join('')}</ul>` : `<p class="vacio-seg">${vacio}</p>`;
  return `
    <div class="bloque lo-que-sigues">
      <h3>Lo que sigues</h3>
      <p class="guia" style="margin:0">Además de los contratos nuevos, el correo
      te avisa de esto. Lo que publican los organismos y la nueva licitación de
      un contrato vigilado llegan en el correo del día. Lo que ganan las
      empresas va con lo demás y, si no hay nada más, en un resumen semanal.</p>

      <h4>Empresas<span class="n">${empresas.length}</span></h4>
      ${lista(empresas.map(e => `<li><span>${esc(e.nombre ?? e.cif)}
        <span class="detalle">Te avisamos de lo que gane</span></span>
        ${quitar('empresa', e.cif, `data-nombre="${esc(e.nombre ?? e.cif)}"`)}</li>`),
        'Síguelas desde Empresas, en su ficha o en la lista de tu competencia.')}

      <h4>Organismos<span class="n">${organismos.length}</span></h4>
      ${lista(organismos.map(o => `<li><span>${esc(o.organo)}
        <span class="detalle">Te avisamos de lo que publique en tu sector</span></span>
        ${quitar('organismo', o.organo)}</li>`),
        'Síguelos desde la ficha de cada organismo.')}

      <h4>Contratos que vigilas<span class="n">${vigilados.length}</span></h4>
      ${lista(vigilados.map(v => `<li><span>${tituloConEnlace(v.titulo, v.enlace)}
        <span class="detalle">${esc(v.organo ?? '')}${v.vence
          ? ` · vence el ${esc(fechaCorta(String(v.vence)))}` : ''}${v.nueva
          ? ` · <span class="nueva">ya ha salido su nueva licitación:</span>
              ${tituloConEnlace(v.nueva.titulo, v.nueva.enlace)}` : ''}</span></span>
        ${quitar('vigilado', v.id_licitacion)}</li>`),
        'Vigílalos desde «Lo que viene»: te avisamos cuando salga su nueva licitación.')}
    </div>`;
}

function activarLoQueSigues(zona) {
  zona.querySelectorAll('[data-quitar]').forEach(b => b.onclick = async () => {
    if (b.disabled) return;
    b.disabled = true;
    const tipo = b.dataset.quitar, valor = b.dataset.valor;
    // Las tres alternan: llamadas sobre algo que se sigue, lo quitan.
    const llamada = tipo === 'empresa'
      ? sb.rpc('seguir', { cif_empresa: valor, nombre_empresa: b.dataset.nombre })
      : tipo === 'organismo'
        ? sb.rpc('seguir_organismo', { organo_elegido: valor })
        : sb.rpc('vigilar', { licitacion: valor });
    let respuesta;
    try { respuesta = await llamada; } catch (error) { respuesta = { error }; }
    // Si devuelve true es que no lo seguía (otra pestaña lo quitó antes):
    // se deshace para dejarlo como estaba.
    if (!respuesta.error && respuesta.data === true) {
      try {
        await (tipo === 'empresa'
          ? sb.rpc('seguir', { cif_empresa: valor, nombre_empresa: b.dataset.nombre })
          : tipo === 'organismo'
            ? sb.rpc('seguir_organismo', { organo_elegido: valor })
            : sb.rpc('vigilar', { licitacion: valor }));
      } catch { /* queda como estaba al recargar */ }
    }
    if (respuesta.error) {
      b.disabled = false;
      recado('No se ha podido guardar. Inténtalo de nuevo.');
      return;
    }
    olvidar('mis_seguimientos', 'mi_seguimiento', 'seguimiento_periodo',
            'competencia_periodo', 'movimientos_periodo', 'resumen_periodo');
    const fila = b.closest('li');
    const ul = fila.parentElement;
    fila.remove();
    const cuenta = ul.previousElementSibling?.querySelector('.n');
    if (cuenta) cuenta.textContent = ul.children.length;
    // La lista vacía no se queda en blanco.
    if (!ul.children.length) {
      ul.outerHTML = `<p class="vacio-seg">${tipo === 'vigilado'
        ? 'Ya no vigilas ningún contrato.' : 'Ya no sigues ninguno.'}</p>`;
    }
    recado(tipo === 'vigilado' ? 'Has dejado de vigilar este contrato'
      : tipo === 'organismo' ? 'Has dejado de seguir este organismo'
      : 'Quitada de tu lista de seguimiento');
  });
}

// Descartes que esperan a enviarse, por id de licitación: { perfilId,
// motivo, temporizador }. Viven fuera de la pantalla para sobrevivir a un
// cambio de pestaña mientras corre la cuenta atrás (ver `corregir`).
const DESCARTES_PENDIENTES = new Map();
const ESPERA_DESHACER = 6000;

// ---------- Mi cartera (Decisión 53) ----------
//
// Seis estados y no los doce de Licitandum: una pyme lleva una o dos
// ofertas a la vez y quiere saber qué tiene entre manos, no gestionar un
// proyecto. "No me presento" no es "no me interesa": encaja, pero no
// compensa, y no enseña nada al filtro.
const ESTADOS_CARTERA = {
  interesa:   'Me interesa',
  preparando: 'Preparo la oferta',
  presentada: 'Oferta presentada',
  ganada:     'Ganada',
  perdida:    'Perdida',
  descartada: 'No me presento',
};
// Lo que aún reclama algo: presentarse o esperar el resultado.
const ACTIVOS = ['interesa', 'preparando', 'presentada'];

// Envía ya un descarte pendiente. Por fetch y no por la librería por dos
// motivos: con la empresa del descarte fija en `x-perfil` (si entre medias
// se cambia de empresa, la librería mandaría la nueva), y con keepalive,
// que es lo único que llega a salir cuando se está cerrando la pestaña.
//
// Devuelve { data, error } como `sb.rpc`.
async function enviarDescarte(id, alSalir = false) {
  const p = DESCARTES_PENDIENTES.get(id);
  if (!p) return { data: null, error: null };
  DESCARTES_PENDIENTES.delete(id);
  clearTimeout(p.temporizador);
  let token = p.token;
  if (!alSalir) {
    const { data: { session } } = await sb.auth.getSession();
    token = session?.access_token ?? token;
  }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/corregir`, {
      method: 'POST', keepalive: alSalir,
      headers: { apikey: SUPABASE_ANON, Authorization: `Bearer ${token}`,
                 'Content-Type': 'application/json', 'x-perfil': p.perfilId },
      body: JSON.stringify({ licitacion: id, le_interesa: false,
                             por_que: p.motivo ?? null }),
    });
    if (!r.ok) return { data: null, error: new Error(`HTTP ${r.status}`) };
    return { data: await r.json().catch(() => null), error: null };
  } catch (error) {
    return { data: null, error };
  }
}
window.addEventListener('pagehide', () => {
  for (const id of [...DESCARTES_PENDIENTES.keys()]) enviarDescarte(id, true);
});

// ---------- Qué piden para presentarse (Decisión 54) ----------

// Cada ficha de Contratos lleva un hueco `[data-requisitos]` que se llena

//
// Se engancha a todo el documento y no a la lista: da igual qué pinte la
// fila o cómo se abra el detalle (clic, Intro, espacio), basta con mirar
// después qué detalles abiertos tienen el hueco sin llenar.
// Por empresa activa y contrato: la comparación depende de la empresa, y
// una cuenta puede tener varias.
const REQUISITOS = new Map();     // "perfil|id" -> respuesta, mientras dure la sesión

const DOCUMENTO_TIPO = {

  pliego_tecnico: 'Pliego de prescripciones técnicas',

// ============================================================
// Pregúntale al pliego (Decisión 57)
// ============================================================
//
// Una pregunta en lenguaje normal sobre los documentos de la licitación;
// responde la función `pliego` con lo que dicen y de qué documento sale.
// Lo ya preguntado se guarda y se enseña al volver (lo último arriba).
// Si la base aún no tiene la función, el bloque no aparece.
const PREGUNTAS_SUGERIDAS = [
  '¿Qué criterios de adjudicación hay y cuánto pesa cada uno?',
  '¿Cómo se puntúa el precio?',
  '¿Cuándo se considera una oferta anormalmente baja?',
  '¿Qué hay que presentar en cada sobre?',
  '¿Qué garantía definitiva piden?',
];
const PREGUNTAS_PLIEGO = new Map();   // "perfil|id" -> lo ya preguntado

const MOTIVO_SIN_LEER = {
  formato: 'en un formato que no sabemos leer (un ZIP, por ejemplo)',
  descarga: 'no se ha podido descargar del portal',
  subida: 'no se ha podido leer',
  demasiados: 'no ha entrado: hay muchos documentos',
};

function pintarRespuestaPliego(q) {
  const docs = (q.citas ?? []).map(c => c.url
    ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.nombre)}</a>`
    : esc(c.nombre));
  const sinLeer = (q.sin_leer ?? []).map(d => `${esc(d.nombre)} (${
    MOTIVO_SIN_LEER[d.motivo] ?? 'no se ha podido leer'})`);
  return `<div class="respuesta">
    <p class="q">${esc(q.pregunta)}</p>
    <p class="r">${esc(q.respuesta ?? '')}</p>
    ${docs.length ? `<p class="de">Sale de ${enumerar(docs)}.</p>` : ''}
    ${sinLeer.length ? `<p class="de">No hemos podido leer ${enumerar(sinLeer)}: si
      la respuesta no está, puede estar ahí.</p>` : ''}
  </div>`;
}

async function montarPliego(hueco) {
  hueco.dataset.cargado = '1';
  const id = hueco.dataset.pliego;
  const clave = `${perfilActivoId}|${id}`;
  if (!PREGUNTAS_PLIEGO.has(clave)) {
    let r;
    try { r = await sb.rpc('mis_preguntas_pliego', { licitacion: id }); }
    catch (error) { r = { error }; }
    // Sin la función en la base, el bloque no sale.
    if (r.error) { delete hueco.dataset.cargado; return; }
    PREGUNTAS_PLIEGO.set(clave, r.data ?? []);
  }
  pintarPliego(hueco, id, clave);
}

function pintarPliego(hueco, id, clave) {
  const hechas = PREGUNTAS_PLIEGO.get(clave) ?? [];
  hueco.hidden = false;
  hueco.innerHTML = `
    <h3>Pregúntale al pliego</h3>
    <p class="guia-pliego">Te respondemos con lo que dicen los documentos de esta
    licitación y te decimos de cuál sale. La primera pregunta tarda hasta un
    minuto: hay que leer el pliego.</p>
    <div class="sugeridas">${PREGUNTAS_SUGERIDAS.map(p =>
      `<button type="button" data-sugerida="${esc(p)}">${esc(p)}</button>`).join('')}</div>
    <form data-preguntar>
      <input type="text" maxlength="500" autocomplete="off"
             placeholder="Escribe tu pregunta sobre el pliego" aria-label="Tu pregunta sobre el pliego">
      <button type="submit" class="secundario">Preguntar</button>
    </form>
    <div class="respuestas">${hechas.map(pintarRespuestaPliego).join('')}</div>
    <p class="aviso-ia">Lo responde un modelo de IA con el texto del pliego y
    puede equivocarse: compruébalo en el documento antes de presentar la oferta.</p>`;

  const form = hueco.querySelector('[data-preguntar]');
  const campo = form.querySelector('input');
  const boton = form.querySelector('button');
  hueco.querySelectorAll('[data-sugerida]').forEach(b => b.onclick = () => {
    campo.value = b.dataset.sugerida;
    form.requestSubmit();
  });
  form.onsubmit = async ev => {
    ev.preventDefault();
    const pregunta = campo.value.trim();
    if (pregunta.length < 3 || boton.disabled) return;
    boton.disabled = true;
    campo.disabled = true;
    const lista = hueco.querySelector('.respuestas');
    const espera = document.createElement('div');
    espera.className = 'respuesta esperando';
    espera.innerHTML = `<p class="q">${esc(pregunta)}</p><p class="r">Leyendo el pliego…</p>`;
    lista.prepend(espera);
    const inicio = Date.now();
    const reloj = setInterval(() => {
      const s = Math.round((Date.now() - inicio) / 1000);
      espera.querySelector('.r').textContent = s < 8 ? 'Leyendo el pliego…'
        : `Leyendo el pliego… ${s} s. La primera vez tarda más.`;
    }, 1000);

    const terminar = () => {
      clearInterval(reloj);
      boton.disabled = false;
      campo.disabled = false;
    };
    let datos;
    try {
      // Si la lectura no acaba en una llamada, la función lo dice y se
      // vuelve a pedir: el almacén sigue leyendo entre tanto.
      for (let intento = 0; intento < 3; intento++) {
        datos = await preguntarAlPliego(id, pregunta);
        if (datos.error !== 'leyendo') break;
      }
    } catch (error) {
      datos = { error: 'red' };
    }
    terminar();

    if (datos.respuesta) {
      const q = { pregunta, respuesta: datos.respuesta, citas: datos.citas, sin_leer: datos.sin_leer };
      PREGUNTAS_PLIEGO.set(clave, [q, ...(PREGUNTAS_PLIEGO.get(clave) ?? [])]);
      espera.outerHTML = pintarRespuestaPliego(q);
      campo.value = '';
      return;
    }
    espera.classList.remove('esperando');
    const docs = (datos.documentos ?? []).map(d =>
      `<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.nombre)}</a>`);
    espera.querySelector('.r').innerHTML = {
      sin_documentos: 'Esta licitación no tiene documentos publicados en el portal.',
      sin_texto: `No hemos podido leer sus documentos: pueden estar escaneados o
        comprimidos.${docs.length ? ` Ábrelos en el portal: ${enumerar(docs)}.` : ''}`,
      tope_perfil: `Has hecho ${datos.tope ?? 'todas las'} preguntas de hoy. Mañana puedes seguir.`,
      tope_dia: 'Hoy no podemos responder más preguntas. Vuelve a intentarlo mañana.',
      leyendo: 'El pliego es largo y aún lo estamos leyendo. Vuelve a preguntar en un minuto.',
    }[datos.error] ?? 'No hemos podido responder. Inténtalo de nuevo.';
  };
}

async function preguntarAlPliego(id, pregunta) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return { error: 'sin_sesion' };
  const r = await fetch(`${SUPABASE_URL}/functions/v1/pliego`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.access_token}`,
               'Content-Type': 'application/json' },
    body: JSON.stringify({ id_licitacion: id, pregunta, perfil_id: perfilActivoId }),
  });
  try { return await r.json(); } catch { return { error: 'red' }; }
}

async function cargarRequisitos(hueco) {
  hueco.dataset.cargado = '1';
  const id = hueco.dataset.requisitos;
  const clave = `${perfilActivoId}|${id}`;
  if (!REQUISITOS.has(clave)) {
    hueco.innerHTML = `<h3>Qué piden para presentarte</h3>
      <p class="cargando">Mirando el anuncio y el pliego…</p>`;
    let r;
    try {
      const { data, error } = await sb.rpc('requisitos', { ficha: id });
      r = error ? { error: error.message } : data;
    } catch (error) {
      r = { error: String(error) };
    }
    // Un fallo no se guarda: al volver a abrir, se reintenta.
    if (r?.error && r.error !== 'no encontrado') {
      hueco.innerHTML = `<h3>Qué piden para presentarte</h3>
        <p class="nota">No hemos podido cargarlo. Cierra y vuelve a abrir la ficha.</p>`;
      delete hueco.dataset.cargado;
      return;
    }
    REQUISITOS.set(clave, r);
  }
  // La lista puede haberse repintado mientras tanto: se llenan todos los
  // huecos de ese contrato que sigan en la página.
  document.querySelectorAll(`[data-requisitos="${CSS.escape(id)}"]`).forEach(h => {
    h.dataset.cargado = '1';
    // En Viabilidad, el veredicto ya está arriba con todo su análisis.
    h.innerHTML = pintarRequisitos(REQUISITOS.get(clave),
                                   { conViabilidad: !!h.closest('.detalle') });
  });
}

// "1,5 veces el valor anual" a partir de lo que leyó el modelo.
function reglaRequisito(req) {
  if (!req?.multiplo || !req?.base) return '';
  const veces = Number(req.multiplo);
  const base = { valor_anual: 'el valor anual medio del contrato',
                 valor_estimado: 'el valor estimado',
                 presupuesto: 'el presupuesto de licitación' }[req.base];
  if (!base) return '';
  if (veces === 1) return `igual a${base.replace(/^el /, 'l ')}`;
  // "El 70 % del valor anual medio", no "de el".
  if (veces < 1) return `el ${numero(Math.round(veces * 100))} % ${base.replace(/^el /, 'del ')}`;
  return `${String(veces).replace('.', ',')} veces ${base}`;
}

// Bajo la cifra, de dónde sale: si el pliego la escribe, su resumen; si
// la calculamos con la regla ("1,5 veces el valor anual medio"), la regla,
// para que se vea que es nuestra cuenta y se pueda comprobar.
function explicacionRequisito(req) {
  const regla = reglaRequisito(req);
  // El resumen que repite la cifra de arriba no añade nada.
  const repite = req.importe != null && String(req.texto ?? '').replace(/\D/g, '')
    .includes(String(Math.trunc(req.importe)));
  const t = req.importe == null && regla
    ? `${regla[0].toUpperCase()}${regla.slice(1)}, según el pliego; la cifra es nuestra cuenta.`
    : repite ? '' : req.texto;
  return t ? `<br><span class="regla">${esc(t)}</span>` : '';
}

function comparacionRequisito(c, tipo) {
  if (!c) return '';
  const tienes = Number(c.tienes) || 0;
  const base = c.contratos
    ? `Calculado con ${numero(c.contratos)} ${c.contratos === 1 ? 'contrato' : 'contratos'}${
        tipo === 'tecnica' ? ' parecidos (mismas tres primeras cifras del CPV)' : ''}, repartiendo cada uno por los meses que dura.`
    : '';
  if (c.estado === 'cumple') {
    return `<span class="compara cumple">${tipo === 'economica'
      ? `Llegas: solo con contratos públicos facturaste unos ${euros(tienes)} en ${c.anio}.`
      : `Llegas: en contratos públicos parecidos ejecutaste unos ${euros(tienes)} en ${c.anio}.`}
      <span class="base">${base}</span></span>`;
  }
  return `<span class="compara revisar">${tipo === 'economica'
    ? (tienes > 0
        ? `Compruébalo con tu facturación total: en contratos públicos llegas a unos ${euros(tienes)} (${c.anio}), y aquí también cuenta lo que facturas a privados.`
        : 'No vemos facturación tuya en contratos públicos estos años: compruébalo con tu facturación total.')
    : (tienes > 0
        ? `Compruébalo: en contratos públicos parecidos llegas a unos ${euros(tienes)} (${c.anio}). También cuentan los trabajos para privados.`
        : 'No vemos contratos públicos parecidos tuyos estos años. También cuentan los trabajos para privados.')}
    ${base ? `<span class="base">${base}</span>` : ''}</span>`;
}

// Para ganarlo: el veredicto de Viabilidad con su porqué, encima de lo
// que piden. Son dos preguntas: un contrato puede pedir lo que ya tienes
// ("Llegas") y ser difícil de ganar (la mitad de la puntuación a juicio
// de valor). Sin el porqué, el "Difícil" de la fila parecía contradecir
// el "Llegas" de la ficha (07/10/2026). Solo lo que la fila marca.
function pintarParaGanarlo(v) {
  const etiqueta = { dificil: 'Difícil de ganar', cerrado: 'Parece cerrado',
                     mio: 'Es tuyo: ganaste la anterior' }[v?.veredicto];
  if (!VIABILIDAD_VISIBLE || !etiqueta) return '';
  const motivos = (v.motivos || []).map(m => `${m[0].toUpperCase()}${m.slice(1)}.`);
  return `<h3>Para ganarlo</h3>
    <p class="ganarlo ${esc(v.veredicto)}"><strong>${etiqueta}</strong>${
      motivos.length ? `: ${esc(motivos.join(' '))}` : '.'}
      <span class="regla">El análisis completo está en «Analizar viabilidad».</span></p>`;
}

function pintarRequisitos(r, { conViabilidad = true } = {}) {
  const titulo = `${conViabilidad ? pintarParaGanarlo(r?.viabilidad) : ''}<h3>Qué piden para presentarte</h3>`;
  if (!r || r.error) return `${titulo}<p class="nota">No tenemos los datos de este contrato.</p>`;

  const filas = [];
  const fila = (dt, dd) => filas.push(`<dt>${dt}</dt><dd>${dd}</dd>`);
  const leido = r.estado === 'leido';
  const comparar = que => (r.comprobar || []).find(c => c.que === que);

  if (leido && r.exento) {
    fila('Solvencia', 'No hace falta acreditarla: el pliego la exime.');
  }

  // Solvencia económica
  const eco = r.economica;
  if (eco && !r.exento) {
    const medio = { volumen_negocios: 'Volumen anual de negocios',
                    seguro: 'Seguro de responsabilidad civil',
                    patrimonio: 'Patrimonio neto' }[eco.medio];
    const pide = eco.pide ? `<span class="pide">${medio ?? 'Importe'} de ${euros(eco.pide)} como mínimo</span>` : '';
    fila('Solvencia económica', `${pide || esc(eco.texto || medio || '—')}${
      pide ? explicacionRequisito(eco) : ''}${
      comparacionRequisito(comparar('economica'), 'economica')}`);
  }

  // Solvencia técnica
  const tec = r.tecnica;
  if (tec && !r.exento) {
    const anios = tec.anios ? ` en los últimos ${tec.anios} años` : '';
    const pide = tec.pide && tec.medio === 'trabajos_similares'
      ? `<span class="pide">Trabajos parecidos por ${euros(tec.pide)}${anios}</span>` : '';
    fila('Solvencia técnica', `${pide || esc(tec.texto || '—')}${
      pide ? explicacionRequisito(tec) : ''}${
      comparacionRequisito(comparar('tecnica'), 'tecnica')}`);
  }

  if (r.seguro?.importe && eco?.medio !== 'seguro') {
    fila('Seguro', `Responsabilidad civil de ${euros(r.seguro.importe)}`);
  }

  if (r.clasificacion?.length) {
    fila('Clasificación', `<ul>${r.clasificacion.map(c => `<li><strong>${esc(c.codigo)}</strong>${
      c.nombre ? ` · ${esc(c.nombre)}` : ''}${c.categoria ? `, categoría ${esc(c.categoria)}` : ''}${
      c.tramo ? ` <span class="regla">(${esc(c.tramo)})</span>` : ''}</li>`).join('')}</ul>${
      r.clasificacion_obligatoria ? '' : '<span class="regla">Sirve en lugar de la solvencia; no es obligatoria.</span>'}`);
  }

  const inscripciones = [];
  if (r.rolece) inscripciones.push('Inscripción en el ROLECE o en el registro de licitadores de la comunidad');
  (r.otros || []).forEach(x => inscripciones.push(x));
  if (inscripciones.length) {
    fila('También piden', `<ul>${inscripciones.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`);
  }

  const g = r.garantias || {};
  const garantias = [
    g.definitiva != null && `definitiva del ${numero(g.definitiva)} % del importe de adjudicación`,
    g.provisional != null && `provisional del ${numero(g.provisional)} %`,
    g.complementaria != null && `complementaria del ${numero(g.complementaria)} %`,
  ].filter(Boolean);
  if (garantias.length) {
    const t = garantias.join('; ');
    fila('Garantía', `${t[0].toUpperCase()}${t.slice(1)}`);
  }

  if (r.email || r.telefono) {
    fila('Contacto del órgano', [
      r.email && `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>`,
      r.telefono && `<a href="tel:${esc(String(r.telefono).replace(/\s/g, ''))}">${esc(r.telefono)}</a>`,
    ].filter(Boolean).join(' · '));
  }

  const docs = (r.documentos || []).filter(d => /^https?:\/\//i.test(d.url ?? ''));
  if (docs.length) {
    fila('Pliegos y anexos', `<ul class="docs">${docs.slice(0, 8).map(d =>
      `<li><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${
        esc(DOCUMENTO_TIPO[d.tipo] ?? d.nombre ?? 'Documento')}</a>${
        DOCUMENTO_TIPO[d.tipo] && d.nombre ? ` <span class="regla">${esc(d.nombre)}</span>` : ''}</li>`).join('')}${
      docs.length > 8 ? `<li class="regla">y ${numero(docs.length - 8)} más en el expediente</li>` : ''}</ul>`);
  }

  // Sin lectura, lo que dice el anuncio tal cual: mejor eso que nada.
  let aviso = '';
  if (!leido) {
    const feed = (r.feed || []).filter(s => !s.es_remision);
    feed.forEach(s => fila(s.clase === 'economica' ? 'Solvencia económica' : 'Solvencia técnica',
      esc(String(s.descripcion).slice(0, 400)) + (String(s.descripcion).length > 400 ? '…' : '')));
    aviso = {
      pendiente: 'Aún no hemos leído la solvencia en su pliego: suele estar al día siguiente de publicarse.',
      error: 'No hemos podido leer el pliego esta vez; lo volvemos a intentar mañana.',
      sin_datos: 'No tenemos los requisitos de este contrato: están en el expediente.',
      sin_pliego: 'El organismo no ha publicado el pliego con el anuncio: la solvencia está en el expediente.',
    // `sin_texto` no es solo un PDF escaneado: también un enlace que el
    // organismo ya no sirve, un .rar o un .doc, o un expediente que solo
    // publica el pliego técnico (muestra del 07/10/2026).
    }[r.estado] ?? 'No hemos podido leer la solvencia en sus documentos de forma automática: está en el pliego, en el expediente.';
  }

  const origen = leido
    ? `Leído ${r.origen === 'pliego'
        ? `del pliego${r.documento_leido ? ` (${esc(r.documento_leido)})` : ''}`
        : 'del anuncio de licitación'} de forma automática: compruébalo en el pliego antes de presentarte.${
        r.comprobar?.length ? ' Lo que ganas sale de los contratos públicos que tenemos de tu empresa; es lo mínimo que facturas, no el total.' : ''}`
    : '';

  return `${titulo}${aviso ? `<p class="nota">${aviso}</p>` : ''}${
    filas.length ? `<dl>${filas.join('')}</dl>` : ''}${
    // La frase literal, solo si dice algo concreto (una cifra): "serán los
    // exigidos en el Anexo 4" no ayuda, y repetir el resumen tampoco.
    leido && /\d/.test(r.cita ?? '') && !/anexo\s+n?º?\.?\s*\d+\.?»?$/i.test(r.cita)
      && ![r.economica?.texto, r.tecnica?.texto].includes(r.cita)
      ? `<p class="cita">«${esc(r.cita)}»</p>` : ''}${
    origen ? `<p class="origen">${origen}</p>` : ''}`;
}

async function pantallaOportunidades(perfil, session, volviendo = false,
                                     pestanaInicial = 'todo') {
  const miLista = ++listaVigente;
  const vigente = () => miLista === listaVigente;
  if (!volviendo) irA('contratos', { pestana: pestanaInicial }, true);
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `<div class="centro"><p class="guia">Cargando tus contratos...</p></div>`;


  // A la vez que la lista, no después: son independientes.
  const promesaCartera = pedir('mi_cartera', {}, {
    alCambiar: d => { if (vigente()) ponerCartera(d); },
  });

  const { data, error } = await pedirContratos(perfil.id, nuevos => {
    // Si algo cambió por detrás, se repinta sin que el cliente
    // haya tenido que esperar.
    if (!vigente() || !document.getElementById('lista')) return;
    ponerDatos(nuevos);
  });
  // Mientras llegaban los datos se ha abierto otra lista: esa manda.
  if (!vigente()) return;
  if (error) {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tus contratos.</div></div>`;
    return;
  }

  const preparar = filas => (filas ?? [])
    // Lo descartado que aún espera a enviarse (ver `corregir`) no vuelve
    // a salir porque llegue un refresco.
    .filter(o => !DESCARTES_PENDIENTES.has(o.id_licitacion))
    .map(o => ({ ...o, dias: diasHasta(o.fecha_limite) }))
    .sort((a, b) => (a.dias ?? 9e9) - (b.dias ?? 9e9));
  const DATOS = preparar(data);

  // La cartera de esta empresa, por contrato (ver `pintarCartera`). Vacía
  // y sin pestaña hasta que llega; si la base no tiene la función (la web
  // publicada antes que la migración), todo sigue como antes de existir.
  const CARTERA = new Map();
  let CARTERA_DISPONIBLE = false;
  let carteraCargada = false;

  // Datos nuevos llegados por detrás (refresco de la caché o cribado de
  // fondo). Antes solo se repintaba la lista: el contador de la pestaña y
  // las cifras del selector de provincias se quedaban con los de la
  // primera carga y no cuadraban con lo que se veía.
  function ponerDatos(nuevos) {
    const vistas = new Set(DATOS.filter(o => !o.es_novedad).map(o => o.id_licitacion));
    DATOS.length = 0;
    preparar(nuevos).forEach(o => {
      // Lo que ya se ha dado por visto en esta sesión no vuelve a ser
      // novedad por refrescar.
      if (yaVistas && vistas.has(o.id_licitacion)) o.es_novedad = false;
