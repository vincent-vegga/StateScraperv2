    <div id="zona"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'organismos');

  const campo = document.getElementById('q-organo');
  const caja = document.getElementById('sugerencias');
  const zona = document.getElementById('zona');

  // ---------- Buscador ----------
  //
  // La lista se pide UNA vez al entrar y se filtra en el navegador.
  // Consultando en cada tecla, cada búsqueda tardaba segundos: agrupar
  // por organismo sobre decenas de miles de filas no es instantáneo, y
  // hacerlo cinco veces mientras se escribe una palabra menos.
  let TODOS = [];
  // La lista que se carga al entrar se corta en 5.000 (la guarda así el
  // servidor). Con un perfil amplio hay más: construcción tiene 8.583.
  // Si viene cortada, al escribir se pregunta también al servidor, que
  // busca por nombre entre todos.
  let cortada = false;
  campo.disabled = true;
  campo.placeholder = 'Cargando organismos...';

  // Por tandas: la API recorta el número de filas por respuesta, así que
  // pedir la lista de una vez devolvía menos de la mitad sin avisar de
  // nada.
  (async () => {
    const TANDA = 400;
    for (let salto = 0; salto < 5000; salto += TANDA) {
      const { data, error } = await sb.rpc('buscar_organismo',
        { texto: '', salto, cuantos: TANDA });
      if (error) break;
      const trozo = data ?? [];
      TODOS = TODOS.concat(trozo);
      // Se habilita en cuanto llega la primera tanda: los organismos con
      // más contratos son los primeros, así que ya se puede buscar
      // mientras acaban de llegar los demás.
      if (salto === 0) campo.disabled = false;
      if (trozo.length < TANDA) break;
      if (salto + TANDA >= 5000) cortada = true;
    }
    campo.disabled = false;
    const cuantos = new Intl.NumberFormat('es-ES', {useGrouping:'always'})
      .format(TODOS.length);
    campo.placeholder = !TODOS.length
      ? 'Ayuntamiento, diputación, consejería...'
      : cortada ? `Busca entre más de ${cuantos} organismos de tu sector`
      : TODOS.length === 1 ? 'Busca el organismo de tu sector'
      : `Busca entre ${cuantos} organismos de tu sector`;
  })();

  // Lo que el servidor encuentra fuera de la lista cargada se añade a
  // ella, así la siguiente búsqueda ya lo tiene a mano.
  let esperaServidor;
  function buscarEnServidor() {
    clearTimeout(esperaServidor);
    const texto = campo.value.trim();
    if (!cortada || texto.length < 3) return;
    esperaServidor = setTimeout(async () => {
      // El servidor busca el texto de corrido: se le manda la palabra más
      // larga, que es la que más acota, y el resto lo filtra `buscar`.
      const palabra = texto.split(/\s+/).sort((a, b) => b.length - a.length)[0];
      const { data, error } = await sb.rpc('buscar_organismo',
        { texto: palabra, salto: 0, cuantos: 40 });
      if (!error && data?.length) {
        const ya = new Set(TODOS.map(o => o.organo));
        TODOS = TODOS.concat(data.filter(o => !ya.has(o.organo)));
      }
      // Se repinta aunque no haya nada nuevo, para quitar el "Buscando".
      // Y solo si sigue escrito lo mismo: si no, pisaría una búsqueda
      // más reciente.
      if (campo.value.trim() === texto && !caja.hidden) buscar(false);
    }, 300);
  }

  function buscar(preguntarAlServidor = true) {
    if (preguntarAlServidor) buscarEnServidor();
    // Palabra a palabra y en las lenguas de los organismos (ver
    // `coincide`): "ayuntamiento barcelona" encuentra "Ajuntament de
    // Barcelona".
    const q = campo.value.trim();
    const encontrados = q ? TODOS.filter(o => coincide(o.organo, q)) : TODOS;
    const filas = encontrados.slice(0, 40);
    const total = encontrados.length;

    caja.innerHTML = (filas.length
      // Solo el nombre y la provincia, que distingue organismos con el
      // mismo nombre. Las cifras están en la ficha, con el periodo
      // elegido: aquí serían de todo el histórico y no cuadrarían.
      ? filas.map(o => `<button data-organo="${esc(o.organo)}">
          ${esc(o.organo)}
          ${o.provincia ? `<span class="cuantos">${esc(o.provincia)}</span>` : ''}
        </button>`).join('')
      : preguntarAlServidor && cortada && campo.value.trim().length >= 3
        ? `<p class="sinresultado">Buscando entre todos los organismos...</p>`
      : `<p class="sinresultado">Ningún organismo con ese nombre ha
         adjudicado contratos de tu sector.</p>`)
      + (total > filas.length
        ? `<p class="sinresultado">Y ${total - filas.length} más. Escribe
           unas letras del nombre para acotar.</p>` : '');
    caja.hidden = false;
  }

  campo.oninput = () => buscar();
  campo.onfocus = () => buscar();
  caja.addEventListener('click', ev => {
    const b = ev.target.closest('[data-organo]');
    if (!b) return;
    caja.hidden = true;
    campo.value = b.dataset.organo;
    abrir(b.dataset.organo);
  });
  document.addEventListener('click', ev => {
    if (!ev.target.closest('.buscar-organo')) caja.hidden = true;
  }, dePantalla());

  // ---------- Ficha ----------
  // El periodo es el de toda la sesión; las barritas del selector, en
  // la ficha, son las del organismo.
  let aniosSector = [], volumenOrgano = null, vueltaFicha = 0;
  let ultimoOrgano = null, ultimaFicha = null;
  let ultimasEmpresas = [], ultimosContratos = [];
  let señalarAhora = null, limpiarAhora = null;

  // Enganchados una sola vez sobre el contenedor, que no se sustituye.
  zona.addEventListener('mouseover', ev => {
    const el = ev.target.closest('.trozo, .lista-empresas [data-cif]');
    if (el && señalarAhora) señalarAhora(el);
  });
  zona.addEventListener('mouseleave', () => { if (limpiarAhora) limpiarAhora(); });
  // El nombre de una empresa abre su ficha en Mercado. Solo el nombre: el
  // resto de la fila sigue señalando sus contratos al pasar o tocar.
  zona.addEventListener('click', ev => {
    const a = ev.target.closest('[data-a-mercado]');
    if (!a) return;
    ev.preventDefault();
    irA('mercado', { cif: a.dataset.aMercado, desde: ultimoOrgano });
    pantallaMercado(perfil, session, true, a.dataset.aMercado);
    window.scrollTo({ top: 0, behavior: 'instant' });
  });
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaFicha) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintar(ultimoOrgano, ultimaFicha);
  });

  async function abrir(cual, mismoOrgano = false) {
    const turno = ++vueltaFicha;
    aniosSector = await aniosDelSector();
    const periodo = periodoGuardado(aniosSector);
    if (!mismoOrgano) {
      zona.innerHTML = `<p class="guia" style="margin-top:24px">Cargando...</p>`;
      const { data: porAnio } = await sb.rpc('anios_de_organismo',
        { organo_buscado: cual });
      volumenOrgano = Object.fromEntries((porAnio ?? []).map(a => [a.anio, a.contratos]));
    } else {
      zona.querySelector('.cuerpo-ficha')?.classList.add('cambiando');
    }

    const { data, error } = await sb.rpc('ficha_organismo',
      { organo_buscado: cual, desde: periodo.desde, hasta: periodo.hasta });
    if (turno !== vueltaFicha) return;
    // Distinguir "no hay datos" de "no se han podido leer": decir lo
    // primero cuando pasa lo segundo es afirmar algo falso.
    if (error) {
      zona.innerHTML = `<div class="aviso mal">No hemos podido cargar este
        organismo.<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
        ${esc(error.message || '')}</div></div>`;
      return;
    }
    if (!data || !data.contratos) {
      // Con el selector a la vista: si no, no hay forma de probar otro
      // periodo sin volver a buscar el organismo.
      zona.innerHTML = `
        <div class="ficha-organo">
          <div class="arriba"><div><h2>${esc(cual)}</h2></div></div>
          <div class="hueco-periodo" id="periodo-org"></div>
          <div class="aviso" style="margin-top:14px">No hay adjudicaciones de
          tu sector para este organismo ${esc(enPeriodo(periodo, aniosSector))}.
          Prueba con otro periodo.</div>
        </div>`;
      ponerSelector(cual);
      return;
    }
    // Las UTEs que se van a enseñar, con sus socios (socios_de_utes,
    // 20261003100000). Aparte y sin bloquear: si falla, sin marcas.
    if (UTES_VISIBLE) {
      const cifs = [...new Set([
        ...(data.empresas ?? []).slice(0, 10).map(e => e.cif),
        ...(data.contratos_lista ?? []).flatMap(c => c.cifs ?? [c.cif]),
      ].filter(Boolean))];
      const { data: socios } = await sb.rpc('socios_de_utes', { cifs });
      if (turno !== vueltaFicha) return;
      data.socios_utes = socios ?? {};
    }
    pintar(cual, data);
  }

  function ponerSelector(cual) {
    selectorPeriodo(document.getElementById('periodo-org'), aniosSector,
      periodoGuardado(aniosSector), () => abrir(cual, true), volumenOrgano);
  }

  // Con pocos contratos una media no dice nada: tres adjudicaciones no
  // describen cómo compra un organismo. Por debajo de este número la
  // cifra no se enseña.
  const MINIMO_PARA_MEDIA = 5;

  function bloqueAdjudicacion(d) {
    const trozos = [];

    // Cada cifra va con la de su sector al lado cuando la hay. Un
    // porcentaje suelto no distingue un organismo de otro; lo que
    // informa es la diferencia.
    const comparar = (valor, referencia, sufijo) => {
      if (!referencia) return '';
      const dif = Math.round((valor - referencia) * 10) / 10;
      if (Math.abs(dif) < 0.5) return 'igual que tu sector';
      return `${Math.abs(dif).toString().replace('.', ',')} ${sufijo} ${
        dif > 0 ? 'más' : 'menos'} que tu sector`;
    };

    if (d.baja_media && d.con_baja >= MINIMO_PARA_MEDIA) {
      const roza = comparar(d.baja_media, d.baja_sector, 'puntos');
      trozos.push(`<div>
        <dt>Se adjudica al</dt>
        <dd>${d.baja_media} %
          <span class="matiz">del presupuesto${roza ? ` · ${roza}` : ''}
          <br>medido en ${d.con_baja} ${
            d.con_baja === 1 ? 'contrato' : 'contratos'}</span>
        </dd></div>`);
    }

    if (d.licitadores_medio && d.con_licitadores >= MINIMO_PARA_MEDIA) {
      // Que la mitad de los contratos vayan con un solo licitador sí es
      // propio de ese organismo, y responde a si merece la pena
      // presentarse.
      const solos = d.sin_competencia > d.con_licitadores / 2;
      const roza = comparar(d.licitadores_medio, d.licitadores_sector, '');
      trozos.push(`<div class="${solos ? 'alerta' : ''}">
        <dt>Se presentan</dt>
        <dd>${String(d.licitadores_medio).replace('.', ',')}
          <span class="matiz">${Number(d.licitadores_medio) === 1 ? 'empresa' : 'empresas'} de media${roza ? ` · ${roza}` : ''}
          ${d.sin_competencia ? `<br><strong>${d.sin_competencia}</strong> de
            ${d.con_licitadores} con un solo licitador` : ''}</span>
        </dd></div>`);
    }

    if (d.procedimientos?.length) {
      const p = d.procedimientos[0];
      trozos.push(`<div>
        <dt>Suele adjudicar por</dt>
        <dd style="font-size:1.02rem">${esc(p.cual)}
          <span class="matiz">${p.cuantos} de sus ${d.contratos}${
            d.procedimientos.length > 1
              ? ` · ${d.procedimientos.length === 2 ? 'y otra vía'
                  : `y otras ${d.procedimientos.length - 1} vías`}` : ''}</span>
        </dd></div>`);
    }

    if (!trozos.length) {
      return `<p class="poca-muestra">Este organismo tiene pocos contratos
        publicados en tus sectores como para decir cómo adjudica.</p>`;
    }
    return `<dl class="como-adjudica">${trozos.join('')}</dl>`;
  }

  function pintar(cual, d) {
    const empresas = d.empresas ?? [];
    const contratos = d.contratos_lista ?? [];
    const sociosUtes = d.socios_utes ?? {};
    // Nombre con enlace a su ficha en Mercado y, si es una UTE, la marca y
    // sus socios. Sin NIF no hay ficha que abrir.
    const empresaTxt = (cif, nombre, enLinea = false) => {
      const socios = sociosUtes[cif];
      const ute = UTES_VISIBLE && esUte(cif, nombre, socios);
      const quien = socios?.length ? `con ${esc(enumerar(socios.map(s => s.nombre)))}` : '';
      return `${cif ? `<a href="#" class="enlace-ficha" data-a-mercado="${esc(cif)}">${
          esc(nombre ?? '—')}</a>` : esc(nombre ?? '—')}${
        ute ? `<span class="marca-ute" title="Unión temporal de empresas. Cuánto le toca a cada socio no se publica.">UTE</span>` : ''}${
        quien ? (enLinea ? ` ${quien}` : `<span class="socios-ute">${quien}</span>`) : ''}`;
    };

    zona.innerHTML = `
      <div class="ficha-organo">
        <div class="arriba">
          <div>
            <h2>${esc(d.organo)}</h2>
            <p class="cifras">
              <span><strong>${d.contratos}</strong> ${
                d.contratos === 1 ? 'contrato' : 'contratos'}${aniosSector.length
                ? ` ${esc(enPeriodo(periodoGuardado(aniosSector), aniosSector))}` : ''}</span>
              <span><strong>${d.n_empresas ?? empresas.length}</strong> ${
                (d.n_empresas ?? empresas.length) === 1 ? 'empresa' : 'empresas'}</span>
              ${d.importe ? `<span><strong>${euros(Number(d.importe))}</strong>
                adjudicados</span>` : ''}
              ${d.provincia ? `<span>${esc(d.provincia)}</span>` : ''}
            </p>
          </div>
        </div>
        <div class="hueco-periodo" id="periodo-org"></div>
        <div class="cuerpo-ficha">

        ${bloqueAdjudicacion(d)}

        <div class="dos-paneles">
          <div class="panel-organo">
            <div style="display:flex;align-items:center;margin-bottom:10px">
              <h4 style="margin:0">A quién le compra</h4>
              <div class="forma" role="group" aria-label="Forma del gráfico">
                <button data-forma="barras"
                  aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
                <button data-forma="quesito"
                  aria-pressed="${formaActual() === 'quesito'}">Circular</button>
              </div>
            </div>
            ${apilada(empresas, 'nombre', 'contratos', 'contratos', false,
                      'cif', false)}
            <div class="lista-empresas" style="margin-top:18px">
              ${empresas.slice(0, 10).map(e => `
                <div class="${e.es_mia ? 'mia' : ''}" data-cif="${esc(e.cif ?? '')}">
                  <span class="quien">${empresaTxt(e.cif, e.nombre)}</span>
                  <span class="cuanto">${e.contratos}
                    <span>${e.importe ? euros(Number(e.importe)) : '—'}</span></span>
                </div>`).join('')}
            </div>
          </div>

          <div class="panel-organo">
            <h4 id="rotulo-contratos">Sus contratos</h4>
            <div class="contratos-organo" id="contratos-organo"></div>
          </div>
        </div>
        </div>
      </div>`;

    ultimoOrgano = cual; ultimaFicha = d; ultimasEmpresas = empresas;
    ultimosContratos = contratos;
    ponerSelector(cual);

    // ---------- Los contratos siguen a lo que señalas ----------
    //
    // Al pasar por encima de una empresa —en el gráfico o en la lista—,
    // la columna de la derecha enseña SUS contratos. Sin eso el gráfico
    // solo dice cuánto se lleva cada una; con eso dice qué le ha
    // comprado.
    const cajaContratos = document.getElementById('contratos-organo');
    const rotulo = document.getElementById('rotulo-contratos');

    // Al señalar una empresa salen también los contratos en los que ganó
    // un lote sin ser la principal, y con SU parte, no con el total.
    const pintarContratos = (cifs, quien) => {
      const ganadoresDe = c => c.cifs ?? [c.cif];
      const filtrados = cifs
        ? contratos.filter(c => ganadoresDe(c).some(x => cifs.includes(x)))
        : contratos;
      const cifra = c => {
        if (cifs?.length === 1 && c.partes) return c.partes[cifs[0]];
        return c.total ?? c.importe;
      };
      rotulo.textContent = quien ? `Contratos de ${quien}` : 'Sus contratos';
      cajaContratos.innerHTML = filtrados.length
        ? filtrados.slice(0, 14).map(c => `
            <div class="${c.es_mia ? 'mia' : ''}">
              <p class="que">${tituloConEnlace(c.titulo, c.enlace)}</p>
              <span class="quien">${c.empresa ? empresaTxt(c.cif, c.empresa, true) : ''}${
                c.otros ? ` y ${c.otros} más` : ''}${
                cifra(c) ? ` · ${euros(Number(cifra(c)))}` : ''}</span>
              ${(c.licitadores || c.baja || c.oferta_baja) ? `
                <span class="detalle-contrato">
                  ${c.licitadores ? `<span><strong>${c.licitadores}</strong>
                    ${c.licitadores === 1 ? 'licitador' : 'licitadores'}</span>` : ''}
                  ${c.baja ? `<span>adjudicado al <strong>${c.baja} %</strong>
                    del presupuesto</span>` : ''}
                  ${c.oferta_baja && c.oferta_alta
                    && Number(c.oferta_alta) > Number(c.oferta_baja)
                    ? `<span>de ${euros(Number(c.oferta_baja))} a ${
                       euros(Number(c.oferta_alta))}</span>` : ''}
                </span>` : ''}
            </div>`).join('')
        : `<p class="sin-datos">Sin contratos en el periodo elegido.</p>`;
    };
    pintarContratos(null, null);

    const señalar = el => {
      const clave = el.dataset.clave ?? el.dataset.cif ?? '';
      if (!clave) return pintarContratos(null, null);
      const cifs = clave.split(',').filter(Boolean);
      const suya = empresas.find(e => e.cif === cifs[0]);
      pintarContratos(cifs, cifs.length === 1 ? (suya?.nombre ?? null) : null);
    };

    // El detalle y el interruptor se atienden por delegación desde
    // `zona`, enganchados UNA vez al abrir la pantalla. Volver a
    // engancharlos en cada dibujado los duplicaba y bastaba con que uno
    // fallara para que el botón dejara de responder.
    señalarAhora = señalar;
    limpiarAhora = () => pintarContratos(null, null);

    activarBarras(zona);

  }

  if (organo) { campo.value = organo; abrir(organo); }
  else zona.innerHTML = `<p class="guia" style="margin-top:26px">
    Escribe el nombre de un organismo para ver su ficha.</p>`;
}

// ---------- Movimientos del mercado ----------
//
// Los contratos que se han adjudicado en su sector durante el último mes.
//
// Va en la web y no en el correo: el correo es para lo que caduca —una
// licitación que cierra el jueves exige acción hoy— y una adjudicación ya
// cerrada no. Meterla ahí le restaría urgencia a lo que sí la tiene.
// Clasifica lo adjudicado que aún no tenga veredicto. Enseña progreso
// porque la primera vez son unos segundos, y una pantalla parada sin
// explicación se lee como que algo va mal.
async function cribarMercado(destino = 'zona') {
  const { data: cola } = await sb.rpc('mercado_sin_cribar', { dias: 30 });
  const total = (cola ?? []).length;
  if (!total) return;

  const zona = document.getElementById(destino);
  if (!zona) return;
  zona.innerHTML = `
    <div class="paso ancha" style="min-height:40vh">
      <h1 style="font-size:1.5rem">Revisando tu mercado</h1>
      <p class="lema">${total === 1
        ? 'Estamos comprobando si la adjudicación de este mes es de verdad de tu sector.'
        : `Estamos comprobando cuáles de las ${total} adjudicaciones de este mes
           son de verdad de tu sector.`}
      Solo hace falta la primera vez.</p>
      <div class="avance" style="margin-top:24px">
        <div class="barra"><div class="relleno" id="relleno-mercado"></div></div>
        <div class="cuenta"><span id="paso-mercado">Empezando...</span><span></span></div>
      </div>
    </div>`;

  let quedan = total;
  for (let vuelta = 0; vuelta < 30; vuelta++) {
    let r;
    try {
      r = await llamar('cribar_mercado', { dias: 30 });
    } catch {
      break;   // Si falla, se enseña sin filtrar antes que no enseñar nada.
    }

    // Si una vuelta clasifica y NO guarda nada, seguir es dar vueltas:
    // la siguiente encontrará los mismos contratos y la pantalla se
    // quedaría girando para siempre.
    if (r?.cribados > 0 && !r?.guardados) break;

    const antes = quedan;
    quedan = r?.quedan ?? 0;
    const hechas = total - quedan;
    const barra = document.getElementById('relleno-mercado');
    if (barra) barra.style.width = `${total ? hechas / total * 100 : 100}%`;
    const texto = document.getElementById('paso-mercado');
    if (texto) texto.textContent = `${hechas} de ${total}`;
    if (r?.terminado || !quedan || quedan >= antes) break;
  }
}

// ---------- Lo que viene ----------
//
// La pestaña que era Movimientos (hoja de ruta, prioridad 2). "Quién
// ganó qué el último mes" era interesante pero no llevaba a ninguna
// acción; saber qué contratos de tu sector terminan pronto, sí: el
// organismo tendrá que volver a licitarlos, y quien lo sabe antes
// prepara la oferta. Es lo que más valoran los clientes de Tussell y
// Stotles.
//
// Lo de antes no se pierde: va dentro, como segunda vista ("Lo
// adjudicado"), con el mismo periodo, rankings y lista. Se abre por
// defecto lo que vence, y se recuerda cuál eligió mientras dura la sesión.
//
// Los datos salen de `lo_que_viene()`, que lee una tabla que se rehace
// cada noche (calcularlo al pedirlo no cabe en los 8 s de la API). Ver
// supabase/migrations/20261005100000_lo_que_viene.sql.
const PLAZOS_VIENE = [3, 6, 12];

function seccionMovGuardada() {
  try {
    const s = sessionStorage.getItem('seccion-mov:' + perfilActivoId);
    return s === 'adjudicado' ? 'adjudicado' : 'viene';
  } catch { return 'viene'; }
}

function plazoViene() {
  let p = null;
  try { p = Number(sessionStorage.getItem('plazo-viene:' + perfilActivoId)); }
  catch { /* modo privado */ }
  return PLAZOS_VIENE.includes(p) ? p : 12;
}

// "jun 2029": para el fin con prórrogas basta el mes; el día exacto
// depende de cuándo se acuerde cada una.
const mesAnio = iso => fechaCorta(iso).replace(/^\d+ /, '');

// "en 12 días", "en 5 meses". Por días de calendario peninsular, como los
// plazos de Contratos.
function faltaPara(iso) {
  const hoy = Date.parse(diaPeninsular(new Date()) + 'T00:00:00Z');
  const dias = Math.round((Date.parse(iso + 'T00:00:00Z') - hoy) / 864e5);
  if (dias <= 0) return 'hoy';
  if (dias === 1) return 'mañana';
  if (dias < 45) return `en ${dias} días`;
  return `en ${Math.round(dias / 30.44)} meses`;
}

// Cada vez que se cambia de vista se pide un turno: una respuesta lenta
// de la vista anterior no puede pintar encima de la nueva.
let turnoMov = 0;

async function pantallaMovimientos(perfil, session, volviendo = false,
                                   provinciaElegida = '', seccion = null) {
  seccion = seccion === 'adjudicado' || seccion === 'viene'
    ? seccion : seccionMovGuardada();
  if (!volviendo) irA('movimientos', { seccion });
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Lo que viene</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('movimientos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <div id="zona">
      <div class="forma vista-ficha vista-mov" role="group" aria-label="Qué ver">
        <button type="button" data-seccion="viene">Lo que vence</button>
        <button type="button" data-seccion="adjudicado">Lo adjudicado</button>
      </div>
      <div id="cuerpo-mov"><p class="guia" style="margin-top:30px">Cargando...</p></div>
    </div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'movimientos');

  const botones = [...raiz.querySelectorAll('[data-seccion]')];
  const abrir = (cual, guardar) => {
    botones.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.seccion === cual)));
    if (guardar) {
      try { sessionStorage.setItem('seccion-mov:' + perfilActivoId, cual); }
      catch { /* modo privado */ }
      // Se sustituye la entrada del historial, no se añade otra: cambiar
      // de vista no es cambiar de pantalla, y "atrás" debe salir de aquí.
      irA('movimientos', { seccion: cual }, true);
    }
    return cual === 'viene'
      ? seccionLoQueViene(perfil, session)
      : seccionAdjudicado(perfil, session, provinciaElegida);
  };
  botones.forEach(b => b.onclick = () => {
    if (b.getAttribute('aria-pressed') === 'true') return;
    abrir(b.dataset.seccion, true);
  });
  await abrir(seccion, false);
}

async function seccionLoQueViene(perfil, session) {
  const turno = ++turnoMov;
  const cuerpo = document.getElementById('cuerpo-mov');
  if (!cuerpo) return;

  let plazo = plazoViene();
  let provincia = null;
  const fecha = fechaCorta;

  // Como en lo adjudicado: 300 primero y "Ver más" de 300 en 300. Aquí la
  // consulta lee una tabla ya hecha y no hay riesgo de pasar de los 8 s;
  // el techo es por lo que pesa la página (unos 800 bytes por contrato).
  const TANDA = 300, TECHO = 1500;
  let tope = TANDA;
  let vuelta = 0;

  cuerpo.innerHTML = `
    <div class="cabeza-movimientos">
      <div>
        <h1 style="margin:0 0 12px">Lo que va a volver a licitarse</h1>
        <p class="guia" style="margin:0">Contratos de tu sector que terminan
        en los próximos meses. El organismo tendrá que volver a licitarlos:
        es el momento de preparar la oferta, y de saber quién lo tiene ahora
        y por cuánto.</p>
      </div>
    </div>
    <div id="datos-viene">
      <div class="pulso"><h4>En tu sector</h4>
        <p class="guia" style="margin:0;font-size:.9rem">Cargando...</p></div>
    </div>`;

  async function cargar(mas = false) {
    const t = ++vuelta;
    const datos = document.getElementById('datos-viene');
    if (!datos) return;
    if (!mas) tope = TANDA;
    datos.classList.add('cambiando');
    const r = await pedir('lo_que_viene',
      { meses: plazo, provincia_elegida: provincia, tope });
    if (t !== vuelta || turno !== turnoMov) return;
    const ahora = document.getElementById('datos-viene');
    if (!ahora) return;
    ahora.classList.remove('cambiando');

    // Si la web llega a producción antes que la migración, la función aún
    // no existe (PGRST202): eso es "se está preparando", no un error.
    if (r.error?.code === 'PGRST202') {
      pintar({ actualizado: null });
      return;
    }

    // Un fallo no se enseña como "no hay nada": el cliente concluiría
    // que en su sector no vence ningún contrato.
    if (r.error) {
      ahora.innerHTML = `
        <div class="aviso mal" style="margin-top:26px">
          No hemos podido cargar los contratos que vencen.
          <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
            ${esc(r.error.message || 'Error desconocido')}</div>
          <div style="margin-top:14px">
            <button class="secundario" id="reintentar-viene">Reintentar</button>
          </div>
        </div>`;
      alPulsar('reintentar-viene', () => cargar());
      return;
    }
    pintar(r.data ?? {});
  }

  function pintar(d) {
    const datos = document.getElementById('datos-viene');
    if (!datos) return;

    // La tabla se rellena por la noche. Hasta la primera pasada está
    // vacía, y eso no es lo mismo que "no vence nada".
    if (!d.actualizado) {
      datos.innerHTML = `<p class="vacio" style="margin-top:26px">Estamos
        preparando esta pantalla: los contratos que vencen se calculan una
        vez al día, por la noche. Vuelve mañana.</p>`;
      return;
    }

    const filas = d.filas ?? [];
    const cuantos = d.cuantos ?? {};
    const total = Number(cuantos[plazo]) || 0;
    const provincias = d.provincias ?? [];

    const enlaceOrgano = o => o ? `<a href="#" class="enlace-ficha"
      data-a-organismo="${esc(o)}">${esc(o)}</a>` : '';

    // Una línea por contrato: quién lo tiene, qué es, de quién, cuánto y
    // cuándo vence. Las prórrogas solo se dicen si el organismo las
    // publicó; si el texto remite al pliego, se dice eso y no se inventa.
    const linea = m => {
      const otros = (Number(m.adjudicatarios) || 1) - 1;
      const marca = m.es_mia ? 'tu empresa' : m.la_sigo ? 'la sigues' : '';
      const quien = m.cif
        ? `<a href="#" class="enlace-ficha" data-a-mercado="${esc(m.cif)}">${esc(m.empresa ?? m.cif)}</a>`
        : esc(m.empresa ?? '—');
      // Ya pasó el plazo inicial y vence cuando acaben las prórrogas. No
      // sabemos si se prorrogó: por eso "como tarde".
      const enProrroga = m.fin < m.vence;
      const dur = duracionTxt(m.duracion_meses);
      const notas = [];
      if (dur) notas.push(`${m.clase === 'marco' ? 'Acuerdo marco' : 'Contrato'} de ${dur}`);
      if (m.prorroga === 'no') notas.push('sin prórroga prevista');
      else if (m.prorroga === 'si' && enProrroga)
        notas.push(`el plazo inicial terminó el ${esc(fecha(m.fin))}; la fecha es la del final de las prórrogas, si se han hecho`);
      else if (m.prorroga === 'si') notas.push(`prorrogable hasta ${esc(mesAnio(m.fin_maximo))}`);
      else if (m.prorroga === 'pliego') notas.push('puede tener prórrogas (ver el pliego)');
      const anual = importeAnualTxt(m.importe, m.duracion_meses);

      return `<div class="movimiento ${m.es_mia ? 'mia' : m.la_sigo ? 'sigo' : ''}">
        <div>
          <p class="gano">Lo tiene ${quien}${
            otros > 0 ? ` <span class="cuanto">y ${otros} más</span>` : ''}${
            marca ? `<span class="marca-mia">${marca}</span>` : ''}</p>
          <p class="que">${tituloConEnlace(m.titulo, m.enlace)}</p>
          <span class="donde">${enlaceOrgano(m.organo)}${
            m.provincia ? ` · ${esc(m.provincia)}` : ''}</span>
          ${notas.length ? `<span class="nota-prorroga">${notas.join(' · ')}</span>` : ''}
        </div>
        <div class="cifra">
          <strong>${Number(m.importe) ? euros(Number(m.importe)) : '—'}</strong>
          ${anual ? `<span class="baja">${anual}</span>` : ''}
          <span class="cuando">${enProrroga ? 'como tarde' : 'vence'} ${esc(fecha(m.vence))}
            <span class="falta">${faltaPara(m.vence)}</span></span>
        </div>
      </div>`;
    };

    datos.innerHTML = `
      <div class="filtros-viene">
        <div class="forma plazos-viene" role="group" aria-label="Vencen en">
          ${PLAZOS_VIENE.map(m => `<button type="button" data-plazo="${m}"
            aria-pressed="${m === plazo}">${m} meses<span class="n">${
            numero(cuantos[m] ?? 0)}</span></button>`).join('')}
        </div>
        ${provincias.length > 1 ? `
          <div class="filtro-provincia">
            <label for="f-provincia-viene">Ver solo</label>
            <select id="f-provincia-viene">
              <option value="">Toda España</option>
              ${provincias.map(pr => `<option value="${esc(pr)}"${
                pr === provincia ? ' selected' : ''}>${esc(pr)}</option>`).join('')}
            </select>
          </div>` : ''}
      </div>

      <div class="pulso">
        <h4>Vencen en ${plazo} meses${provincia ? ` · ${esc(provincia)}` : ''}</h4>
        <dl>
          <div><dt>Contratos</dt><dd>${numero(total)}</dd></div>
          <div><dt>Importe adjudicado</dt><dd>${
            Number(d.importe) ? eurosConDetalle(d.importe) : '—'}</dd></div>
          ${d.mios ? `<div><dt>Son tuyos</dt><dd>${numero(d.mios)}</dd></div>` : ''}
          <p class="destacado">Un contrato vence cuando termina el plazo con
          el que se firmó: la fecha de formalización (o de adjudicación) más
          su duración. Si el organismo publicó prórrogas, se dice al lado: con
          ellas puede tardar más en volver a licitarse. No entran los
          contratos menores, los basados en un acuerdo marco (solo pueden
          pedirlos las empresas homologadas), las obras ni los de menos de
          seis meses. ${d.mios ? '<strong>Los tuyos</strong> van marcados: son los que te toca defender. ' : ''}Se
          recalcula cada noche.</p>
        </dl>
      </div>

      <div style="margin-top:32px">
        ${total > filas.length ? `<p class="guia" style="font-size:.88rem">
          Los ${numero(filas.length)} que vencen antes, de ${numero(total)}.</p>` : ''}
        ${filas.length ? filas.map(linea).join('') : `<p class="vacio">No hay
          contratos de tus sectores que venzan en los próximos ${plazo} meses${
          provincia ? ` en ${esc(provincia)}` : ''}.</p>`}
        ${total > filas.length && tope < TECHO ? `
          <button class="mas" id="mas-viene">Ver ${TANDA} más
            <span class="flechita">▾</span></button>` : ''}
      </div>`;

    datos.querySelectorAll('[data-plazo]').forEach(b => b.onclick = () => {
      const m = Number(b.dataset.plazo);
      if (m === plazo) return;
      plazo = m;
      try { sessionStorage.setItem('plazo-viene:' + perfilActivoId, String(m)); }
      catch { /* modo privado */ }
      cargar();
    });

    const selProv = document.getElementById('f-provincia-viene');
    if (selProv) selProv.onchange = () => {
      provincia = selProv.value || null;
      cargar();
    };

    const mas = document.getElementById('mas-viene');
    if (mas) mas.onclick = () => {
      mas.disabled = true;
      mas.firstChild.textContent = 'Cargando... ';
      tope = Math.min(TECHO, tope + TANDA);
      cargar(true);
    };

    // La empresa abre su ficha en Empresas y el organismo la suya, igual
    // que en lo adjudicado.
    datos.onclick = ev => {
      const e = ev.target.closest('[data-a-mercado]');
      const o = ev.target.closest('[data-a-organismo]');
      if (!e && !o) return;
      ev.preventDefault();
      if (e) {
        irA('mercado', { cif: e.dataset.aMercado });
        pantallaMercado(perfil, session, true, e.dataset.aMercado);
      } else {
        pantallaOrganismos(perfil, session, false, o.dataset.aOrganismo);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
  }

  await cargar();
}

// Lo que era Movimientos, igual que antes: lo adjudicado en el periodo.
async function seccionAdjudicado(perfil, session, provinciaElegida = '') {
  const turno = ++turnoMov;
  if (!document.getElementById('cuerpo-mov')) return;

  // Se criba antes de enseñar, la primera vez.
  //
  // El sector se define cruzando códigos CPV y eso trae empresas que no
  // compiten: a un proveedor de equipamiento médico le salían empresas
  // de mantenimiento de escuelas y de semáforos. El clasificador que ya
  // filtra sus contratos abiertos sabe distinguirlas.
  //
  // Solo pasa una vez: el veredicto se guarda, y lo que entra a diario
  // lo criba el propio scraper. Ya no se hace al entrar en la pestaña,
  // sino al abrir esta vista: lo que vence no lo necesita.
  await cribarMercado('cuerpo-mov');
  if (turno !== turnoMov) return;

  // El periodo, compartido con Organismos y Empresas. Por defecto, el
  // último año con datos.
  const anios = await aniosDelSector();
  if (turno !== turnoMov || !document.getElementById('cuerpo-mov')) return;
  let periodo = periodoGuardado(anios);
  let provincia = provinciaElegida || null;

  // La estructura primero, los datos después: reemplazar la pantalla
  // entera por «Cargando...» da sensación de salto en cada cambio de
  // pestaña o de periodo. Así la cabecera y el selector no parpadean.
  document.getElementById('cuerpo-mov').innerHTML = `
    <div class="cabeza-movimientos">
      <div>
        <h1 style="margin:0 0 12px">Qué se ha adjudicado en tu sector</h1>
        <p class="guia" style="margin:0">Los contratos adjudicados en el
        periodo elegido con los mismos códigos que los tuyos. Quién los ganó,
        de qué organismo y por cuánto.</p>
      </div>
      <div class="hueco-periodo" id="periodo-mov"></div>
    </div>
    <div id="datos-mov">
      <div class="pulso"><h4>En tu sector</h4>
        <p class="guia" style="margin:0;font-size:.9rem">Cargando...</p></div>
    </div>`;

  if (!anios.length) {
    document.getElementById('datos-mov').innerHTML = `<p class="vacio">
      Todavía no hay adjudicaciones registradas en tus sectores.</p>`;
    return;
  }

  selectorPeriodo(document.getElementById('periodo-mov'), anios, periodo, p => {
    periodo = p;
    cargar();
  });

  const fecha = fechaCorta;

  // Cada petición lleva su número: si el cliente cambia de periodo dos
  // veces seguidas, la respuesta lenta de la primera no pisa la segunda.
  let vuelta = 0;

  // Cuántas de las más recientes se piden. Empieza en 300 (lo mismo que
  // precarga la pestaña) y "Ver más" lo sube de 300 en 300 hasta un techo:
  // más allá, la consulta se acerca a los 8 s que corta la API.
  const TANDA_MOV = 300, TECHO_MOV = 1200;
  let topeMov = TANDA_MOV;

  async function cargar(mas = false) {
    const turno = ++vuelta;
    const datos = document.getElementById('datos-mov');
    if (!datos) return;
    if (!mas) topeMov = TANDA_MOV;
    datos.classList.add('cambiando');

    // Cifras y rankings sobre el periodo ENTERO, calculados en la base.
    // La lista solo trae los más recientes: con un año son miles.
    const extra = { provincia_elegida: provincia };
    const [res, mov] = await Promise.all([
      pedir('resumen_periodo', argsPeriodo(periodo, extra)),
      pedir('movimientos_periodo', argsPeriodo(periodo, { ...extra, tope: topeMov })),
    ]);
    if (turno !== vuelta || !document.getElementById('datos-mov')) return;
    datos.classList.remove('cambiando');

    // Un fallo NO se enseña como "no hay nada".
    //
    // Cuando la consulta se cae —un tiempo de espera agotado mientras el
    // catálogo escribe, por ejemplo— la pantalla decía "Todavía no hay
    // adjudicaciones en tus sectores". Y eso es mentira: las hay, pero no
    // se han podido leer. El cliente concluye que su sector está parado.
    if (res.error || mov.error) {
      const fallo = res.error || mov.error;
      datos.innerHTML = `
        <div class="aviso mal" style="margin-top:26px">
          No hemos podido cargar los movimientos.
          <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
            ${esc(fallo.message || 'Error desconocido')}</div>
          <div style="margin-top:14px">
            <button class="secundario" id="reintentar">Reintentar</button>
          </div>
        </div>`;
      alPulsar('reintentar', () => cargar());
      return;
    }
    pintarDatos(res.data ?? {}, mov.data ?? []);
  }

  function pintarDatos(r, filas) {
    // Una fila por licitación, con TODOS sus ganadores. `total` es el
    // importe del expediente e `importe` la parte de la principal.
    const lista = filas.map(m => ({
      ...m,
      total: m.total ?? m.importe,
      ganadores: m.ganadores?.length ? m.ganadores : [{
        cif: m.cif, nombre: m.empresa, importe: m.importe, lotes: 1,
        es_mia: m.es_mia, la_sigo: m.la_sigo }],
    }));
    const provincias = r.provincias ?? [];
    const cuantos = Number(r.contratos) || 0;

    function bloqueRanking(filas, titulo, id) {
      if (!filas?.length) return '';
      // Todas las barras ocupan lo mismo: el importe total ya está
      // escrito a la derecha, así que la barra no tiene que repetirlo. Lo
      // que muestra es OTRA cosa: cómo se reparte ese dinero entre sus
      // contratos, y si depende de uno grande o lo tiene repartido.
      //
      // Tres tramos y el resto agrupado. Con diez o quince, los pequeños
      // quedaban en hilos de dos píxeles imposibles de señalar, y uno
      // grande se comía la barra entera.
      return `
        <div class="ranking" data-ranking="${id}">
          <h4>${titulo}</h4>
          <ol>${filas.map((f, i) => {
            const euros_ = Number(f.euros) || 0;
            const tramos = [...(f.tramos ?? [])];
            if (f.resto_n) tramos.push({
              titulo: f.resto_n === 1 ? 'Otro contrato' : `Otros ${f.resto_n} contratos`,
              quien: '', importe: f.resto_importe, agrupado: true,
            });
            return `<li class="${f.es_mia ? 'mia' : f.la_sigo ? 'sigo' : ''}">
              <div class="fila-ranking">
                <span class="cual">${esc(f.nombre)}${
                  f.provincia && id === 'organos'
                    ? `<span class="cuanto"> · ${esc(f.provincia)}</span>` : ''}</span>
                <span class="cuanto">${numero(f.n)} · ${euros_ ? eurosConDetalle(euros_) : 'sin importe'}</span>
              </div>
              <div class="barra-tramos">
                ${tramos.map((c, j) => `<button class="tramo"
                  style="width:${euros_
                    ? (Number(c.importe) || 0) / euros_ * 100
                    // En un acuerdo marco se sabe quién gana pero no
                    // cuánto: tramos iguales, en vez de una barra vacía.
                    : 100 / tramos.length}%;
                         background:${c.agrupado ? COLOR_OTROS : PALETA[(i + j) % PALETA.length]}"
                  data-titulo="${esc(c.titulo ?? '')}"
                  data-quien="${esc(c.quien ?? '')}"
                  data-importe="${esc(euros(Number(c.importe)) ?? '')}"
                  aria-label="${esc(c.titulo ?? '')}"></button>`).join('')}
              </div>
            </li>`;
          }).join('')}</ol>
          <div class="detalle-tramo" data-hueco-ranking>
            <span class="titulo-tramo" style="font-weight:400;color:var(--tenue)">
              Cada barra reparte ese dinero entre sus contratos. Toca o
              pasa por encima de un tramo para ver cuál es.</span>
          </div>
        </div>`;
    }

    // Sin el porcentaje sobre el presupuesto.
    //
    // Medido sobre 263.412 contratos: la media salía en 4.896 % y 100.862
    // estaban por encima del presupuesto. Los dos campos no comparan lo
    // mismo —importes de acuerdos marco frente a presupuestos de
    // contratos basados, lotes sueltos frente al expediente entero— y
    // publicarlo sería peor que no dar el dato: alguien podría calcular
    // una oferta con él.
    //
    // Una línea por contrato, no por compra.
    //
    // Un acuerdo marco de stents publica CADA compra derivada como su
    // propio expediente: salían 41 líneas con el mismo título y distinta
    // empresa. Se agrupan por organismo y título, y el detalle se
    // despliega.
    const grupos = new Map();
    lista.forEach(m => {
      const k = m.grupo || m.id_licitacion;
      if (!grupos.has(k)) grupos.set(k, []);
      grupos.get(k).push(m);
    });

    // Con varios ganadores: la principal "y 12 más". Si entre los demás
    // está tu empresa o una que sigues, se dice cuál y qué se llevó: es
    // lo único de esos doce que le importa.
    const enlaceOrgano = o => o ? `<a href="#" class="enlace-ficha"
      data-a-organismo="${esc(o)}">${esc(o)}</a>` : '';
    const unaLinea = m => {
      const [principal, ...resto] = m.ganadores;
      const destacados = resto.filter(g => g.es_mia || g.la_sigo);
      const marca = principal?.es_mia ? 'tu empresa'
        : principal?.la_sigo ? 'la sigues'
        : m.es_mia ? 'tu empresa entre ellas'
        : m.la_sigo ? 'una que sigues' : '';
      return `<div class="movimiento ${m.es_mia ? 'mia' : m.la_sigo ? 'sigo' : ''}">
        <div>
          <p class="gano">${principal?.cif
            ? `<a href="#" class="enlace-ficha" data-a-mercado="${esc(principal.cif)}">${esc(m.empresa ?? '—')}</a>`
            : esc(m.empresa ?? '—')}${
            resto.length ? ` <span class="cuanto">y ${resto.length} más</span>` : ''}${
            marca ? `<span class="marca-mia">${marca}</span>` : ''}</p>
          <p class="que">${tituloConEnlace(m.titulo, m.enlace)}</p>
          <span class="donde">${enlaceOrgano(m.organo)}${
            m.provincia ? ` · ${esc(m.provincia)}` : ''}</span>
          ${destacados.map(g => `<span class="donde">${
            g.es_mia ? 'Tu empresa' : esc(g.nombre ?? g.cif)}: ${
            plural(g.lotes ?? 1, 'lote', 'lotes')}${
            g.importe ? ` · ${euros(Number(g.importe))}` : ''}</span>`).join('')}
        </div>
        <div class="cifra">
          <strong>${m.total ? euros(Number(m.total)) : '—'}</strong>
          <span class="baja">${esc(fecha(m.fecha))}</span>
        </div>
      </div>`;
    };

    const cuerpo = lista.length ? [...grupos.values()].map(g => {
      if (g.length === 1) return unaLinea(g[0]);

      // Del grupo se enseña la compra más reciente, y el resto debajo.
      const primera = g[0];
      const empresas = new Set(g.flatMap(x => x.ganadores.map(y => y.cif))
        .filter(Boolean)).size;
      const total = g.reduce((s, x) => s + (Number(x.total) || 0), 0);
      const mia = g.some(x => x.es_mia);
      const sigo = g.some(x => x.la_sigo);

      return `<details class="grupo-mov">
        <summary>
          <div>
            <p class="gano">${empresas} ${empresas === 1 ? 'empresa' : 'empresas'}
              ${mia ? '<span class="marca-mia">tu empresa entre ellas</span>'
              : sigo ? '<span class="marca-mia">una que sigues</span>' : ''}</p>
            <p class="que">${esc(primera.titulo ?? '')}</p>
            <span class="donde">${enlaceOrgano(primera.organo)}${
              primera.provincia ? ` · ${esc(primera.provincia)}` : ''}</span>
            <span class="cuantas-veces">${plural(g.length, 'compra', 'compras')}
              <span class="flechita">▾</span></span>
          </div>
          <div class="cifra">
            <strong>${total ? euros(total) : '—'}</strong>
            <span class="baja">${esc(fecha(primera.fecha))}</span>
          </div>
        </summary>
        <div class="dentro">${g.map(unaLinea).join('')}</div>
      </details>`;
    }).join('') : `<p class="vacio">No hay adjudicaciones de tus sectores en
      este periodo${provincia ? ` en ${esc(provincia)}` : ''}.</p>`;

    const cuando = textoPeriodo(periodo, anios);

    // La provincia va ARRIBA, antes de las cifras: es un filtro de todo lo
    // que viene después, y debajo del resumen pasaba por un dato más.
    document.getElementById('datos-mov').innerHTML = `
      ${provincias.length > 1 ? `
        <div class="filtro-provincia">
          <label for="f-provincia">Ver solo</label>
          <select id="f-provincia">
            <option value="">Toda España</option>
            ${provincias.map(pr => `<option value="${esc(pr)}"${
              pr === provincia ? ' selected' : ''}>${esc(pr)}</option>`).join('')}
          </select>
        </div>` : ''}

      <div class="pulso">
        <h4>En tu sector${provincia ? ` · ${esc(provincia)}` : ''} · ${esc(cuando)}</h4>
        <dl>
          <div><dt>Adjudicaciones</dt><dd>${numero(cuantos)}</dd></div>
          <div><dt>Importe total</dt><dd>${
            Number(r.importe) ? eurosConDetalle(r.importe) : '—'}</dd></div>
          <div><dt>Empresas distintas</dt><dd>${numero(r.empresas ?? 0)}</dd></div>
          ${Number(r.importe_mediano) ? `<div><dt>Importe mediano</dt>
            <dd>${euros(Number(r.importe_mediano))}</dd></div>` : ''}
          ${r.mias ? `<div><dt>Las has ganado tú</dt>
            <dd>${numero(r.mias)}</dd></div>` : ''}
          <p class="destacado">Cada contrato cuenta una vez aunque tenga
          varios lotes o varias empresas ganadoras. El importe mediano es el
          del contrato de en medio: la mitad se adjudicó por menos y la
          mitad por más, y unos pocos contratos enormes no lo mueven. Cada
          contrato cuenta en el año en que se formalizó, y los contratos
          menores no entran. En «Quién más ha facturado», cada empresa suma solo su
          parte.</p>
        </dl>
      </div>

      ${(r.por_empresa?.length || r.por_organo?.length) ? `
      <div class="dos-columnas">
        ${bloqueRanking(r.por_empresa, 'Quién más ha facturado', 'empresas')}
        ${bloqueRanking(r.por_organo, 'Quién ha adjudicado más', 'organos')}
      </div>` : ''}

      <div style="margin-top:32px">
        ${cuantos > lista.length ? `<p class="guia" style="font-size:.88rem">
          Las ${numero(lista.length)} adjudicaciones más recientes de ${
          numero(cuantos)}. Las cifras y los rankings de arriba cuentan
          todas.</p>` : ''}
        ${cuerpo}
        ${cuantos > lista.length && topeMov < TECHO_MOV ? `
          <button class="mas" id="mas-mov">Ver ${TANDA_MOV} más
            <span class="flechita">▾</span></button>` : ''}
      </div>`;

    // Antes no había forma de pasar de las 300 más recientes.
    const masMov = document.getElementById('mas-mov');
    if (masMov) masMov.onclick = () => {
      const boton = masMov;
      boton.disabled = true;
      boton.firstChild.textContent = 'Cargando... ';
      topeMov = Math.min(TECHO_MOV, topeMov + TANDA_MOV);
      cargar(true);
    };

    // El nombre de la empresa abre su ficha en Mercado y el del organismo
    // la suya en Organismos. preventDefault evita que, dentro de un grupo
    // desplegable, el clic pliegue o despliegue el resumen.
    document.getElementById('datos-mov').onclick = ev => {
      const e = ev.target.closest('[data-a-mercado]');
      const o = ev.target.closest('[data-a-organismo]');
      if (!e && !o) return;
      ev.preventDefault();
      if (e) {
        irA('mercado', { cif: e.dataset.aMercado });
        pantallaMercado(perfil, session, true, e.dataset.aMercado);
      } else {
        pantallaOrganismos(perfil, session, false, o.dataset.aOrganismo);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
    };

    const selProv = document.getElementById('f-provincia');
    if (selProv) selProv.onchange = () => {
      provincia = selProv.value || null;
      cargar();
    };

    // Cada tramo dice de qué contrato es. Sin esto la barra solo compara
    // tamaños; con esto se puede ir al detalle sin bajar a la lista.
    raiz.querySelectorAll('[data-ranking]').forEach(caja => {
      const hueco = caja.querySelector('[data-hueco-ranking]');
      const reposo = hueco.innerHTML;
      const tramos = [...caja.querySelectorAll('.tramo')];

      const mostrar = t => {
        const contexto = [t.dataset.quien, t.dataset.importe]
          .filter(Boolean).join(' · ');
        hueco.innerHTML =
          `<span class="titulo-tramo">${esc(t.dataset.titulo)}</span>` +
          (contexto ? `<span class="meta-tramo">${esc(contexto)}</span>` : '');
        tramos.forEach(x => x.classList.toggle('activo', x === t));
      };
      const soltar = () => {
        hueco.innerHTML = reposo;
        tramos.forEach(x => x.classList.remove('activo'));
      };

      // Se escucha en la tarjeta entera y no tramo a tramo: así el
      // detalle solo se borra al salir de la tarjeta, no cada vez que el
      // cursor cruza de un tramo al siguiente.
      caja.addEventListener('mouseover', ev => {
        const t = ev.target.closest('.tramo');
        if (t) mostrar(t);
      });
      caja.addEventListener('mouseleave', soltar);
      tramos.forEach(t => {
        t.onfocus = () => mostrar(t);
        t.onclick = () => mostrar(t);
      });
    });
  }

  await cargar();
}

// Topes de tamaño para la competencia: lo que gana la empresa al año en
// contratos públicos (0 = todas). Una pyme no quiere ver primero al líder
// del sector, sino a quien le quita los contratos a su escala. Son los
// mismos que usa `mi_tamano_competencia` para proponer uno a quien entró
// con NIF. De menos a más: son las paradas del deslizador.
const TAMANOS_COMPETENCIA = [500000, 2000000, 10000000, 0];
const textoTamano = t => t ? `Hasta ${eurosRedondos(t)}` : 'Todas';

// El deslizador del tope. Hecho a mano y no con <input type="range">: el
// nativo salta de parada en parada; este sigue al dedo y, al soltar,
// encaja en la más cercana. Para el teclado y los lectores de pantalla es
// un deslizador como cualquier otro (role="slider", flechas, Inicio, Fin).
function htmlTamanos(paso) {
  const ultimo = TAMANOS_COMPETENCIA.length - 1;
  const en = i => `${i / ultimo * 100}%`;
  return `
    <div class="tamanos" style="--pos:${paso / ultimo}">
      <span class="etiqueta-tamanos" id="tamanos-titulo">Lo que ganan al año</span>
      <div class="pista-tamanos">
        <div class="riel">
          <div class="carril"><i class="lleno"></i>${TAMANOS_COMPETENCIA.map((_, i) =>
            `<b style="left:${en(i)}"></b>`).join('')}</div>
          <div class="pulgar" role="slider" tabindex="0"
            aria-labelledby="tamanos-titulo" aria-valuemin="0"
            aria-valuemax="${ultimo}"><span class="globo"></span></div>
        </div>
        <div class="marcas">${TAMANOS_COMPETENCIA.map((t, i) =>
          `<button type="button" tabindex="-1" data-paso="${i}" style="left:${en(i)}"
            >${t ? eurosRedondos(t) : 'Todas'}</button>`).join('')}</div>
      </div>
    </div>`;
}

// `alElegir(tope)` llega un poco después de que el pulgar se pare: con
// varias flechas seguidas, una sola vez, y sin cortar la animación.
function deslizadorTamanos(bloque, inicial, alElegir) {
  const ultimo = TAMANOS_COMPETENCIA.length - 1;
  const riel = bloque.querySelector('.riel');
  const pulgar = bloque.querySelector('.pulgar');
  const globo = bloque.querySelector('.globo');
  const puntos = [...bloque.querySelectorAll('.carril b')];
  const marcas = [...bloque.querySelectorAll('.marcas button')];
  let paso = inicial;
  let espera = null;

  // Pone el pulgar en `pos` (de 0 a 1) y marca la parada más cercana.
  const pintar = pos => {
    const cerca = Math.round(pos * ultimo);
    bloque.style.setProperty('--pos', pos);
    puntos.forEach((b, i) => b.classList.toggle('dentro', i / ultimo <= pos + 1e-6));
    marcas.forEach((b, i) => b.classList.toggle('actual', i === cerca));
    globo.textContent = textoTamano(TAMANOS_COMPETENCIA[cerca]);
  };

  const fijar = i => {
    i = Math.max(0, Math.min(ultimo, i));
    pintar(i / ultimo);
    pulgar.setAttribute('aria-valuenow', i);
    pulgar.setAttribute('aria-valuetext', textoTamano(TAMANOS_COMPETENCIA[i]));
    if (i === paso) return;
    paso = i;
    clearTimeout(espera);
    espera = setTimeout(() => {
      if (bloque.isConnected) alElegir(TAMANOS_COMPETENCIA[paso]);
    }, 300);
  };

  const posDe = ev => {
    const r = riel.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
  };

  // Un toque lleva el pulgar deslizándose hasta la parada; arrastrar lo
  // lleva pegado al dedo y encaja al soltar. Por debajo de 4 px es un
  // toque: un dedo nunca está quieto del todo.
  let inicio = null;
  riel.addEventListener('pointerdown', ev => {
    if (ev.button > 0) return;
    ev.preventDefault();
    inicio = ev.clientX;
    riel.setPointerCapture(ev.pointerId);
    riel.classList.add('con-puntero');
    pulgar.focus({ preventScroll: true });
  });
  riel.addEventListener('pointermove', ev => {
    if (inicio == null) return;
    if (!riel.classList.contains('arrastrando')) {
      if (Math.abs(ev.clientX - inicio) < 4) return;
      riel.classList.add('arrastrando');
    }
    pintar(posDe(ev));
  });
  riel.addEventListener('pointerup', ev => {
    if (inicio == null) return;
    inicio = null;
    riel.classList.remove('arrastrando');
    fijar(Math.round(posDe(ev) * ultimo));
  });
  // Si el navegador se queda el gesto (el dedo se fue hacia arriba para
  // desplazar la página), vuelve a donde estaba.
  riel.addEventListener('pointercancel', () => {
    inicio = null;
    riel.classList.remove('arrastrando');
    fijar(paso);
  });

  pulgar.addEventListener('blur', () => riel.classList.remove('con-puntero'));
  pulgar.addEventListener('keydown', ev => {
    riel.classList.remove('con-puntero');
    const paso1 = { ArrowLeft: -1, ArrowDown: -1, PageDown: -1,
                    ArrowRight: 1, ArrowUp: 1, PageUp: 1 }[ev.key];
    if (paso1) fijar(paso + paso1);
    else if (ev.key === 'Home') fijar(0);
    else if (ev.key === 'End') fijar(ultimo);
    else return;
    ev.preventDefault();
  });
  marcas.forEach((b, i) => b.onclick = () => fijar(i));

  fijar(inicial);
}

async function pantallaMercado(perfil, session, volviendo = false, cif = null) {
  if (!volviendo) irA('mercado');
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Empresas</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('mercado')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién gana en tu sector</h1>
    <p class="guia">Los contratos públicos son datos abiertos: quién los
    gana, por cuánto y de qué organismo. ${perfil.cif ? 'Mira tu propio historial, busca'
      : 'Busca'} una empresa por su nombre o su NIF, o averigua quién se lleva
    los contratos de tus sectores.</p>

    <!-- Por nombre también: casi nadie se sabe el NIF de su competencia. -->
    <div class="buscador-cif">
      <input type="search" id="cif-buscar" placeholder="Nombre o NIF de una empresa"
             autocomplete="off" aria-label="Nombre o NIF de una empresa">
      <button class="principal" id="buscar-cif">Buscar</button>
      ${perfil.cif ? `<button class="secundario" id="ver-mia">Ver mi
        empresa</button>` : ''}
    </div>

    <div class="hueco-periodo" id="periodo-emp"></div>

    <div id="zona" style="margin-top:22px"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'mercado');

  const zona = document.getElementById('zona');
  const campo = document.getElementById('cif-buscar');

  // Ver la propia empresa es la misma acción que buscar otra, así que va
  // junto al buscador y no abajo con las listas.
  alPulsar('ver-mia', () => verEmpresa(perfil.cif));

  // El periodo vale para las listas y para la ficha: al cambiarlo se
  // repinta lo que haya a la vista.
  const [aniosEmp, tam] = await Promise.all([
    aniosDelSector(), pedir('mi_tamano_competencia')]);
  let periodoEmp = periodoGuardado(aniosEmp);
  // El tope de tamaño de la competencia. Si no llega, todas: como antes.
  let topeEmp = Number(tam.data?.tope) || 0;
  let repintarVista = null;
  let repintarSeguimiento = null;
  let vueltaEmp = 0;
  selectorPeriodo(document.getElementById('periodo-emp'), aniosEmp, periodoEmp, p => {
    periodoEmp = p;
    repintarVista?.();
  });
  const cuandoEmp = () => aniosEmp.length ? enPeriodo(periodoEmp, aniosEmp) : '';

  // Mientras llega lo nuevo, lo anterior se atenúa en vez de sustituirse
  // por "Cargando...": así no salta la página al cambiar de periodo.
  const esperando = texto => {
    if (zona.children.length) zona.classList.add('cambiando');
    else zona.innerHTML = `<p class="guia">${texto}</p>`;
  };

  // Cambiar de forma repinta la ficha y guarda la elección para todos los
  // gráficos. Enganchado una sola vez sobre el contenedor, que no se
  // sustituye al redibujar.
  let ultimaEmpresa = null;
  // Qué enseña la ficha: 'contratos' o 'otros' (UTEs y acuerdos marco).
  // Se guarda con el NIF para que sobreviva al cambio de periodo y al de
  // forma de los gráficos, que repintan la ficha entera.
  let vistaFicha = { cif: null, cual: null };
  zona.addEventListener('click', ev => {
    const b = ev.target.closest('[data-forma]');
    if (!b || !ultimaEmpresa) return;
    if (b.getAttribute('aria-pressed') === 'true') return;
    ponerForma(b.dataset.forma);
    pintarFicha(ultimaEmpresa);
  });

  // Elegir un tope se guarda para la próxima vez; si no se puede guardar,
  // vale igual mientras siga en la pantalla. Volver al que ya estaba no
  // guarda nada: así, quien entró con NIF y no ha tocado nada sigue con el
  // que le corresponde si cambia lo que gana.
  const elegirTope = tope => {
    if (tope === topeEmp) return;
    topeEmp = tope;
    sb.rpc('cambiar_tamano_competencia', { tope })
      .then(() => olvidar('mi_tamano_competencia'), () => {});
    verListas({ soloCompetencia: true });
  };

  // ---------- Estado: listas ----------

  // Tres filas a la vista y el resto detrás de un botón.
  const ASOMAN = 3;

  // `soloCompetencia`: al mover el tope solo cambia la lista de
  // competencia. Repintar todo le cortaba la animación al deslizador y le
  // quitaba el foco; así se queda donde está y la lista cambia debajo.
  async function verListas({ soloCompetencia = false } = {}) {
    repintarVista = verListas;
    const turno = ++vueltaEmp;
    const hueco = soloCompetencia ? document.getElementById('lista-competencia') : null;
    if (hueco) hueco.classList.add('cambiando');
    else esperando('Cargando...');
    const [comp, seg] = await Promise.all([
      pedir('competencia_periodo', argsPeriodo(periodoEmp, { tope: topeEmp })),
      hueco ? { data: null, error: null } : pedir('seguimiento_periodo', argsPeriodo(periodoEmp)),
    ]);
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');

    // Un fallo NO se enseña como «no hay empresas».
    //
    // Con `comp.data ?? []`, cualquier error se convertía en una lista
    // vacía y la pantalla afirmaba que el cliente no tiene competencia.
    // Eso no es una pantalla en blanco: es un dato falso.
    if (comp.error || seg.error) {
      const fallo = comp.error || seg.error;
      zona.innerHTML = `<div class="aviso mal">
        No hemos podido cargar las empresas de tu sector.
        <div style="margin-top:10px;font-size:.86rem;color:var(--tenue)">
          ${esc(fallo.message || '')}</div>
        <div style="margin-top:14px">
          <button class="secundario" id="reintentar-emp">Reintentar</button>
        </div></div>`;
      alPulsar('reintentar-emp', verListas);
      return;
    }

    const competencia = comp.data ?? [];
    const seguidas = seg.data ?? [];
    const tope = topeEmp;
    // Un tope que no está entre las paradas (no debería pasar) cae en
    // "Todas", que es lo que la base aplica con 0.
    const ultimo = TAMANOS_COMPETENCIA.length - 1;
    const paso = TAMANOS_COMPETENCIA.includes(tope)
      ? TAMANOS_COMPETENCIA.indexOf(tope) : ultimo;

    // Lo que gana al año va en su columna; en el móvil no cabe y pasa a
    // una línea bajo el nombre.
    const fila = (f, i, sigo) => `<tr data-cif="${esc(f.cif)}"
        class="${i >= ASOMAN ? 'oculta' : ''}" style="--i:${Math.min(i, ASOMAN)}">
        <td class="quien">${esc(f.nombre ?? f.cif)}${eurosRedondos(f.anual) ? `
          <span class="anual-movil">Gana ${eurosRedondos(f.anual)} al año</span>` : ''}</td>
        <td class="num">${f.contratos}</td>
        <td class="num">${f.importe ? euros(Number(f.importe)) : '—'}</td>
        <td class="num anual">${eurosRedondos(f.anual) ?? '—'}</td>
        <td class="fin"><button class="seguir chico" aria-pressed="${sigo}"
          data-seguir="${esc(f.cif)}" data-nombre="${esc(f.nombre ?? f.cif)}"
          >${sigo ? 'Siguiendo' : 'Seguir'}</button></td>
      </tr>`;

    const tabla = (filas, id, todasSeguidas = false) => `
      <table class="tabla" id="${id}">
        <thead><tr><th>Empresa</th><th class="num">Contratos</th>
          <th class="num">Importe</th>
          <th class="num anual" title="Media de lo que ha ganado al año en contratos públicos en los dos últimos años, en todos sus sectores">Gana al año</th>
          <th class="fin"></th></tr></thead>
        <tbody>${filas.map((f, i) =>
          fila(f, i, todasSeguidas || !!f.sigo)).join('')}</tbody>
      </table>
      ${filas.length > ASOMAN ? `<button class="mas" data-tabla="${id}"
        aria-expanded="false"
        data-mas="${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}"
        data-menos="Ver menos">${filas.length - ASOMAN === 1 ? 'Ver la restante' : `Ver las ${filas.length - ASOMAN} restantes`}
        <span class="flechita">▾</span></button>` : ''}`;

    const frase = `Empresas que han ganado contratos de los mismos códigos
      que tú${cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}${tope ? `, solo las
      que ganan hasta ${eurosRedondos(tope)} al año en contratos públicos,
      sumando todos sus sectores` : ''}. Contratos e importe cuentan solo lo
      que han ganado en tus sectores; en su ficha, que se abre al pulsarla,
      está todo lo suyo.`;
    const listaCompetencia = competencia.length ? tabla(competencia, 't-competencia')
      : `<p class="sin-datos">${tope
          ? 'Ninguna empresa de ese tamaño ha ganado contratos de tus sectores en este periodo.'
          : 'No hay adjudicaciones de tus sectores en este periodo.'}</p>`;

    // Solo la competencia: el deslizador y la lista de seguimiento se
    // quedan como están. Si mientras tanto se abrió una ficha, ya no hay
    // hueco y se pinta todo.
    if (hueco?.isConnected) {
      hueco.innerHTML = listaCompetencia;
      hueco.classList.remove('cambiando');
      document.getElementById('frase-competencia').innerHTML = frase;
      document.getElementById('cuantas-competencia').textContent = competencia.length;
      const nueva = hueco.querySelector('.tabla');
      if (nueva) {
        nueva.classList.add('entra');
        // Fuera al terminar: si no, desplegar las restantes las animaría
        // otra vez.
        setTimeout(() => nueva.classList.remove('entra'), 700);
      }
      enlazar(hueco);
      return;
    }

    // La lista de seguimiento se enseña SIEMPRE, aunque esté vacía: si no
    // aparece, nadie descubre que existe.
    const htmlSeguimiento = lista => `
        <h3>Tu lista de seguimiento
          <span class="cuantas">${lista.length || 'vacía'}</span></h3>
        ${lista.length ? tabla(lista, 't-seguimiento', true) : `
          <p class="vacio-seguimiento">Todavía no sigues a ninguna empresa.
          Búscala por su nombre o su NIF, o elígela de la lista de abajo, y
          pulsa <strong>Seguir</strong> para tenerla aquí a mano.</p>`}`;

    // Al seguir una desde la competencia, sube aquí. Antes no se repintaba
    // nada y arriba seguía diciendo "vacía" justo después de "Añadida a tu
    // lista de seguimiento".
    repintarSeguimiento = async () => {
      const caja = document.getElementById('sec-seguimiento');
      if (!caja) return;
      const { data, error } = await pedir('seguimiento_periodo',
        argsPeriodo(periodoEmp), { alVuelo: false });
      if (error || !caja.isConnected) return;
      caja.innerHTML = htmlSeguimiento(data ?? []);
      enlazar(caja);
    };

    zona.innerHTML = `
      <div class="seccion-mercado" id="sec-seguimiento">
        ${htmlSeguimiento(seguidas)}
      </div>

      <div class="seccion-mercado">
        <h3>Quién gana más en tus sectores
          <span class="cuantas" id="cuantas-competencia">${competencia.length}</span></h3>
        <p class="guia" id="frase-competencia"
          style="margin:0 0 14px;font-size:.9rem">${frase}</p>
        ${htmlTamanos(paso)}
        <div id="lista-competencia">${listaCompetencia}</div>
      </div>`;

    deslizadorTamanos(zona.querySelector('.tamanos'), paso, elegirTope);
    enlazar(zona);
  }

  // Filas, botones de seguir y "ver las restantes" de lo que haya dentro de
  // `raiz`: las dos listas, o solo la de competencia al cambiar el tope.
  function enlazar(raiz) {
    raiz.querySelectorAll('tr[data-cif]').forEach(f =>
      f.onclick = ev => {
        // El botón de seguir vive dentro de la fila para que aparezca a su
        // altura; hay que evitar que su clic abra además la ficha.
        if (ev.target.closest('[data-seguir]')) return;
        verEmpresa(f.dataset.cif);
      });

    raiz.querySelectorAll('[data-seguir]').forEach(b => b.onclick = async () => {
      // Quieto mientras responde el servidor: `seguir` alterna, así que
      // un doble clic seguía y dejaba de seguir.
      if (b.disabled) return;
      const antes = b.getAttribute('aria-pressed') === 'true';
      // Se pinta al instante y se corrige si el servidor dice otra cosa.
      b.setAttribute('aria-pressed', String(!antes));
      b.textContent = !antes ? 'Siguiendo' : 'Seguir';
      b.disabled = true;
      try {
        // Supabase no lanza: devuelve `{ error }`. Sin mirarlo, un fallo
        // acababa en "Quitada de tu lista de seguimiento".
        const { data, error } = await sb.rpc('seguir', {
          cif_empresa: b.dataset.seguir, nombre_empresa: b.dataset.nombre });
        if (error) throw error;
        b.disabled = false;
        b.setAttribute('aria-pressed', String(!!data));
        b.textContent = data ? 'Siguiendo' : 'Seguir';
        recado(data
          ? 'Añadida a tu lista de seguimiento'
          : 'Quitada de tu lista de seguimiento');
        olvidar('seguimiento_periodo', 'competencia_periodo',
                'movimientos_periodo', 'resumen_periodo');

        // Al seguirla desde la competencia, su fila se va: ya está arriba
        // en la lista de seguimiento y saldría dos veces. Si deja de
        // seguirla, vuelve a aparecer al recargar.
        //
        // Dejar de seguir desde la propia lista de seguimiento NO la
        // repinta: la fila se iría de debajo del cursor. Se pone al día al
        // volver a entrar.
        const enCompetencia = b.closest('#t-competencia');
        if (data && enCompetencia) {
          const suya = b.closest('tr');
          // Se descubre la siguiente oculta para que sigan viéndose tres.
          const escondida = enCompetencia.querySelector('tbody tr.oculta');
          if (escondida) escondida.classList.remove('oculta');
          suya.remove();
          const cuenta = document.getElementById('cuantas-competencia');
          if (cuenta) cuenta.textContent = enCompetencia.querySelectorAll('tbody tr').length;
          repintarSeguimiento?.();
        }
      } catch {
        b.disabled = false;
        b.setAttribute('aria-pressed', String(antes));
        b.textContent = antes ? 'Siguiendo' : 'Seguir';
        recado('No se ha podido guardar. Inténtalo de nuevo.');
      }
    });

    // Alterna: se puede volver a cerrar. Antes el botón desaparecía al
    // pulsarlo y la lista se quedaba abierta para siempre.
    raiz.querySelectorAll('[data-tabla]').forEach(b => {
      const filas = [...document.getElementById(b.dataset.tabla)
        .querySelectorAll('tbody tr')];
      b.onclick = () => {
        const abierto = b.getAttribute('aria-expanded') === 'true';
        filas.forEach((t, i) => t.classList.toggle('oculta', abierto && i >= ASOMAN));
        b.setAttribute('aria-expanded', String(!abierto));
        b.firstChild.textContent = abierto
          ? b.dataset.mas + ' ' : b.dataset.menos + ' ';
      };
    });
  }

  // ---------- Estado: ficha ----------
  //
  // Deja marca en el historial: sin ella, atrás salía de Mercado entero
  // en vez de devolver a las listas.
  //
  // `desde` es el nombre de la ficha en la que se pulsó el enlace (un socio,
  // una UTE): queda en el historial para que el botón de volver diga
  // adónde vuelve.
  async function verEmpresa(cif, restaurando = false, desde = null) {
    if (!restaurando) {
      irA('mercado', { cif, ...(desde ? { desde } : {}) });
      // Cada ficha nueva empieza en su vista por defecto (ver pintarFicha).
      vistaFicha = { cif: null, cual: null };
    }
    repintarVista = () => verEmpresa(cif, true);
    // El buscador enseña el NIF de la ficha abierta: al llegar por un
    // enlace se quedaba con el de la anterior.
    campo.value = cif;
    const turno = ++vueltaEmp;
    esperando('Buscando...');
    // Las UTEs van aparte (utes_y_socios, 20261001120000) y en paralelo:
    // si fallan, la ficha sale igual, sin esa sección.
    const [{ data, error }, { data: utes }] = await Promise.all([
      sb.rpc('ficha_empresa', { cif_buscado: cif, ...argsPeriodo(periodoEmp) }),
      UTES_VISIBLE
        ? sb.rpc('utes_y_socios', { cif_buscado: cif, ...argsPeriodo(periodoEmp) })
        : { data: null },
    ]);
    if (turno !== vueltaEmp) return;
    zona.classList.remove('cambiando');
    if (data) {
      data.utes = utes?.utes ?? [];
      data.socios = utes?.socios ?? [];
      // La lista llega cortada en 30; el total, aparte.
      data.n_utes = Math.max(utes?.n_utes ?? 0, data.utes.length);
    }
    // Una empresa que en el periodo solo está homologada en acuerdos
    // marco, o que solo ha ganado en UTE, no tiene contratos propios,
    // pero sí algo que enseñar.
    if (error || !data || (!data.contratos && !data.marcos?.length
                           && !data.utes.length && !data.socios.length)) {
      // Con nombre es que existe y ha ganado algo, pero no en este
      // periodo: decir "no hemos encontrado ese NIF" sería falso.
      zona.innerHTML = `
        <button class="volver-listas" id="volver-listas">${textoVolver()}</button>
        <div class="aviso">${data?.nombre
          ? `${esc(data.nombre)} no tiene contratos adjudicados
             ${esc(cuandoEmp())}. Prueba con otro periodo.`
          : `No hemos encontrado contratos adjudicados con ese NIF. Puede
             que no haya ganado ninguno todavía.`}</div>`;
      alPulsar('volver-listas', () => history.back());
      return;
    }
    pintarFicha(data);
    // Al abrir otra ficha, arriba: si no, desde el final de una ficha
    // larga se caía en mitad de la nueva sin ver su nombre. Al cambiar de
    // periodo (restaurando) se queda donde estaba.
    // Al instante: la página tiene desplazamiento suave, y deslizarse
    // medio segundo por encima de la ficha nueva parece otro salto.
    if (!restaurando) window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // Con `desde` en el historial se vuelve a la ficha anterior, no a las
  // listas, y el botón lo dice.
  const textoVolver = () => history.state?.desde
    ? `← Volver a ${esc(history.state.desde)}` : '← Volver a las listas';

  function pintarFicha(e) {
    const sectores = e.sectores ?? [];
    // La base trae los 8 con más contratos, pero los empates (todos con uno,
    // a menudo) llegaban en cualquier orden: a igualdad, el de más importe.
    const organos = [...(e.organos ?? [])].sort((a, b) =>
      (b.contratos - a.contratos) || ((Number(b.importe) || 0) - (Number(a.importe) || 0)));
    const ultimos = e.ultimos ?? [];
    const marcos = e.marcos ?? [];
    const utes = e.utes ?? [];
    const socios = e.socios ?? [];
    const nUtes = Math.max(e.n_utes ?? 0, utes.length);
    const raros = nUtes + marcos.length;

    // Por defecto, sus contratos. Si en el periodo no tiene ninguno pero sí
    // UTEs o acuerdos marco, se abre en esos: una vista vacía no enseña nada.
    // Al volver atrás a esta ficha, la vista que se dejó (va en el historial).
    if (vistaFicha.cif !== e.cif || !vistaFicha.cual) {
      const guardada = history.state?.cif === e.cif ? history.state.vistaFicha : null;
      vistaFicha = { cif: e.cif,
        cual: guardada ?? (!e.contratos && raros ? 'otros' : 'contratos') };
    }
    const vista = raros ? vistaFicha.cual : 'contratos';

    // Otra empresa que se abre al pulsar: solo el nombre, con aspecto de
    // enlace. `desde` deja dicho en el historial de dónde se viene.
    const enlaceEmpresa = (cif, nombre) => `<a href="#" class="enlace-ficha"
      data-ver-cif="${esc(cif)}">${esc(nombre ?? cif)}</a>`;
    const yLista = enumerar;
    const etiquetaRaros = utes.length && marcos.length ? 'UTEs y acuerdos marco'
      : utes.length ? 'UTEs' : 'Acuerdos marco';
    const resumenRaros = yLista([
      nUtes ? plural(nUtes, 'UTE', 'UTEs') : '',
      marcos.length ? plural(marcos.length, 'acuerdo marco', 'acuerdos marco') : '',
    ].filter(Boolean));
    const titulo = t => `<h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">${t}</h4>`;

    zona.innerHTML = `
      <button class="volver-listas" id="volver-listas">${textoVolver()}</button>
      <div class="tarjeta-empresa" style="margin-top:8px">
        <div class="arriba">
          <div>
            <h3>${esc(e.nombre ?? e.cif)}</h3>
            ${socios.length ? `
              <p class="cifras" style="margin-top:-2px">
                <span>UTE formada por ${yLista(socios.map(s => enlaceEmpresa(s.cif, s.nombre)))}
                  <span style="color:var(--tenue)" title="Sacados del nombre de la UTE.
Cuánto le toca a cada socio no se publica.">· puede haber más socios</span></span>
              </p>` : ''}
            <p class="cifras">
              ${!e.contratos && raros
                // Solo UTEs o acuerdos marco: "0 contratos" sería cierto,
                // pero parece que la ficha está vacía.
                ? `<span>Sin contratos propios${cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}
                    · ${esc(resumenRaros)}</span>`
                : `<span><strong>${e.contratos}</strong> ${e.contratos === 1 ? 'contrato' : 'contratos'}${
                e.lotes > e.contratos ? ` (${e.lotes} lotes)` : ''}${
                cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}</span>`}
              ${e.importe ? `<span><strong>${euros(Number(e.importe))}</strong>
                adjudicados</span>` : ''}
              ${e.ultimo ? `<span>último en ${esc(new Date(e.ultimo)
                .toLocaleDateString('es-ES', {timeZone:ZONA, month:'long',
                year:'numeric'}))}</span>` : ''}
            </p>
          </div>
          ${e.cif === perfil.cif ? '' : `
            <button class="seguir" id="seguir" aria-pressed="${!!e.sigo}"
                    data-cif="${esc(e.cif)}" data-nombre="${esc(e.nombre ?? e.cif)}">
              ${e.sigo ? 'Siguiendo' : 'Seguir'}</button>`}
        </div>

        ${raros ? `
          <div class="forma vista-ficha" role="group" aria-label="Qué enseñar de esta empresa">
            <button data-vista="contratos"
              aria-pressed="${vista === 'contratos'}">Contratos</button>
            <button data-vista="otros"
              aria-pressed="${vista === 'otros'}">${etiquetaRaros} · ${raros}</button>
          </div>` : ''}

        ${vista === 'contratos' ? `
          ${!e.contratos ? `<p class="sin-datos">Sin contratos propios${
            cuandoEmp() ? ` ${esc(cuandoEmp())}` : ''}.</p>` : ''}

        ${sectores.length ? `
          <div style="display:flex;align-items:center;margin-bottom:6px">
            <div class="forma" role="group" aria-label="Forma de los gráficos">
              <button data-forma="barras"
                aria-pressed="${formaActual() !== 'quesito'}">Barras</button>
              <button data-forma="quesito"
                aria-pressed="${formaActual() === 'quesito'}">Circular</button>
            </div>
          </div>
          <div style="margin-bottom:26px">${reparto(sectores, 'sector')}</div>` : ''}

        ${organos.length ? `
          <h4 style="margin:0 0 12px;font-size:.83rem;font-weight:650;
                     color:var(--tenue);letter-spacing:.05em;
                     text-transform:uppercase">${organos.length >= 8
                       // La base corta en 8: con 14 contratos y 8 organismos
                       // parecía que faltaban cifras.
                       ? 'Los 8 organismos a los que más vende' : 'A quién le vende'}</h4>
          <table class="tabla"><tbody>
            ${organos.map(o => `<tr style="cursor:default">
              <td class="quien"><a href="#" class="enlace-ficha"
                data-a-organismo="${esc(o.organo)}">${esc(o.organo)}</a></td>
              <td class="num">${o.contratos}</td>
              <td class="num">${o.importe ? euros(Number(o.importe))
                // Corto: la columna mide 112 px (92 en el móvil) y no parte
                // líneas. El porqué va en el texto flotante.
                : `<span style="color:var(--tenue)" title="${SIN_IMPORTE}">sin importe</span>`}</td>
            </tr>`).join('')}
          </tbody></table>` : ''}

        ${ultimos.length ? `
          <h4 style="margin:26px 0 4px;font-size:.83rem;font-weight:650;
