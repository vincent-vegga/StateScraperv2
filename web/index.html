// quiere ver casi siempre.
//
// Los años los da la base (`anios_de_mi_sector`): los que tienen datos
// de verdad en los sectores de la empresa. Al importar más histórico
// aparecen solos.
const CACHE_ANIOS = new Map();

async function aniosDelSector() {
  const clave = perfilActivoId;
  if (CACHE_ANIOS.has(clave)) return CACHE_ANIOS.get(clave);
  const { data, error } = await sb.rpc('anios_de_mi_sector');
  const anios = error ? [] : (data ?? []);
  if (!error) CACHE_ANIOS.set(clave, anios);
  return anios;
}

function periodoGuardado(anios) {
  const ultimo = anios.at(-1)?.anio ?? null;
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem('periodo:' + perfilActivoId)); }
  catch { /* modo privado o dato roto */ }
  const existe = a => anios.some(x => x.anio === a);
  if (p && existe(p.desde) && existe(p.hasta) && p.desde <= p.hasta) return p;
  return { desde: ultimo, hasta: ultimo };
}

function guardarPeriodo(p) {
  try { sessionStorage.setItem('periodo:' + perfilActivoId, JSON.stringify(p)); }
  catch { /* se usa igual, solo que no se recuerda */ }
}

// Los argumentos siempre en el mismo orden: `pedir` guarda por ellos, y
// con otro orden la misma consulta se pediría dos veces.
const argsPeriodo = (p, extra = {}) => ({ desde: p.desde, hasta: p.hasta, ...extra });

// Para meterlo dentro de una frase: "66 contratos en 2025", "entre 2024
// y 2025", "en todo el histórico (2024–2026)".
// El año en curso está a medias, y por defecto es el que se enseña: sin
// decirlo, "2 contratos en 2026" en octubre parece un organismo parado.
const anioEnCurso = () => Number(new Intl.DateTimeFormat('en-CA',
  {timeZone:ZONA, year:'numeric'}).format(new Date()));

function enPeriodo(p, anios) {
  if (p.desde == null) return '';
  if (p.desde === p.hasta)
    return p.desde === anioEnCurso() ? `en lo que va de ${p.desde}` : `en ${p.desde}`;
  const todos = anios.length > 1 && p.desde === anios[0].anio
    && p.hasta === anios.at(-1).anio;
  return todos ? `en todo el histórico (${p.desde}–${p.hasta})`
               : `entre ${p.desde} y ${p.hasta}`;
}

function textoPeriodo(p, anios) {
  if (p.desde === p.hasta)
    return p.desde === anioEnCurso() ? `${p.desde} · hasta hoy` : String(p.desde);
  const todos = anios.length > 1 && p.desde === anios[0].anio
    && p.hasta === anios.at(-1).anio;
  return `${todos ? 'Todos los años · ' : ''}${p.desde}–${p.hasta}`;
}

// El selector: los años en fila, como tramos de una misma barra.
//
// Pulsar un año lo elige solo a él; arrastrar de un año a otro (o
// pulsar otro con mayúsculas) elige el tramo entre los dos. Así elegir
// un solo año es lo más fácil, no un caso raro de un control de dos
// asas en el que las dos asas se pisan.
//
// La barrita de cada año dice cuánto hay en él: con el histórico a
// medio cargar, un año con poco no es un año sin actividad, y conviene
// verlo antes de sacar conclusiones.
//
// `volumen` (opcional) cambia lo que miden las barritas, por ejemplo
// los contratos de un organismo en vez de los del sector.
function selectorPeriodo(hueco, anios, periodo, alCambiar, volumen = null) {
  if (!hueco || !anios.length) return;
  const cuanto = a => (volumen ? volumen[a.anio] : a.contratos) ?? 0;
  const maximo = Math.max(1, ...anios.map(cuanto));
  // Lo del sector cuenta filas de adjudicación (un lote, un adjudicatario),
  // no contratos: llamarlo "contratos" no cuadraba con Movimientos, que
  // cuenta cada expediente una vez aunque tenga varios lotes.
  const cuantoTxt = a => volumen
    ? plural(numero(cuanto(a)), 'contrato', 'contratos')
    : plural(numero(cuanto(a)), 'adjudicación registrada', 'adjudicaciones registradas');
  const tactil = matchMedia('(hover:none),(pointer:coarse)').matches;
  let actual = { ...periodo };

  hueco.innerHTML = `
    <div class="periodo">
      <div class="pista-periodo" role="group" aria-label="Años del periodo">
        ${anios.map(a => `<button type="button" class="anio" data-anio="${a.anio}"
            aria-label="${a.anio}: ${cuantoTxt(a)}" title="${cuantoTxt(a)} en ${a.anio}">
          <span class="volumen"><i style="height:${
            Math.max(8, Math.round(cuanto(a) / maximo * 100))}%"></i></span>
          <span class="numero">${a.anio}</span></button>`).join('')}
      </div>
      <div class="lado-periodo">
        <strong class="resumen-periodo"></strong>
        <span class="ayuda-periodo">${anios.length < 2 ? 'Todo el histórico disponible'
          : tactil ? 'Toca un año, o desliza por varios'
          : 'Pulsa un año, o arrastra por varios'}</span>
        ${anios.length > 1 ? `<button type="button" class="todos-periodo">
          Todos los años</button>` : ''}
      </div>
    </div>`;

  const pista = hueco.querySelector('.pista-periodo');
  const botones = [...pista.querySelectorAll('.anio')];
  const resumen = hueco.querySelector('.resumen-periodo');
  const todos = hueco.querySelector('.todos-periodo');

  const pintar = p => {
    botones.forEach(b => {
      const a = +b.dataset.anio;
      const dentro = a >= p.desde && a <= p.hasta;
      b.classList.toggle('dentro', dentro);
      b.classList.toggle('inicio', a === p.desde);
      b.classList.toggle('fin', a === p.hasta);
      b.setAttribute('aria-pressed', String(dentro));
    });
    resumen.textContent = textoPeriodo(p, anios);
    if (todos) todos.hidden = p.desde === anios[0].anio && p.hasta === anios.at(-1).anio;
  };

  const elegir = p => {
    pintar(p);
    if (p.desde === actual.desde && p.hasta === actual.hasta) return;
    actual = p;
    guardarPeriodo(p);
    alCambiar(p);
  };

  // Punteros y no clics: con el ratón y con el dedo es el mismo gesto, y
  // el año bajo el puntero se busca por coordenadas, que siguen valiendo
  // aunque el puntero esté capturado por la pista.
  const anioBajo = ev => {
    const b = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.anio');
    return b && pista.contains(b) ? +b.dataset.anio : null;
  };
  let ancla = null, extremo = null;
  const tramo = () => ({ desde: Math.min(ancla, extremo), hasta: Math.max(ancla, extremo) });

  pista.addEventListener('pointerdown', ev => {
    const a = anioBajo(ev);
    if (a == null || ev.button > 0) return;
    ev.preventDefault();
    // Con mayúsculas se alarga lo elegido desde el extremo más lejano.
    ancla = ev.shiftKey
      ? (a < actual.desde ? actual.hasta : actual.desde)
      : a;
    extremo = a;
    pista.setPointerCapture(ev.pointerId);
    pintar(tramo());
  });
  pista.addEventListener('pointermove', ev => {
    if (ancla == null) return;
    const a = anioBajo(ev);
    if (a != null && a !== extremo) { extremo = a; pintar(tramo()); }
  });
  const soltar = ev => {
    if (ancla == null) return;
    const p = tramo();
    ancla = extremo = null;
    if (ev.type === 'pointercancel') pintar(actual); else elegir(p);
  };
  pista.addEventListener('pointerup', soltar);
  pista.addEventListener('pointercancel', soltar);

  // Con el teclado: Intro elige el año, y con mayúsculas alarga.
  // `detail === 0` es un clic que no viene del puntero.
  botones.forEach(b => b.addEventListener('click', ev => {
    if (ev.detail !== 0) return;
    const a = +b.dataset.anio;
    elegir(ev.shiftKey
      ? { desde: Math.min(a, actual.desde), hasta: Math.max(a, actual.hasta) }
      : { desde: a, hasta: a });
  }));
  pista.addEventListener('keydown', ev => {
    if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
    const i = botones.indexOf(document.activeElement);
    const j = i + (ev.key === 'ArrowLeft' ? -1 : 1);
    if (i >= 0 && botones[j]) { ev.preventDefault(); botones[j].focus(); }
  });

  if (todos) todos.onclick = () =>
    elegir({ desde: anios[0].anio, hasta: anios.at(-1).anio });

  pintar(actual);
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// El título de un contrato como enlace a su expediente en la plataforma
// de contratación, en otra pestaña. Si no hay un enlace utilizable, el
// título queda como texto: sin http(s), con restos de concatenación o el
// de Madrid que no lleva identificador (solo es la portada).
function tituloConEnlace(titulo, enlace) {
  const t = esc(titulo ?? '');
  const ok = /^https?:\/\//i.test(enlace ?? '')
    && !String(enlace).includes("' || '")
    && !/\/contrato-publico\/?$/.test(enlace);
  return ok
    ? `<a class="enlace-expediente" href="${esc(enlace)}" target="_blank"
         rel="noopener noreferrer" title="Abrir el expediente en la plataforma de contratación">${t}<span class="externo" aria-hidden="true"> ↗</span><span class="solo-lector"> (se abre en otra pestaña)</span></a>`
    : t;
}
// `useGrouping: 'always'`: en español, Intl no separa los miles de los
// números de cuatro cifras por defecto, y salía "3524 €" al lado de
// "12.583 €" en la misma lista.
const euros = n => n == null ? null : new Intl.NumberFormat('es-ES',
  {style:'currency',currency:'EUR',maximumFractionDigits:0,
   useGrouping:'always'}).format(n);
// Cifras sueltas ("1.831 adjudicaciones") con el mismo criterio que los
// euros: sin `useGrouping: 'always'` salía "1831" al lado de "12.583".
const numero = n => new Intl.NumberFormat('es-ES', {useGrouping:'always'})
  .format(Number(n) || 0);
// Importes muy grandes, para leerlos de un vistazo: "3.563 M€" en vez de
// "3.563.165.513 €". La cifra exacta va en el texto flotante.
const eurosCortos = n => {
  const v = Number(n);
  if (!(v >= 1e7)) return euros(v);
  return `${new Intl.NumberFormat('es-ES', {maximumFractionDigits:0,
    useGrouping:'always'}).format(v / 1e6)} M€`;
};
const eurosConDetalle = n => {
  const corto = eurosCortos(n), largo = euros(Number(n));
  return corto === largo ? corto : `<span title="${esc(largo)}">${corto}</span>`;
};
// Para buscar como busca la gente: sin tildes y sin mayúsculas.
const sinTildes = s => String(s ?? '')
  .normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
// Lo que alguien escribe en un buscador se compara palabra a palabra, y no
// como un solo trozo: "ayuntamiento malaga" tiene que encontrar "Junta de
// Gobierno del Ayuntamiento de Málaga" aunque falte el "de".
//
// Y el nombre del organismo va en la lengua de quien lo publica: quien
// escribe "ayuntamiento" también busca "Ajuntament", "Concello" o "Udala".
const EQUIVALENTES = [
  ['ayuntamiento', 'ajuntament', 'concello', 'udala', 'ayto'],
  ['diputacion', 'diputacio', 'deputacion', 'aldundia'],
  ['consejeria', 'conselleria', 'departament', 'departamento'],
  ['generalitat', 'generalidad'],
];
function coincide(texto, consulta) {
  const donde = sinTildes(texto);
  return sinTildes(consulta).split(/\s+/).filter(Boolean).every(palabra => {
    // Con cuatro letras como mínimo: "de" empieza igual que "deputacion"
    // y convertía cualquier búsqueda en una de diputaciones.
    const familia = palabra.length >= 4 && EQUIVALENTES.find(f =>
      f.some(x => x.startsWith(palabra) || palabra.startsWith(x)));
    return familia ? familia.some(x => donde.includes(x)) || donde.includes(palabra)
                   : donde.includes(palabra);
  });
}
// Lo que gana una empresa al año, redondeado: es una media de dos años y
// con todas las cifras parecería exacta.
function eurosRedondos(n) {
  const v = Number(n);
  if (!(v > 0)) return null;
  if (v >= 1e6) return new Intl.NumberFormat('es-ES',
    {maximumFractionDigits: v < 1e7 ? 1 : 0}).format(v / 1e6) + ' M€';
  return v < 1000 ? 'menos de 1.000 €' : euros(Math.round(v / 1000) * 1000);
}
const ZONA = 'Europe/Madrid';

// Duración de un contrato y lo que sale por año. El importe adjudicado es
// el de TODO el contrato: un servicio a doce años por 448 M€ son unos
// 37 M€ al año. Solo se calcula cuando el organismo publicó la duración
// y pasa de un año; con menos, "por año" sería mayor que el total.
function duracionTxt(meses) {
  const m = Number(meses);
  if (!(m > 0)) return null;
  if (m < 1) { const d = Math.max(1, Math.round(m * 30.44));
               return `${d} ${d === 1 ? 'día' : 'días'}`; }
  if (m >= 12 && Math.abs(m / 12 - Math.round(m / 12)) < 0.05) {
    const a = Math.round(m / 12); return `${a} ${a === 1 ? 'año' : 'años'}`; }
  const n = Math.round(m); return `${n} ${n === 1 ? 'mes' : 'meses'}`;
}
// "A", "A y B", "A, B y C".
const enumerar = xs => xs.length < 2 ? xs.join('')
  : `${xs.slice(0, -1).join(', ')} y ${xs.at(-1)}`;

// Una UTE se reconoce por su NIF (empieza por U), por su nombre, o porque
// conocemos sus socios (ute_socios). Muchas llegan con un número en vez de
// NIF y solo el nombre lo dice.
const esUte = (cif, nombre, socios) => /^U\d{8}$/.test(cif ?? '')
  || /\bUTE\b|U\.T\.E|UNI[OÓ]N? TEMPORAL/i.test(nombre ?? '') || !!socios?.length;

function importeAnualTxt(importe, meses) {
  const i = Number(importe), m = Number(meses);
  return i > 0 && m > 12 ? `≈ ${euros(i / (m / 12))}/año` : null;
}

// ------------------------------------------------------------
// VIABILIDAD (fuera del cajón el 04/10/2026)
//
// Se escondió el 20/09/2026 porque "convocatoria anterior" era
// cualquier contrato del mismo órgano y CPV con el título parecido al
// 40 %: en grupos grandes pasaba el 90 %, y decía "X ha ganado 8 de
// las últimas 10 convocatorias" de diez contratos distintos.
//
// Ahora la serie de un contrato (`serie_de` en la base) pesa cada
// palabra por lo rara que es en ese organismo, exige 0,6 de
// semejanza, deja fuera las obras (no se repiten) y los contratos
// paralelos (muchos casi iguales a la vez, por centros o zonas), y
// cuenta las convocatorias desiertas. "De este contrato" solo se dice
// con serie; sin ella se habla del organismo. Ver
// supabase/migrations/20261004120000_viabilidad_por_series.sql.
//
// Apagado, la pestaña, el botón "Analizar viabilidad" y la vuelta a
// la pantalla al recargar desaparecen; no se borra nada.
// ------------------------------------------------------------
const VIABILIDAD_VISIBLE = true;
// UTEs en la ficha de empresa (decisión 42). Apagadas el 01/10/2026 (el
// enlace a otra ficha no subía la página y la ficha de la UTE no decía
// arriba que lo era) y encendidas el 02/10 con el interruptor
// "Contratos / UTEs y acuerdos marco". Apagado, la ficha es la de antes
// de las UTEs: ni siquiera se llama a utes_y_socios.
const UTES_VISIBLE = true;
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// Todas las fechas en hora peninsular, sea cual sea la del visitante: un
// plazo que vence a las 23:59 aparecería un día después para quien lo
// consulte desde otro huso, y alguien podría presentarse tarde.
const partes = iso => {
  const v = {};
  new Intl.DateTimeFormat('es-ES', {timeZone:ZONA, day:'numeric', month:'numeric',
    year:'numeric', hour:'2-digit', minute:'2-digit'})
    .formatToParts(new Date(iso)).forEach(p => v[p.type] = p.value);
  return v;
};
// "1 oct 2026", con las mismas abreviaturas que la lista de contratos:
// `toLocaleDateString` pone "sept", y en una pantalla salía "sep" y en la
// otra "sept".
const fechaCorta = iso => {
  if (!iso) return '';
  const p = partes(iso);
  return `${p.day} ${MESES[+p.month - 1]} ${p.year}`;
};
// Días de CALENDARIO peninsular, no tramos de 24 horas. Dividiendo la
// diferencia en milisegundos, un plazo de mañana a las 10:00 consultado
// hoy a las 20:00 daba 0 y la fila decía "22 sep · hoy": por la tarde
// fallaba en la mitad de la lista.
//
// Un plazo que ya ha pasado es vencido aunque sea de hoy: contado por
// calendario saldría "hoy" cuando ya no se puede presentar nada.
const diaPeninsular = d => new Intl.DateTimeFormat('en-CA',
  {timeZone:ZONA, year:'numeric', month:'2-digit', day:'2-digit'}).format(d);
// Un plazo a las 00:00 en punto es el final del día ANTERIOR. Casi siempre
// es un organismo que publicó solo la fecha, sin hora, y el lector la deja
// a medianoche. Contado tal cual, la fila decía "5 oct · mañana" cuando lo
// que había era hasta esta noche: alguien podía dejarlo para el día
// siguiente y llegar tarde. Se cuenta como las 23:59 del día de antes, que
// es lo que vale de verdad.
const esMedianoche = iso => {
  const p = partes(iso);
  // "24" lo devuelven algunos navegadores para la medianoche.
  return (p.hour === '00' || p.hour === '24') && p.minute === '00';
};
const plazoEfectivo = iso => esMedianoche(iso)
  ? new Date(new Date(iso).getTime() - 60_000).toISOString() : iso;
const diasHasta = iso => {
  if (!iso) return null;
  const plazo = new Date(plazoEfectivo(iso)), ahora = new Date();
  if (plazo < ahora) return -1;
  // Las dos fechas se leen como medianoche UTC, así que la resta es un
  // número exacto de días, sin horario de verano de por medio.
  return Math.round((Date.parse(diaPeninsular(plazo))
    - Date.parse(diaPeninsular(ahora))) / 86400000);
};

// Trae las empresas de la cuenta y devuelve la activa: la que recuerda
// este dispositivo si sigue existiendo, y si no la más antigua.
async function cargarPerfil(session) {
  const { data, error } = await sb.from('perfiles').select('*')
    .eq('usuario_id', session.user.id)
    .order('fecha_alta').order('id').limit(TOPE_EMPRESAS);
  if (error) throw error;
  PERFILES = data ?? [];
  const perfil = PERFILES.find(p => p.id === perfilActivoId) ?? PERFILES[0];
  fijarEmpresa(perfil?.id ?? null);
  return perfil;
}

function fijarEmpresa(id) {
  if (id !== perfilActivoId) {
    // Lo guardado es de la otra empresa: enseñarlo, aunque fuera un
    // instante, sería mostrar los contratos de una sociedad bajo el
    // nombre de otra.
    CACHE.clear();
    refrescarListaAbierta = null;
  }
  perfilActivoId = id;
  try {
    if (id) localStorage.setItem('empresa-activa', id);
    else localStorage.removeItem('empresa-activa');
  } catch { /* modo privado: vale para esta visita */ }
}

async function cambiarEmpresa(id) {
  if (id === perfilActivoId) return;
  fijarEmpresa(id);
  arrancar();
}

async function irAAvisos() {
  const { data: { session } } = await sb.auth.getSession();
  const perfil = PERFILES.find(p => p.id === perfilActivoId);
  if (session && perfil) pantallaPanel(perfil, session, false, 'avisos');
}

async function anadirEmpresa() {
  const { data, error } = await sb.rpc('nueva_empresa');
  if (error || !data?.ok) {
    recado(data?.error === 'tope_empresas'
      ? `De momento se pueden llevar ${TOPE_EMPRESAS} empresas por cuenta`
      : 'No se ha podido añadir. Inténtalo de nuevo.');
    return;
  }
  cambiarEmpresa(data.perfil_id);
}

const nombreEmpresa = p => p.empresa || (p.paso_alta === 'listo'
  ? (p.email || 'Tu empresa') : 'Empresa nueva, sin terminar');

// Donde iba el nombre de la empresa, bajo el título. Con una sola se
// queda como siempre; con varias se convierte en el selector.
function cabeceraEmpresa(perfil) {
  if (PERFILES.length <= 1)
    return `<div class="quien">${esc(perfil.empresa || perfil.email || '')}</div>`;
  const quedan = PERFILES.length < TOPE_EMPRESAS;
  return `
    <div class="menu-envoltorio selector-empresa">
      <button class="boton-empresa" id="abrir-empresas" aria-haspopup="true"
              aria-expanded="false">
        <span class="nombre">${esc(nombreEmpresa(perfil))}</span><span class="flechita">▾</span>
      </button>
      <div class="menu menu-empresas" id="menu-empresas" role="menu" hidden>
        ${PERFILES.map(p => `
          <button role="menuitemradio" data-empresa="${esc(p.id)}"
                  aria-checked="${p.id === perfil.id}">
            <span class="nombre">${esc(nombreEmpresa(p))}</span>
            ${p.cif ? `<span class="nif">${esc(p.cif)}</span>` : ''}
          </button>`).join('')}
        <div class="separa"></div>
        ${quedan
          ? `<button role="menuitem" data-anadir-empresa>+ Añadir empresa
               <span class="nif">${PERFILES.length} de ${TOPE_EMPRESAS}</span></button>`
          : `<p class="tope">Máximo de ${TOPE_EMPRESAS} empresas por cuenta</p>`}
      </div>
    </div>`;
}

// Delegado y una sola vez: las cabeceras se repintan en cada pantalla y
// así no hay que acordarse de activar el selector en cada una.
document.addEventListener('click', ev => {
  const abrir = ev.target.closest('#abrir-empresas');
  const menu = document.getElementById('menu-empresas');
  if (abrir && menu) {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
    abrir.setAttribute('aria-expanded', String(!menu.hidden));
    return;
  }
  const flecha = ev.target.closest('#abrir-avisos');
  const menuAvisos = document.getElementById('menu-avisos');
  if (flecha && menuAvisos) {
    ev.stopPropagation();
    menuAvisos.hidden = !menuAvisos.hidden;
    flecha.setAttribute('aria-expanded', String(!menuAvisos.hidden));
    return;
  }
  if (menuAvisos && !ev.target.closest('.campana-grupo')) {
    menuAvisos.hidden = true;
    document.getElementById('abrir-avisos')?.setAttribute('aria-expanded', 'false');
  }
  if (ev.target.closest('[data-ir-avisos]')) return irAAvisos();
  const elegida = ev.target.closest('[data-empresa]');
  if (elegida) return cambiarEmpresa(elegida.dataset.empresa);
  if (ev.target.closest('[data-anadir-empresa]')) return anadirEmpresa();
  if (menu && !ev.target.closest('.selector-empresa')) {
    menu.hidden = true;
    document.getElementById('abrir-empresas')?.setAttribute('aria-expanded', 'false');
  }
});

// ---------- Sectores de la empresa ----------
//
// Sus prefijos CPV agrupados en 2-6 sectores con nombre ("Alumbrado
// público"). Si no los tiene —empresa nueva, filtro rehecho, o de antes
// de que existieran— se piden a `alta`, que los escribe con el modelo y
// los deja guardados: la segunda vez ya salen de la base.
//
// `base` es el cpv_prefijos con el que se generaron: si no coincide con
// el actual, son de un filtro anterior y no valen.
async function cargarSectores(perfil) {
  const base = perfil.cpv_prefijos ?? '';
  if (base.split(',').filter(x => x.trim()).length < 2) return [];
  const clave = 'sectores:' + perfil.id + ':' + base;
  const guardado = CACHE.get(clave);
  if (guardado) return guardado.data;

  const { data } = await sb.from('sectores_perfil')
    .select('id,nombre,prefijos,base').eq('perfil_id', perfil.id).order('orden');
  let sectores = (data ?? []).filter(x => x.base === base);
  if (!sectores.length) {
    try { sectores = (await llamar('sectores', { perfil_id: perfil.id })).sectores ?? []; }
    catch { return []; }   // sin sectores, la lista funciona igual
    // Se releen de la base para tener su id: los avisos apuntan a él.
    const { data: otraVez } = await sb.from('sectores_perfil')
      .select('id,nombre,prefijos,base').eq('perfil_id', perfil.id).order('orden');
    if (otraVez?.length) sectores = otraVez;
  }
  CACHE.set(clave, { data: sectores, cuando: Date.now() });
  return sectores;
}

// Misma regla con la que el contrato entró en su lista: algún CPV que
// empiece por alguno de los prefijos. Un contrato puede estar en varios.
const enSector = (o, sector) => (o.cpvs ?? []).some(c =>
  sector.prefijos.some(p => String(c).startsWith(p)));

async function llamar(accion, cuerpo = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error('sin_sesion');
  const r = await fetch(`${SUPABASE_URL}/functions/v1/alta`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${session.access_token}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ accion, perfil_id: perfilActivoId, ...cuerpo }),
  });
  const datos = await r.json();
  if (!r.ok || datos.error) throw new Error(datos.error || 'error');
  return datos;
}

// ============================================================
// Enrutado: la pantalla depende del punto en que esté el perfil
// ============================================================

async function arrancar(volviendo = false) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaEntrar();
  sesionActual = session.user.id;

  // Algo en pantalla desde el primer momento. Antes no se pintaba nada
  // hasta tener el perfil y la comprobación de pendientes: hasta 4
  // segundos de página en blanco en cada carga.
  if (!raiz.innerHTML.trim())
    raiz.innerHTML = `<div class="centro"><p class="guia">Cargando...</p></div>`;

  let perfil;
  try { perfil = await cargarPerfil(session); }
  catch {
    raiz.innerHTML = `<div class="centro"><div class="aviso mal">
      No hemos podido cargar tu cuenta. Recarga la página.</div></div>`;
    return;
  }

  // Sin perfil: es su primera entrada. El código de acceso lo escribió
  // antes que el correo; se canjea aquí, ya con sesión, sin pedírselo
  // otra vez.
  if (!perfil) {
    const guardado = codigoGuardado();
    if (!guardado) return pantallaCodigo(session);
    // Se retira ANTES de canjearlo: si arrancar() corriera dos veces a
    // la vez, la segunda no lo canjea otra vez (gastaría dos usos y
    // crearía dos perfiles).
    guardarCodigo(null);
    const { data, error } = await sb.rpc('canjear_codigo',
      { codigo_entrada: guardado });
    // Si falla (lo ha gastado otro entre medias, ha caducado...), a la
    // pantalla del código con el motivo, para que escriba otro.
    if (error || !data?.ok)
      return pantallaCodigo(session, data?.error ?? 'error');
    return arrancar(volviendo);
  }

  // Si queda algo sin clasificar, se clasifica, pero SIN hacer esperar.
  //
  // El cribado corría solo al final del alta. Si se interrumpía —o si
  // alguien se daba de alta entre dos pasadas del scraper— la lista
  // salía vacía hasta la madrugada siguiente, y un cliente que entra y
  // no ve nada no vuelve.
  //
  // Antes esto iba ANTES de enseñar la lista, con un tope de 4 segundos.
  // La consulta suele tardar 200 ms, pero cuando la base viene de estar
  // ocupada pasa de 5 s (medido el 21/09/2026: mediana 2,1 s desde la
  // web, y cuatro errores por tiempo agotado). Cada carga esperaba esos
  // 4 segundos en blanco para nada, porque casi nunca queda algo
  // pendiente. Ahora la lista sale ya, y lo pendiente se criba por
  // detrás y la actualiza al terminar.
  //
  // Va aquí y no en la pantalla de contratos porque por el arranque
  // pasan TODAS las entradas a la aplicación, se llegue a la pantalla
  // que se llegue.
  if (perfil.paso_alta === 'listo' && !volviendo) cribarPendientesDeFondo(perfil);

  if (perfil.paso_alta === 'listo') {
    // La primera vez que llega a su lista, se le presenta cómo funciona.
    if (!perfil.vio_bienvenida && !volviendo)
      return pantallaBienvenida(perfil, session);
    return pantallaOportunidades(perfil, session, volviendo);
  }
  if (perfil.paso_alta === 'cribando') return pantallaCribando(perfil, session);
  // 'entrenando' era el paso de las tarjetas, que ya no existen: quien
  // se quedó a medias vuelve a su descripción, que conserva escrita.
  // El CIF va primero: si la empresa tiene historial, no hace falta que
  // describa nada. Lo que ha ganado dice mejor a qué se presenta que
  // cualquier descripción.
  if (!perfil.descripcion) return pantallaEmpresa(perfil, session);
  return pantallaDescribir(perfil, session);
}

// La lista de contratos abierta, si la hay, deja aquí cómo refrescarse.
// Así el cribado de fondo puede actualizarla al terminar sin repintar la
// pantalla entera, que borraría los filtros que el cliente haya puesto.
let refrescarListaAbierta = null;
// Cuál es la lista de contratos que se está viendo. Si la pantalla se
// monta dos veces a la vez (arranque y cribado, atrás del navegador...),
// la copia vieja seguía viva: repintaba encima con sus datos —devolviendo
// a la lista el contrato que se acababa de descartar— y añadía otra vez
// los sectores al filtro. Solo pinta la última.
let listaVigente = 0;
let cribandoDeFondo = false;

async function cribarPendientesDeFondo(perfil) {
  if (cribandoDeFondo) return;
  cribandoDeFondo = true;
  try {
    const { data, error } = await sb.rpc('pendientes_de_perfil',
      { perfil: perfil.id, tope: 1 });
    if (error || !data?.length) return;

    recado('Revisando los contratos nuevos para ti...');
    // Con la misma salida que pantallaCribando: si dos vueltas seguidas
    // no clasifican nada, las siguientes tampoco lo harán.
    let hechas = 0, sinAvance = 0;
    for (let vuelta = 0; vuelta < 200; vuelta++) {
      // Con su perfil fijo: si cambia de empresa a mitad, esto sigue
      // cribando la que empezó en vez de saltar a la otra.
      const r = await llamar('cribar', { perfil_id: perfil.id });
      hechas += r.hechas || 0;
      if (r.terminado) break;
      sinAvance = r.hechas ? 0 : sinAvance + 1;
      if (sinAvance >= 2) break;
    }
    if (hechas && refrescarListaAbierta && perfil.id === perfilActivoId)
      await refrescarListaAbierta();
  } catch { /* lo que quede lo criba el scraper por la noche */ }
  finally { cribandoDeFondo = false; }
}

// Supabase renueva el token cada pocos minutos y eso dispara un evento
// SIGNED_IN. Reaccionar a él reiniciaba la pantalla en mitad del alta:
// alguien con veinte tarjetas deslizadas volvía al principio y perdía
// sus respuestas.
//
// Solo importa cuando la sesión aparece por primera vez o desaparece.
sb.auth.onAuthStateChange((evento, sesion) => {
  const usuario = sesion?.user?.id ?? null;

  if (evento === 'SIGNED_OUT') {
    sesionActual = null;
    arrancar();
    return;
  }
  // Una renovación de token trae el mismo usuario: no hay nada que
  // volver a decidir.
  if (usuario && usuario !== sesionActual) {
    sesionActual = usuario;
    arrancar();
  }
});

// ============================================================
// 1 · Entrar: primero el código de acceso, luego el correo
// ============================================================
//
// El orden era correo → código del correo → código de acceso. Justo
// después de escribir el código que llega al correo salía otra pantalla
// pidiendo OTRO código, y se leía como un fallo. Ahora el de acceso va
// delante: se comprueba sin gastarlo (comprobar_codigo, sin sesión), se
// guarda, y al entrar con el correo arrancar() lo canjea solo.
//
// Quien ya tiene cuenta no necesita código: tiene un enlace directo al
// correo.

// En sessionStorage para que sobreviva a una recarga entre el código y
// el correo, y en memoria por si el navegador no deja guardar.
let codigoEnMemoria = null;
function codigoGuardado() {
  try { return sessionStorage.getItem('codigo-acceso') ?? codigoEnMemoria; }
  catch { return codigoEnMemoria; }
}
function guardarCodigo(codigo) {
  codigoEnMemoria = codigo;
  try {
    if (codigo) sessionStorage.setItem('codigo-acceso', codigo);
    else sessionStorage.removeItem('codigo-acceso');
  } catch { /* modo privado: queda en memoria */ }
}

const MENSAJES_CODIGO = {
  codigo_no_valido: 'Ese código no existe. Revísalo.',
  codigo_caducado: 'Ese código ha caducado.',
  codigo_agotado: 'Ese código ya se ha usado.',
  sin_sesion: 'La sesión ha expirado. Vuelve a entrar.',
};
const mensajeCodigo = e =>
  MENSAJES_CODIGO[e] ?? 'No se ha podido validar el código.';

function pantallaEntrar() {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="paso ancha">
      <h1>Los contratos públicos que te interesan, sin buscarlos</h1>
      <p class="guia">Cada mañana te enviamos solo las licitaciones que encajan
      con tu negocio. Nada de listas de mil contratos entre los que rebuscar.</p>
      <div class="campo">
        <input type="text" id="codigo" class="clave" placeholder="CÓDIGO DE ACCESO"
               autocomplete="off" aria-label="Código de acceso">
      </div>
      <button class="principal" id="continuar">Continuar</button>
      <p class="guia" style="margin-top:20px;font-size:.87rem">
      El código que te facilitamos al contratar el servicio.</p>
      <div id="resultado"></div>
      <button class="enlace" id="ya-tengo">Ya tengo cuenta: entrar con mi correo</button>
    </div>`;

  const boton = document.getElementById('continuar');
  const campo = document.getElementById('codigo');
  campo.value = codigoGuardado() ?? '';
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  alPulsar('ya-tengo', () => { guardarCodigo(null); pantallaCorreo(); });

  boton.onclick = async () => {
    const codigo = campo.value.trim();
    if (!codigo) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Escribe tu código de acceso.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Comprobando...';
    const { data, error } = await sb.rpc('comprobar_codigo',
      { codigo_entrada: codigo });
    if (error || !data?.ok) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">${esc(mensajeCodigo(data?.error))}</div>`;
      boton.disabled = false;
      boton.textContent = 'Continuar';
      campo.select();
      return;
    }
    guardarCodigo(codigo);
    pantallaCorreo();
  };
}

// El correo, después del código (o directamente, si ya tiene cuenta).
function pantallaCorreo() {
  const conCodigo = !!codigoGuardado();
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="paso ancha">
      <h1>${conCodigo ? 'Tu correo' : 'Entra con tu correo'}</h1>
      <p class="guia">Te mandamos un código al correo. Sin contraseñas que
      recordar.</p>
      <div class="campo">
        <input type="email" id="correo" placeholder="nombre@empresa.es"
               autocomplete="email" aria-label="Tu correo">
      </div>
      <button class="principal" id="enviar">${conCodigo ? 'Continuar' : 'Entrar'}</button>
      <button class="enlace" id="volver">${conCodigo
        ? 'Cambiar el código de acceso' : 'Tengo un código de acceso'}</button>
      <div id="resultado"></div>
    </div>`;

  const boton = document.getElementById('enviar');
  const correo = document.getElementById('correo');
  const textoBoton = boton.textContent;
  correo.focus();
  correo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  alPulsar('volver', () => pantallaEntrar());

  boton.onclick = async () => {
    const email = correo.value.trim();
    if (!email.includes('@')) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese correo no parece válido.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Enviando...';
    // Un CÓDIGO, no un enlace.
    //
    // Los filtros antiphishing de correo corporativo —Safe Links de
    // Microsoft, que viene activado por defecto en Microsoft 365—
    // ABREN el enlace antes que el destinatario para comprobar si es
    // malicioso. Y un enlace mágico solo sirve una vez: cuando el
    // cliente pincha, ya está gastado y aterriza sin sesión.
    //
    // Un código de seis dígitos no se gasta al mirarlo: hay que
    // escribirlo. Y además funciona aunque abra el correo en otro
    // dispositivo.
    const { error } = await sb.auth.signInWithOtp({
      email, options: { shouldCreateUser: true },
    });
    if (error) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">No se ha podido enviar: ${esc(error.message)}</div>`;
      boton.disabled = false;
      boton.textContent = textoBoton;
      return;
    }
    pantallaCodigoCorreo(email);
  };
}

// Donde se escribe el código que ha llegado por correo.
function pantallaCodigoCorreo(email) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="paso ancha">
      <h1>Revisa tu correo</h1>
      <p class="guia">Hemos enviado un código a
      <strong>${esc(email)}</strong>. Escríbelo aquí para entrar.</p>
      <div class="campo">
        <input type="text" id="codigo-correo" inputmode="numeric"
               autocomplete="one-time-code" maxlength="10"
               placeholder="Tu código" aria-label="Código recibido por correo"
               style="letter-spacing:.3em;text-align:center;font-size:1.3rem">
      </div>
      <button class="principal" id="comprobar">Entrar</button>
      <button class="enlace" id="reenviar" disabled>Reenviar el código</button>
      <button class="enlace" id="otro-correo">Usar otro correo</button>
      <p class="guia" style="margin-top:18px;font-size:.85rem">
      Si no lo ves, mira en la carpeta de correo no deseado.</p>
      <div id="resultado"></div>
    </div>`;

  const campo = document.getElementById('codigo-correo');
  const boton = document.getElementById('comprobar');
  campo.focus();
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  // Sin dar por hecha la longitud: Supabase manda seis dígitos por
  // defecto, pero el proyecto puede estar configurado a ocho. Fijar el
  // número aquí hacía que el campo no dejara escribir el código entero.
  campo.addEventListener('input', () => {
    campo.value = campo.value.replace(/\D/g, '');
  });

  alPulsar('otro-correo', () => pantallaCorreo());

  // Reenviar sin volver a escribir el correo. Antes, si el código no
  // llegaba o caducaba, el aviso decía que se pidiera otro con «usar otro
  // correo»: había que volver atrás y teclear la misma dirección.
  //
  // Con cuenta atrás de 60 s porque es lo que admite Supabase por
  // dirección: pulsar antes solo devolvía un error.
  const reenviar = document.getElementById('reenviar');
  let espera;
  const contarAtras = (segundos = 60) => {
    clearInterval(espera);
    reenviar.disabled = true;
    const pintar = () => {
      reenviar.textContent = segundos > 0
        ? `Reenviar el código (${segundos} s)` : 'Reenviar el código';
      reenviar.disabled = segundos > 0;
    };
    pintar();
    espera = setInterval(() => {
      segundos -= 1;
      pintar();
      if (segundos <= 0) clearInterval(espera);
    }, 1000);
  };
  contarAtras();
  alPulsar('reenviar', async () => {
    reenviar.disabled = true;
    reenviar.textContent = 'Reenviando...';
    const { error } = await sb.auth.signInWithOtp({
      email, options: { shouldCreateUser: true },
    });
    document.getElementById('resultado').innerHTML = error
      ? `<div class="aviso mal">No se ha podido reenviar: ${esc(error.message)}</div>`
      : `<div class="aviso">Te hemos enviado un código nuevo. El anterior
         ya no sirve.</div>`;
    contarAtras();
    campo.value = '';
    campo.focus();
  });

  boton.onclick = async () => {
    const token = campo.value.trim();
    if (token.length < 4) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Escribe el código que te ha llegado.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Comprobando...';
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese código no es válido o ha caducado.
         Pide otro con «Reenviar el código».</div>`;
      boton.disabled = false;
      boton.textContent = 'Entrar';
      campo.select();
      return;
    }
    // Al entrar, el detector de sesión arranca la aplicación solo.
  };
}

// ============================================================
// 3 · Identificar la empresa por su CIF
// ============================================================

function pantallaEmpresa(perfil, session) {
  // ¿Es una empresa más de una cuenta que ya tiene otra lista?
  const otra = PERFILES.find(p => p.id !== perfil.id && p.paso_alta === 'listo');
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="paso">
      <h1>¿Cuál es el NIF de ${otra ? 'la otra empresa' : 'tu empresa'}?</h1>
      <p class="guia">Con él encontramos los contratos públicos que ya has
      ganado. De ahí sabemos a qué te presentas, sin que tengas que
      explicárnoslo.</p>
      <div class="campo">
        <input type="text" id="cif" class="clave" placeholder="B12345678"
               autocomplete="off" aria-label="NIF de tu empresa">
      </div>
      <button class="principal" id="buscar">Buscar</button>
      <button class="enlace" id="sin-cif">No tengo contratos públicos todavía</button>
      <div id="resultado"></div>
      ${otra
        ? `<button class="enlace" id="cancelar-empresa">Cancelar y volver a
             ${esc(nombreEmpresa(otra))}</button>`
        : `<p class="guia pista-empresas">¿Llevas varias empresas? Podrás
             añadir hasta ${TOPE_EMPRESAS} cuando termines con esta.</p>`}
    </div>`;

  // Se quita la empresa a medio hacer: si no, ocuparía uno de los tres
  // huecos sin servir para nada.
  if (otra) alPulsar('cancelar-empresa', async () => {
    await sb.rpc('quitar_empresa', { perfil: perfil.id });
    cambiarEmpresa(otra.id);
  });

  const boton = document.getElementById('buscar');
  const campo = document.getElementById('cif');
  campo.addEventListener('keydown', e => { if (e.key === 'Enter') boton.click(); });
  document.getElementById('sin-cif').onclick = () => pantallaDescribir(perfil, session);

  boton.onclick = async () => {
    const cif = campo.value.trim();
    if (cif.length < 8) {
      document.getElementById('resultado').innerHTML =
        `<div class="aviso mal">Ese NIF no parece completo.</div>`;
      return;
    }
    boton.disabled = true;
    boton.textContent = 'Buscando...';
    try {
      const r = await llamar('buscar_empresa', { cif });
      if (!r.empresas.length) {
        // El NIF no encuentra nada, y muchas veces NO es que la empresa
        // no tenga contratos: las matrices de los grupos no licitan.
        // Acciona S.A. y ACS tienen cero contratos a su nombre; los
        // tienen sus filiales, cada una con el suyo. Quien escribe el
        // NIF que conoce se quedaba fuera teniendo el grupo cientos de
        // adjudicaciones.
        //
        // Por eso vuelve el rescate por nombre. Ya no es el recorrido
        // de 12 segundos de antes: busca contra la tabla `empresas`,
        // una fila por NIF y con índice de trigramas, en milisegundos.
        document.getElementById('resultado').innerHTML = `
          <div class="aviso">No encontramos contratos públicos con ese NIF.

async function pantallaCribando(perfil, session, lectura, volviendo = false) {
  raiz.className = 'envoltorio';
  raiz.innerHTML = `
    <div class="paso ancha">
      <h1>Estamos revisando los contratos abiertos</h1>
      ${lectura?.actividad ? `<p class="guia">Hemos entendido que te dedicas a
      <strong>${esc(lectura.actividad.toLowerCase().replace(/[.\s]+$/, ''))}</strong>. Ahora buscamos
      contratos abiertos que encajen.</p>` : `
      <p class="guia">Aplicamos tu filtro a todas las licitaciones que siguen
      abiertas ahora mismo.</p>`}
      <p class="guia" style="font-size:.9rem">Puede tardar unos minutos.
      No cierres esta página.</p>
      <div class="avance" style="margin-top:30px">
        <div class="barra"><div class="relleno" id="relleno"></div></div>
        <div class="cuenta"><span id="progreso">Empezando...</span><span></span></div>
      </div>
    </div>`;

  // Se piden lotes seguidos hasta terminar. Cada llamada devuelve
  // cuánto queda, así que el progreso es real y no una animación.
  //
  // Con salida si deja de avanzar. Cuando el modelo no consigue
  // clasificar un contrato, `cribar` no guarda nada y responde lo mismo
  // una y otra vez: el `while (true)` de antes se quedaba pidiendo para
  // siempre con la pantalla congelada, y como el arranque pasa por aquí
  // si queda algo pendiente, ocurría en cada visita. Mejor enseñar la
  // lista con lo ya clasificado; lo que falte lo criba el scraper.
  //
  // Se mira `hechas` y no `quedan`: la cola llega con tope, y con muchas
  // pendientes `quedan` sale igual aunque se esté avanzando.
  const MAX_VUELTAS_SIN_AVANCE = 2;
  // Lo hecho se cuenta vuelta a vuelta. `total` y `quedan` vienen de una
  // cola que la API recorta a 1.000 filas: con más pendientes, "quedan"
  // se quedaba en ~940 y el contador se clavaba en "60 de 1.000" durante
  // minutos. Mientras la cola llegue recortada se dice "más de 1.000";
  // cuando baja de ahí, el total ya es exacto.
  const RECORTE = 1000;
  let hechas = 0, sinAvance = 0;
  for (let vuelta = 0; vuelta < 200; vuelta++) {
    let r;
    try {
      r = await llamar('cribar');
    } catch {
      raiz.innerHTML = `<div class="centro"><div class="aviso mal">
        Se ha interrumpido. Recarga la página y continuará donde iba.</div></div>`;
      return;
    }
    if (r.terminado) break;
    // Empresas con historial: su lista la calcula el puntuador fuera de
    // aquí (un par de minutos) y `cribar` responde `esperando` mientras
    // tanto. Esperar no es «no avanzar».
    if (r.esperando) {
      // Sin NIF no ha ganado nada: se compara con contratos parecidos a
      // lo que ha descrito (su historial sintético, decisión 40).
      document.getElementById('progreso').textContent = perfil.cif
        ? 'Comparando con los contratos que has ganado. Un par de minutos...'
        : 'Comparando con contratos parecidos a lo que haces. Un par de minutos...';
      document.getElementById('relleno').style.width = `${Math.min(95, 10 + vuelta * 8)}%`;
      continue;
    }
    hechas += r.hechas || 0;
    sinAvance = r.hechas ? 0 : sinAvance + 1;
    if (sinAvance >= MAX_VUELTAS_SIN_AVANCE) break;
    // Al empezar esta vuelta quedaban r.total; si venía recortada, al menos
    // RECORTE, así que el total es como mínimo lo de antes más RECORTE.
    const recortada = (r.total ?? 0) >= RECORTE;
    const total = recortada ? hechas - (r.hechas || 0) + RECORTE : hechas + r.quedan;
    document.getElementById('relleno').style.width = `${total ? hechas/total*100 : 0}%`;
    document.getElementById('progreso').textContent = recortada
      ? `${hechas} de más de ${new Intl.NumberFormat('es-ES',
          { useGrouping: 'always' }).format(total)} contratos`
      : `${hechas} de ${plural(total, 'contrato', 'contratos')}`;
  }

  // Al volver desde la lista, se devuelve el control y la pinta ella:
  // volver a llamarla aquí crearía un bucle.
  if (volviendo) return;

  const { data } = await sb.from('perfiles').select('*').eq('id', perfil.id).limit(1);
  const actualizado = data?.[0] ?? perfil;
  // Este es el camino por el que llega un cliente nuevo, así que es aquí
  // donde más falta hace la presentación.
  if (actualizado.vio_bienvenida) pantallaOportunidades(actualizado, session);
  else pantallaBienvenida(actualizado, session);
}

// 6 · Mercado
// ============================================================

// Paleta fría, sin rojos ni naranjas.
//
// En la interfaz el color ya significa algo: --no y --urge son rojizos,
// y --acento marca lo que reclama atención. Pintar con esos tonos una
// categoría neutra hace que el gráfico parezca una alarma: media barra
// naranja se lee como "algo va mal" aunque solo diga "equipamiento
// médico".
//
// La regla habitual en sistemas de diseño: los colores con significado
// se reservan, y las categorías usan una escala cualitativa aparte.
// Aquí, azules y verdeazulados que descienden en tono, lo bastante
// distintos entre sí para no confundirse.
const PALETA = ['#2d5f8a','#3f8f8c','#5c7fb8','#6aa88b','#7a6ea8',
                '#4a8fa8','#8a9a5b','#5e7a94'];
const COLOR_OTROS = '#aab6c2';

function apilada(filas, campoNombre, campoValor, unidad, rotulo = true,
                 campoClave = null, conLeyenda = true) {
  const total = filas.reduce((s, f) => s + (Number(f[campoValor]) || 0), 0);
  if (!total) return '';

  const conValor = filas
    .map((f, i) => ({
      nombre: String(f[campoNombre] ?? '—'),
      valor: Number(f[campoValor]) || 0,
      color: PALETA[i % PALETA.length],
      // Para que quien dibuje el gráfico pueda saber a qué fila
      // corresponde cada porción y reaccionar al señalarla.
      clave: campoClave ? String(f[campoClave] ?? '') : '',
    }))
    .filter(x => x.valor > 0)
    .sort((a, b) => b.valor - a.valor);

  const grandes = conValor.filter(x => x.valor / total >= 0.02);
  const chicos = conValor.filter(x => x.valor / total < 0.02);
  const trozos = [...grandes];
  if (chicos.length) {
    trozos.push({
      nombre: chicos.length === 1 ? chicos[0].nombre
            : `Otros ${chicos.length} ${unidad === 'euros' ? '' : ''}`.trim(),
      valor: chicos.reduce((s, x) => s + x.valor, 0),
      color: COLOR_OTROS,
      agrupa: chicos,
    });
  }

  const comoTexto = v => unidad === 'euros' ? euros(v)
    : `${v} ${v === 1 ? 'contrato' : 'contratos'}`;
  const pct = v => {
    const p = v / total * 100;
    return p >= 10 ? `${Math.round(p)} %` : `${p.toFixed(1).replace('.', ',')} %`;
  };

  const id = 'r' + Math.random().toString(36).slice(2, 8);

  // Barras o quesito, según lo que tenga elegido el cliente. Los dos
  // dibujan lo mismo: cada porción lleva su etiqueta y su valor, así que
  // el detalle al pasar por encima funciona igual con cualquiera.
  let grafico;
  if (formaActual() === 'quesito') {
    // Se dibuja con el trazo de un círculo y no con arcos: cada porción es
    // un segmento del contorno, lo que evita calcular trayectorias y hace
    // que cada una sea un elemento propio al que se puede apuntar.
    const R = 60, C = 2 * Math.PI * R;
    let recorrido = 0;
    grafico = `<svg class="quesito" viewBox="0 0 160 160" role="img">
      ${trozos.map((t, i) => {
        const parte = t.valor / total;
        const trazo = `<circle class="trozo" data-i="${i}" data-clave="${esc(t.clave ?? '')}"
          cx="80" cy="80" r="${R}"
          stroke="${t.color}"
          stroke-dasharray="${(parte * C).toFixed(2)} ${C.toFixed(2)}"
          stroke-dashoffset="${(-recorrido * C).toFixed(2)}"
          transform="rotate(-90 80 80)"
          data-valor="${esc(comoTexto(t.valor))}"
          aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></circle>`;
        recorrido += parte;
        return trazo;
      }).join('')}
    </svg>`;
  } else {
    grafico = `<div class="apilada">
      ${trozos.map((t, i) => `<button class="trozo" data-i="${i}" data-clave="${esc(t.clave ?? '')}"
        style="width:${t.valor / total * 100}%;background:${t.color}"
        data-valor="${esc(comoTexto(t.valor))}"
        aria-label="${esc(t.nombre)}: ${pct(t.valor)}"></button>`).join('')}
    </div>`;
  }

  return `
    <div class="reparto" data-reparto="${id}">
      ${rotulo === false ? ''
        : `<h4>${unidad === 'euros' ? 'Por importe' : 'Por número de contratos'}</h4>`}
      ${grafico}
      <div class="detalle-trozo callado" data-hueco>
        Pasa por encima o toca para ver el detalle
      </div>
      ${conLeyenda === false ? '' : `<div class="leyenda">
        ${trozos.map((t, i) => `<button data-i="${i}">
          <span class="punto" style="background:${t.color}"></span>
          <span class="cual">${esc(t.nombre)}</span>
          <span class="pct">${pct(t.valor)}</span>
        </button>`).join('')}
      </div>`}
    </div>`;
}

// Devuelve las dos barras de una misma dimensión.
function reparto(filas, campoNombre) {
  if (!filas.length) return `<p class="sin-datos">Todavía no hay datos.</p>`;
  return apilada(filas, campoNombre, 'contratos', 'contratos')
       + apilada(filas, campoNombre, 'importe', 'euros');
}

// Detalle de cada segmento de las barras apiladas. Al pasar por encima o
// tocar, la línea de debajo dice qué es y cuánto vale. En el móvil no hay
// cursor, así que el toque es la única forma de leer un segmento estrecho.
function activarBarras(donde) {
  donde.querySelectorAll('[data-reparto]').forEach(caja => {
    const hueco = caja.querySelector('[data-hueco]');
    const trozos = [...caja.querySelectorAll('.trozo')];
    if (!hueco || !trozos.length) return;
    const reposo = hueco.innerHTML;

    const mostrar = i => {
      const t = trozos[i];
      if (!t) return;
      const etiqueta = t.getAttribute('aria-label');
      const corte = etiqueta.lastIndexOf(': ');
      hueco.className = 'detalle-trozo';
      hueco.innerHTML = `
        <span class="punto" style="background:${t.style.background || t.getAttribute('stroke')}"></span>
        <span class="cual">${esc(etiqueta.slice(0, corte))}</span>
        <span class="cuanto">${esc(etiqueta.slice(corte + 2))} · ${
          esc(t.dataset.valor ?? '')}</span>`;
      trozos.forEach((x, j) => x.classList.toggle('activo', j === +i));
    };
    const soltar = () => {
      hueco.className = 'detalle-trozo callado';
      hueco.innerHTML = reposo;
      trozos.forEach(x => x.classList.remove('activo'));
    };

    trozos.forEach(t => {
      t.onmouseenter = () => mostrar(t.dataset.i);
      t.onfocus = () => mostrar(t.dataset.i);
      // En táctil el clic es lo único que hay: se queda fijo hasta que se
      // toque otro.
      t.onclick = () => mostrar(t.dataset.i);
    });
    caja.querySelector('.apilada, .quesito')?.addEventListener('mouseleave', soltar);

    caja.querySelectorAll('.leyenda button').forEach(b => {
      b.onmouseenter = () => mostrar(b.dataset.i);
      b.onclick = () => mostrar(b.dataset.i);
    });
    // Hay gráficos sin leyenda (conLeyenda === false). Sin comprobarlo,
    // el error cortaba aquí y lanzaba una excepción en cada ficha de
    // organismo.
    const leyenda = caja.querySelector('.leyenda');
    if (leyenda) leyenda.onmouseleave = soltar;
  });
}

// Navegación principal. Va en la cabecera y no en el menú de cuenta
// porque Contratos y Mercado son áreas pares: qué me interesa presentar,
// y qué pasa en mi sector.
function navPrincipal(donde) {
  return `
    <div class="principales">
      <button data-nav="contratos" aria-current="${donde === 'contratos'}">Contratos</button>
      <button data-nav="movimientos" aria-current="${donde === 'movimientos'}">Lo que viene</button>
      <button data-nav="mercado" aria-current="${donde === 'mercado'}">Empresas</button>
      <button data-nav="organismos" aria-current="${donde === 'organismos'}">Organismos</button>
      ${VIABILIDAD_VISIBLE ? `<button data-nav="viabilidad" aria-current="${donde === 'viabilidad'}">Viabilidad</button>` : ''}
    </div>`;
}

function activarNav(perfil, session, donde) {
  document.querySelectorAll('[data-nav]').forEach(b => {
    // Al acercar el cursor ya se va pidiendo: para cuando pulsa, los
    // datos están de camino.
    const adelantar = () => precargar(b.dataset.nav);
    b.onmouseenter = adelantar;
    b.onfocus = adelantar;
    b.ontouchstart = adelantar;
  });

  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => {
    if (b.dataset.nav === donde) return;
    if (b.dataset.nav === 'mercado') pantallaMercado(perfil, session);
    else if (b.dataset.nav === 'movimientos') pantallaMovimientos(perfil, session);
    else if (b.dataset.nav === 'organismos') pantallaOrganismos(perfil, session);
    else if (b.dataset.nav === 'viabilidad') pantallaViabilidad(perfil, session);
    else pantallaOportunidades(perfil, session);
  });
}

// ---------- Lo que ya se ha pedido ----------
//
// Cada cambio de pestaña volvía a pedirlo todo a la base, así que había
// un segundo de espera cada vez. Aquí se guarda lo último que devolvió
// cada consulta: al volver, la pantalla sale al instante con eso y se
// refresca por detrás.
//
// Vive solo en memoria y se pierde al recargar, que es lo que se quiere:
// nunca se enseñan datos de una sesión anterior.
const CACHE = new Map();
const VIGENCIA = 90_000;   // Metro y medio de margen: pasado eso, se pide de nuevo.

async function pedir(nombre, args = {}, opciones = {}) {
  // La empresa va en la clave: un refresco que llega tarde, después de
  // cambiar de empresa, no puede colarse en la de la otra.
  const clave = nombre + ':' + perfilActivoId + ':' + JSON.stringify(args);
  const guardado = CACHE.get(clave);
  const fresco = guardado && (Date.now() - guardado.cuando) < VIGENCIA;

  // Con algo guardado se devuelve YA y se refresca en segundo plano.
  if (guardado && opciones.alVuelo !== false) {
    if (!fresco) refrescar(clave, nombre, args, opciones.alCambiar);
    return { data: guardado.data, error: null, deCache: true };
  }

  const r = await sb.rpc(nombre, args);
  if (!r.error) CACHE.set(clave, { data: r.data, cuando: Date.now() });
  return r;
}

async function refrescar(clave, nombre, args, alCambiar) {
  try {
    const r = await sb.rpc(nombre, args);
    if (r.error) return;
    const antes = JSON.stringify(CACHE.get(clave)?.data);
    CACHE.set(clave, { data: r.data, cuando: Date.now() });
    // Solo se avisa si de verdad cambió algo: repintar una lista
    // idéntica mueve lo que el cliente está mirando sin motivo.
    if (alCambiar && JSON.stringify(r.data) !== antes) alCambiar(r.data);
  } catch { /* el refresco nunca estorba */ }
}

// Lo que se toca deja de valer: tras corregir un contrato o seguir una
// empresa, lo guardado ya no describe la realidad.
function olvidar(...nombres) {
  for (const k of [...CACHE.keys()]) {
    if (nombres.some(n => k.startsWith(n + ':'))) CACHE.delete(k);
  }
}

// Sus contratos abiertos. No es una función sino una consulta de tabla,
// así que necesita su propio guardado — y es la pantalla a la que más se
// vuelve, así que es donde más se nota.
async function pedirContratos(perfilId, alCambiar) {
  const clave = 'contratos:' + perfilId;
  const guardado = CACHE.get(clave);

  if (guardado) {
    if (Date.now() - guardado.cuando >= VIGENCIA) {
      sb.from('mis_oportunidades').select('*').eq('perfil_id', perfilId)
        .then(({ data, error }) => {
          if (error) return;
          const antes = JSON.stringify(CACHE.get(clave)?.data);
          CACHE.set(clave, { data, cuando: Date.now() });
          if (alCambiar && JSON.stringify(data) !== antes) alCambiar(data);
        });
    }
    return { data: guardado.data, error: null };
  }

  const r = await sb.from('mis_oportunidades').select('*').eq('perfil_id', perfilId);
  if (!r.error) CACHE.set(clave, { data: r.data, cuando: Date.now() });
  return r;
}

// Al pasar el cursor por una pestaña se va pidiendo lo que necesita.
// Para cuando se pulsa, los datos ya están de camino.
function precargar(donde) {
  if (donde === 'contratos') {
    // El perfil no está aquí, pero la clave se resuelve sola en cuanto
    // la pantalla lo pida: lo que importa es no esperar dos veces.
    return;
  }
  if (donde === 'movimientos') {
    // Con los mismos argumentos que pedirá la pantalla, o no se
    // aprovecha: `pedir` guarda por nombre y argumentos.
    if (seccionMovGuardada() === 'viene') {
      pedir('lo_que_viene', { meses: plazoViene(), provincia_elegida: null, tope: 300 });
      return;
    }
    aniosDelSector().then(anios => {
      const p = periodoGuardado(anios);
      if (p.desde == null) return;
      const extra = { provincia_elegida: null };
      pedir('resumen_periodo', argsPeriodo(p, extra));
      pedir('movimientos_periodo', argsPeriodo(p, { ...extra, tope: 300 }));
    });
  } else if (donde === 'mercado') {
    pedir('buscar_organismo', { texto: '', salto: 0, cuantos: 400 });
  } else if (donde === 'viabilidad') {
    pedir('analizables', { texto: '', organo_filtro: '' });
  }
}

// ---------- Viabilidad ----------
//
// Responde a una pregunta distinta del cribado: no «¿esto encaja con lo
// que hago?» sino «¿merece la pena que me presente?».
//
// Devuelve un veredicto en palabras y sus motivos, no una puntuación de
// 0 a 100: un número compuesto oculta de dónde sale, y si falla una vez
// el cliente deja de fiarse de todo lo demás.
async function pantallaViabilidad(perfil, session, volviendo = false,
                                  contrato = null) {
  if (!volviendo) irA('viabilidad', contrato ? { contrato } : {});
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Viabilidad</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('viabilidad')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>
    <div id="zona"></div>`;

  activarMenu(perfil, session);
  activarCampana();
  activarNav(perfil, session, 'viabilidad');

  const zona = document.getElementById('zona');

  // ---------- Elegir contrato ----------
  async function elegir(texto = '', organo = '') {
    zona.innerHTML = `
      <h1 style="margin-top:26px">¿A cuál te presentas?</h1>
      <p class="guia" style="max-width:66ch">Antes de preparar una oferta,
      mira quién ha ganado las convocatorias anteriores, cuánto se baja del
      presupuesto en ese organismo y qué parte de la puntuación depende de
      una fórmula.</p>

      <div class="buscador-cif" style="max-width:640px">
        <input type="search" id="q-contrato" autocomplete="off"
               placeholder="Buscar entre tus contratos abiertos"
               value="${esc(texto)}" aria-label="Buscar contrato">
      </div>
      <div id="lista-elegir"><p class="guia">Cargando...</p></div>`;

    const campo = document.getElementById('q-contrato');
    let espera;
    campo.oninput = () => {
      clearTimeout(espera);
      espera = setTimeout(() => cargarLista(campo.value.trim(), organo), 250);
    };
    campo.focus();
    cargarLista(texto, organo);
  }

  async function cargarLista(texto, organo) {
    const { data, error } = await pedir('analizables',
      { texto: texto || '', organo_filtro: organo || '' });
    const caja = document.getElementById('lista-elegir');
    if (!caja) return;

    if (error) {
      caja.innerHTML = `<div class="aviso mal">No hemos podido cargar tus
        contratos.<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
        ${esc(error.message || '')}</div></div>`;
      return;
    }

    const filas = data ?? [];
    if (!filas.length) {
      caja.innerHTML = `<p class="vacio">${texto
        ? 'Ningún contrato abierto coincide con esa búsqueda.'
        : 'Ahora mismo no tienes contratos abiertos que analizar.'}</p>`;
      return;
    }

    caja.innerHTML = `<div class="elige">${filas.map(f => {
      const dias = diasHasta(f.fecha_limite);
      return `<button data-contrato="${esc(f.id_licitacion)}">
        <span>
          <p class="que">${esc(f.titulo ?? '')}</p>
          <span class="donde">${esc([f.organo, f.provincia]
            .filter(Boolean).join(' · '))}</span>
        </span>
        <span class="plazo">${f.presupuesto
          ? euros(Number(f.presupuesto)) : ''}${dias != null
          ? `<br>${dias < 0 ? 'vencido' : dias === 0 ? 'vence hoy'
             : dias === 1 ? 'queda 1 día' : `quedan ${dias} días`}` : ''}</span>
      </button>`;
    }).join('')}</div>`;

    caja.querySelectorAll('[data-contrato]').forEach(b =>
      b.onclick = () => analizar(b.dataset.contrato));
  }

  // ---------- Analizar ----------
  async function analizar(id, restaurando = false) {
    if (!restaurando) irA('viabilidad', { contrato: id });
    zona.innerHTML = `<p class="guia" style="margin-top:26px">Analizando...</p>`;

    // Las dos consultas a la vez y no una detrás de otra: el veredicto
    // y las convocatorias anteriores son independientes, así que el
    // usuario espera lo que tarde la más lenta, no la suma.
    //
    // El fallo de la segunda NO tumba la pantalla: si las ediciones
    // anteriores no llegan, el análisis se enseña igual y esa sección
    // simplemente no aparece. Es información que suma, no de la que
    // dependa el veredicto.
    const [analisis, anteriores] = await Promise.all([
      sb.rpc('viabilidad', { ficha: id }),
      sb.rpc('ediciones_anteriores', { ficha: id }).then(r => r, () => ({ data: null })),
    ]);
    const { data: d, error } = analisis;
    if (error || !d || d.error) {
      zona.innerHTML = `<div class="aviso mal" style="margin-top:26px">
        No hemos podido analizar este contrato.
        ${error ? `<div style="margin-top:8px;font-size:.86rem;color:var(--tenue)">
          ${esc(error.message)}</div>` : ''}</div>`;
      return;
    }
    pintar(d, anteriores?.error ? [] : (anteriores?.data ?? []));
  }

  function pintar(d, ediciones = []) {
    const c = d.contrato ?? {};
    const inc = d.incumbencia ?? {};
    const org = d.organismo ?? {};
    const lider = inc.lider ?? {};
    const motivos = Array.isArray(d.motivos) ? d.motivos : [];

    // Si el proveedor de siempre es él, el mensaje se invierte: no es un
    // aviso, es una ventaja que conviene defender.
    const clase = d.soy_el_lider ? 'mio' : d.veredicto === 'cerrado' ? 'cerrado'
                : d.veredicto === 'difícil' ? 'dificil' : 'abierto';
    const etiqueta = d.soy_el_lider ? 'Este contrato es tuyo'
                   : d.veredicto === 'cerrado' ? 'Parece cerrado'
                   : d.veredicto === 'difícil' ? 'Lo tienes difícil'
                   : 'Tienes opciones';

    // Cuánto respalda el veredicto. Sin esto, «Tienes opciones» suena
    // igual de firme con tres contratos detrás que con doscientos.
    const muestra = Math.max(inc.ediciones ?? 0, org.licitadores_muestra ?? 0,
                             org.baja_muestra ?? 0);

    zona.innerHTML = `
      <button class="volver-listas" id="otro" style="margin-top:22px">
        ← Analizar otro contrato</button>

      <h1 style="margin:6px 0 8px;font-size:clamp(1.3rem,3vw,1.7rem)">
        ${esc(c.titulo ?? '')}</h1>
      <p class="guia" style="margin:0 0 20px">${esc([c.organo, c.provincia]
        .filter(Boolean).join(' · '))}${c.presupuesto
        ? ` · ${euros(Number(c.presupuesto))}` : ''}</p>

      <div class="dictamen ${clase}">
        <div class="titular">
          <h2>${etiqueta}</h2>
          ${muestra ? `<span class="cuantos">según ${muestra}
            ${muestra === 1 ? 'contrato anterior' : 'contratos anteriores'}
            de este organismo</span>` : ''}
        </div>
        <div class="motivos">
          ${motivos.length
            ? motivos.map(m => `<p>${esc(m[0].toUpperCase() + m.slice(1))}.</p>`).join('')
            : `<p class="solo">No hemos encontrado señales en contra: ningún
               proveedor que repita, ningún criterio subjetivo y poca
               competencia en este organismo.</p>`}
        </div>
      </div>

      ${(!c.peso_objetivo && !inc.ediciones) ? `
        <p class="guia" style="margin:14px 0 0;font-size:.88rem">
        De este contrato no hay datos suficientes para valorarlo: ni el
        reparto de la puntuación ni adjudicaciones anteriores del
        organismo. El veredicto solo refleja que no hemos encontrado
        señales en contra, no que no las haya.</p>` : ''}

      <div class="factores">
        ${factorCriterios(c)}
        ${factorIncumbencia(inc, lider, d.soy_el_lider)}
        ${factorBaja(org)}
        ${factorCompetencia(org, d.veredicto === 'cerrado')}
      </div>

      ${(inc.reparto?.length) ? `
        <div class="seccion-mercado" style="margin-top:18px">
          <h3>Quién ha ganado aquí${inc.por_convocatoria
            ? ' este mismo contrato' : ' contratos parecidos'}</h3>
          <p class="guia" style="margin:0 0 14px;font-size:.89rem">
            ${inc.por_convocatoria
              ? `${plural(inc.ediciones, 'convocatoria anterior adjudicada',
                  'convocatorias anteriores adjudicadas')} de este mismo contrato.`
              : inc.paralelos
                ? `Este organismo saca muchos contratos casi iguales a la vez
                   (por centros, zonas o especialidades), así que no podemos
                   saber cuál fue el anterior de este. Miramos todos los de su
                   misma familia: ${inc.ediciones} en cuatro años.`
                : `No hemos encontrado convocatorias anteriores de este contrato
                   concreto, así que miramos las de su misma familia en este
                   organismo: ${inc.ediciones} en cuatro años.`}</p>
          <div class="historial-contrato">
            ${inc.reparto.map((r, i) => {
              const clase = `${r.cif === lider.cif ? 'lider' : ''} ${
                r.cif === perfil.cif ? 'mia' : ''}`;
              const veces = `${r.veces} ${r.veces === 1 ? 'vez' : 'veces'}`;
              const suyos = Array.isArray(r.contratos) ? r.contratos : [];
              // Con serie, los contratos exactos ya salen debajo, en «Las
              // convocatorias anteriores»: repetirlos aquí sería lo mismo
              // dos veces. Sin serie, el «N veces» se abre para enseñar
              // cuáles, con su enlace a la plataforma.
              if (inc.por_convocatoria || !suyos.length) return `
              <div class="${clase}">
                <span class="quien">${esc(r.nombre ?? '—')}</span>
                <span class="cuando">${veces}</span>
              </div>`;
              return `
              <div class="${clase} con-contratos">
                <details>
                  <summary>
                    <span class="quien">${esc(r.nombre ?? '—')}</span>
                    <span class="cuando">${veces}</span>
                  </summary>
                  <ul class="contratos-ganados">
                    ${suyos.map(k => `<li>${tituloConEnlace(k.titulo ?? '—', k.enlace)}
                      <span class="dato">${[
                        k.fecha ? fechaCorta(k.fecha) : null,
                        k.importe != null ? euros(Number(k.importe)) : null,
                      ].filter(Boolean).join(' · ')}</span></li>`).join('')}
                  </ul>
                  ${r.veces > suyos.length ? `<p class="mas-ganados">Los
                    ${suyos.length} más recientes de ${r.veces}.</p>` : ''}
                </details>
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}

      ${ediciones.length ? `
        <div class="seccion-mercado" style="margin-top:18px">
          <h3>Las convocatorias anteriores</h3>
          <p class="guia" style="margin:0 0 14px;font-size:.89rem">
            Las veces que este organismo ya ha sacado este mismo contrato,
            de la más reciente a la más antigua.</p>
          <div class="historial-contrato">
            ${ediciones.map(e => `
              <div class="${e.cif && e.cif === perfil.cif ? 'mia' : ''}">
                <span class="quien">
                  ${tituloConEnlace(e.titulo ?? '—', e.enlace)}
                  <span style="display:block;color:var(--tenue);font-size:.85rem;
                               margin-top:3px">
                    ${e.desierta
                      ? ({ desistimiento: 'Desistida: no se adjudicó',
                           renuncia: 'Renunciada: no se adjudicó' }[e.desierta]
                         ?? 'Desierta: nadie se la llevó')
                      : esc(e.empresa ?? 'Sin adjudicatario')}${
                      e.licitadores
                        ? ` · ${e.licitadores} ${e.licitadores === 1
                            ? 'oferta' : 'ofertas'}` : ''}</span>
                </span>
                <span class="cuando">
                  ${e.importe != null ? euros(Number(e.importe)) : '—'}
                  <span style="display:block;margin-top:3px">${
                    e.fecha ? new Date(e.fecha).toLocaleDateString('es-ES',
                      { timeZone: ZONA, month: 'short', year: 'numeric' }) : ''}</span>
                </span>
              </div>`).join('')}
          </div>
        </div>` : ''}

      ${c.enlace ? `<div style="margin-top:22px">
        <a class="secundario" href="${esc(c.enlace)}" target="_blank"
           rel="noopener" style="display:inline-block;text-decoration:none">
          Ver el expediente</a></div>` : ''}`;

    alPulsar('otro', () => elegir());
  }

  // ---------- Los cuatro factores ----------
  function factorIncumbencia(inc, lider, esMio) {
    if (!inc.ediciones) {
      return `<div class="factor"><h4>Quién suele ganar</h4>
        <p class="vacio-factor">No hay adjudicaciones anteriores de este
        organismo en tu sector.</p></div>`;
    }

    // Una sola adjudicación: ni porcentaje ni reparto, solo quién la
    // ganó. «100 %» de una sería verdad y no diría nada.
    if (inc.ediciones === 1) {
      return `<div class="factor ${esMio ? 'bueno' : ''}">
        <h4>${inc.por_convocatoria ? 'Quién ganó la anterior' : 'Quién ganó aquí'}</h4>
        <div class="cifra" style="font-size:1.05rem;line-height:1.3">${
          esc(lider.nombre ?? '—')}</div>
        <span class="pie">${inc.por_convocatoria
          ? 'la única convocatoria anterior de este contrato que hemos encontrado'
          : 'la única adjudicación de este tipo en este organismo en cuatro años'}</span>
      </div>`;
    }

    // Nadie destaca: se dice eso, no se señala a uno cualquiera.
    //
    // Con cuatro empresas a una adjudicación cada una, anunciar que
    // «una ha ganado el 25 %» es arbitrario y sugiere un dominio que no
    // existe.
    if (inc.reparto_equitativo) {
      // «Nadie» decía que no hay ganadores, cuando lo que pasa es lo
      // contrario: hay muchos y ninguno destaca. La cifra que importa es
      // cuántas empresas se lo reparten.
      return `<div class="factor bueno">
        <h4>Quién suele ganar</h4>
        <div class="cifra">${inc.empresas}
          <span style="font-size:.9rem;font-weight:400"> ${
            inc.empresas === 1 ? 'empresa' : 'empresas'}</span></div>
        <span class="pie">se reparten ${inc.por_convocatoria
          ? plural(inc.ediciones, 'convocatoria anterior', 'convocatorias anteriores')
          : plural(inc.ediciones, 'adjudicación', 'adjudicaciones')}
          <br>ninguna repite más que las demás: no hay proveedor de
          referencia</span>
      </div>`;
    }

    const cuota = lider.cuota ?? 0;
    const clase = esMio ? 'bueno' : cuota >= 60 ? 'malo' : cuota <= 30 ? 'bueno' : '';
    return `<div class="factor ${clase}">
      <h4>Quién suele ganar</h4>
      <div class="cifra">${cuota} %</div>
      <span class="pie">${esc(lider.nombre ?? '—')}<br>
        ${lider.veces} de ${inc.por_convocatoria
          ? plural(inc.ediciones, 'convocatoria anterior', 'convocatorias anteriores')
          : plural(inc.ediciones, 'adjudicación', 'adjudicaciones')} ·
        ${plural(inc.empresas, 'empresa distinta', 'empresas distintas')}</span>
    </div>`;
  }

  function factorCriterios(c) {
    if (c.peso_objetivo == null) {
      return `<div class="factor ancho-entero"><h4>Cómo se puntúa</h4>
        <p class="vacio-factor">Este expediente no publica el reparto de
        la puntuación.</p></div>`;
    }
    const juicio = c.peso_subjetivo ?? 0;
    const lista = Array.isArray(c.criterios) ? c.criterios : [];
    return `<div class="factor ancho-entero ${
      juicio >= 40 ? 'malo' : juicio === 0 ? 'bueno' : ''}">
      <h4>Cómo se puntúa</h4>
      <div class="pesos">
        ${c.peso_objetivo ? `<span class="formula"
          style="width:${c.peso_objetivo}%">${c.peso_objetivo} % fórmula</span>` : ''}
        ${juicio ? `<span class="juicio"
          style="width:${juicio}%">${juicio} % juicio</span>` : ''}
      </div>
      <span class="pie">${juicio >= 40
        ? 'Una parte grande depende de la valoración de un técnico, y eso favorece a quien ya trabaja con el organismo.'
        : juicio === 0
          ? 'Todo se calcula con fórmula: gana la mejor oferta, sin valoraciones.'
          : 'La mayor parte se calcula con fórmula.'}</span>
      ${lista.length ? `<ul class="lista-criterios">
        ${lista.map(k => `<li>
          <span class="${k.juicio ? 'esjuicio' : ''}">${esc(k.nombre || '—')}</span>
          <span class="peso">${k.peso}${k.juicio ? ' · juicio' : ''}</span>
        </li>`).join('')}</ul>` : ''}
    </div>`;
  }

  function factorBaja(org) {
    if (org.baja_media == null) {
      return `<div class="factor"><h4>A qué precio se cierra</h4>
        <p class="vacio-factor">Sin datos suficientes de este organismo.</p></div>`;
    }
    // El rango y no solo la media: la mitad central de las adjudicaciones
    // (del cuartil inferior al superior). Con menos de cinco contratos un
    // rango no describe nada, y si los dos extremos coinciden, es una cifra.
    const muestra = `medido en ${org.baja_muestra}
        ${org.baja_muestra === 1 ? 'contrato' : 'contratos'}`;
    const conRango = org.baja_muestra >= 5 && org.baja_p25 != null
      && org.baja_p75 != null && org.baja_p75 > org.baja_p25;
    if (conRango) {
      return `<div class="factor ${org.baja_media <= 75 ? 'malo' : ''}">
        <h4>A qué precio se cierra</h4>
        <div class="cifra">${org.baja_p25}–${org.baja_p75} %</div>
        <span class="pie">del presupuesto: la mitad de las adjudicaciones
          se cerraron en ese tramo<br>
          media ${org.baja_media} % · ${muestra}</span>
      </div>`;
    }
    return `<div class="factor ${org.baja_media <= 75 ? 'malo' : ''}">
      <h4>A qué precio se cierra</h4>
      <div class="cifra">${org.baja_media} %</div>
      <span class="pie">del presupuesto, de media<br>
        ${muestra}</span>
    </div>`;
  }

  function factorCompetencia(org, hayIncumbente = false) {
    // Con menos de cinco contratos, una media no describe nada: dos de
    // tres es una casualidad, no una costumbre del organismo.
    if (org.licitadores_muestra != null && org.licitadores_muestra < 5) {
      return `<div class="factor"><h4>Cuánta competencia</h4>
        <p class="vacio-factor">Solo hay ${org.licitadores_muestra}
        ${org.licitadores_muestra === 1 ? 'contrato' : 'contratos'} con datos
        de licitadores en este organismo: muy poco para decir nada.</p></div>`;
    }
    if (org.licitadores_medio == null) {
      return `<div class="factor"><h4>Cuánta competencia</h4>
        <p class="vacio-factor">Sin datos de licitadores en este
        organismo.</p></div>`;
    }
    const n = String(org.licitadores_medio).replace('.', ',');
    // Poca competencia NO es buena noticia si hay un proveedor que
    // siempre gana: significa que los demás ya han dejado de
    // presentarse. Solo se pinta en verde cuando el sitio está abierto.
    const bueno = org.licitadores_medio <= 3 && !hayIncumbente;
    return `<div class="factor ${org.licitadores_medio >= 8 ? 'malo'
                                : bueno ? 'bueno' : ''}">
      <h4>Cuánta competencia</h4>
      <div class="cifra">${n}</div>
      <span class="pie">empresas de media<br>
        medido en ${org.licitadores_muestra}
        ${org.licitadores_muestra === 1 ? 'contrato' : 'contratos'}${
        org.sin_competencia
          ? `, de los que ${org.sin_competencia} ${
             org.sin_competencia === 1 ? 'tuvo' : 'tuvieron'} un solo
             licitador` : ''}</span>
    </div>`;
  }

  if (contrato) analizar(contrato, true);
  else elegir();
}

// ---------- Organismos ----------
//
// A esta pantalla no se entra a recorrer una lista: se entra a mirar UN
// organismo concreto antes de decidir si presentarse. Así que primero se
// busca y después se estudia.
async function pantallaOrganismos(perfil, session, volviendo = false,
                                  organo = null) {
  if (!volviendo) irA('organismos', organo ? { organo } : {});
  raiz.className = 'envoltorio ancho';
  raiz.innerHTML = `
    <div class="cabecera-app">
      <div><strong>Organismos</strong>
        ${cabeceraEmpresa(perfil)}
        ${navPrincipal('organismos')}</div>
      <div style="display:flex;gap:9px;align-items:center">
        ${campanaAvisos()}
        ${menuCuenta()}
      </div>
    </div>

    <h1 style="margin-top:26px">Quién compra en tu sector</h1>
    <p class="guia" style="max-width:66ch">Busca un organismo y mira a
    quién le ha comprado: cuántas empresas distintas, cuántos contratos a
    cada una y por cuánto.</p>

    <div class="buscar-organo">
      <input type="search" id="q-organo" autocomplete="off"
             placeholder="Ayuntamiento, diputación, consejería..."
             aria-label="Buscar organismo">
      <div class="sugerencias" id="sugerencias" hidden></div>
    </div>
