<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* El dominio antiguo de Cloudflare Pages se cae a ratos y los betatesters
   lo tienen guardado. Antes de cargar nada, mandamos esa visita al dominio
   bueno conservando ruta, parámetros y ancla. Va aquí arriba, sin esperar a
   nada más, para que no llegue a pintarse la interfaz vieja. */
(function(){
  // El nombre estaba mal escrito ("stescraperv2") y la redirección no
  // saltaba nunca: el 21/09/2026 seguía entrando gente por
  // statescraperv2.pages.dev. Se aceptan los dos por si acaso.
  if (/^(sta|s)tescraperv2\.pages\.dev$/.test(location.hostname)) {
    location.replace('https://statescraper.com' + location.pathname + location.search + location.hash);
  }
})();
</script>
<title>Contratos públicos para tu negocio</title>
<!-- Lo que enseñan buscadores, WhatsApp, Slack o LinkedIn al pegar el
     enlace. Sin og:image hasta que haya logo: una imagen genérica es peor
     que ninguna. -->
<meta name="description" content="Cada mañana, solo las licitaciones públicas que encajan con tu negocio. Deducimos a qué te dedicas a partir de los contratos que ya has ganado.">
<link rel="canonical" href="https://statescraper.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="State Scraper">
<meta property="og:locale" content="es_ES">
<meta property="og:url" content="https://statescraper.com/">
<meta property="og:title" content="Los contratos públicos que te interesan, sin buscarlos">
<meta property="og:description" content="Cada mañana, solo las licitaciones públicas que encajan con tu negocio. Deducimos a qué te dedicas a partir de los contratos que ya has ganado.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* El tema vive entero en estas variables, así que cambiarlo es
   reasignarlas. El resto de la hoja no sabe de colores concretos. */
:root{
  --fondo:#f3f5f7;
  --superficie:#ffffff;
  --texto:#172a3d;
  --tenue:#637386;
  --linea:#dbe2e8;
  --fuerte:#96a4b1;
  --si:#19745e;
  --no:#b65347;
  --urge:#bd6827;
  --alto:48px;
  --acento:#c78b35;
  --sombra:0 10px 28px rgba(24,42,61,.08);
  /* Papeles que cambian de valor entre temas y no se pueden derivar de
     los anteriores: el fondo al pasar por encima, la letra sobre el
     botón sólido, y los tintes suaves de aviso. */
  --hover:rgba(23,42,61,.045);
  --btn-fondo:#172a3d;
  --btn-fondo-hover:#0d1d2d;
  --btn-texto:#ffffff;
  --tinte-si:rgba(25,116,94,.07);
  --tinte-no:rgba(182,83,71,.07);
  --tinte-acento:rgba(199,139,53,.07);
  /* La barra de filtros se queda fija sobre la lista, así que necesita
     un fondo semiopaco del color de la página. Escrito a mano se
     quedaba blanco en oscuro. */
  --fondo-velado:rgba(243,245,247,.94);
  --sombra-corta:0 1px 1px rgba(24,42,61,.03);
  --sombra-baja:0 1px 2px rgba(24,42,61,.025);
  --sombra-pegajosa:0 8px 18px rgba(24,42,61,.035);
  --sombra-flotante:0 2px 4px rgba(24,42,61,.04),0 10px 22px rgba(24,42,61,.11);
  --sombra-boton:0 4px 10px rgba(23,42,61,.14);
  --sombra-boton-alta:0 6px 15px rgba(23,42,61,.2);
  --foco:0 0 0 3px rgba(23,42,61,.09);
}

/* Modo oscuro. Los mismos papeles con otros valores: fondo, superficie,
   texto, y los dos colores de veredicto ajustados para que mantengan
   contraste sobre oscuro. */
html[data-tema="oscuro"]{
  color-scheme:dark;
  --fondo:#15171a;
  --superficie:#1d2024;
  --texto:#e8eaed;
  --tenue:#9aa2ac;
  --linea:rgba(232,234,237,.12);
  --fuerte:rgba(232,234,237,.3);
  --si:#7fb89c;
  --no:#d98a7a;
  --urge:#d99a6a;
  --acento:#d6a458;
  --sombra:0 10px 28px rgba(0,0,0,.4);
  --hover:rgba(232,234,237,.06);
  --btn-fondo:#e8eaed;
  --btn-fondo-hover:#ffffff;
  --btn-texto:#15171a;
  --tinte-si:rgba(127,184,156,.1);
  --tinte-no:rgba(217,138,122,.1);
  --tinte-acento:rgba(214,164,88,.1);
  --fondo-velado:rgba(21,23,26,.94);
  /* En oscuro las sombras se ven poco y el relieve lo dan los bordes;
     se mantienen suaves para que no ensucien. */
  --sombra-corta:0 1px 1px rgba(0,0,0,.25);
  --sombra-baja:0 1px 2px rgba(0,0,0,.3);
  --sombra-pegajosa:0 8px 18px rgba(0,0,0,.35);
  --sombra-flotante:0 2px 4px rgba(0,0,0,.3),0 10px 22px rgba(0,0,0,.45);
  --sombra-boton:0 4px 10px rgba(0,0,0,.3);
  --sombra-boton-alta:0 6px 15px rgba(0,0,0,.4);
  --foco:0 0 0 3px rgba(232,234,237,.12);
}

*{box-sizing:border-box}

html{
  color-scheme:light;
  scroll-behavior:smooth;
  /* Se reserva el hueco de la barra de desplazamiento aunque no haga
     falta. Sin esto, al desplegar una lista la página crece, aparece la
     barra, y todo el contenido se desplaza unos píxeles a la izquierda:
     parecía que las columnas se movían solas. */
  scrollbar-gutter:stable;
}

body{
  min-width:320px;
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  /* `clip` y no `hidden`: `hidden` convierte al body en contenedor de
     desplazamiento y la barra de filtros, que es `sticky`, dejaba de
     quedarse fija. `clip` corta igual sin ese efecto. */
  overflow-x:hidden;
  overflow-x:clip;
}

::selection{
  background:rgba(45,95,138,.18);
  color:var(--texto);
}

.envoltorio{
  width:calc(100% - 40px);
  max-width:680px;
  margin:0 auto;
  padding:64px 0 88px;
}

/* En las pantallas con cabecera de servicio el margen superior sobra:
   la barra ya separa lo suficiente. */
.envoltorio.ancho{padding-top:18px}

.ancho{
  max-width:1120px;
}

h1{
  margin:0 0 14px;
  color:var(--texto);
  font-size:clamp(1.85rem,4.5vw,2.7rem);
  font-weight:650;
  line-height:1.13;
  letter-spacing:-.045em;
}

h2{
  margin:0 0 12px;
  color:var(--texto);
  font-size:1.35rem;
  font-weight:650;
  line-height:1.25;
  letter-spacing:-.025em;
}

h3{
  color:var(--texto);
}

p{
  margin-top:0;
}

p.guia{
  max-width:54ch;
  margin:0 0 24px;
  color:var(--tenue);
  line-height:1.62;
}

.centro{
  padding:88px 0 64px;
  text-align:center;
}

.centro p.guia{
  margin-right:auto;
  margin-left:auto;
}

input[type=email],
input[type=text],
textarea{
  width:100%;
  min-height:var(--alto);
  padding:12px 14px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:1rem;
  line-height:1.4;
  box-shadow:var(--sombra-corta);
  transition:border-color .16s,box-shadow .16s,background-color .16s;
}

input::placeholder,
textarea::placeholder{
  /* El mismo tono en los tres filtros. Antes cada campo usaba un gris
     distinto y la fila parecía desalineada sin motivo. */
  color:var(--tenue);
  opacity:1;
}

input:focus,
textarea:focus{
  outline:0;
  border-color:var(--fuerte);
  box-shadow:var(--foco);
}

textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.55;
}

label{
  display:block;
  margin:0 0 7px;
  color:var(--tenue);
  font-size:.78rem;
  font-weight:650;
  letter-spacing:.055em;
  text-transform:uppercase;
}

.campo{
  margin-bottom:20px;
  text-align:left;
}

/* ---------- Pantallas de entrada ----------
   Registro, código, CIF y nombre comparten estructura: un titular, una
   explicación, un campo y un botón. Repetirlas con estilos en línea las
   dejaba ligeramente distintas entre sí —el botón pegado al campo en
   una, separado en otra— y el recorrido se notaba desigual. */
.paso{max-width:420px;margin:0 auto;padding:76px 0 64px;text-align:center}
.paso.ancha{max-width:560px}
.paso h1{font-size:clamp(1.6rem,4vw,2.15rem)}
.paso p.guia{margin-left:auto;margin-right:auto}

.paso .campo{
  margin:30px 0 0;text-align:left;
}
.paso .campo input{text-align:center}
/* Salvo en las pantallas de texto largo, donde centrar una descripción
   la haría ilegible. */
.paso[style*="left"] .campo input,
.paso[style*="left"] .campo textarea{text-align:left}
.paso[style*="left"] p.guia{margin-left:0;margin-right:0}
.paso[style*="left"] .enlace{margin-left:0}
/* Códigos y CIF se leen mejor espaciados y en mayúsculas. */
.paso .campo input.clave{
  text-transform:uppercase;letter-spacing:.09em;font-weight:600;
}

.paso .principal{margin-top:18px;min-width:180px}
/* La salida secundaria va debajo y separada: es una alternativa, no el
   camino previsto. */
.paso .enlace{display:block;margin:18px auto 0}
.paso .aviso{text-align:left}

@media(max-width:520px){
  .paso{padding-top:52px}
  .paso .principal{width:100%}
}

button{
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:2px solid var(--fuerte);
  outline-offset:2px;
}

.principal{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:12px 25px;
  border:1px solid var(--btn-fondo);
  border-radius:8px;
  background:var(--btn-fondo);
  color:var(--btn-texto);
  font-size:1rem;
  font-weight:650;
  line-height:1.2;
  box-shadow:var(--sombra-boton);
  transition:background-color .16s,border-color .16s,box-shadow .16s,transform .16s;
}

.principal:hover{
  border-color:var(--btn-fondo-hover);
  background:var(--btn-fondo-hover);
  box-shadow:var(--sombra-boton-alta);
  transform:translateY(-1px);
}

.principal:active{
  box-shadow:none;
  transform:translateY(0);
}

.principal:disabled{
  opacity:.45;
  cursor:default;
  box-shadow:none;
  transform:none;
}

.secundario{
  display:inline-flex;
  min-height:var(--alto);
  align-items:center;
  justify-content:center;
  padding:11px 21px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-weight:600;
  transition:background-color .16s,border-color .16s,color .16s;
}

.secundario:hover{
  border-color:var(--texto);
  background:var(--hover);
}

.enlace{
  padding:6px;
  border:0;
  background:none;
  color:var(--tenue);
  font-size:.88rem;
  text-decoration:underline;
  text-decoration-color:transparent;
  text-underline-offset:3px;
  transition:color .16s,text-decoration-color .16s;
}

.enlace:hover{
  color:var(--texto);
  text-decoration-color:currentColor;
}
/* Mientras corre la cuenta atrás de "Reenviar el código": que no parezca
   pulsable ni reaccione al pasar por encima. */
.enlace:disabled,
.enlace:disabled:hover{
  color:var(--fuerte);
  text-decoration-color:transparent;
  cursor:default;
}

.aviso{
  margin:18px 0;
  padding:13px 15px;
  border:1px solid var(--linea);
  border-radius:8px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.92rem;
}

.aviso.mal{
  border-color:rgba(182,83,71,.42);
  background:var(--tinte-no);
  color:var(--no);
}

.aviso.bien{
  border-color:rgba(25,116,94,.38);
  background:var(--tinte-si);
  color:var(--si);
}

/* Propuesta de sectores */

.propuesta{
  margin:24px 0;
}

.familia{
  display:flex;
  gap:14px;
  align-items:flex-start;
  margin-bottom:9px;
  padding:17px 18px;
  border:1px solid var(--linea);
  border-radius:10px;
  background:var(--superficie);
  text-align:left;
  box-shadow:var(--sombra-baja);
  /* Es un <label> y la regla general de label (mayúsculas pequeñas,
     tenue) no va aquí: esto se lee como una frase. */
  color:var(--texto);
  font-size:1rem;
  font-weight:400;
  letter-spacing:normal;
  text-transform:none;
}

.familia input{
  width:17px;
  height:17px;
  flex:0 0 17px;
  margin-top:3px;
  accent-color:var(--si);
}

.familia .cuerpo{
  min-width:0;
  flex:1;
}

.familia .que{
  margin:0;
  color:var(--texto);
  font-size:.96rem;
  line-height:1.4;
}

.familia .aviso-corto{
  margin:5px 0 0;
  color:var(--no);
  font-size:.85rem;
}

.familia .volumen{
  flex:0 0 auto;
  color:var(--tenue);
  font-size:.84rem;
  white-space:nowrap;
}

/* Bajo cada familia, contratos ya adjudicados parecidos a lo que ha
   descrito. Solo para verlos: van fuera de la etiqueta para que tocarlos
   no desmarque la familia. */
.familia-bloque{margin-bottom:9px}
.familia-bloque .familia{margin-bottom:0}
.ejemplos{
  margin:0;
  padding:6px 18px 2px 49px;
  list-style:none;
  color:var(--tenue);
  font-size:.86rem;
  line-height:1.4;
}
.ejemplos:empty{display:none}
.ejemplos li{padding:5px 0}
.ejemplos li + li{border-top:1px solid var(--linea)}
.ejemplos .titulo-ejemplo{color:var(--texto)}
.ejemplos .cargando{font-style:italic}

/* Tamaños de contrato: se pueden marcar varios, o ninguno. */
.franjas{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:6px 0 22px;
}
.franjas button{
  min-height:40px;
  padding:8px 14px;
  border:1px solid var(--fuerte);
  border-radius:8px;
  background:var(--superficie);
  color:var(--texto);
  font-size:.92rem;
}
.franjas button[aria-pressed="true"]{
  border-color:var(--texto);
  background:var(--texto);
  color:var(--superficie);
}
.etiqueta-campo{margin:0 0 4px;color:var(--texto);font-size:.95rem;font-weight:600}

/* Progreso del cribado */

.avance{
  margin:24px 0 0;
}

.barra{
  height:5px;
  overflow:hidden;
  border-radius:99px;
  background:var(--linea);
}

.relleno{
  width:0;
  height:100%;
  border-radius:inherit;
  /* El naranja está reservado para lo que reclama atención: un plazo
     que vence, un criterio subjetivo. Una barra de progreso no es un
     aviso, así que va con el color del texto. */
  background:var(--texto);
  transition:width .3s ease;
}

.cuenta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:9px;
  color:var(--tenue);
  font-size:.84rem;
  font-variant-numeric:tabular-nums;
}


/* Aplicación y resumen */

.cabecera-app{
  display:flex;
  /* Arriba, no en medio: el bloque de la izquierda tiene tres líneas
     —título, empresa y navegación— y centrar los botones los dejaba
     flotando a la altura del nombre de la empresa. */
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  /* Ajustada: es una barra de servicio, no una portada. El espacio que
     ocupaba empujaba hacia abajo lo que el cliente viene a ver. */
  padding:14px 0 13px;
  border-bottom:1px solid var(--linea);
}

/* Que el bloque de la izquierda pueda estrecharse: sin esto no bajaba de
   lo que mide la navegación en una línea, y a 320 px "Organismos" se
   salía de la pantalla en vez de pasar a la línea siguiente. */
.cabecera-app > div:first-child{min-width:0}

.cabecera-app h1{
  margin:0;
  font-size:1.25rem;
  letter-spacing:-.03em;
}

.cabecera-app .quien{
  max-width:42ch;
  overflow:hidden;
  color:var(--tenue);
  font-size:.86rem;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Lista sencilla de pares nombre-cifra. La usa la pantalla de
   confirmación para enseñar los sectores de la empresa encontrada. */
.listado{
  margin:24px 0;border:1px solid var(--linea);border-radius:10px;
  padding:4px 18px;background:var(--superficie);
}
.listado > div{
  display:flex;justify-content:space-between;gap:16px;padding:12px 0;
  font-size:.94rem;
}
.listado > div + div{border-top:1px solid var(--linea)}
.listado > div > span:last-child{
  color:var(--tenue);font-variant-numeric:tabular-nums;
}

/* Filtros y pestañas */

.filtros{
  position:sticky;
  z-index:10;
  top:0;
  display:flex;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:10px;
  padding:18px 0 16px;
  border-bottom:1px solid var(--linea);
  background:var(--fondo-velado);
  box-shadow:var(--sombra-pegajosa);
  backdrop-filter:blur(12px);
}

select,
input[type=search]{
  min-width:0;
  height:var(--alto);
  flex:1 1 220px;
  padding:0 39px 0 13px;
  border:1px solid var(--linea);
  border-radius:8px;
  background-color:var(--superficie);
  color:var(--texto);
  font:inherit;
  font-size:.92rem;
  line-height:1.2;
  box-shadow:var(--sombra-corta);
  transition:border-color .16s,box-shadow .16s;
}

select{
  appearance:none;
  background-image:
    linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
    linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:
    calc(100% - 18px) 20px,
    calc(100% - 13px) 20px;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}

input[type=search]{
  padding-right:13px;
}

input[type=search]:focus,
select:focus{
  outline:0;
  border-color:var(--fuerte);
  box-shadow:var(--foco);
}

/* ---------- Panel de cuenta ---------- */
.panel{max-width:720px;padding:30px 0}
.bloque{
  border:1px solid var(--linea);border-radius:10px;padding:24px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.bloque + .bloque{margin-top:16px}
.bloque h3{margin:0 0 18px;font-size:1.02rem;font-weight:650}
.bloque dl{display:grid;grid-template-columns:180px 1fr;gap:12px 22px;margin:0}
.bloque dt{color:var(--tenue);font-size:.9rem}
.bloque dd{margin:0;font-size:.95rem}
.filtro-lista{margin:0;padding:0;list-style:none}
.filtro-lista li{
  padding:10px 0 10px 20px;position:relative;font-size:.95rem;line-height:1.5;
}
.filtro-lista li + li{border-top:1px solid var(--linea)}
.filtro-lista li::before{
  content:'';position:absolute;left:5px;top:19px;width:5px;height:5px;
  border-radius:50%;background:var(--fuerte);
}
.peligro{border-color:rgba(182,83,71,.3)}
.peligro h3{color:var(--no)}

/* ---------- Menú de cuenta ----------
   Un desplegable y no todo en la misma página: el panel crece con
   sectores, órganos y lo que venga de inteligencia, y un muro de datos
   se lee peor que una sección cada vez. */
.menu-envoltorio{position:relative}

/* ---------- Navegación principal ----------
   Contratos y Mercado son áreas pares, no una dentro de otra: qué me
   interesa presentar, y qué pasa en mi sector. Meterlas en el menú de
   cuenta escondería la segunda. Las pestañas de Novedades y Todos se
   quedan dentro de Contratos, que es donde pertenecen. */
.principales{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.principales button{
  border:0;background:none;padding:0;cursor:pointer;font:inherit;
  font-size:.92rem;color:var(--tenue);transition:color .15s;
}
.principales button:hover{color:var(--texto)}
.principales button[aria-current="true"]{color:var(--texto);font-weight:650}

/* ---------- Mercado ----------
   La ficha SUSTITUYE a las listas en lugar de apilarse encima. Apilando,
   abrir una empresa empujaba las listas hacia abajo y la página saltaba
   bajo el cursor. Así solo hay dos estados: las listas, o una ficha. */

/* Se enseñan tres filas y el resto se despliega. Un bloque cerrado no
   dice qué hay dentro; con unas cuantas asomando se ve de qué va y si
   merece abrirlo. */
.seccion-mercado{
  border:1px solid var(--linea);border-radius:10px;background:var(--superficie);
  box-shadow:var(--sombra-baja);padding:20px;
}
.seccion-mercado + .seccion-mercado{margin-top:14px}
.seccion-mercado > h3{
  display:flex;align-items:baseline;gap:11px;margin:0 0 4px;
  font-size:1rem;font-weight:650;
}
.seccion-mercado > h3 .cuantas{
  margin-left:auto;color:var(--tenue);font-size:.86rem;font-weight:400;
}
/* Sin borde propio: la última fila de la tabla ya trae el suyo, y los
   dos juntos dibujaban una franja doble. */
.mas{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px 0 2px;
  border:0;background:none;
  color:var(--tenue);font:inherit;font-size:.88rem;cursor:pointer;
  transition:color .15s;
}
.mas:hover{color:var(--texto)}
.mas .flechita{font-size:.72rem;transition:transform .18s}
.mas[aria-expanded="true"] .flechita{transform:rotate(180deg)}
.oculta{display:none}

.volver-listas{
  display:inline-flex;align-items:center;gap:7px;
  border:0;background:none;padding:6px 0;color:var(--tenue);
  font:inherit;font-size:.9rem;cursor:pointer;transition:color .15s;
}
.volver-listas:hover{color:var(--texto)}

.vacio-seguimiento{
  padding:8px 0 4px;color:var(--tenue);font-size:.92rem;line-height:1.6;
}

/* ---------- Selector de periodo ----------
   Los años en fila, como tramos de una misma barra; lo elegido se ve
   como una banda continua. Sustituye al de dos asas sobre una línea,
   que no respondía bien al arrastrar y no dejaba elegir un solo año
   sin que las asas se pisaran. */
.periodo{
  display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;
}
.pista-periodo{
  display:flex;max-width:100%;overflow-x:auto;padding:3px;
  border:1px solid var(--linea);border-radius:10px;
  background:var(--superficie);box-shadow:var(--sombra-corta);
  /* Deja desplazar la página en vertical, pero el gesto horizontal es
     del selector: sin esto, en el móvil arrastrar movía la página. */
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.pista-periodo .anio{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  flex:0 0 auto;min-width:64px;padding:7px 12px 6px;
  border:0;border-radius:0;background:none;color:var(--tenue);
  font:inherit;font-size:.88rem;font-weight:600;
  font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background-color .12s,color .12s;
}
.pista-periodo .anio:first-child{border-radius:7px 0 0 7px}
.pista-periodo .anio:last-child{border-radius:0 7px 7px 0}
.pista-periodo .anio:not(.dentro):hover{background:var(--hover);color:var(--texto)}
.pista-periodo .anio.dentro{background:var(--texto);color:var(--superficie)}
.pista-periodo .anio.inicio{border-top-left-radius:7px;border-bottom-left-radius:7px}
.pista-periodo .anio.fin{border-top-right-radius:7px;border-bottom-right-radius:7px}
.pista-periodo .anio:focus-visible{outline:2px solid var(--fuerte);outline-offset:-2px}
.pista-periodo .volumen{
  display:flex;align-items:flex-end;width:28px;height:16px;
}
.pista-periodo .volumen i{
  display:block;width:100%;border-radius:2px 2px 0 0;
  background:var(--linea);
}
.pista-periodo .anio:not(.dentro):hover .volumen i{background:var(--tenue)}
.pista-periodo .anio.dentro .volumen i{
  background:color-mix(in srgb, var(--superficie) 45%, transparent);
}
.lado-periodo{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.resumen-periodo{font-size:.95rem;font-variant-numeric:tabular-nums}
.ayuda-periodo{color:var(--tenue);font-size:.8rem}
.todos-periodo{
  padding:2px 0;border:0;background:none;color:var(--tenue);
  font:inherit;font-size:.8rem;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;
}
.todos-periodo:hover{color:var(--texto)}
.todos-periodo[hidden]{display:none}

/* Donde va el selector en cada pantalla. */
.hueco-periodo{margin-top:18px}
.ficha-organo .hueco-periodo{margin:18px 0 4px}

@media(max-width:720px){
  .pista-periodo .anio{min-width:54px;padding:7px 8px 6px}
}

/* ---------- Buscador de organismo ---------- */
.buscar-organo{position:relative;max-width:760px;margin-top:22px}
/* El campo hereda `flex:1 1 220px` de la regla general, que fuera de un
   contenedor flexible no hace nada: se quedaba en su ancho por defecto y
   cortaba los nombres largos. */
.buscar-organo input[type=search]{width:100%;flex:none}
.sugerencias{
  position:absolute;z-index:30;top:calc(100% + 5px);left:0;right:0;
  max-height:300px;overflow-y:auto;padding:5px;
  border:1px solid var(--fuerte);border-radius:9px;
  background:var(--superficie);box-shadow:var(--sombra-flotante);
}
.sugerencias[hidden]{display:none !important}
.sugerencias button{
  display:block;width:100%;padding:10px 11px;border:0;border-radius:6px;
  background:none;color:var(--texto);font:inherit;font-size:.92rem;
  text-align:left;cursor:pointer;line-height:1.4;
}
.sugerencias button:hover,.sugerencias button.destacada{background:var(--hover)}
.sugerencias .cuantos{
  display:block;color:var(--tenue);font-size:.82rem;margin-top:2px;
}

/* ---------- Ficha de organismo ---------- */
/* Una sola tarjeta con todo dentro: cabecera, periodo, gráfico y
   contratos. Repartirlo en varias hacía que el periodo pareciera un
   control de la página y no de la ficha. */
.ficha-organo{
  margin-top:22px;padding:24px;
  border:1px solid var(--linea);border-radius:10px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.ficha-organo .arriba{
  display:flex;justify-content:space-between;gap:20px;align-items:flex-start;
  flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;
  border-bottom:1px solid var(--linea);
}
.ficha-organo h2{margin:0 0 6px;font-size:1.3rem}
.ficha-organo .cifras{
  display:flex;gap:24px;flex-wrap:wrap;margin:0;
  color:var(--tenue);font-size:.9rem;
}
.ficha-organo .cifras strong{
  color:var(--texto);font-weight:650;font-variant-numeric:tabular-nums;
}

/* ---------- Cómo se adjudica aquí ----------
   Dentro de la misma tarjeta, bajo la cabecera: son datos DE ese
   organismo, no un tema aparte. En una tarjeta separada habría que
   relacionar dos bloques mentalmente. */
.como-adjudica{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:18px 26px;padding:18px 0;margin-bottom:18px;
  border-bottom:1px solid var(--linea);
}
.como-adjudica > div{min-width:0}
.como-adjudica dt{
  color:var(--tenue);font-size:.78rem;letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 5px;
}
.como-adjudica dd{
  margin:0;font-size:1.22rem;font-weight:650;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.como-adjudica .matiz{
  display:block;margin-top:4px;color:var(--tenue);font-size:.82rem;
  font-weight:400;line-height:1.4;
}
/* Cuando la mitad de los contratos van con un solo licitador, eso no es
   un dato más: es la respuesta a si merece la pena presentarse. */
.como-adjudica .alerta dd{color:var(--no)}

.poca-muestra{
  padding:16px 0;margin-bottom:18px;border-bottom:1px solid var(--linea);
  color:var(--tenue);font-size:.9rem;line-height:1.55;
}

.detalle-contrato{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:5px;
  color:var(--tenue);font-size:.8rem;
}
.detalle-contrato span{white-space:nowrap}
.detalle-contrato strong{color:var(--texto);font-weight:600}

.dos-paneles{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;margin-top:18px;align-items:start;
}
/* Dentro de la tarjeta, los paneles solo se separan con una línea. */
.panel-organo{padding:0}
.dos-paneles > .panel-organo + .panel-organo{
  padding-left:24px;border-left:1px solid var(--linea);
}
@media(max-width:860px){
  .dos-paneles > .panel-organo + .panel-organo{
    padding-left:0;padding-top:22px;border-left:0;
    border-top:1px solid var(--linea);
  }
}
.panel-organo h4{
  margin:0 0 14px;font-size:.79rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
.lista-empresas > div{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--linea);align-items:baseline;
}
.lista-empresas > div:last-child{border-bottom:0}
.lista-empresas > div{cursor:default;transition:background-color .12s}
.lista-empresas > div:hover{background:var(--hover)}
.lista-empresas .quien{font-size:.93rem;word-break:break-word}
.lista-empresas .cuanto{
  text-align:right;white-space:nowrap;font-size:.88rem;
  font-variant-numeric:tabular-nums;
}
.lista-empresas .cuanto span{display:block;color:var(--tenue);font-size:.82rem}
.lista-empresas .mia .quien{color:var(--si);font-weight:650}

.contratos-organo > div{
  padding:12px 0;border-bottom:1px solid var(--linea);
}
.contratos-organo > div:last-child{border-bottom:0}
.contratos-organo .que{margin:0 0 3px;font-size:.92rem;line-height:1.4}
.contratos-organo .quien{color:var(--tenue);font-size:.84rem}
.contratos-organo .mia .quien{color:var(--si);font-weight:600}

@media(max-width:860px){
  .dos-paneles{grid-template-columns:1fr}
}

/* ---------- Viabilidad ----------
   Un veredicto en palabras y sus motivos debajo, no una puntuación.
   Un número compuesto oculta de dónde sale: si acierta, el cliente no
   sabe por qué; si falla, deja de fiarse de todo lo demás. */
.dictamen{
  padding:26px 28px;border-radius:12px;
  border:1px solid var(--linea);border-left:5px solid var(--linea);
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.dictamen .titular{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  margin:0 0 4px;
}
.dictamen h2{
  margin:0;font-size:clamp(1.35rem,3.2vw,1.75rem);letter-spacing:-.02em;
}
.dictamen .cuantos{color:var(--tenue);font-size:.88rem}

.dictamen.abierto{border-left-color:var(--si)}
.dictamen.abierto h2{color:var(--si)}
.dictamen.dificil{border-left-color:var(--acento)}
.dictamen.dificil h2{color:var(--acento)}
.dictamen.cerrado{border-left-color:var(--no)}
.dictamen.cerrado h2{color:var(--no)}
.dictamen.mio{border-left-color:var(--si)}
.dictamen.mio h2{color:var(--si)}

/* Los motivos, en prosa y no en lista: con uno solo, un punto de lista
   suelto queda absurdo, y con tres se leen igual de bien separados por
   líneas. */
.dictamen .motivos{margin:14px 0 0}
.dictamen .motivos p{
  margin:0;padding:11px 0;font-size:.97rem;line-height:1.55;
  max-width:70ch;
}
.dictamen .motivos p + p{border-top:1px solid var(--linea)}
.dictamen .solo{color:var(--tenue)}

/* Los cuatro factores, cada uno con su dato detrás. */
/* Rejilla fija, no `auto-fit`.
   Con `minmax(190px,1fr)` cabían dos, tres o cuatro tarjetas por fila
   según el largo del texto, así que la forma cambiaba entre un contrato
   y otro. Ahora: el reparto de puntuación arriba a todo lo ancho —que
   es lo que más espacio necesita— y los otros tres debajo. */
.factores{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;margin-top:16px;
}
.factores > .ancho-entero{grid-column:1 / -1}

@media(max-width:860px){
  .factores{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.factor{
  border:1px solid var(--linea);border-radius:10px;padding:18px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.factor h4{
  margin:0 0 9px;font-size:.77rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
.factor .cifra{
  font-size:1.5rem;font-weight:650;line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.factor .cifra.pequena{font-size:1.02rem;line-height:1.3}
.factor .pie{
  display:block;margin-top:7px;color:var(--tenue);font-size:.83rem;
  line-height:1.45;
}
.factor.malo .cifra{color:var(--no)}
.factor.bueno .cifra{color:var(--si)}
.factor .vacio-factor{color:var(--tenue);font-size:.9rem;line-height:1.5}

/* Reparto de la puntuación del pliego. */
.pesos{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.pesos .formula{background:var(--si)}
.pesos .juicio{background:var(--acento)}
.pesos span{
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.76rem;font-weight:650;
}
.lista-criterios{margin:10px 0 0;padding:0;list-style:none}
.lista-criterios li{
  display:flex;justify-content:space-between;gap:12px;
  padding:6px 0;font-size:.86rem;border-top:1px solid var(--linea);
}
.lista-criterios .peso{
  color:var(--tenue);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.lista-criterios .esjuicio{color:var(--acento)}

/* Quién ha ganado las ediciones anteriores. */
.historial-contrato > div{
  display:grid;grid-template-columns:1fr auto;gap:14px;
  padding:12px 0;border-bottom:1px solid var(--linea);align-items:baseline;
}
.historial-contrato > div:last-child{border-bottom:0}
.historial-contrato .quien{font-size:.94rem;word-break:break-word}
.historial-contrato .cuando{
  color:var(--tenue);font-size:.84rem;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.historial-contrato .lider .quien{font-weight:650}
.historial-contrato .mia .quien{color:var(--si);font-weight:650}
/* Quién ha ganado aquí: cada empresa se abre para enseñar sus contratos. */
.historial-contrato > div.con-contratos{display:block}
.con-contratos summary{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;
  cursor:pointer;list-style:none;
}
.con-contratos summary::-webkit-details-marker{display:none}
.con-contratos summary .cuando::after{content:' ▾'}
.con-contratos details[open] summary .cuando::after{content:' ▴'}
.contratos-ganados{
  margin:12px 0 2px;padding:0 0 0 14px;list-style:none;
  border-left:2px solid var(--linea);display:grid;gap:10px;font-size:.88rem;
}
.contratos-ganados .dato{display:block;margin-top:2px;color:var(--tenue);font-size:.8rem}
.mas-ganados{margin:8px 0 0 16px;color:var(--tenue);font-size:.8rem}

/* Elegir qué contrato analizar. */
.elige{
  border:1px solid var(--linea);border-radius:10px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
  margin-top:22px;padding:4px 20px;
}
.elige > button{
  display:grid;grid-template-columns:1fr auto;gap:16px;width:100%;
  padding:15px 0;border:0;border-bottom:1px solid var(--linea);
  background:none;font:inherit;text-align:left;cursor:pointer;
}
.elige > button:last-child{border-bottom:0}
.elige > button:hover{background:var(--hover)}
.elige .que{font-size:.95rem;line-height:1.42;margin:0 0 3px}
.elige .donde{color:var(--tenue);font-size:.85rem}
.elige .plazo{
  color:var(--tenue);font-size:.84rem;white-space:nowrap;text-align:right;
  font-variant-numeric:tabular-nums;
}

@media(max-width:720px){
  .dictamen{flex-direction:column;gap:14px}
  .elige > button{grid-template-columns:1fr;gap:4px}
  .elige .plazo{text-align:left}
}

/* ---------- Movimientos del mercado ----------
   Arriba, el titular a la izquierda y las cifras del mes a la derecha;
   debajo, la lista de lo adjudicado. */
/* En una columna, no en dos.
   La tarjeta de cifras es mucho más alta que el titular, y a su lado
   dejaba un vacío de varios cientos de píxeles bajo el texto. Como
   franja horizontal ocupa lo que necesita y el hueco desaparece. */
.cabeza-movimientos{margin-top:26px}
.cabeza-movimientos > div:first-child{max-width:70ch}

.pulso{
  margin-top:20px;padding:20px 22px;
  border:1px solid var(--linea);border-radius:10px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.pulso h4{
  margin:0 0 14px;font-size:.79rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
.pulso dl{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:16px 26px;margin:0;
}
.pulso dl > div{min-width:0}
.pulso dt{
  color:var(--tenue);font-size:.79rem;letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 5px;
}
.pulso dd{
  margin:0;font-size:1.32rem;font-weight:650;line-height:1.15;
  font-variant-numeric:tabular-nums;
}
.pulso .destacado{
  grid-column:1 / -1;
  margin:4px 0 0;padding-top:14px;border-top:1px solid var(--linea);
  color:var(--tenue);font-size:.86rem;line-height:1.55;
}
.pulso .destacado strong{color:var(--texto)}

/* Dos columnas de estadísticas entre la explicación y la lista: ese
   hueco estaba vacío y son datos que orientan antes de bajar al detalle. */
.dos-columnas{
  /* minmax(0,1fr) y no 1fr: `1fr` respeta el ancho mínimo del contenido,
     y como el detalle de abajo lleva `nowrap`, un nombre largo ensanchaba
     la columna. Al pasar de un tramo a otro cambiaba el texto, cambiaba
     el ancho, y la tarjeta se movía bajo el cursor. */
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:14px;margin-top:26px;
  /* Cada tarjeta con su altura natural: estirarlas dejaba un hueco
     vacío en la más corta. */
  align-items:start;
}
.ranking{
  border:1px solid var(--linea);border-radius:10px;padding:20px;
  background:var(--superficie);box-shadow:var(--sombra-baja);
}
.ranking h4{
  margin:0 0 14px;font-size:.79rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
/* La tarjeta se estira con la rejilla; la lista ocupa lo que sobre para
   que las dos columnas terminen a la misma altura. */
.ranking{display:flex;flex-direction:column}
/* Sin repartir el espacio sobrante entre las filas: al cambiar el
   detalle de abajo se recolocaban todas y la barra se escapaba del
   cursor. */
.ranking ol{margin:0;padding:0;list-style:none;flex:1}
/* Altura fija por fila. Sin ella, una columna con nombres de una línea
   quedaba más corta que la otra y las dos tarjetas no cuadraban. */
.ranking li{
  padding:10px 0;font-size:.9rem;height:82px;
  display:flex;flex-direction:column;justify-content:center;
}
.ranking li + li{border-top:1px solid var(--linea)}
.ranking .fila-ranking{
  display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  margin-bottom:7px;
}
/* Dos líneas fijas para el nombre: así todas las filas miden lo mismo y
   las dos columnas terminan a la misma altura, aunque unos nombres sean
   cortos y otros largos. */
.ranking .cual{
  min-width:0;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.ranking .cuanto{
  color:var(--tenue);font-size:.84rem;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.ranking li.mia .cual{color:var(--si);font-weight:650}
.ranking li.sigo .cual{font-weight:650}

/* Cada barra son sus contratos, uno detrás de otro: el ancho total
   compara empresas y cada tramo es un contrato concreto que se puede
   señalar. */
.barra-tramos{
  display:flex;height:10px;border-radius:99px;overflow:hidden;
  background:var(--linea);
}
.barra-tramos .tramo{
  /* Puede encoger: con anchos fijos la suma se pasaba del 100 % y los
     últimos tramos quedaban cortados fuera de la barra. */
  border:0;padding:0;flex:0 1 auto;min-width:7px;cursor:pointer;
  transition:opacity .15s;
}
.barra-tramos .tramo.activo{opacity:1}
.barra-tramos .tramo + .tramo{border-left:1px solid var(--superficie)}
.barra-tramos:hover .tramo:not(:hover){opacity:.4}

/* Altura FIJA, no mínima.
   Con altura variable el texto crecía al aparecer, la tarjeta con él, y
   la barra se apartaba del cursor: el ratón salía, el texto volvía a su
   sitio, la barra regresaba bajo el cursor y otra vez. Un bucle que se
   veía como una vibración. */
/* Título y contexto en bloques separados.
   Recortando el conjunto, un título largo se llevaba las tres líneas y
   el órgano y el importe quedaban fuera. Ahora el título se recorta a
   dos líneas con puntos suspensivos y la segunda línea está siempre. */
.detalle-tramo{
  height:76px;margin-top:14px;padding-top:13px;
  border-top:1px solid var(--linea);
  color:var(--tenue);font-size:.83rem;line-height:1.4;
  display:flex;flex-direction:column;gap:4px;overflow:hidden;
}
.detalle-tramo .titulo-tramo{
  color:var(--texto);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.detalle-tramo .meta-tramo{
  margin-top:auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

@media(max-width:720px){
  .dos-columnas{grid-template-columns:1fr}
}

/* Compras repetidas del mismo contrato, plegadas.
   Un acuerdo marco de stents publica cada compra derivada como su
   propio expediente: salían 41 líneas con el mismo título. */
.grupo-mov > summary{
  display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:start;
  padding:17px 0;border-bottom:1px solid var(--linea);
  cursor:pointer;list-style:none;
}
.grupo-mov > summary::-webkit-details-marker{display:none}
.grupo-mov > summary:hover{background:var(--hover)}
.grupo-mov[open] > summary{border-bottom:0;padding-bottom:8px}
/* Los estilos de texto viven dentro de `.movimiento`; el resumen del
   grupo no lo es, así que los necesita también. */
.grupo-mov > summary .gano{font-size:.86rem;font-weight:650;margin:0 0 4px}
.grupo-mov > summary .que{margin:0 0 4px;font-size:.95rem;line-height:1.42}
.grupo-mov > summary .donde{color:var(--tenue);font-size:.85rem}
.grupo-mov > summary .cifra{text-align:right;white-space:nowrap}
.grupo-mov > summary .cifra strong{font-variant-numeric:tabular-nums}
.grupo-mov > summary .baja{
  display:block;margin-top:3px;color:var(--tenue);font-size:.8rem;
}

.grupo-mov .cuantas-veces{
  display:inline-flex;align-items:center;gap:6px;margin-top:5px;
  color:var(--tenue);font-size:.84rem;
}
.grupo-mov .flechita{font-size:.7rem;transition:transform .18s}
.grupo-mov[open] .flechita{transform:rotate(180deg)}
.grupo-mov .dentro{
  margin-left:16px;padding-left:16px;
  border-left:2px solid var(--linea);
  border-bottom:1px solid var(--linea);
}
.grupo-mov .dentro .movimiento{padding:12px 0}

.filtro-provincia{
  display:flex;align-items:center;gap:10px;margin-top:20px;
}
.filtro-provincia label{color:var(--tenue);font-size:.88rem}
.filtro-provincia select{max-width:260px}

.movimiento{
  display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:start;
  padding:17px 0;border-bottom:1px solid var(--linea);
}
.movimiento:last-child{border-bottom:0}
.movimiento .gano{font-size:.86rem;font-weight:650;margin:0 0 4px}
.movimiento .gano .cuanto{font-weight:400;color:var(--tenue)}
.movimiento .que{margin:0 0 4px;font-size:.95rem;line-height:1.42}
.movimiento .donde{color:var(--tenue);font-size:.85rem}
.movimiento .cifra{text-align:right;white-space:nowrap}
.movimiento .cifra strong{font-variant-numeric:tabular-nums}
.movimiento .baja{
  display:block;margin-top:3px;color:var(--tenue);font-size:.8rem;
}
/* Lo propio y lo de las empresas que sigue se distinguen del resto: son
   las dos líneas que el cliente busca al recorrer la lista. */
.movimiento.mia{
  margin-left:-14px;padding-left:14px;border-left:3px solid var(--si);
}
.movimiento.mia .gano{color:var(--si)}
.movimiento.sigo .gano{color:var(--acento)}

.marca-mia{
  margin-left:8px;font-size:.74rem;font-weight:400;color:var(--tenue);
}

/* ---------- Lo que viene ----------
   Reutiliza la fila de lo adjudicado (`.movimiento`): mismo sitio para
   quién, qué, de quién y cuánto. Lo nuevo es la fecha en que vence, que
   es lo que se busca al recorrer la lista, y una línea con la duración y
   las prórrogas. */
/* Con dos clases: `.forma` y `.vista-ficha` se definen más abajo y su
   margen ganaba (los plazos salían empujados a la derecha). */
.forma.vista-mov{margin:26px 0 0}
.filtros-viene{
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:22px;
}
.filtros-viene .filtro-provincia{margin-top:0}
.filtros-viene .filtro-provincia label{white-space:nowrap}
.forma.plazos-viene{margin-left:0}
.plazos-viene button{font-size:.84rem;padding:7px 13px}
.plazos-viene button + button{border-left:0}
.plazos-viene .n{
  margin-left:7px;font-variant-numeric:tabular-nums;opacity:.7;
}
.movimiento .nota-prorroga{
  display:block;margin-top:4px;color:var(--tenue);font-size:.82rem;line-height:1.45;
}
.movimiento .cuando{
  display:block;margin-top:5px;font-size:.84rem;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.movimiento .cuando .falta{
  display:block;font-weight:400;color:var(--tenue);font-size:.8rem;
}

/* Ningún bloque ancho arrastra la página entera.
   Una tabla o un gráfico que no cabe debe desplazarse DENTRO de su
   caja; si empuja al body, hay que deslizar todo de lado y la cabecera
   se va con ello. */
@media(max-width:640px){
  html, body{overflow-x:hidden;overflow-x:clip}

  /* El panel de usuario, en una columna.
     Con `180px 1fr`, en 390 px quedaban menos de 130 para el valor y
     el correo o el nombre de la empresa se cortaban. */
  .panel{padding:20px 0}
  .bloque{padding:18px}
  .bloque dl{grid-template-columns:1fr;gap:3px 0}
  .bloque dt{font-size:.82rem;margin-top:12px}
  .bloque dt:first-of-type{margin-top:0}
  .bloque dd{font-size:.97rem;overflow-wrap:anywhere}

  /* Y las tarjetas de viabilidad, en una sola columna: con
     `minmax(190px,1fr)` cabían dos a veces y una otras, según el largo
     del texto, y la rejilla cambiaba de forma entre contratos. */
  .factores{grid-template-columns:1fr}
  .factor[style*="span 2"]{grid-column:span 1 !important}
  .dictamen{padding:20px}
  .como-adjudica{grid-template-columns:1fr;gap:14px}

  .envoltorio{max-width:100%;overflow-x:hidden;overflow-x:clip}
  /* Las tablas de datos (`.tabla`) no: ya caben por diseño, y como
     bloque perdían el ancho fijo de sus columnas. */
  table:not(.tabla){display:block;overflow-x:auto;max-width:100%}
  .reparto, .apilada, .quesito, .pesos{max-width:100%}
  pre, code{overflow-x:auto;max-width:100%}
  /* Los títulos largos de contrato no ensanchan la pantalla. */
  h1, h2, h3, .que, .titulo-tramo{overflow-wrap:anywhere}
}

/* ---------- La cabecera en pantallas estrechas ----------
   Cinco pestañas más la campana y el menú no caben en 390 px. */
@media(max-width:640px){
  .cabecera-app{gap:10px;padding:12px 0}

  /* Que el bloque del título pueda ENCOGER. Sin `min-width:0`, un
     contenedor flexible se niega a bajar del ancho de su contenido, y
     la barra de pestañas de dentro empujaba toda la cabecera. */
  .cabecera-app{position:relative;flex-wrap:wrap}
  .cabecera-app > div:first-child{min-width:0;flex:1 1 100%}
  .cabecera-app > div:last-child{
    flex:0 0 auto;position:absolute;top:12px;right:0;
  }

  /* El título deja sitio a la campana y al menú, pero las PESTAÑAS no:
     van por debajo y pueden usar todo el ancho.

     El margen es solo para el título, que es corto. El nombre de la
     empresa cabe entero y reservarle 96 px lo partía sin necesidad. */
  .cabecera-app > div:first-child > strong{
    display:block;padding-right:96px;
  }
  /* Hasta tres líneas: un nombre con «Sociedad Anónima Unipersonal» y
     su forma jurídica completa puede ser larguísimo, pero tampoco debe
     empujar las pestañas fuera de la pantalla. */
  .cabecera-app > div:first-child > .quien{
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;overflow-wrap:anywhere;line-height:1.35;
  }

  .cabecera-app strong{font-size:.98rem}
  .cabecera-app .quien{font-size:.78rem}

  /* Las pestañas se desplazan DENTRO de su caja, no arrastrando la
     página. */
  .principales{
    flex-wrap:nowrap;overflow-x:auto;gap:15px;margin-top:10px;
    padding-bottom:3px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .principales::-webkit-scrollbar{display:none}
  .principales button{white-space:nowrap;font-size:.86rem}

  /* En el panel hay un botón más —«Mis contratos»— y con la campana y
     el menú no caben los tres. Ese sobra: el menú ya lleva a todo. */
  .cabecera-app .enlace{display:none}

  /* El menú de la flechita se alinea con el borde derecho del grupo
     campana + «Mi cuenta», no con la campana: desde ahí, en un móvil de
     320 px, sus 200 px se salían de la pantalla por la izquierda. */
  .cabecera-app .campana-grupo{position:static}
}

@media(max-width:720px){
  .cabeza-movimientos{grid-template-columns:1fr}
  .movimiento{grid-template-columns:1fr;gap:6px}
  .movimiento .cifra{text-align:left}
  .grupo-mov > summary{grid-template-columns:1fr;gap:6px}
  .grupo-mov > summary .cifra{text-align:left}
  .grupo-mov .dentro{margin-left:8px;padding-left:10px}
  /* En una columna, la fecha va en una sola línea bajo el importe: dos
     líneas a la izquierda alargaban cada fila sin decir más. */
  .movimiento .cuando .falta{display:inline;margin-left:6px}
  .filtros-viene{gap:12px}
  /* Los tres plazos a todo el ancho: con su cifra al lado no cabían en
     320 px a su tamaño natural. */
  .plazos-viene{width:100%}
  .plazos-viene button{flex:1;padding:7px 6px}
  .filtros-viene .filtro-provincia{width:100%}
  .filtros-viene .filtro-provincia select{flex:1;max-width:none}
}

/* ---------- Mercado ---------- */
.buscador-cif{display:flex;gap:9px;margin:26px 0 8px;flex-wrap:wrap;
  align-items:center}
/* Sin mayúsculas forzadas: ahora también se busca por nombre. */
.buscador-cif input{flex:1 1 220px}
/* La lista de empresas que coinciden con un nombre. */
.coincidencias{display:grid;gap:8px;margin-top:8px}
.coincidencias button{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  width:100%;padding:12px 14px;text-align:left;
  border:1px solid var(--linea);border-radius:8px;background:var(--superficie);
  color:var(--texto);font:inherit;cursor:pointer;
  transition:border-color .15s,background-color .15s;
}
.coincidencias button:hover{border-color:var(--fuerte);background:var(--hover)}
.coincidencias .nif{color:var(--tenue);font-size:.86rem;white-space:nowrap}
.buscador-cif .principal,
.buscador-cif .secundario{flex:0 0 auto;white-space:nowrap}
/* Separado del par buscar/CIF: es otra acción, no una variante de la
   búsqueda. */
.buscador-cif #ver-mia{margin-left:6px}

@media(max-width:520px){
  .buscador-cif > *{flex:1 1 100%}
  .buscador-cif #ver-mia{margin-left:0}
}

.tarjeta-empresa{
  border:1px solid var(--linea);border-radius:10px;padding:24px;
  background:var(--superficie);margin-top:20px;box-shadow:var(--sombra-baja);
}
.tarjeta-empresa .arriba{
  display:flex;justify-content:space-between;gap:18px;align-items:flex-start;
  flex-wrap:wrap;margin-bottom:20px;
}
.tarjeta-empresa h3{margin:0 0 5px;font-size:1.15rem;font-weight:650}
.tarjeta-empresa .cifras{
  display:flex;gap:26px;flex-wrap:wrap;margin:0;color:var(--tenue);
  font-size:.9rem;
}
.tarjeta-empresa .cifras strong{
  color:var(--texto);font-weight:650;font-variant-numeric:tabular-nums;
}

.seguir{
  display:inline-flex;align-items:center;gap:7px;min-height:36px;
  padding:0 14px;border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,background-color .15s;
}
.seguir:hover{border-color:var(--fuerte);background:var(--hover)}
.seguir[aria-pressed="true"]{border-color:var(--texto);background:var(--texto);
  color:var(--btn-texto)}

/* El mismo botón, más pequeño, para cada fila de las listas: seguir a una
   empresa sin tener que abrir su ficha. */
.seguir.chico{min-height:30px;padding:0 11px;font-size:.8rem}

/* Ancho fijo: si la tabla se ajusta al contenido, desplegar filas con
   importes más largos mueve las columnas y la lista da un salto. */
.tabla{
  width:100%;border-collapse:collapse;margin-top:4px;font-size:.92rem;
  table-layout:fixed;
}
.tabla th{
  text-align:left;padding:9px 12px 9px 0;color:var(--tenue);
  font-size:.79rem;font-weight:650;letter-spacing:.05em;
  text-transform:uppercase;border-bottom:1px solid var(--linea);
}
/* Centradas: en una tabla de tres columnas donde la primera es texto
   largo, alinear los números a la derecha los deja pegados al borde y
   lejos de su encabezado. */
.tabla th.num, .tabla td.num{text-align:center;width:112px;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding:9px 10px}
.tabla th.fin, .tabla td.fin{text-align:right;padding-right:0;width:116px}
/* El nombre puede ser largo: parte de línea en vez de desbordar. */
.tabla td.quien{word-break:break-word}
.tabla td{padding:12px 12px 12px 0;border-bottom:1px solid var(--linea)}
.tabla tr:last-child td{border-bottom:0}
.tabla tbody tr{cursor:pointer;transition:background-color .12s}
.tabla tbody tr:hover{background:var(--hover)}
.tabla .quien{font-weight:600}
.tabla .anual-movil{display:none}

/* El tamaño de la competencia: un tope a lo que ganan al año, con una
   parada por tope, de menos a más (a la derecha, todas). El pulgar sigue
   al dedo y, al soltar, encaja en la parada más cercana con un pequeño
   rebote. La posición es `--pos`, de 0 a 1: el pulgar y el relleno se
   mueven solos al cambiarla. */
.tamanos{
  display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 22px;
  /* Arriba, el hueco de la burbuja: así no tapa la frase. */
  margin:12px 0 14px;
  --pulgar:22px;
  --muelle:cubic-bezier(.34,1.4,.64,1);
}
/* A la altura de la barra, no centrada con barra y etiquetas juntas. */
.tamanos .etiqueta-tamanos{padding-top:10px;color:var(--tenue);font-size:.86rem}
/* El hueco a los lados deja sitio a las etiquetas de los extremos. */
.pista-tamanos{flex:0 1 380px;min-width:250px;padding:0 30px}
/* Más alto que la barra: es la zona que se agarra. Deja pasar el
   desplazamiento vertical para que en el móvil se pueda seguir bajando
   con el dedo encima. */
.riel{
  position:relative;height:40px;cursor:pointer;
  touch-action:pan-y;-webkit-user-select:none;user-select:none;
}
.riel .carril{
  position:absolute;left:0;right:0;top:17px;height:6px;
  border-radius:3px;background:var(--linea);
}
.riel .lleno{
  position:absolute;top:0;bottom:0;left:0;width:calc(var(--pos) * 100%);
  border-radius:3px;background:var(--texto);
  transition:width .45s var(--muelle);
}
.riel .carril b{
  position:absolute;top:50%;width:6px;height:6px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:var(--fuerte);transition:background-color .2s ease;
}
.riel .carril b.dentro{background:color-mix(in srgb,var(--superficie) 70%,transparent)}
.riel .pulgar{
  position:absolute;top:20px;left:calc(var(--pos) * 100%);
  width:var(--pulgar);height:var(--pulgar);
  border:2px solid var(--texto);border-radius:50%;
  background:var(--superficie);box-shadow:var(--sombra-boton);
  transform:translate(-50%,-50%);outline:none;
  transition:left .45s var(--muelle),transform .2s var(--muelle),box-shadow .2s ease;
}
.riel:hover .pulgar{
  box-shadow:var(--sombra-boton),0 0 0 6px color-mix(in srgb,var(--texto) 8%,transparent);
}
/* El anillo de foco y la burbuja, solo con el teclado. Al tocarlo con el
   ratón o el dedo también se enfoca (para seguir con las flechas), pero
   el navegador lo daba por foco de teclado: `con-puntero` lo distingue. */
.riel:not(.con-puntero) .pulgar:focus-visible{
  box-shadow:var(--sombra-boton),0 0 0 3px var(--superficie),0 0 0 5px var(--fuerte);
}
/* Arrastrando: pegado al dedo, sin retraso, y algo más grande. */
.riel.arrastrando{cursor:grabbing}
.riel.arrastrando .lleno{transition:none}
.riel.arrastrando .pulgar{
  transform:translate(-50%,-50%) scale(1.14);
  box-shadow:var(--sombra-boton-alta),0 0 0 8px color-mix(in srgb,var(--texto) 10%,transparent);
  transition:transform .2s var(--muelle),box-shadow .2s ease;
}
/* Lo que se va a elegir, encima del pulgar: con el dedo encima no se ven
   las etiquetas de debajo. */
.riel .globo{
  position:absolute;left:50%;bottom:calc(100% + 11px);
  padding:4px 9px;border-radius:7px;
  background:var(--texto);color:var(--superficie);
  font-size:.78rem;font-weight:600;line-height:1.3;white-space:nowrap;
  pointer-events:none;opacity:0;
  transform:translate(-50%,5px) scale(.9);transform-origin:50% 100%;
  transition:opacity .15s ease,transform .22s var(--muelle);
}
.riel .globo::after{
  content:'';position:absolute;left:50%;top:100%;
  border:5px solid transparent;border-top-color:var(--texto);
  transform:translateX(-50%);
}
.riel.arrastrando .globo,
.riel:not(.con-puntero) .pulgar:focus-visible .globo{opacity:1;transform:translate(-50%,0) scale(1)}
.tamanos .marcas{position:relative;height:22px}
.tamanos .marcas button{
  position:absolute;top:0;transform:translateX(-50%);
  padding:2px 6px;border:0;border-radius:6px;background:none;
  color:var(--tenue);font-size:.8rem;font-weight:600;white-space:nowrap;
  transition:color .2s ease;
}
.tamanos .marcas button:hover,
.tamanos .marcas button.actual{color:var(--texto)}

/* Al cambiar el tope solo cambia la lista: se atenúa mientras llega y las
   filas nuevas entran escalonadas, así se ve que ha cambiado sin que la
   página salte. */
#lista-competencia{transition:opacity .16s ease}
@keyframes entrarFila{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}
.tabla.entra tbody tr{
  animation:entrarFila .38s cubic-bezier(.2,.7,.3,1) both;
  animation-delay:calc(var(--i, 0) * 45ms);
}
@media(prefers-reduced-motion:reduce){
  .riel .pulgar,.riel .lleno,.riel .globo,.riel .carril b{transition:none}
  .tabla.entra tbody tr{animation:none}
}

.ultimos-contratos > div{
  padding:13px 0;border-bottom:1px solid var(--linea);
}
.ultimos-contratos > div:last-child{border-bottom:0}
.ultimos-contratos .que{font-size:.94rem;line-height:1.42;margin:0 0 4px}
.ultimos-contratos .quien{color:var(--tenue);font-size:.86rem}

@media(max-width:720px){
  /* Cabe menos: se deja el nombre, el importe y el botón. El número de
     contratos se ve al abrir la ficha. */
  .tabla th:nth-child(2), .tabla td:nth-child(2){display:none}
  .tabla th.anual, .tabla td.anual{display:none}
  .tabla .anual-movil{display:block;margin-top:2px;color:var(--tenue);
    font-size:.8rem;font-weight:400}
  .tabla th.num, .tabla td.num{width:92px;padding:9px 8px 9px 4px;text-align:right}
  .tabla th.fin, .tabla td.fin{width:78px}
  .seguir.chico{padding:0 9px;font-size:.76rem}
}

/* Confirmación breve. Un icono sin etiqueta no dice qué ha pasado al
   pulsarlo, y el texto al pasar por encima no existe en el móvil. */
.recado{
  /* Arriba: es donde está la campana que lo provoca, así que el aviso
     aparece cerca de la acción en lugar de al otro extremo. */
  position:fixed;left:50%;top:18px;z-index:60;
  transform:translateX(-50%) translateY(-10px);
  padding:11px 18px;border-radius:99px;
  background:var(--btn-fondo);color:var(--btn-texto);
  font-size:.9rem;box-shadow:var(--sombra-flotante);
  opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;
}
.recado.visible{opacity:1;transform:translateX(-50%) translateY(0)}
/* Con botón ("Deshacer") sí recibe clics, y no se parte en el móvil. */
.recado.con-accion.visible{pointer-events:auto}
.recado{max-width:calc(100vw - 32px);text-align:center}
.accion-recado{
  margin-left:10px;padding:0;border:0;background:none;
  color:inherit;font:inherit;font-weight:650;text-decoration:underline;
  text-underline-offset:3px;cursor:pointer;
}

/* Campana de avisos. Sin animación: una campana que vibra significa
   "hay algo nuevo", no "el aviso está encendido", y si vibrase siempre
   dejaría de decir nada. Encendido es el estado normal; apagado se
   marca tachándola. */
.campana{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;padding:0;
  border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);cursor:pointer;
  box-shadow:var(--sombra-corta);
  transition:border-color .15s,background-color .15s,color .15s;
}
.campana:hover{border-color:var(--fuerte);background:var(--hover)}
.campana svg{width:17px;height:17px;display:block}
.campana[aria-pressed="false"]{color:var(--tenue)}
.campana[aria-pressed="false"] .tachado{display:block}
.campana .tachado{display:none}

/* Campana y flechita forman un solo botón partido: la campana a un lado,
   el atajo al configurador al otro. */
.campana-grupo{display:inline-flex}
.campana-grupo .campana{border-top-right-radius:0;border-bottom-right-radius:0}
.campana-flecha{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:36px;padding:0;margin-left:-1px;
  border:1px solid var(--linea);border-radius:0 8px 8px 0;
  background:var(--superficie);color:var(--tenue);cursor:pointer;
  box-shadow:var(--sombra-corta);
  transition:border-color .15s,background-color .15s,color .15s;
}
.campana-flecha:hover,.campana-flecha[aria-expanded="true"]{
  border-color:var(--fuerte);background:var(--hover);color:var(--texto);
}
.campana-flecha svg{width:10px;height:10px;transition:transform .18s}
.campana-flecha[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu-avisos{min-width:200px}

/* Botón de cuenta con forma de botón. Como enlace subrayado pasaba
   desapercibido, y es la puerta a todo lo demás. */
.boton-cuenta{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;
  padding:0 13px;border:1px solid var(--linea);border-radius:8px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.88rem;font-weight:600;cursor:pointer;
  box-shadow:var(--sombra-corta);
  transition:border-color .15s,background-color .15s;
}
.boton-cuenta:hover{border-color:var(--fuerte);background:var(--hover)}
.boton-cuenta[aria-expanded="true"]{border-color:var(--fuerte);background:var(--hover)}
.boton-cuenta .flechita{
  color:var(--tenue);font-size:.7rem;line-height:1;transition:transform .18s;
}
.boton-cuenta[aria-expanded="true"] .flechita{transform:rotate(180deg)}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:210px;
  background:var(--superficie);border:1px solid var(--fuerte);border-radius:9px;
  padding:5px;box-shadow:var(--sombra-flotante);
}
.menu[hidden]{display:none !important}
.filtros select[hidden]{display:none}

/* ---------- Mis avisos ---------- */
.casillas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 18px}
/* `label` va en mayúsculas pequeñas para los campos de formulario; aquí
   son opciones que se leen, no rótulos. */
.casilla-linea{display:flex;align-items:center;gap:9px;min-height:34px;margin:0;
  cursor:pointer;color:var(--texto);font-size:.93rem;font-weight:400;
  letter-spacing:normal;text-transform:none}
.casilla-linea input{width:17px;height:17px;flex:none;margin:0;accent-color:var(--texto);cursor:pointer}
.casilla-linea.toda{margin-bottom:10px;font-weight:600}
.zonas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px;
  padding-top:10px;border-top:1px solid var(--linea)}
.fila-comunidad{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ver-provs{padding:0;font-size:.82rem;color:var(--tenue);white-space:nowrap}
.provs{padding:0 0 8px 26px}
.provs[hidden]{display:none}
.resumen-avisos p{margin:0 0 16px;font-size:.95rem}
.menu button{
  display:block;width:100%;min-height:38px;padding:0 12px;border:0;
  border-radius:6px;background:none;color:var(--texto);font:inherit;
  font-size:.92rem;text-align:left;cursor:pointer;transition:background-color .12s;
}
.menu button:hover{background:var(--hover)}
.menu button[aria-current="true"]{font-weight:650}
.menu .separa{height:1px;margin:5px 8px;background:var(--linea)}

/* Interruptor de tema. Dentro del menú y no en la barra: se toca una
   vez y no vuelve a tocarse. */
.menu .tema{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.palanca{
  position:relative;width:38px;height:21px;flex:0 0 38px;
  border-radius:99px;background:var(--linea);
  transition:background-color .2s;
}
.palanca::after{
  content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;
  border-radius:50%;background:var(--tenue);
  transition:transform .2s,background-color .2s;
}
.menu .tema[aria-pressed="true"] .palanca{background:var(--fuerte)}
.menu .tema[aria-pressed="true"] .palanca::after{
  transform:translateX(17px);background:var(--texto);
}
.menu .peligroso{color:var(--no)}

/* Borrar la cuenta: al pie de "Mi cuenta", pequeño y apagado. */
.borrar-cuenta{margin-top:56px;padding-top:14px;border-top:1px solid var(--linea)}
.borrar-cuenta > .enlace{padding:0;color:var(--tenue);font-size:.8rem}
.borrar-cuenta > .enlace:hover{color:var(--no)}
.borrar-cuenta .aviso{margin-top:14px;max-width:560px;overflow-wrap:anywhere}
.borrar-cuenta label{text-transform:none;letter-spacing:0;font-size:.9rem}
.borrar-cuenta input{max-width:240px}
.principal.peligroso{background:var(--no);border-color:var(--no)}
.principal.peligroso:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Selector de empresa ----------
   Solo aparece con más de una. Va donde estaba el nombre, entre el
   título y las pestañas: es lo que dice DE QUIÉN son los datos de
   debajo, así que tiene que verse sin abrir nada. */
.selector-empresa{display:inline-block;margin-top:4px;max-width:100%}
.boton-empresa{
  display:inline-flex;align-items:center;gap:7px;max-width:100%;min-height:30px;
  padding:0 10px;border:1px solid var(--linea);border-radius:7px;
  background:var(--superficie);color:var(--texto);font:inherit;
  font-size:.86rem;cursor:pointer;transition:border-color .15s,background-color .15s;
}
.boton-empresa:hover,.boton-empresa[aria-expanded="true"]{
  border-color:var(--fuerte);background:var(--hover);
}
.boton-empresa .nombre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boton-empresa .flechita{color:var(--tenue);font-size:.7rem;transition:transform .18s}
.boton-empresa[aria-expanded="true"] .flechita{transform:rotate(180deg)}
.menu-empresas{left:0;right:auto;min-width:260px;max-width:min(360px,calc(100vw - 32px))}
.menu-empresas button{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.menu-empresas .nombre{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-empresas .nif{flex:none;color:var(--tenue);font-size:.8rem}
.menu-empresas [aria-checked="true"]{font-weight:650}
.menu-empresas [aria-checked="true"]::after{content:'✓';color:var(--texto)}
.menu-empresas [aria-checked="true"] .nif{margin-left:auto}
.menu-empresas .tope{margin:6px 12px 8px;color:var(--tenue);font-size:.82rem}
.pista-empresas{margin-top:26px;font-size:.84rem;text-align:center}

.seccion[hidden]{display:none !important}

/* ---------- Barras apiladas ----------
   Apiladas y no en paralelo: una barra que se llena al 100 % porque es
   la mayor no dice nada —no sabes si ese sector es la mitad del negocio
   o el 90 %—. Aquí la línea ES el total, así que cada segmento se lee
   como la parte que representa.

   Y dos líneas, contratos e importe, porque no coinciden: si un sector
   ocupa un tercio arriba y dos tercios abajo, ahí está el dinero. */

.reparto + .reparto{margin-top:28px}
.reparto > h4{
  margin:0 0 11px;font-size:.83rem;font-weight:650;color:var(--tenue);
  letter-spacing:.05em;text-transform:uppercase;
}
/* Interruptor de forma. Uno solo para toda la aplicación: la elección
   es del cliente, no de cada gráfico, y repetir el control en cada sitio
   sería ruido. */
.forma{display:flex;gap:2px;margin-left:auto}
.forma button{
  border:1px solid var(--linea);background:var(--superficie);
  color:var(--tenue);cursor:pointer;padding:5px 10px;font:inherit;
  font-size:.78rem;transition:color .15s,background-color .15s;
}
.forma button:first-child{border-radius:6px 0 0 6px}
.forma button:last-child{border-radius:0 6px 6px 0;border-left:0}
.forma button[aria-pressed="true"]{
  background:var(--btn-fondo);color:var(--btn-texto);border-color:var(--btn-fondo);
}
/* El mismo interruptor, para elegir qué enseña la ficha de empresa:
   sus contratos o lo raro (UTEs y acuerdos marco). Va a la izquierda,
   bajo las cifras, no arrinconado a la derecha como el de los gráficos. */
.vista-ficha{margin:0 0 22px}
.vista-ficha button{font-size:.84rem;padding:7px 14px}
/* Nombre de otra empresa que abre su ficha. Subrayado siempre, para que
   se vea que se puede pulsar; el color de acento solo al pasar por
   encima (como texto no tiene contraste suficiente). */
.enlace-ficha{color:inherit;text-decoration:underline;
  text-decoration-color:var(--fuerte);text-underline-offset:3px}
.enlace-ficha:hover{text-decoration-color:var(--acento)}
/* Título de un contrato que abre su expediente fuera de la app: sin
   subrayado fijo (no es otra ficha) y con ↗ para que se note que sale. */
.enlace-expediente{color:inherit;text-decoration:none}
.enlace-expediente:hover{text-decoration:underline;
  text-decoration-color:var(--acento);text-underline-offset:3px}
.enlace-expediente .externo{color:var(--tenue);font-size:.85em;white-space:nowrap}
.solo-lector{position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap}
/* Marca de UTE en las listas de un organismo: discreta, para distinguir
   una unión temporal de una empresa sin restarle sitio al nombre. */
.marca-ute{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--linea);
  border-radius:4px;font-size:.68rem;font-weight:650;letter-spacing:.05em;
  color:var(--tenue);vertical-align:2px;line-height:1.5}
.marca-sistema{margin-left:8px;white-space:nowrap}
.socios-ute{display:block;margin-top:2px;color:var(--tenue);font-size:.82rem}

.apilada{
  display:flex;width:100%;height:34px;border-radius:7px;overflow:hidden;
  background:var(--linea);
}

/* Quesito. Se dibuja con el trazo de un círculo y no con arcos: cada
   porción es un segmento del contorno, lo que evita el cálculo de
   trayectorias y hace que cada una sea un elemento propio al que se
   puede apuntar. */
.quesito{display:block;width:190px;height:190px;margin:2px auto 0}
.quesito circle{
  fill:none;stroke-width:26;cursor:pointer;
  transition:opacity .15s,stroke-width .15s;
}
.quesito:hover circle:not(:hover){opacity:.4}
.quesito circle:hover,.quesito circle.activo{stroke-width:30}
.apilada .trozo{
  min-width:3px;border:0;padding:0;cursor:pointer;
  transition:opacity .15s,filter .15s;
}
.apilada .trozo:hover,
.apilada .trozo:focus-visible,
.apilada .trozo.activo{filter:brightness(1.12)}
.apilada:hover .trozo:not(:hover){opacity:.45}
.apilada .trozo + .trozo{border-left:1px solid var(--superficie)}

/* Lo que se muestra al pasar por encima o tocar. Reserva su altura para
   que la leyenda no dé un salto al aparecer. */
.detalle-trozo{
  display:flex;align-items:baseline;gap:10px;min-height:26px;
  margin-top:11px;font-size:.9rem;
}
.detalle-trozo .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
  transform:translateY(1px);
}
.detalle-trozo .cual{font-weight:600}
.detalle-trozo .cuanto{color:var(--tenue);font-variant-numeric:tabular-nums}
.detalle-trozo.callado{color:var(--tenue);font-size:.85rem}

.leyenda{
  display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:14px;
  padding-top:14px;border-top:1px solid var(--linea);
}
.leyenda button{
  display:flex;align-items:center;gap:8px;padding:2px 0;border:0;
  background:none;color:var(--texto);font:inherit;font-size:.87rem;
  cursor:pointer;text-align:left;
}
.leyenda .punto{
  width:10px;height:10px;flex:0 0 10px;border-radius:3px;
}
.leyenda .pct{
  color:var(--tenue);font-variant-numeric:tabular-nums;
}
.leyenda button:hover .cual{text-decoration:underline;text-underline-offset:3px}

.sin-datos{padding:34px 0;color:var(--tenue);text-align:center;font-size:.92rem}

@media(max-width:720px){
  .bloque{padding:19px}
  .bloque dl{grid-template-columns:1fr;gap:3px}
  .bloque dt{margin-top:9px}
  .apilada{height:30px}
  .leyenda{gap:8px 16px}
}


.pestanas{
  display:flex;
  gap:27px;
  margin-top:29px;
  overflow-x:auto;
  border-bottom:1px solid var(--linea);
  scrollbar-width:none;
}

.pestanas::-webkit-scrollbar{
  display:none;
}

.pestana{
  position:relative;
  flex:0 0 auto;
  padding:0 0 13px;
  border:0;
  background:none;
  color:var(--tenue);
  font:inherit;
  font-size:.96rem;
  font-weight:600;
  cursor:pointer;
  transition:color .16s;
}

.pestana:hover{
  color:var(--texto);
}

.pestana[aria-selected="true"]{
  color:var(--texto);
}

.pestana[aria-selected="true"]::after{
  content:'';
  position:absolute;
  right:0;
  bottom:-1px;
  left:0;
  height:2px;
  border-radius:2px 2px 0 0;
  /* Del color del texto, no del acento: marca dónde estás sin reclamar
     atención. El acento se reserva para lo que sí la necesita. */
  background:var(--texto);
}

.pestana .cuantas{
  margin-left:6px;
  color:var(--tenue);
  font-size:.8rem;
  font-weight:500;
}

/* Acciones de cada contrato */

/* Siempre a la vista. Escondidos hasta pasar el ratón, en el ordenador
   no se descubrían: son la acción principal del producto, la que hace
   que el filtro aprenda. */
.acciones{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:11px;
}

.accion{white-space:nowrap}

.accion{
  min-height:29px;
  padding:4px 10px;
  border:1px solid var(--linea);
  border-radius:6px;
  background:var(--superficie);
  color:var(--tenue);
  font:inherit;
  font-size:.78rem;
  cursor:pointer;
  transition:color .15s,border-color .15s,background-color .15s;
}

.accion.si:hover{
  border-color:var(--si);
  background:var(--tinte-si);
  color:var(--si);
}

.accion.no:hover{
  border-color:var(--no);
  background:var(--tinte-no);
  color:var(--no);
}

.confirmado{
  display:inline-block;
  margin-top:10px;
  color:var(--si);
  font-size:.79rem;
  font-weight:600;
}

/* El veredicto de Viabilidad en la fila: los mismos colores que el
   dictamen de su pantalla. */
.viab{
  display:block;
  width:fit-content;
  margin:7px 0 0;
  font-size:.78rem;
  font-weight:600;
}
.viab::before{content:'● ';font-size:.7em;vertical-align:1px}
.viab.mio{color:var(--si)}
.viab.dificil{color:var(--acento)}
.viab.cerrado{color:var(--no)}

.sin-verificar{
  display:inline-block;
  margin-top:8px;
  color:var(--no);
  font-size:.78rem;
}

/* ---------- Bienvenida ----------
   Centrada y a gran tamaño. Un bloque estrecho alineado a la izquierda,
   flotando en medio de una pantalla vacía, no se lee como un momento
   especial sino como contenido mal colocado: lo que le daba aspecto
   descuidado era la falta de un eje. */
.bienvenida{
  min-height:76vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;
  max-width:560px;margin:0 auto;padding:40px 0;
}

.bienvenida .saluda{
  margin:0 0 14px;color:var(--tenue);font-size:.82rem;
  letter-spacing:.13em;text-transform:uppercase;
}
.bienvenida h1{
  font-size:clamp(2.4rem,7vw,3.6rem);margin:0 0 28px;line-height:1.05;
  letter-spacing:-.035em;
}
.bienvenida .lema{
  font-size:1.05rem;line-height:1.7;color:var(--tenue);margin:0 0 30px;
  /* Medida corta: el texto centrado se sigue peor que el alineado, así
     que las líneas tienen que ser breves para compensarlo. */
  max-width:44ch;
}
.bienvenida .lema strong{color:var(--texto);font-weight:650}
.bienvenida .principal{min-width:210px;margin-top:10px}

.dos-botones{
  display:flex;gap:10px;align-items:center;justify-content:center;
  margin:0 0 30px;
}
.dos-botones .muestra{
  display:inline-flex;align-items:center;min-height:36px;padding:0 15px;
  border:1px solid var(--linea);border-radius:7px;
  background:var(--superficie);font-size:.86rem;color:var(--tenue);
  box-shadow:var(--sombra-corta);
}
.dos-botones .muestra.si{border-color:var(--si);color:var(--si)}
.dos-botones .muestra.no{border-color:var(--no);color:var(--no)}

/* Entrada lenta y escalonada. Lo que da sensación de calma es el tiempo
   entre uno y otro, no la duración de cada uno. */
.bienvenida .entra{
  opacity:0;transform:translateY(14px);
  animation:subir 1.1s cubic-bezier(.16,.8,.3,1) forwards;
}
.bienvenida .entra:nth-child(1){animation-delay:.3s}
.bienvenida .entra:nth-child(2){animation-delay:1.2s}
.bienvenida .entra:nth-child(3){animation-delay:2.3s}
/* El botón, mucho después: si aparece con el texto, se pulsa antes de
   leerlo. */
.bienvenida .entra:nth-child(4){animation-delay:4.6s}

@keyframes subir{ to{opacity:1;transform:none} }

.dos-botones .muestra{opacity:0;animation:asomar .9s ease forwards}
.dos-botones .muestra.si{animation-delay:2.9s}
.dos-botones .muestra.no{animation-delay:3.1s}

@keyframes asomar{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:none}
}

@media(prefers-reduced-motion:reduce){
  .bienvenida .entra,
  .dos-botones .muestra{animation:none;opacity:1;transform:none}
}

/* Confirmación de lo aprendido: el momento en que se ve que sirve. */
.aprendido{
  margin:0 0 14px;padding:16px 18px;
  border:1px solid rgba(25,116,94,.35);border-radius:9px;
  background:var(--tinte-si);font-size:.93rem;line-height:1.55;
}
.aprendido strong{color:var(--si)}
.aprendido ul{margin:10px 0 0;padding-left:18px}
.aprendido li{margin:4px 0}
.explica{
  margin:21px 0 0;
  padding:15px 17px;
  border:1px solid var(--linea);
  border-radius:9px;
  background:var(--superficie);
  color:var(--tenue);
  font-size:.9rem;
  line-height:1.6;
}

.explica strong{
  color:var(--texto);
  font-weight:650;
}

/* Solo aparece con algún filtro puesto. Es texto y no un botón con
   borde: al lado de tres campos, un cuarto recuadro parecería otro
   filtro. */
.quitar-filtros{
  flex:0 0 auto;
  align-self:center;
  padding:6px 4px;
  border:0;
  background:none;
  color:var(--tenue);
  font:inherit;
  font-size:.88rem;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
}
.quitar-filtros:hover{color:var(--texto)}
.quitar-filtros[hidden]{display:none}
.vacio .quitar-filtros{margin-left:4px;font-size:inherit}

.explica{position:relative;padding-right:44px}
/* Aparece al acercarse: presente cuando se busca, invisible mientras se
   lee. */
.explica .cerrar{
  position:absolute;top:8px;right:9px;
  width:26px;height:26px;padding:0;border:0;border-radius:6px;
  background:none;color:var(--tenue);font-size:1.05rem;line-height:1;
  cursor:pointer;opacity:0;transition:opacity .15s,background-color .15s;
}
.explica:hover .cerrar,
.explica:focus-within .cerrar{opacity:1}
.explica .cerrar:hover{background:var(--hover);color:var(--texto)}
@media(hover:none),(pointer:coarse){ .explica .cerrar{opacity:1} }

/* Selector geográfico */

.selector{
  position:relative;
  min-width:0;
  flex:1 1 260px;
  align-self:stretch;
}

/* El campo es un botón con la misma forma que los otros selectores de
   la barra, y de alto fijo: con las provincias dentro como etiquetas,
   tres o cuatro partían el campo en dos líneas y la barra entera daba
   un salto. Lo elegido se resume en una línea ("Sevilla y 2 más") y el
   detalle está en el panel. */
.campo-geo{
  display:flex;
  width:100%;
  height:var(--alto);
  align-items:center;
  padding:0 39px 0 13px;
  border:1px solid var(--linea);
  border-radius:8px;
  background-color:var(--superficie);
  background-image:
    linear-gradient(45deg,transparent 50%,var(--tenue) 50%),
    linear-gradient(135deg,var(--tenue) 50%,transparent 50%);
  background-position:

//

// `mi_perfil_id()` la usa para elegir entre los perfiles del usuario.

const TOPE_EMPRESAS = 3;

let perfilActivoId = (() => {

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {

//

// decidido en su equipo.
const temaActual = () => document.documentElement.dataset.tema || 'claro';

// Leerla de vuelta justo después de escribirla la hacía depender de que

// dejaba de responder sin dar ninguna señal.
let FORMA = (() => {
  try { return localStorage.getItem('forma') || 'barras'; }
  catch { return 'barras'; }
})();

const formaActual = () => FORMA;

function ponerForma(cual) {

}

function ponerTema(cual) {
  document.documentElement.dataset.tema = cual;
  try { localStorage.setItem('tema', cual); } catch { /* modo privado */ }

(function temaInicial() {

  try { guardado = localStorage.getItem('tema'); } catch { /* modo privado */ }
